[workspace]
resolver = "3"
members = ["crates/almide", "crates/almide-base", "crates/almide-diag", "crates/almide-frontend", "crates/almide-ir", "crates/almide-lang", "crates/almide-spine", "crates/almide-syntax", "crates/almide-types"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# Pinned and enforced from day one (the incumbent stated "1.89+" in prose only).
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
