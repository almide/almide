[workspace]
members = [".", "crates/almide-base", "crates/almide-syntax", "crates/almide-types", "crates/almide-lang", "crates/almide-ir", "crates/almide-mir", "crates/almide-dialect", "crates/almide-codegen", "crates/almide-optimize", "crates/almide-frontend", "crates/almide-driver", "crates/almide-interp", "crates/almide-tools", "crates/almide-egg-lab"]
resolver = "3"
exclude = ["crates/almide-kernel", "research/benchmark/stdlib/rust_wasm_compare", "tools/wasmgen-harness", "tools/wasmgen-harness-uu", "tools/xtarget-fuzz"]

[package]
name = "almide"
version = "0.42.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
almide-base = { path = "crates/almide-base" }
almide-lang = { path = "crates/almide-lang" }
almide-ir = { path = "crates/almide-ir" }
almide-codegen = { path = "crates/almide-codegen" }
almide-tools = { path = "crates/almide-tools" }
almide-optimize = { path = "crates/almide-optimize" }
almide-driver = { path = "crates/almide-driver" }
almide-interp = { path = "crates/almide-interp" }
almide-frontend = { path = "crates/almide-frontend" }
almide-dialect = { path = "crates/almide-dialect" }
# v1 MIR trust-spine — the sole wasm codegen path (pipeline::try_render_wasm_source; the v0
# emitter was retired in #782, a wall is a hard error) and the native Rust render (which still
# falls back to v0 codegen source on a wall). Acyclic:
# almide-mir keeps `almide` only as a DEV-dependency, so this edge does not cycle.
almide-mir = { path = "crates/almide-mir" }
# WAT (text) → wasm bytes: the v1 renderer emits WAT; the CLI assembles it to a module.
wat = "1"
# Structural validation of the assembled v1 module: `wat` assembles without full stack-shape
# validation, so the test harness validates before accepting a v1 module (invalid → the test
# harness falls back to native execution; there is no v0 wasm emitter anymore).
wasmparser = "0.254"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "1.1"
lasso = { version = "0.7", features = ["multi-threaded"] }
lsp-server = "0.10"
lsp-types = "0.97"

# Cross-platform advisory file lock (flock / LockFileEx) for the shared build
# scratch dir (see BuildDirLock) — lets CI run the suite in parallel on every
# host OS. Excluded on wasm32 (the determinism harness target), where fs2 has
# no backing OS lock and the compiler never spawns build subprocesses.
[target.'cfg(any(unix, windows))'.dependencies]
fs2 = "0.4"

[dev-dependencies]
proptest = "1"
insta = "1"
tempfile = "3"

# The root build.rs (docs/diagnostics) and almide-types (stdlib/) re-embed repo
# content on any mtime bump — git pull/checkout triggers a full opt-3 recompile
# of the embedding crate even when content is unchanged (8.6s bin / 30s
# almide-types cascade). Incremental makes that false positive ~0.8s (#1006).
# CI builds cold and should opt out via CARGO_INCREMENTAL=0.
[profile.release]
incremental = true

