# Downstream canary roster (#2839). Read by scripts/downstream-canary.py,
# run by .github/workflows/downstream-canary.yml (workflow_dispatch only).
#
# The question the canary answers, before an rc is cut: "does real CURRENT
# downstream code that built on the previous release still build on the
# candidate?" Every project is therefore checked out at its DEFAULT-BRANCH
# HEAD — unlike the acceptance ring (acceptance-ring.yml), which pins a commit
# so downstream churn can never turn push CI red. The canary is not push CI;
# its verdicts are relative (baseline vs candidate on the same checkout), so
# churn cannot fake a regression.
#
# Policy: PUBLIC repositories only. CI must never depend on a private company
# repository, so Aid-On/teastia stays out permanently (the same decision as
# the ring, 2026-08-20). Every entry was verified public and to carry a root
# almide.toml when it was added.
#
# Fields
#   repo      owner/name on github.com
#   commands  almide sub-commands run in the project root, each with the
#             baseline and the candidate compiler (the string is split on
#             whitespace and passed as `almide <args>`). Convention:
#               check  every project
#               test   every project with test blocks
#               build  every project with src/main.almd (an application)
#   ref       optional pin — only for a project whose HEAD cannot be built by
#             any release; leave unset to track HEAD
#   timeout   optional per-command seconds (default 900)
#   note      optional, shown in the report
#
# Left out, with the reason:
#   almide/almide-lander, almide/bonsai-almide  depend on file:///Users/... paths
#   O6lvl4/almide-examples                      no almide.toml (loose files)
#   almide/almide, almide/als, playground, ...  not Almide packages

