[package]
name = "almide-wasm-run"
version.workspace = true
edition.workspace = true
# The embedded engine's floor (wasmtime/cranelift), NOT the compiler's:
# every other workspace crate holds the workspace 1.89 promise, and the
# MSRV-honesty gate checks both claims separately.
rust-version = "1.94"
license.workspace = true
description = "The greenfield wasm HOST: the almide.* import surface (print/exit/fs_call/host_read) over wasmtime, as a library and a CLI runner"

[dependencies]
almide-base = { path = "../almide-base" }
almide-wasm = { path = "../almide-wasm" }
# The p1 transform moved out (#2554) so wasm32 consumers can carry it
# without wasmtime; re-exported below as `wasi`, the path every caller uses.
almide-wasi = { path = "../almide-wasi" }
# The shared native-runtime client core (#1715): the http client the
# embedded host serves through fs_call ops 43..=47 — the SAME source the
# splice template inlines, so C-328 equality holds by construction.
almide-rt-core = { path = "../almide-rt-core" }
# The embedded host's http client (#1710 increment 1): a verbatim copy of
anyhow = "1"
wasmparser = "0.259"
wasm-encoder = "0.259"
wasmtime = "47"
wit-component = "0.259"
wit-parser = "0.259"

[lints]
workspace = true
