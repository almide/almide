[package]
name = "almide-wasm-run"
version.workspace = true
edition.workspace = true
# The embedded engine's floor (wasmtime/cranelift), NOT the compiler's:
# every other workspace crate holds the workspace 1.89 promise, and the
# MSRV-honesty gate checks both claims separately.
rust-version = "1.96"
license.workspace = true
description = "The greenfield wasm HOST: the almide.* import surface (print/exit/fs_call/host_read) over wasmtime, as a library and a CLI runner"

[dependencies]
almide-base = { path = "../almide-base" }
almide-wasm = { path = "../almide-wasm" }
# The block layout a fan worker builds a list capture in (#3331).
almide-layout = { path = "../almide-layout" }
# The p1 transform moved out (#2554) so wasm32 consumers can carry it
# without wasmtime; re-exported below as `wasi`, the path every caller uses.
almide-wasi = { path = "../almide-wasi" }
# The shared native-runtime client core (#1715): the http client the
# embedded host serves through fs_call ops 43..=47 — the SAME source the
# splice template inlines, so C-328 equality holds by construction.
almide-rt-core = { path = "../almide-rt-core" }
# The embedded host's http client (#1710 increment 1): a verbatim copy of
anyhow = "1"
# http.serve's shutdown on the embedded lane (ADR-0020 §5.6, #2692): SIGTERM
# and SIGINT (Ctrl-C / Ctrl-Break on Windows) start the drain. The crate's
# handler thread keeps the host free of `unsafe` (the workspace forbids it).
ctrlc = { version = "3.5", features = ["termination"] }
wasmparser = "0.261"
wasm-encoder = "0.261"
wasmtime = "49.0.3"
# ADR-0023 step 7: the embedded lane runs an HTTP program's WASI 0.3
# component. The p3 worlds come from wasmtime-wasi; wasi:http comes from
# wasmtime-wasi-http WITHOUT `default-send-request` (no hyper client, no
# rustls): the transport is the `send_request` hook, which is almide-rt-core,
# the client native runs (§2.2). Pinned in lockstep with wasmtime's major
# (proofs/wasi-pin-policy.toml [runtime].crate_major).
wasmtime-wasi = { version = "49.0.3", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "49.0.3", default-features = false, features = ["p3"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
wit-component = "0.261"
wit-parser = "0.261"

# The fan cost model's clock (#3341): a worker thread's CPU time, read
# without `unsafe` (the workspace forbids it). Already in the tree via wasmtime.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[lints]
workspace = true
