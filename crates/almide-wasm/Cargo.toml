[package]
name = "almide-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Unit 6: typed IR -> structural wasm emission (wasm-encoder; no WAT text, no templates)"

[dependencies]
almide-ir = { path = "../almide-ir" }
almide-base = { path = "../almide-base" }
almide-types = { path = "../almide-types" }
almide-layout = { path = "../almide-layout" }
wasm-encoder = { version = "0.261", features = ["wasmparser"] }
wasmparser = "0.261"
# #1315: the DWARF line table of a debug build (`debug_lines.rs`). The writer
# alone — no_std + alloc, so the wasm32 consumers of this crate still build;
# the crate is already in the lock graph (wasmtime reads DWARF with it).
gimli = { version = "0.33", default-features = false, features = ["write"] }

[dev-dependencies]
almide-corpus = { path = "../almide-corpus" }
anyhow = "1"
almide-spine = { path = "../almide-spine" }
# The portable re-checker (#2152), dependency-free: witness_floor counts a
# fixture certified only when it ACCEPTS every frame (#2754). Its agreement
# with the extracted kernel-proven checker is gated in proofs/gate.sh.
almide-verify = { path = "../almide-verify" }
almide-wasm-run = { path = "../almide-wasm-run" }
almide-wasm-vm = { path = "../almide-wasm-vm" }
almide = { path = "../.." }
wasmparser = "0.261"
wasmtime = "49.0.2"
sha2 = "0.11"
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }

[lints]
workspace = true
