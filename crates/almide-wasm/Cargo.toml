[package]
name = "almide-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Unit 6: typed IR -> structural wasm emission (wasm-encoder; no WAT text, no templates)"

[dependencies]
almide-ir = { path = "../almide-ir" }
almide-base = { path = "../almide-base" }
almide-types = { path = "../almide-types" }
almide-layout = { path = "../almide-layout" }
# The stamp the Region-export rewrite writes on its wrapper (extern_region.rs).
almide-lang = { path = "../almide-lang" }
wasm-encoder = { version = "0.262", features = ["wasmparser"] }
wasmparser = "0.262"
# #1315: the DWARF line table of a debug build (`debug_lines.rs`). The writer
# alone — no_std + alloc, so the wasm32 consumers of this crate still build;
# the crate is already in the lock graph (wasmtime reads DWARF with it).
gimli = { version = "0.34", default-features = false, features = ["write"] }

[dev-dependencies]
almide-corpus = { path = "../almide-corpus" }
anyhow = "1"
almide-spine = { path = "../almide-spine" }
# The portable re-checker (#2152), dependency-free: witness_floor counts a
# fixture certified only when it ACCEPTS every frame (#2754). Its agreement
# with the extracted kernel-proven checker is gated in proofs/gate.sh.
almide-verify = { path = "../almide-verify" }
almide-wasm-run = { path = "../almide-wasm-run" }
almide-wasm-vm = { path = "../almide-wasm-vm" }
almide = { path = "../.." }
wasmparser = "0.262"
# wasmtime's defaults minus `cache`: the on-disk compilation cache is never
# configured here, and the feature pulls zstd (RUSTSEC-2026-0391/0395/0398/0403/0410).
wasmtime = { version = "49.0.4", default-features = false, features = ["anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "component-model-async", "threads", "stack-switching", "std", "debug", "compile-time-builtins", "wit-parser"] }
sha2 = "0.11"
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }

[lints]
workspace = true
