[package]
name = "almide-syntax"
version = "0.12.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Almide syntax definitions: AST, lexer, and parser"

[dependencies]
almide-base = { path = "../almide-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-ident = "1"
unicode-normalization = "0.1"
# #4266 (E101): UTS #39 restriction level and confusable skeletons for identifiers.
unicode-security = "0.1"
unicode-script = "0.5"

[dev-dependencies]
almide-corpus = { path = "../almide-corpus" }
sha2 = "0.11"
