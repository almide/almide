[package]
name = "almide-interp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Almide IR tree-walking interpreter — the executable spec / third cross-target oracle"

[dependencies]
almide-base = { path = "../almide-base" }
almide-layout = { path = "../almide-layout" }
almide-lang = { path = "../almide-lang" }
almide-ir = { path = "../almide-ir" }
almide-frontend = { path = "../almide-frontend" }
almide-optimize = { path = "../almide-optimize" }
almide-driver = { path = "../almide-driver" }

[dev-dependencies]
# The test battery lowers .almd source to IR through the same public frontend
# functions the driver uses, then interprets. No fixtures, all inline.
#
# The corpus gates that used to live here — the 3-way oracle and the abstain
# ledger over `spec/wasm_cross/*.almd` — moved to the root binary
# (`tests/wasm_runtime_test.rs`), where they share ONE build of each fixture
# with the equivalence and wasm-opt gates instead of compiling it again. That
# also retired this crate's copies of the native/wasm capture helpers, and with
# them the `tempfile` scratch dir they needed.

# Verbatim-ported tier (PORTLOG.md "two-tier lint policy"): frozen at the
# incumbent's lint state; clippy off wholesale.
[lints.clippy]
all = { level = "allow", priority = -1 }
