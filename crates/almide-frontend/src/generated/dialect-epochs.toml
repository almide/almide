  "`json.parse` refuses a string RFC 8259 / I-JSON does not allow (C-400, #4111): a lone surrogate (`json: lone surrogate at pos N`), an unknown escape (`json: unknown escape at pos N`), `\\u` without four hex digits, a raw U+0000–U+001F, a noncharacter and an unterminated string are each an err where the parser used to drop or close them (`\"ad\\ud800min\"` was `admin`). A program that relied on the drop must escape its input correctly",
