  "`url.parse` validates the scheme at the start (`ALPHA *( ALPHA / DIGIT / \"+\" / \"-\" / \".\" )` then `://`), strips leading/trailing C0 and space and removes tab/LF/CR as WHATWG does, refuses a backslash, a remaining control character, a `%` in the host and a non-canonical numeric host (`127.1`, `0x7f.0.0.1`), lowercases scheme and host, and removes `.`/`..` path segments including `%2e` spellings (C-361, C-402, #4116): `javascript:alert(1)//://good.com` is an err where it parsed with host `good.com`, and `HTTP://Good.COM/a/../b` is `http://good.com/b`",
