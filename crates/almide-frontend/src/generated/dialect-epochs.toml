  "`http.query_params(req)` returns `Result[List[(String, String)], String]` (was `Map[String, String]`) and is `url.parse_query` of the target after its first `?` (C-404, #4117): every pair is kept in order, a bare key has value `\"\"`, and a bad escape or invalid UTF-8 is an err. Rewrite `map.get(http.query_params(req), k)` as `list.find(http.query_params(req) ?? [], ((key, _)) => key == k)` (or `map.from_list(http.query_params(req) ?? [])` for the old last-wins map)",
  "on a socket host, `http.serve` answers `400` before the handler to a request head RFC 9112 refuses (C-405, #4112): a line not ending in CRLF or holding a bare CR, a request line that is not three single-space-separated parts with a token method and `HTTP/1.1` / `HTTP/1.0`, an asterisk-form or authority-form target, whitespace before a field's colon, a line without a colon, an obs-fold line, two `Host` fields, or an HTTP/1.1 request without `Host`; an absolute-form target reaches the handler as its origin-form path. A client that omitted `Host` must send it",
  "`value.object(pairs)` folds a repeated key as one upsert (first position, last value), and so do `value.to_camel_case` / `value.to_snake_case` when two keys rename to one (C-401, #4112): `value.keys` lists the key once, `value.field` reads the last value, and `json.stringify` never writes a key twice. `value.pick(v, keys)` of a non-object is `{}` (was `v`)",
  "`http.router` answers `400 Bad Request: the path is not in canonical form` to a path with an empty segment inside it, a `.` / `..` segment, a percent-encoded unreserved byte, a backslash or a control character, and `400 Bad Request: a path parameter is a dot segment or holds a /, \\ or NUL` to such a parameter (C-406, #4133, #4134): `//admin` and `/%61dmin` used to route as `/admin`, and `/u/..%2F..%2Fetc` bound `../../etc`",
  "every `http.serve` response carries `X-Content-Type-Options: nosniff` unless the handler set the field (C-407, #4134)",
  "the buffered http client (`http.get` family, `http.request_response`, `http.request_bytes`) answers `malformed or incomplete response from \"<url>\"` for a response with no whole head, a body shorter than Content-Length, or a chunked body without its 0-chunk, and for a head past 1 MiB (C-408, #4137), where it used to return what had arrived as ok",
  "the http client's URL splitter cleans and refuses as `url.parse` does (C-402, #4116 comment): a backslash or control character and a non-canonical numeric host (`127.1`, `0x7f.0.0.1`) are URL errors, leading/trailing C0 and space and tab/LF/CR are removed, and `.` / `..` segments (with `%2e` spellings) leave the target before it is sent",
  "an `http.serve` handler's `err(m)` is answered with the fixed body `Internal Server Error (request <id>)` (`id` = 8 hex digits of `hash.fnv1a32(method + \" \" + target + \"\\n\" + body)`) and `m` goes to stderr only, quoted, as `http.serve: request <id>: handler error: <m>`; a refused response's body is `Internal Server Error` (C-409, #4150). A client or test that read the error text from the body must read the server's stderr",
  "`env.set(name, value)` is fallible (#4200, C-421): it errs, and sets nothing, on an empty name (`env.set: empty name`), a name containing `=` or NUL, and a value containing NUL, where native panicked (exit 101) and wasm stored the pair; a bare `env.set(k, v)` statement is now E042 — write `env.set(k, v)!`",
]

# DEPRECATIONS — spellings accepted for a window, with the epoch that removes them
# =============================================================

# A window is a [[deprecation]] block: id, issue, since_epoch, since,
# removal_epoch, summary, removal. `legacy-native-callback-names` (#3425,
# since epoch 10) reached its removal_epoch 14 and is a break of epoch 14 above.

[[deprecation]]
id = "bytes-raw-pointers-to-ffi"
issue = 3853
since_epoch = 15
since = "0.69.0"
removal_epoch = 16
summary = "The five `bytes` raw-pointer functions are `@deprecated` (E052) in favour of the `ffi` module, which needs `import ffi` (R-ffi-01). `ffi.read` / `ffi.write` are effect fns (R-ffi-02) and `ffi.write` takes the address first (R-ffi-03)."
removal = "`bytes.as_ptr(b)` / `bytes.as_mut_ptr(b)` → `ffi.address(b)`; `bytes.data_ptr(b)` → `ffi.to_int(ffi.address(b))` (0 for an empty b); `bytes.from_raw_ptr(p, n)` → `ffi.read(p, n)` from an effect fn; `bytes.copy_to_ptr(b, p, c)` → `ffi.write(p, b, c)` from an effect fn — each with `import ffi`"

[[deprecation]]
id = "numeric-renames-wave-2"
issue = 3985
since_epoch = 15
since = "0.69.0"
removal_epoch = 16
summary = "Three numeric functions are `@deprecated` (E052) under a new name with the same signature and answers: `int.pop_count` → `int.count_ones` (R-int-07, #3985), `int.bit_width` → `int.bit_length` (R-int-11, #4004), and `float.sign` → `float.signum` (R-float-05, #3972), which frees `sign` for the 0-for-0 answer every other number type gives."
removal = "`int.pop_count(n)` → `int.count_ones(n)`; `int.bit_width(n)` → `int.bit_length(n)`; `float.sign(x)` → `float.signum(x)` (still 1.0 for 0.0 and -1.0 for -0.0)"

