  "an effect fn reached as a VALUE is an effect (#4151, ADR-0009 D2, ADR-0026 D1): a pure fn passing one as an argument — `list.map(xs, fs.read_text)`, `apply(fs.read_text, p)`, `list.map(paths, fs.remove)` — is E006 (a bare name already was), and a pure fn that runs one it reached through a record field, a list or option element, or a closure an effect fn built is E109 on every route (`check`, `build`, `run`, `test`, both targets). These programs read and deleted files from a plain `fn`; mark the fn `effect fn` (its callers then propagate with `!`), or hand it a value that does no I/O. With it `[permissions]` sees a category carried by a fn value: `list.map(fs.read_text)` in a program whose manifest does not allow `IO` is a capability violation, where it used to build and read (#4152)",
  "`[permissions].allow` names ADR-0026 D2's leaves and parents (#4155): `IO` is the standard streams only — a file read or write is `FS` (`FS.read`, `FS.write`); `Env` is the environment only — starting or signalling a process is `Proc`, which no parent grants; `Net` splits into `Net.fetch` and `Net.listen`; the clock readers of `env` are `Time`; and the output and abort builtins carry `IO.stdout` (`println`), `IO.stderr` (`eprintln`) and `Abort` (`panic`, a failing `assert*`, `process.exit`). A manifest that relied on `IO` for files must add `FS`, one that relied on `Env` for `process.*` must add `Proc` (with a `proc = [...]` list, or it warns — and is refused under `--profile critical`), and a manifest for a program that prints or asserts must grant `IO` and `Abort`. Each refused leaf an old name would have covered prints a `note:` naming the new one",
