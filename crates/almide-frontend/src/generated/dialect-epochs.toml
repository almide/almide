  "`matrix.rms_norm_rows(…)` → `import nnlib` + `nnlib.rms_norm_rows(…)` (package almide/nnlib: `almide add almide/nnlib@v0.1.0`; the same arguments)",
  "`matrix.layer_norm_rows(…)` → `import nnlib` + `nnlib.layer_norm_rows(…)` (package almide/nnlib: `almide add almide/nnlib@v0.1.0`; the same arguments)",
  "`matrix.pre_norm_linear(…)` → `import nnlib` + `nnlib.pre_norm_linear(…)` (package almide/nnlib: `almide add almide/nnlib@v0.1.0`; the same arguments)",
  "`matrix.causal_mask_add(…)` → `import nnlib` + `nnlib.causal_mask_add(…)` (package almide/nnlib: `almide add almide/nnlib@v0.1.0`; the same arguments)",
  "`matrix.softmax_rows(…)` → `import nnlib` + `nnlib.softmax_rows(…)` (package almide/nnlib: `almide add almide/nnlib@v0.1.0`; the same arguments)",
  "`mem.save()` → delete the call, and the `import mem` line with it: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "`mem.restore(mark)` → delete the call, and the `import mem` line with it: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "`bytes.heap_save()` → delete the call: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "`bytes.heap_restore(mark)` → delete the call: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "the pre-#3338 callback spellings a package's `native/*.rs` could still call (deprecation `legacy-native-callback-names`, #3425, since epoch 10) are gone: a `native/*.rs` calling `crate::almide_rt_<pkg>_v<N>_<fn>` or `..._v<N>_<sub>_<fn>` gets rustc E0425 — write the injective name (`_` in a segment is `_0`, a `.` is `_1`: `almide_rt_tf_v0_calc_double` → `almide_rt_tf_0v0_1calc_double`)",
  "`testing.assert_throws(f, expected)` → rewrite as `testing.assert_aborts(expected, f)`: the expected text comes first, and `f` must be a lambda that captures nothing (it runs in a child process or instance); every abort counts — `panic`, index out of bounds, division by zero, a failed assert — not only `panic`. Outside a test block there is nothing to rewrite to: the call could only fail, so delete it",
  "`fan.race { … }`, `fan.race(budget) { … }`, `fan.race(xs, f)` and `fan.race(budget, xs, f)` are E027; write `fan.min(compute.ms(n)) { … }` / `fan.min(compute.ms(n), xs, f)` — the arms and mapper are unchanged, and the budget is now required (`fan.min { … }` and `fan.min(xs, f)` without a clock are parse errors)",
  "`fan.any { a(), b() }` is E027; write `a() ?? b() ?? fallback` — the same first-Ok-in-source-order, and later candidates never run once one succeeds; the value is the winner's payload (not a Result), so the all-failed case is the fallback, not an Err",
  "`fan.any(xs, f)` is E027; write `list.find_map(xs, (x) => f(x)?) ?? fallback` — `?` turns an element's Err into none so the element is skipped; the all-failed case is `none`, so the fixed text `fan.any: all candidates failed` no longer exists",
  "the all-failed error text of `fan.min` is `fan.min: no branch succeeded within budget` (was `fan.race: no branch completed within budget`); a program matching on the old text must match the new one",
]

[[epoch]]
n = 15
since = "0.69.0"
name = "stdlib-redesign"
summary = "The standard-library redesign (docs/roadmap/stdlib-redesign/). Its waves add their breaks here. First: the memory-unsafe stdlib surface moves to an explicitly imported `ffi` module (R-ffi-01, R-L0-45), and `--profile critical` refuses everything outside the memory-safety guarantee (#4008)."
breaks = [
  "under `--profile critical`, every `ffi.*` call, the deprecated `bytes` raw-pointer functions (`as_ptr`, `as_mut_ptr`, `data_ptr`, `from_raw_ptr`, `copy_to_ptr`) and an `@extern` fn declaration are E100 (outside the memory-safety guarantee), and no `--allow` grants them; the program checked without the profile is unchanged. Keep raw-address and foreign code in a module that is not checked with `--profile critical`",
  "a call to a `@memory_unsafe` stdlib function — any `ffi.*` function or a deprecated `bytes` raw-pointer function (`as_ptr`, `as_mut_ptr`, `data_ptr`, `from_raw_ptr`, `copy_to_ptr`) — in a file without `import ffi` is E100 (#4043), in every spelling (direct call, pipe stage, method call, function value, selective import); the opt-in is per file, and the stdlib's own sources are exempt. Add `import ffi` to the file that touches raw memory: with it the deprecated spellings check as before, with their E052 warning. The rewrite: `bytes.as_ptr(b)` / `bytes.as_mut_ptr(b)` → `ffi.address(b)`; `bytes.data_ptr(b)` → `ffi.to_int(ffi.address(b))`; `bytes.from_raw_ptr(p, n)` → `ffi.read(p, n)` from an effect fn; `bytes.copy_to_ptr(b, p, c)` → `ffi.write(p, b, c)` from an effect fn",
  "`zlib.inflate`, `zlib.decompress` and `zlib.gunzip` return `err(\"zlib: output exceeds 268435456 bytes\")` for a stream whose output passes 256 MiB, where they used to decode it whole (R-zlib-04, #4020, C-390); a program that decodes more than 256 MiB at once writes `zlib.inflate_max(data, n)` / `decompress_max` / `gunzip_max` with its own bound",
  "`json.parse` returns `err(\"json: nesting deeper than 1000\")` for an array or object opened inside 1000 others, where it used to recurse until the stack ran out (R-json-04, #4020, C-391); a document nested more than 1000 deep cannot be parsed",
