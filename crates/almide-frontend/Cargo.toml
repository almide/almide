[package]
name = "almide-frontend"
version = "0.12.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Almide frontend: type checker, canonicalization, IR lowering"

[dependencies]
almide-base = { path = "../almide-base" }
almide-lang = { path = "../almide-lang" }
almide-ir = { path = "../almide-ir" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
toml = "1.1"
serde = { version = "1", features = ["derive"] }

# Crate-scoped allows for verbatim-ported sources (no source edits during a
# port — PORTLOG.md). New modules in this crate must be written clean.
[lints.clippy]
clone_on_copy = "allow"
collapsible_if = "allow"
derivable_impls = "allow"
doc_lazy_continuation = "allow"
empty_line_after_doc_comments = "allow"
manual_ignore_case_cmp = "allow"
needless_return = "allow"
new_without_default = "allow"
redundant_closure = "allow"
should_implement_trait = "allow"
type_complexity = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_map_or = "allow"
unnecessary_sort_by = "allow"
items_after_test_module = "allow"
comparison_chain = "allow"
field_reassign_with_default = "allow"
for_kv_map = "allow"
get_first = "allow"
large_enum_variant = "allow"
len_without_is_empty = "allow"
manual_map = "allow"
manual_strip = "allow"
map_entry = "allow"
match_like_matches_macro = "allow"
needless_borrow = "allow"
needless_range_loop = "allow"
only_used_in_recursion = "allow"
op_ref = "allow"
ptr_arg = "allow"
question_mark = "allow"
redundant_pattern_matching = "allow"
single_char_pattern = "allow"
single_match = "allow"
too_many_arguments = "allow"
unused_enumerate_index = "allow"
useless_format = "allow"
vec_init_then_push = "allow"
while_let_on_iterator = "allow"
wrong_self_convention = "allow"
