[package]
name = "almide-frontend"
version = "0.12.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Almide frontend: type checker, canonicalization, IR lowering"

[dependencies]
almide-base = { path = "../almide-base" }
almide-lang = { path = "../almide-lang" }
almide-ir = { path = "../almide-ir" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
toml = "1.1"
serde = { version = "1", features = ["derive"] }


# Verbatim-ported tier (PORTLOG.md "two-tier lint policy"): this crate's
# sources are the incumbent's, frozen — clippy is off wholesale rather than
# curated into a fake-precision allow list. Modules rebuilt as new structure
# move to the strict tier (workspace lints) with that rebuild.
[lints.clippy]
all = { level = "allow", priority = -1 }
