[package]
name = "almide-rt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prelude-independent native runtime cores shared between the splice template (runtime/rs, via include!) and linking consumers (the embedded host)"

[dependencies]
# The pure-Rust TLS client the http core rides — same pin the generated
# projects and the embedded host carry.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1.0"
# The platform trust store and SSL_CERT_FILE / SSL_CERT_DIR (#2820), added to
# the webpki roots. rustls-org crate, the one reqwest (rustls-tls-native-roots),
# hyper-rustls and ureq use; its only deps are pki-types (already here) plus
# openssl-probe (Linux/BSD), security-framework (macOS) or schannel (Windows) —
# pure Rust on musl.
rustls-native-certs = "0.8"

[dev-dependencies]
# Test-only: the audit tests (tests/http_client_audit.rs) mint a throwaway CA
# and leaf so SSL_CERT_FILE / SSL_CERT_DIR are exercised against a CA that
# exists nowhere else (#2820). Same ring backend the client uses.
# Scratch trees for the rooted fs tests (tests/fs_beneath_core.rs, #4084).
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# Its own lints, not `[lints] workspace = true` (#3620): the workspace FORBIDS
# unsafe code, which no module can relax, and net's Unix-socket core needs
# four syscalls std has no safe form of (sendmsg / recvmsg with SCM_RIGHTS,
# poll, fcntl). Here unsafe is DENIED crate-wide and allowed in exactly one
# module, src/net_unix_sys.rs; tests/net_unix_core.rs fails if it appears in
# any other file or a block there lacks its SAFETY line. Native and the
# embedded wasm host both run that one module, so they agree by construction.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
