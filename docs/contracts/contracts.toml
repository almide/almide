title     = "The fs write-side floors answer with native's std::io Display text, and fd_write's errno is not dropped"
statement = "Every wasm fs WRITE-side floor answers a failure with the SAME native `std::io` Display text the native leg produces, through the one errno mapping `$read_text_file` already carried. Before #1385 each floor collapsed its whole failure space to one fixed string — `$write_text_file` \"write failed\", `$make_dir` \"mkdir failed\", `$remove_all` \"remove failed\", `$read_dir` \"directory not found\", `$rename` a hand-rolled NOENT/ACCES-only half — so the Result BRANCH agreed cross-target while the PAYLOAD, the half a user actually reads, diverged: eight measured rows, eight divergences. All eight close. Seven are fixture-pinned: `fs.write` onto a directory (`Is a directory (os error 21)`) and through a file component (`Not a directory (os error 20)`), `fs.mkdir_p` through a file component (same), `fs.remove_all` of a missing path and `fs.list_dir` of a missing path and `fs.rename` of a missing source (`No such file or directory (os error 2)`), `fs.list_dir` of a plain file (`Not a directory (os error 20)`). The eighth and ninth — `fs.write` to a mode-444 file and into a mode-555 directory, both `Permission denied (os error 13)` — are MEASURED equal on both legs but NOT fixture-reachable: setting a mode needs `process.exec`, which walls on the wasm leg, so no `spec/wasm_cross` program can build the precondition. The mapped errno set is exactly {NOENT 44, ACCES 2, NOTDIR 54, ISDIR 31} and that boundary is the DELIBERATE, BOUNDED residue of this contract: those four are the errnos whose native number AND Display text are identical on every Unix host, so one baked data segment is correct in a portable `.wasm`. ENOTEMPTY (39 Linux / 66 macOS), ENAMETOOLONG (36 / 63) and EXDEV (same number, different text — `Invalid cross-device link` vs `Cross-device link`) are NOT mapped, and an errno outside the set keeps its floor's generic string; mapping them would trade a visible divergence for a host-specific one baked into a portable artifact. SECOND, latent half: `$write_text_file` built `Ok(())` UNCONDITIONALLY — `fd_write`'s errno was dropped, so ENOSPC / EIO / a short write read as SUCCESS. The sweep that found it could not reach it (every failure it produced was caught by `path_open` first), which is what makes a silent success worth fixing before it is live. The write is now native `fs::write`'s write_all LOOP: a partial `fd_write` resumes at the unwritten bytes, its errno feeds the same mapping, and an accepted-0-bytes call is native's `ErrorKind::WriteZero` (`failed to write whole buffer` — Rust's own const message, not an OS string, so it is platform-independent like the four). The 12800-byte body and the zero-length write in the fixture are the loop's many-iteration and zero-iteration edges. THIRD, the neighbourhood sweep #1368's follow-up did for the read side, done for the write side: `path_create_directory` (the intermediate-prefix drops are by design — the FINAL call's errno subsumes them and is reported), `path_remove_directory` and `path_unlink_file` (both already feed `$remove_path`'s first-error verdict), `path_rename` (captured), `fd_readdir` inside `$remove_path` (its drop cannot manufacture a silent SUCCESS: a pass that reads nothing declares the directory emptied, and `path_remove_directory` then refuses a non-empty one, so the failure still surfaces as an err. It is not a CLEAN error path — a readdir that starts failing mid-walk re-scans the previous pass's stale buffer — but every exit from that shape is an err, and the shape is untouched here), and the `fd_close` drops (native drops its `File` and ignores the close result identically). `fd_seek` / `fd_filestat_set_size` are requested as path_open RIGHTS but never imported or called, so there is nothing to check. The four errno branches live in ONE Rust source (`fs_errno_msg_wat`) rendered inline at each site — §4.1 forbids a new hand-written WAT function, and one source is what stops the floors drifting apart again."
since     = "0.57.1"
status    = "active"
evidence  = [
