statement = "A dimension-taking matrix constructor (`matrix.zeros`/`ones` and their `_f32` aliases) normalizes `(rows, cols)` identically on both targets. A NEGATIVE dimension clamps to 0 — the empty matrix — matching the C-034 signed-clamp rule the `repeat` family already follows; an element count above the shared 2^28 (2 GiB of f64, inside wasm32's address space so both targets accept exactly the same shapes) ABORTS in the T6 form: one `Error: matrix dimensions too large` line on stderr and exit 1. Before, a transformer-shaped program built with `seq = -2147483648` crashed on BOTH targets in DIFFERENT forms — native a raw-vec `capacity overflow` panic (exit 101), wasm an out-of-bounds memory fault in `__mx_rms_rows` (exit 134) — and neither is a permitted observable: the T6 convention forbids a native panic and a wasm `unreachable` alike. The ROW COUNT is bounded ALONE by the same ceiling, not only the r*c product: `zeros(2^31, -7)` has 0 elements after the cols clamp yet still asks for 2^31 ROW slots — a 16 GiB row-pointer array that OOM-killed the wasm leg while native's UNUSED-value allocation was LLVM-elided and ran clean, two verdicts for one program (differential fuzz, 2026-08-10 night); rows over the element ceiling can never yield an in-ceiling matrix anyway, so both targets die in the T6 form, and the fixture keeps its bind deliberately unused so the guard's abort is what pins the call on both. The guard fires before either allocator is asked for anything, so the ceiling costs no memory to enforce; `ALMIDE_MATRIX_MAX_ELEMS` (runtime/rs/src/matrix.rs) and `__mx_max_elems` (stdlib/matrix_core.almd) are the two halves that must stay in sync. THREE NON-BYTES COUNT FAMILIES joined it. `list.range`'s count IS `end - start`, and for a span like (i64::MIN, 3) that subtraction OVERFLOWS — the count came out negative and the allocation was sized from the wrapped value, so native died on a raw panic (exit 101, the form ALS-T6 forbids) where wasm aborted with `Error: