fold: a magnitude past the `u128` the comparison is done in answered `fits`, so a 44-digit literal printed `0` with no diagnostic — the check that exists to stop silent folds, folding silently at its own edge. `-0` stays legal — it is `0`, and the rule this enforces is `can the type represent this value`, which `0` passes; rejecting it (as Rust does, following from ITS choice to frame the failure as a missing `Neg` impl) would contradict the framing that lets the other two hints name a fix. Everything the carrier DOES reach is byte-identical native == wasm: both bounds of every unsigned width, `-0` in each, and the negated minimum of every signed width. The cross-language survey behind these choices — every case run on a real toolchain — is docs/roadmap/active/integer-literal-domain.md. SUPERSEDED IN PART by C-179 (0.37.0): deviation (3), the CARRIER rejection, was explicitly interim — 'until the unsigned lane lands' — and the lane landed, so `UInt64`'s bound is again its DECLARED `u64::MAX` and its fixture (tests/diagnostics/e024-carrier-overflow) is retired with the wall it pinned. Deviations (1) MAGNITUDE and (2) SIGN are unchanged and still carried by the evidence below."
