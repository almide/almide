[[contract]]
id        = "C-006"
spec      = "ALS-R3"
title     = "fan.timeout does not exist — wall-clock deadlines live at the host boundary"
statement = "`fan.timeout` was removed in 0.29.0: a wall-clock timeout has no portable cross-target meaning (wasm has no clock, scheduler, or threads), and it was the sole stdlib surface whose result was not a function of the program + its inputs — the deadline firing depended on machine load, even native-to-native. Referencing it is a check-time tombstone error (E027) with a host-boundary migration hint, identical on both targets since type check precedes the target split. This retired the ledger's LAST flagged-for-revision entry: the ratchet stands at zero, so the equivalence claim carries no clause for divergences awaiting a fix. It is not exception-free in the absolute sense — the platform-reporting fns `env.os` / `env.temp_dir` differ by design and are exempt under C-189, which bounds that carve-out to exactly that surface (env.os and the env/fs temp_dir pair)."
since     = "0.29.0"
status    = "active"
doc       = "C-006-fan-timeout-removed.md"
evidence  = [
  { path = "tests/diagnostics/e027-fan-timeout-removed/broken.almd", class = "fixture" },
