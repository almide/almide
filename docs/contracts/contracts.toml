(2026-08-17): the `io.read_n_bytes` clamp described above was WRONG and is gone. `read_n_bytes(n)` answers min(n, what stdin has) — no cap. The clamp truncated a 100 MiB read of a 100 MiB stream to 64 MiB, silently, on BOTH legs, for a call 0.57.0 got right on both; the measurement that justified it was taken with FIVE BYTES on stdin, where a large `n` fails only because the wasm floor pre-allocates the REQUESTED size. A guard measured on input that cannot exercise it gets set below every real use. The genuine constraint is the floor's i32 boundary, and the self-host now reads in 2^26 CHUNKS so it never hands the floor a span it cannot represent — the chunk bounds the buffer, not the answer. The two halves of that chunk size are rostered as a cross-leg pair in scripts/check-alloc-ceilings.sh. RATIFIED CORRECTION (2026-08-17, ○×: A) — THE WIDENED CEILING IS WITHDRAWN BEFORE EVER SHIPPING. The passages above describing a shared 2 GiB abort on `bytes.new`/`pad_left`/`pad_right`/`chunks`, `list.range` and `string.pad_start`/`pad_end` no longer hold: those are plain allocations and carry NO chosen ceiling on either leg. A nine-compiler survey (../almide-references/RESEARCH-allocation-ceilings.md) found zero precedent for a chosen cross-target cap — the cohort unifies the failure MECHANISM and MESSAGE and lets the THRESHOLD stay structural per target — and the cap measurably cut work BOTH legs satisfied in 0.57.0 (native and wasm alike handled 2.5 GiB `bytes.new`, `list.range(0, 3e8)`, 2.5e9-column pads; wasm's own floor already turns every unsatisfiable size, u32::MAX and i64::MAX included, into the defined `Error: out of memory` — measured, never a raw trap). Each leg now allocates to its OWN structural bound and takes C-197's abort beyond it; native satisfying what wasm32 cannot is C-197's contracted divergence, declared per cell in proofs/domain-edges.toml. What this contract keeps is exactly its 0.57.0 scope: the REPEAT family's shared ceiling (`string.repeat`, `list