statement = "`xs |> list.map((x) => f(x)!)!` and its `flat_map` sibling — the idiom the language reference recommends — produce the same stdout, stderr and exit code on both targets when the callback calls a USER `effect fn`, including the ADR-0006 first-err short-circuit. A LAMBDA is a target-directed position: its own `Ty::Fn` ret is the authority, and monomorphization already specializes the twin off exactly that type (`list.__fallible_map__Int_Int_String` is named for `(Int) -> Result[Int, String]`). But the v1-only pre-pass that strips the carrier from a NEVER-ERR lifted effect call recurses INTO lambda bodies, and the lambda lifter reads only the BODY — so the tail came out raw `Int` while the enclosing node still said `Result[Int, String]`. The lifted function rendered `(result i64)` where the `call_indirect` inside the monomorphized twin declares `(result i32)`, a Result block pointer. Two observable failures followed on the SAME defect, and the difference between them is only where the reinterpreted value landed: the `map` cells trapped at run time with `wasm trap: indirect call type mismatch`, while `flat_map` did not trap at all — native printed `a1,b,a2,b` and wasm printed four EMPTY strings, both exit 0, the silent-wrong class, on the documented idiom (almide#1406). Native was never affected: the strip is a v1/MIR pre-pass and the codegen leg keeps the carrier uniformly. The re-wrap pass whose stated contract is already `a target position whose declared type is Result must hold a Result block` simply never enumerated `Lambda` among its List/Call/Tuple/Record arms; it does now, and because the callee genuinely never errs, `ok(call)` is exact. WHY THE SUITE DID NOT SEE IT: every prior fixture for the fallible form drives it with a non-effect callee returning Result or with `int.parse` — that cell passes on both legs and is pinned here unchanged — while the effect-fn cell had no coverage at all. The THIRD judge covers this too, and covering it required the same repair: the interpreter's fallible-HOF glue read the callback's applied VALUE and abstained on a bare payload (`__fallible_* callback returned Int`), so the fixture would have entered the interp-abstain ledger — shrinking the executable spec at exactly the shape this contract is about. It now consults the closure's own declared `Ty::Fn` ret, the same authority the MIR side uses, and since the callee cannot err `ok(v)` is exact rather than a guessed polarity. All three legs agree on every cell. There is still NO emit-time signature-agreement check between an `elem` entry and a `call_indirect` type; this contract is the executable evidence in its place, not a proof that the class is closed."
since     = "0.57.1"
status    = "active"
evidence  = [
  { path = "spec/wasm_cross/fallible_hof_effect_callback_family.almd", class = "fixture" },
]

[[contract]]
id        = "C-285"
spec      = "ALS-D4"
title     = "regex.captures answers the whole match at index 0, and `none` means only that nothing matched"
statement = "`regex.captures(pat, s)` answers `some([whole, group1, group2, ...])` — index 0 is the WHOLE match, 1.. are the capture groups in lexical order, and an optional group that did not participate is the empty string — identically on both targets. `none` means exactly one thing: the pattern did not match anywhere in `s`. Two changes from 0.57.x, both toward the shape every mainstream regex API uses (Rust `Captures::get(0)`, Python `m.group(0)`, JS `match[0]`, PCRE) and the one `docs/stdlib/regex.md` had documented since it was written. (1) The whole match was MISSING: both engines returned groups only, so a caller carrying the universal habit read `caps[1]` as the first group and silently got the SECOND — a wrong value, not an error, which is the class this language exists to remove. It was found dogfooding, not by a test: every fixture had been written against the implementation rather than the documented example (almide#1432). (2) A pattern with NO groups returned `none` even when it MATCHED, conflating `matched, nothing to capture` with `did not match`; with a whole match at index 0 that case has a real answer, `some([whole])`, so `none` is now unambiguous. The engines reach it differently and both were changed: native takes the `(start, end)` `rx_find_at` already computed and discarded, while the self-host scan now returns the matching START — the end alone cannot name the whole match — and the caller re-runs the matcher there so the capture buffer it reads belongs to the winning attempt rather than the last position probed."
since     = "0.57.1"
status    = "active"
evidence  = [
  { path = "spec/wasm_cross/regex_engine.almd", class = "fixture" },
]

[[contract]]
id        = "C-286"
spec      = "ALS-E9"
title     = "`??` reads its source; the Option survives the elimination and stays readable"
statement = "`xs ?? default` READS the Option it eliminates. The source is not consumed, so the same binding may be eliminated any number of times, and remains readable afterwards by any other spelling (`match`, a further `??`), with identical results on both targets. It used to be consumed on the wasm leg for every HEAP payload. A heap `??` lowers to a synthesized `match e { some(p) => p, none => d }` (#1270), and `try_lower_variant_value_match` dropped its subject; the ownership test was membership in `live_heap_handles`, whose own documentation calls it `heap handles in binding order, FOR SCOPE-END DROPS` — so every `let`-bound heap local is in it, and a still-live user variable was read as an owned temporary. The first `??` therefore FREED the binding while later readers still needed it. The payload arm was never the problem: it already emitted `Op::Dup`. Only one leg lost the value, which is why it went unseen: the native renderer emits `Drop`/`DropListStr` as a COMMENT and leaves the free to Rust's own scope end, while the wasm renderer emits `rc_dec` and the free is real — so both legs exited 0 and printed different answers. Measured across the family: `String?` gave `abc,z` against `abc,abc`, `List[Int]?` gave `3,0` against `3,3`, `Option[Option[Int]]` gave `5,9,9` against `5,5,5`, and a `match` reading the source after one `??` saw the payload already freed. This is `xs ?? default` — the fallback idiom docs/CHEATSHEET.md recommends — so the blast radius was every heap Option in the language, not a corner. Found by the differential fuzz (seed 510754018596 index 189, a mutation of spec/wasm_cross/option_result_ctors.almd) in its nested-Option cell only; the fixture pins the whole family because the defect lived in the match's subject handling and never cared which payload type it carried. A HAND-WRITTEN two-arm `match` over the same binding was always correct — that asymmetry is what localized the defect to the synthesized rewrite rather than to matching, and it is pinned here as a counter-cell. The scope-end pass still drops the binding exactly once: a subject left alone stays in `live_heap_handles`, so the single-use shape neither double-frees nor leaks, and that cell is pinned too."
since     = "0.57.1"
status    = "active"
evidence  = [
  { path = "spec/wasm_cross/unwrap_or_source_survives.almd", class = "fixture" },
]


