[[contract]]
id        = "C-229"
spec      = "ALS-R6"
title     = "A selected row past the byte buffer is the all-zero row on both targets"
statement = "The three `matrix.select_rows_*` byte-buffer selectors (f32 LE, Q1_0, Q8_0) answer an out-of-range row id with the ALL-ZERO row — the same defined OOB→zeros edge the full-matrix `from_bytes_*` loaders take, applied per selected row — and clamp a negative row id to row 0 and a negative offset to 0, identically on both targets. Found by the generative fuzzer (run 31515916427, a mutation of the C-228 fixture): native panicked on an unchecked slice (`range end index 33 out of range for slice of length 32`) while wasm read undefined heap bytes past the block — a raw-abort/silent-wrong divergence, closed by per-row bounds checks against the buffer length in both implementations. `ALL-ZERO` is a claim about BIT PATTERNS: the zeros are observed through `float.to_string`, which spells the sign that `==` cannot see, and it holds for the IN-RANGE zeros too — the DEQUANTIZATION-ZERO RULING (#1358, fuzz run 31667874852) is that a Q1_0/Q8_0 element of zero magnitude is `+0.0` on both targets. A quantized element is magnitude (the block's fp16 scale) × direction (the sign bit / int8 quant); at zero magnitude the bytes encode no direction, so the sign IEEE-754 returns is an artifact of how the arithmetic was spelled — native's `-scale` produced -0.0 on an all-zero block exactly where wasm's `0.0 - scale` produced +0.0, and every `-0.0 == 0.0` downstream agreed with both. Both entry points are pinned (`select_rows_q1_0` and its full-matrix twin `from_q1_0_bytes`), for Q1_0 per block (every element is ±scale) and for Q8_0 per element (the product is zero from EITHER factor, and `a·b` signs by xor). Non-zero weights keep their exact sign; the float DECODERS `from_bytes_f16_le`/`_f32_le`/`_f64_le` are deliberately excluded, since there a stored -0.0 is the datum — see C-270. The same negative-index rule holds for the whole BYTES accessor family: a negative offset is a NO-OP for every `bytes.set_*` and the type default for every `bytes.read_*`, on both targets, never a panic (#1408). The writers previously cast `pos as usize` and guarded with `p + width <= len`, which WRAPPED past its own check (usize::MAX + 4 = 3), so native died with a raw slice panic where wasm ran clean; the readers already used checked_add and were unaffected. THE OTHER END OF THE SAME DOMAIN, found by the differential fuzz a night later (seed 510754018593 index 222, a spec/wasm_cross/matrix_select_rows.almd mutation): the #1408 fix made NATIVE's writers `checked_add`, but the wasm self-host kept the room test as `pos + N <= n`, and that sum wraps for a `pos` near the TOP of i64 exactly as it did for a negative one. The wrapped negative passed `<= n`, the store went ahead, and `base + pos` landed back inside the buffer: `bytes.set_f32_le(b, i64::MAX, 4.0)` left native's buffer untouched and MUTATED the wasm one, exit 0 on both — a silent write, which is how it surfaced, as a denormal f32 appearing in a row decoded by `matrix.select_rows_f32`. All fourteen widths carried the identical guard and all fourteen are rewritten to SUBTRACT (`pos <= n - N`), which cannot overflow because `n` is a length; a buffer shorter than N makes `n - N` negative, which the existing `pos >= 0` half already rejects. The fixture's matrix now spans BOTH ends — every width at -1, at a large negative, at i64::MAX, at i64::MAX - 1, and at the 2^32 narrowing boundary — because the first fix demonstrated that a per-width hand-written guard drifts back on whichever end nothing measures. The FULL-MATRIX loader was left behind by the row-subset fix: `matrix.from_q1_0_bytes` carried no buffer limit at all, so a rows/cols pair asking for more 18-byte blocks than the buffer holds read straight past it — native bounds-checked its slice and died with a RAW PANIC (exit 101, the form ALS-T6 forbids) where wasm read whatever linear memory held and answered. `from_q1_0_bytes(bytes.new(18), 0, 4, 128)` was exit 101 against a four-row answer (differential fuzz, a matrix_select_rows_oob mutation). Both legs now take the same per-ROW edge the row-subset twin already took: a row whose blocks would fall outside the buffer is the all-zero row, and the in-range shape is unchanged."
since     = "0.57.1"
