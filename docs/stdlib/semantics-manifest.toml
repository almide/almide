# index_unit vocabulary — env (the datetime scales, one module over):
#   second      — Unix-epoch seconds (unix_timestamp — NOT millis)
#   millisecond — Unix-epoch milliseconds (millis — 1000× the second scale)
[env]
default_index_unit = "second"

[[env.fn]]
name = "unix_timestamp"
index_unit = "second"
setup = [
  "let ts = env.unix_timestamp()",
]
probe = 'ts > 1700000000 and ts < 100000000000'
expect = "true"
note = """
The window pins the SCALE: seconds since the epoch sit near 1.7e9 in this era,
while a milliseconds value would exceed the 1e11 upper bound — the exact
confusion the second/millisecond split exists to prevent.
"""

[[env.fn]]
name = "millis"
index_unit = "millisecond"
setup = [
  "let ms = env.millis()",
]
probe = 'ms > 1700000000000'
expect = "true"
note = """
Milliseconds exceed 1.7e12 in this era — a seconds value could never reach the
bound, so the probe separates the two scales.
"""

[[env.fn]]
name = "sleep_ms"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed: env.sleep_ms is HOST_CAPABILITY on the wasm leg (no
WASI sleep), so a calling probe would push this whole generated file off the
wasm leg — and the millisecond SCALE would be flaky to assert anyway. The
native semantics are pinned by the duration tests.
"""

# index_unit vocabulary — random:
#   value — the Int is a produced or bounding value. int(min, max) is
#           INCLUSIVE ON BOTH ENDS (range = max - min + 1), and min >= max
#           collapses to min — both pinned below
#   byte-count — bytes(n): n is the length of the result
[random]
default_index_unit = "value"

[[random.fn]]
name = "int"
index_unit = "value"
setup = [
  "let r = random.int(1, 6)",
  "let collapsed = random.int(9, 3)",
]
probe = 'r >= 1 and r <= 6 and collapsed == 9'
expect = "true"
note = """
Both ends inclusive (a die roll reaches 6), and the degenerate min >= max
case returns min — the two bound behaviors a caller gets wrong.
"""

[[random.fn]]
name = "seeded"
index_unit = "value"
probe = 'random.next_int(random.seeded(0), 1, 6).0'
expect = "4"
note = """
The seed fixes the stream: SplitMix64 from state 0 draws 4 first on the
1..6 range, on every target, every run.
"""

[[random.fn]]
name = "next_int"
index_unit = "value"
setup = [
  "let r = random.next_int(random.seeded(7), 1, 6).0",
  "let collapsed = random.next_int(random.seeded(7), 9, 3).0",
]
probe = 'r >= 1 and r <= 6 and collapsed == 9'
expect = "true"
note = """
The bounds rule of random.int: both ends inclusive, and min >= max returns min.
"""

[[random.fn]]
name = "bytes"
index_unit = "byte-count"
setup = [
  "let b = random.bytes(13)",
  "let e = random.bytes(0)",
]
probe = 'bytes.len(b) == 13 and bytes.len(e) == 0'
expect = "true"
note = """
n is a byte COUNT: the result is exactly n bytes long, n = 0 is empty (C-394).
The bytes themselves are the OS CSPRNG's and not probed; a negative n aborts.
"""

