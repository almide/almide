# Stdlib semantics manifest — §8 step 2 (#521).
#
# THE machine-checked record of semantic dimensions prose used to carry
# alone (the #419 class: docs said characters, the implementation did bytes,
# for years). Enforced by scripts/check-semantics-manifest.sh:
#
#   1. COVERAGE (signature-driven, no human list): every `string` fn whose
#      signature mentions Int MUST have an entry here declaring its
#      `index_unit`. A new Int-bearing fn cannot land without declaring its
#      unit.
#   2. PROBES: every entry carries an executable probe (multibyte input) +
#      expected output. The script REGENERATES
#      spec/stdlib/<module>_semantics_manifest_test.almd from these and fails
#      on diff — doc and test can never drift apart, and the test failing
#      means the IMPLEMENTATION drifted from the declared semantics.
#
# OPTIONAL `setup` key: a list of statements emitted before the probe inside
# the same test block. A probe is ONE expression, and a block expression inside
# the interpolation walls the wasm renderer — so a dimension that needs two
# reads to compare (a clock's monotonicity) binds them here instead of inlining
# a block. Keep probes single-expression where they already fit.
#
# THE RULE for `index_unit`: it names the unit of the Int the function's
# MEANING hinges on — the one a caller gets wrong. For `string.len` that is the
# return (codepoints); for `string.slice` the position params; for
# `datetime.day` the return (a civil field), not the `ts` param it reads.
#
# index_unit vocabulary — string:
#   codepoint — positions/lengths count Unicode scalar values (C-065)
#   byte      — positions/lengths count UTF-8 bytes (only where the NAME
#               says bytes)
#   scalar    — the Int is a Unicode scalar VALUE, not a position
#   count     — the Int is an occurrence/repetition count, not a position
#
# index_unit vocabulary — datetime:
#   second      — the Int counts SECONDS: a Unix-epoch timestamp, a duration,
#                 or an offset. The module's timestamp scale (NOT millis)
#   day/hour/   — the Int is an offset COUNT in that calendar unit, which the
#     minute      function scales to seconds itself (add_days(0, 1) = 86400)
#   nanosecond  — the Int counts NANOSECONDS (monotonic_ns)
#   civil-field — the Int is a calendar/clock field value — year, month 1–12,
#                 day-of-month 1–31, hour 0–23, minute/second 0–59 — not a
#                 duration and not a position. The probes pin the ORIGIN
#                 (month of 2024-01-15 is 1, so months are 1-based)
#
# index_unit vocabulary — bytes (every value below verified by execution over
# the fixed buffer [1,2,3,4,5,6,7,8], not read off the prose):
#   byte-offset   — the Int is a position in BYTES from the start, 0-based.
#                   `read_i32_be(b, 4)` starts at byte 4, NOT at the 4th i32
#   byte-count    — the Int counts BYTES: a length, a chunk size, a pad target
#   element-count — the Int counts ELEMENTS of the decoded type, NOT bytes.
#                   The `_array` trap: `read_i32_be_array(b, 0, 2)` consumes 8
#                   bytes, and nothing in the name or the prose says so
#   cursor        — the RETURNED Int is the next byte offset after the read,
#                   not a length. The `_at` family returns `(cursor, T?)`:
#                   `read_i32_be_at(b, 0)` is `(4, some(…))`
#   byte-value    — the Int is one byte's value, 0–255 (`read_u8`, `set_at`'s
#                   val, `fill`'s val)
#   value         — the Int is the number encoded/decoded at exactly the width
#                   AND byte order the name declares. `_be` vs `_le` is the
#                   whole point: 0x0102 reads 258 big-endian, 513 little-endian
#   ordering      — the Int is a comparison sign (-1 / 0 / 1), not a magnitude
#   address       — the Int is a raw address or an opaque heap token
#                   (`data_ptr`, `heap_save`) — meaningless to arithmetic on
#
# OPTIONAL `note` key: prose recording what the probe does NOT prove, for the
# rare entry whose declared dimension is not fully probe-reachable. It is never
# a substitute for a probe — an entry still needs one — and it exists so a
# trusted-not-proven edge is written down instead of implied (the
# docs/contracts/proven-vs-trusted.md discipline).
#
# Modules ratchet on: string is the founding module (the #419 home);
# adding a module = extend COVERED_MODULES in the check script. Each module
# generates its own spec/stdlib/<module>_semantics_manifest_test.almd.
#   ordering      — the Int is a comparison verdict, strictly -1/0/1 (measured:
#                   NOT a byte difference)
#   address       — the Int is a linear-memory/native address or allocator
#                   checkpoint (data_ptr, heap_save). Never a stable value —
#                   probes pin only leg-independent properties (non-zero,
#                   monotonicity, restore-then-allocate works)

[string]
default_index_unit = "codepoint"

[[string.fn]]
name = "len"
index_unit = "codepoint"
probe = 'string.len("café7")'
expect = "5"

[[string.fn]]
name = "length"
index_unit = "codepoint"
probe = 'string.length("café7")'
expect = "5"

[[string.fn]]
name = "slice"
index_unit = "codepoint"
probe = 'string.slice("café7", 0, 4)'
expect = "café"

[[string.fn]]
name = "pad_start"
index_unit = "codepoint"
probe = 'string.pad_start("é", 3, "x")'
expect = "xxé"

[[string.fn]]
name = "pad_end"
index_unit = "codepoint"
probe = 'string.pad_end("é", 3, "x")'
expect = "éxx"

[[string.fn]]
name = "to_bytes"
index_unit = "byte"
probe = 'list.len(string.to_bytes("é"))'
expect = "2"

[[string.fn]]
name = "from_bytes"
index_unit = "byte"
probe = 'string.from_bytes([195, 169])'
expect = "é"

[[string.fn]]
name = "get"
index_unit = "codepoint"
probe = 'string.get("café7", 3) ?? "?"'
expect = "é"

[[string.fn]]
name = "index_of"
index_unit = "codepoint"
probe = 'string.index_of("café7", "7") ?? -1'
expect = "4"

[[string.fn]]
name = "last_index_of"
index_unit = "codepoint"
probe = 'string.last_index_of("café7", "7") ?? -1'
expect = "4"

[[string.fn]]
name = "repeat"
index_unit = "count"
probe = 'string.repeat("é", 2)'
expect = "éé"

[[string.fn]]
name = "codepoint"
index_unit = "scalar"
probe = 'string.codepoint("é") ?? -1'
expect = "233"

[[string.fn]]
name = "from_codepoint"
index_unit = "scalar"
probe = 'string.from_codepoint(233)'
expect = "é"

[[string.fn]]
name = "count"
index_unit = "count"
probe = 'string.count("ééa", "é")'
expect = "2"

[[string.fn]]
name = "take"
index_unit = "codepoint"
probe = 'string.take("café7", 4)'
expect = "café"

[[string.fn]]
name = "take_end"
index_unit = "codepoint"
probe = 'string.take_end("café7", 2)'
expect = "é7"

[[string.fn]]
name = "drop"
index_unit = "codepoint"
probe = 'string.drop("café7", 3)'
expect = "é7"

[[string.fn]]
name = "drop_end"
index_unit = "codepoint"
probe = 'string.drop_end("café7", 2)'
expect = "caf"

[[string.fn]]
name = "run_length_encode"
index_unit = "count"
probe = 'string.run_length_encode("ééa")'
expect = """[("é", 2), ("a", 1)]"""

# ---------------------------------------------------------------------------
# datetime — the second module on the ratchet. The #419 question here is the
# TIMESTAMP SCALE (seconds, not milliseconds — a JS-shaped assumption is off by
# 1000x and still type-checks) and the CIVIL-FIELD ORIGIN (month/day 1-based,
# hour/minute/second 0-based). Every field probe reads the same fixed instant,
# 1705322096 = 2024-01-15T12:34:56Z, as a LITERAL rather than through
# from_parts, so a bug in from_parts cannot mask a bug in an extractor.
# ---------------------------------------------------------------------------

[datetime]
default_index_unit = "second"

[[datetime.fn]]
name = "add_days"
index_unit = "day"
probe = 'datetime.add_days(0, 1)'
expect = "86400"

[[datetime.fn]]
name = "add_hours"
index_unit = "hour"
probe = 'datetime.add_hours(0, 1)'
expect = "3600"

[[datetime.fn]]
name = "add_minutes"
index_unit = "minute"
probe = 'datetime.add_minutes(0, 1)'
expect = "60"

[[datetime.fn]]
name = "add_seconds"
index_unit = "second"
probe = 'datetime.add_seconds(0, 1)'
expect = "1"

[[datetime.fn]]
name = "day"
index_unit = "civil-field"
probe = 'datetime.day(1705322096)'
expect = "15"

[[datetime.fn]]
name = "diff_seconds"
index_unit = "second"
probe = 'datetime.diff_seconds(90, 30)'
expect = "60"

[[datetime.fn]]
name = "format"
index_unit = "second"
probe = 'datetime.format(1705322096, "%Y-%m-%dT%H:%M:%SZ")'
expect = "2024-01-15T12:34:56Z"

[[datetime.fn]]
name = "from_parts"
index_unit = "civil-field"
probe = 'datetime.from_parts(2024, 1, 15, 12, 34, 56)'
expect = "1705322096"

[[datetime.fn]]
name = "from_unix"
index_unit = "second"
probe = 'datetime.from_unix(1705322096)'
expect = "1705322096"

[[datetime.fn]]
name = "hour"
index_unit = "civil-field"
probe = 'datetime.hour(1705322096)'
expect = "12"

[[datetime.fn]]
name = "is_after"
index_unit = "second"
probe = 'datetime.is_after(0, 1)'
expect = "false"

[[datetime.fn]]
name = "is_before"
index_unit = "second"
probe = 'datetime.is_before(0, 1)'
expect = "true"

[[datetime.fn]]
name = "minute"
index_unit = "civil-field"
probe = 'datetime.minute(1705322096)'
expect = "34"

[[datetime.fn]]
name = "monotonic_ns"
index_unit = "nanosecond"
setup = [
  "let a = datetime.monotonic_ns()",
  "let b = datetime.monotonic_ns()",
]
probe = 'b >= a'
expect = "true"
note = """
Proves the ORDER property the clock promises — never goes backwards. It does
NOT prove the nanosecond SCALE, and it cannot pin a VALUE: the origin is an
unspecified reference point that differs by target BY DESIGN (native counts
from the first call, WASI from its own epoch), so only differences are
meaningful. The only executable discriminator between ns/us/ms is a wall-clock
lower bound over a timed workload, and a timing assertion inside a correctness
gate is a flake source this repo does not accept. The scale is TRUSTED from the
two implementations — Instant::elapsed().as_nanos() natively,
prim.clock_time_get(1, …) undivided on WASI — not proven here.
"""

[[datetime.fn]]
name = "month"
index_unit = "civil-field"
probe = 'datetime.month(1705322096)'
expect = "1"

[[datetime.fn]]
name = "now"
index_unit = "second"
probe = 'if datetime.now() > 1700000000 and datetime.now() < 100000000000 then "second" else "other"'
expect = "second"
note = """
Reads the host clock, so the probe cannot assert a value — it asserts the
SCALE, which is the dimension that bites. The window is the discriminator: a
seconds clock lands in it (1.7e9) and a millisecond clock does not (1.7e12
exceeds the 1e11 ceiling), so a unit regression fails here rather than silently
shipping a 1000x error.
"""

[[datetime.fn]]
name = "parse_iso"
index_unit = "second"
probe = 'match datetime.parse_iso("2024-01-15T12:34:56Z") { ok(v) => v, err(_) => -1 }'
expect = "1705322096"

[[datetime.fn]]
name = "second"
index_unit = "civil-field"
probe = 'datetime.second(1705322096)'
expect = "56"

[[datetime.fn]]
name = "to_iso"
index_unit = "second"
probe = 'datetime.to_iso(1705322096)'
expect = "2024-01-15T12:34:56Z"

[[datetime.fn]]
name = "to_unix"
index_unit = "second"
probe = 'datetime.to_unix(1705322096)'
expect = "1705322096"

[[datetime.fn]]
name = "weekday"
index_unit = "second"
probe = 'datetime.weekday(1705322096)'
expect = "Monday"

[[datetime.fn]]
name = "year"
index_unit = "civil-field"
probe = 'datetime.year(1705322096)'
expect = "2024"

# ---------------------------------------------------------------------------
# bytes — the third module on the ratchet, and the widest API FAMILY in the
# stdlib: read/set/append x {i16,i32,i64,u16,u32,u8,f16,f32,f64} x {be,le}.
# CLAUDE.md's rule is that a family is extended BY MATRIX, never point-wise —
# this table is that matrix for the semantic axis, so a cell whose byte order
# or width silently disagrees with its NAME cannot survive.
#
# The scalar-read probes use the fixture [255,254,253,252,251,250,249,248]:
# with the high bit SET, signed and unsigned disagree (i16_be = -2 vs
# u16_be = 65534) and big- and little-endian disagree (i16_be = -2 vs
# i16_le = -257), so one probe pins width, signedness and byte order at once.
# A low-byte fixture like [1,2,3,4] would have let a signed/unsigned mixup
# through. Every expectation below is computed independently by Python's
# `struct` and then checked against the implementation, never transcribed
# from a run.
#
# The float probes invert that: the byte PATTERN is derived from 1.5 for the
# target order, so the expectation is 1.5 by construction and a byte-order
# regression shows up as a garbage float rather than a value someone has to
# recognise.
# ---------------------------------------------------------------------------

[bytes]
default_index_unit = "byte-offset"

[[bytes.fn]]
name = "read_i16_be"
index_unit = "value"
probe = 'bytes.read_i16_be(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "-2"

[[bytes.fn]]
name = "read_i16_le"
index_unit = "value"
probe = 'bytes.read_i16_le(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "-257"

[[bytes.fn]]
name = "read_u16_be"
index_unit = "value"
probe = 'bytes.read_u16_be(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "65534"

[[bytes.fn]]
name = "read_u16_le"
index_unit = "value"
probe = 'bytes.read_u16_le(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "65279"

[[bytes.fn]]
name = "read_i32_be"
index_unit = "value"
probe = 'bytes.read_i32_be(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "-66052"

[[bytes.fn]]
name = "read_i32_le"
index_unit = "value"
probe = 'bytes.read_i32_le(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "-50462977"

[[bytes.fn]]
name = "read_u32_be"
index_unit = "value"
probe = 'bytes.read_u32_be(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "4294901244"

[[bytes.fn]]
name = "read_u32_le"
index_unit = "value"
probe = 'bytes.read_u32_le(bytes.from_list([255, 254, 253, 252, 251, 250, 249, 248]), 0)'
expect = "4244504319"

[[bytes.fn]]
name = "read_i64_be"
index_unit = "value"
