# index_unit vocabulary — testing:
#   value — the Int is a compared MAGNITUDE, and the comparison is STRICT
#           (measured 2026-08-13: assert_gt(1, 1) and assert_lt(1, 1) both
#           fail — native "assert_gt failed: 1 is not > 1" exit 101, wasm
#           "assert_gt failed" exit 1)
[testing]
default_index_unit = "value"

[[testing.fn]]
name = "assert_gt"
index_unit = "value"
setup = [
  "testing.assert_gt(2, 1)",
]
probe = "true"
expect = "true"
note = """
The passing call pins the ARGUMENT ORDER: assert_gt(a, b) passes iff a > b,
so a reversed implementation would fail this file. Strictness is measured
out-of-band (an in-file failing call would fail the harness itself, and the
assert_throws route is HARNESS_LIMITATION on wasm): assert_gt(1, 1) rejects
on BOTH legs — native panics "assert_gt failed: 1 is not > 1" (exit 101),
wasm prints "assert_gt failed" (exit 1).
"""

[[testing.fn]]
name = "assert_lt"
index_unit = "value"
setup = [
  "testing.assert_lt(1, 2)",
]
probe = "true"
expect = "true"
note = """
The mirror of assert_gt: passes iff a < b, strictly — measured out-of-band,
assert_lt(1, 1) rejects on both legs ("1 is not < 1" natively).
"""

# index_unit vocabulary — args:
#   element-index — the Int is a 0-based list position. For the __ scan
#                   helpers it is the RAW argv position the scan STARTS at;
#                   for positional_at it is a position in the FILTERED
#                   positional list (flag arguments removed first)
[args]

[[args.fn]]
name = "__flag_at"
index_unit = "element-index"
setup = [
  'let hit = args.__flag_at(["x", "--verbose"], "--verbose", "-v", 0)',
  'let skipped = args.__flag_at(["--verbose", "x"], "--verbose", "-v", 1)',
]
probe = "hit and not skipped"
expect = "true"
note = """
i is the 0-based RAW-argv position the scan starts at: starting at 0 finds
"--verbose" sitting at position 1 (hit = true), while starting at 1 can
never see the flag at position 0 (skipped = false) — i is a start index,
not a match position or a count.
"""

[[args.fn]]
name = "__find_prefixed"
index_unit = "element-index"
setup = [
  'let found = args.__find_prefixed(["a", "--out=x"], "--out=", 0) ?? "none"',
  'let skipped = args.__find_prefixed(["--out=x", "b"], "--out=", 1) ?? "none"',
]
probe = 'found + " " + skipped'
expect = "--out=x none"
note = """
The same start-index dimension as __flag_at, and the some() payload is the
WHOLE matching element ("--out=x"), not the part after the prefix.
"""

[[args.fn]]
name = "positional_at"
index_unit = "element-index"
probe = 'args.positional_at(0) ?? "none"'
expect = "none"
note = """
The harness runs test files with an empty argv, so in-file the probe can only
pin the empty case (index 0 of no positionals is none, not a trap). The
FILTERED-list dimension is measured out-of-band on BOTH legs (2026-08-13,
`almide run … -- alpha --flag beta`, native and wasm byte-identical):
positional_at(0) = "alpha" and positional_at(1) = "beta" — the index counts
POSITIONAL (non-flag) arguments with "--flag" filtered out, 0-based — and
positional_at(2) is none.
"""

# index_unit vocabulary — mem (the bytes address discipline, module-sized):
#   address — the Int is an opaque allocator CHECKPOINT token, produced by
#             save and consumed by restore — never a byte count, meaningless
#             to arithmetic on
[mem]

[[mem.fn]]
name = "save"
index_unit = "address"
probe = "1"
expect = "1"
note = """
Declared, not probed in-file: mem.save WALLS the verified wasm renderer today
("scalar binding outside the value subset" brick), so a calling probe would
push this generated file off the wasm leg. Measured on the native leg
(2026-08-13): save() returns 0 and the save/spacer/save monotonicity and
restore-then-allocate sequences run without corruption — native pins both
calls as no-ops (runtime/rs/src/mem.rs: RC already reclaims what a restore
would). The checkpoint is only a live bump-allocator token on the wasm leg,
where the same discipline is probe-pinned by the bytes.heap_save /
bytes.heap_restore rows.
"""

[[mem.fn]]
name = "restore"
index_unit = "address"
probe = "1"
expect = "1"
note = """
Declared, not probed in-file (the same wasm wall as save). mark is an opaque
token a save RETURNED, not a byte count. Measured on the native leg
(2026-08-13): save / allocate 64 bytes / restore / allocate again returns the
fresh allocation intact ([5, 6]) — the native no-op pair is safe to call.
"""

# index_unit vocabulary — zlib:
#   value — the Int is the COMPRESSION LEVEL knob, 0–9 (0 = stored, 9 = max
#           effort; out of range CLAMPS, never errors) — not a size and not
#           a byte count
[zlib]
default_index_unit = "value"

[[zlib.fn]]
name = "compress_level"
index_unit = "value"
probe = "1"
expect = "1"
note = """
Declared, not probed in-file: zlib is HOST_CAPABILITY on the wasm leg
(measured wall: "zlib.compress_level needs a declared capability not in this
brick"; spec/stdlib/zlib_test.almd sits in the fallback baseline), so a
calling probe would push this generated file off the wasm leg. Measured on
the native leg (2026-08-13, input [1,2,3] repeated 4x = 12 bytes): the level
is an EFFORT knob, not a size — level 0 STORES (23-byte output, larger than
the input), level 9 compresses to 13; out of range CLAMPS instead of
erroring (level -1 produces level 0's 23 bytes, level 10 produces level 9's
13 — runtime clamp(0, 9)); decompress roundtrips the input byte-identically
at levels 0, 9 and 10.
"""

[[zlib.fn]]
name = "deflate_level"
index_unit = "value"
probe = "1"
expect = "1"
note = """
The same level dimension and clamp on the RAW deflate stream — measured on
the native leg (2026-08-13, same 12-byte input): level 0 gives 17 bytes
where compress_level gives 23 (the 6-byte difference is the zlib
header + adler32 wrapper deflate omits), level 9 gives 7, level 10 clamps
to 9's 7 bytes, and inflate roundtrips the level-10 output byte-identically.
"""

# Zero-Int modules, ratcheted for the FUTURE: map, set, option, result, error,
# regex, bool, path, base64 and hex bear no Int in any swept signature today,
# so their entry lists are empty — but COVERED_MODULES holds them, so the first
# Int-bearing fn to land in any of them cannot merge without declaring its unit
# here.
#
# path is the strongest case for a zero-Int ratchet: its whole surface is
# String → String (join / dirname / basename / extension / stem / normalize)
# plus the SafePath newtype, and the ONE dimension a caller would get wrong —
# whether a position counts bytes or codepoints — cannot arise until someone
# adds an Int-bearing fn (a `path.depth`, a `path.split_at`). This section is
# the tripwire for that day.
#
# base64 and hex are total Bytes ⇄ String codecs (encode / encode_url /
# encode_upper / decode / decode_url): every size is carried by the Bytes or
# the String itself, so no Int crosses the boundary. The unit that WOULD appear
# the moment one does is byte-count — a `decoded_len(s)`, an offset-taking
# streaming variant — and it must be declared here first.
[map]
default_index_unit = "value"
fn = []

[set]
default_index_unit = "value"
fn = []

[option]
default_index_unit = "value"
fn = []

[result]
default_index_unit = "value"
fn = []

[error]
default_index_unit = "value"
fn = []

[regex]
default_index_unit = "value"
fn = []

[bool]
default_index_unit = "value"
fn = []

[path]
default_index_unit = "value"
fn = []

[base64]
default_index_unit = "value"
fn = []

[hex]
default_index_unit = "value"
fn = []
