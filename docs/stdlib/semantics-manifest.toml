# index_unit vocabulary — float:
#   value       — the Int carries the number at integer precision. to_int
#                 TRUNCATES TOWARD ZERO (native `as i64`): 3.9 → 3, -3.9 → -3
#   bit-pattern — the Int is the raw IEEE-754 bit pattern, not a magnitude
#   count       — the Int counts digits (to_fixed's decimals)
[float]
default_index_unit = "value"

[[float.fn]]
name = "to_int"
index_unit = "value"
probe = 'float.to_int(0.0 - 3.9)'
expect = "-3"
note = """
Truncation TOWARD ZERO (native `as i64`), not floor: -3.9 becomes -3. The
negative operand is the discriminating case — floor would give -4.
"""

[[float.fn]]
name = "to_int_checked"
index_unit = "value"
probe = '"${float.to_int_checked(0.0 - 3.0)} ${float.to_int_checked(0.0 - 3.9)}"'
expect = "some(-3) none"
note = """
The checked cell of the Float -> Int trio (#4145): some only for an integer
value in the Int range. -3.9 is the discriminating case — a truncating or
flooring conversion would answer some(-3) or some(-4) instead of none.
"""

[[float.fn]]
name = "to_int_saturating"
index_unit = "value"
probe = 'float.to_int_saturating(0.0 - 3.9)'
expect = "-3"
note = """
The saturating cell of the Float -> Int trio (#4145): float.to_int spelled
explicitly — truncation toward zero, so -3.9 becomes -3, not -4.
"""

[[float.fn]]
name = "from_int"
index_unit = "value"
probe = 'float.from_int(2)'
expect = "2"

[[float.fn]]
name = "to_fixed"
index_unit = "count"
probe = 'float.to_fixed(3.14159, 2)'
expect = "3.14"

[[float.fn]]
name = "to_bits"
index_unit = "bit-pattern"
probe = 'float.to_bits(1.0)'
expect = "4607182418800017408"

[[float.fn]]
name = "compare"
index_unit = "value"
probe = 'float.compare(0.0 * (0.0 - 1.0), 0.0)'
expect = "-1"
note = """
The IEEE total order: -0.0 sorts below 0.0, where -0.0 < 0.0 is false.
"""

[[float.fn]]
name = "from_bits"
index_unit = "bit-pattern"
probe = 'float.to_string(float.from_bits(4607182418800017408))'
expect = "1.0"

