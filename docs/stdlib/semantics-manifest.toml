# index_unit vocabulary — int:
#   value       — the Int is a plain numeric value at full i64 precision
#   bit-pattern — the Int is (or the fn operates on) the raw two's-complement
#                 64-bit pattern: to_hex(-1) is the full 16-f image, bnot(0) is
#                 -1, bit_reverse(1) is i64::MIN — magnitudes are meaningless
#   count       — the Int counts BITS: a shift distance, a leading/trailing/
#                 population count, a width, a log2, or the wrap/rotate family's
#                 `bits` width parameter
#
# The sized-conversion matrix (#956: lossy ⇒ trio) pins one discriminating
# input per cell: the PLAIN cast WRAPS (two's-complement truncation, 200 as
# i8 = -56), `_checked` yields none on overflow, `_saturating` clamps to the
# target's bound. The lossless from_* family is plain-only by design.
[int]
default_index_unit = "value"

[[int.fn]]
name = "to_string"
index_unit = "value"
probe = 'int.to_string(0 - 42)'
expect = "-42"

[[int.fn]]
name = "to_hex"
index_unit = "bit-pattern"
probe = 'int.to_hex(0 - 1)'
expect = "ffffffffffffffff"
note = """
The image is the raw two's-complement 64-bit pattern in lowercase hex, no
prefix: -1 is sixteen f's, never "-1" in hex.
"""

[[int.fn]]
name = "parse"
index_unit = "value"
probe = 'int.parse("-42") ?? 0'
expect = "-42"

[[int.fn]]
name = "count_ones"
index_unit = "count"
probe = 'int.count_ones(255)'
expect = "8"

[[int.fn]]
name = "bit_length"
index_unit = "count"
probe = 'int.bit_length(255)'
expect = "8"

[[int.fn]]
name = "compare"
index_unit = "value"
probe = 'int.compare(0 - 5, 3)'
expect = "-1"

[[int.fn]]
name = "sign"
index_unit = "value"
probe = 'int.sign(0 - 9)'
expect = "-1"

[[int.fn]]
name = "pow"
index_unit = "value"
probe = 'int.pow(0 - 2, 3)'
expect = "-8"

[[int.fn]]
name = "floor_div"
index_unit = "value"
probe = 'int.floor_div(0 - 7, 2)'
expect = "-4"
note = """
Rounds toward -inf, not toward 0: -7 / 2 is -3, floor_div(-7, 2) is -4.
"""

[[int.fn]]
name = "modulo"
index_unit = "value"
probe = 'int.modulo(0 - 7, 3)'
expect = "2"
note = """
The remainder takes the sign of the divisor: -7 % 3 is -1, modulo(-7, 3) is 2.
"""

[[int.fn]]
name = "wrap"
index_unit = "count"
probe = 'int.wrap(0 - 1, 8)'
expect = "255"
note = """
The `bits` param is a WIDTH count: -1 kept to its low 8 bits is 255.
"""

[[int.fn]]
name = "wrap_sub"
index_unit = "value"
probe = 'int.wrap_sub(int.min_value(), 1)'
expect = "9223372036854775807"

[[int.fn]]
name = "bshr_logical"
index_unit = "bit-pattern"
probe = 'int.bshr_logical(0 - 1, 63)'
expect = "1"
note = """
The shift fills with zeros: the 64-bit pattern of -1 shifted 63 leaves only the low bit.
"""

[[int.fn]]
name = "to_string_radix"
index_unit = "value"
probe = 'int.to_string_radix(0 - 255, 16)'
expect = "-ff"
note = """
Signed digits, not the bit pattern: to_hex(-255) is the 16-digit two's complement, to_string_radix(-255, 16) is -ff.
"""

[[int.fn]]
