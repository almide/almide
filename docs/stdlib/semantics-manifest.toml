# index_unit vocabulary — list (the GENERIC fns — len[A], get[A], take[A] … —
# sit outside the signature sweep, which reads only non-generic signatures; the
# element-position dimension for those lives with the list module docs until
# the sweep grows a generics parser. What IS swept is pinned below):
#   value         — the Int is an element value or an arithmetic result over
#                   element values (sum/product; range's start/end are the
#                   VALUES the produced elements run over, end EXCLUSIVE)
#   element-index — the Int is a 0-based ELEMENT position (binary_search's
#                   some(i) — over a SORTED list)
[list]
default_index_unit = "value"

