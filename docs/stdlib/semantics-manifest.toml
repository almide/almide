# index_unit vocabulary — args:
#   element-index — the Int is a 0-based list position. For the __ scan
#                   helpers it is the RAW argv position the scan STARTS at;
#                   for positional_at it is a position in the FILTERED
#                   positional list (flag arguments removed first)
[args]

[[args.fn]]
name = "__flag_at"
index_unit = "element-index"
setup = [
  'let hit = args.__flag_at(["x", "--verbose"], "--verbose", "-v", 0)',
  'let skipped = args.__flag_at(["--verbose", "x"], "--verbose", "-v", 1)',
]
probe = "hit and not skipped"
expect = "true"
note = """
i is the 0-based RAW-argv position the scan starts at: starting at 0 finds
"--verbose" sitting at position 1 (hit = true), while starting at 1 can
never see the flag at position 0 (skipped = false) — i is a start index,
not a match position or a count.
"""

[[args.fn]]
name = "__find_prefixed"
index_unit = "element-index"
setup = [
  'let found = args.__find_prefixed(["a", "--out=x"], "--out=", 0) ?? "none"',
  'let skipped = args.__find_prefixed(["--out=x", "b"], "--out=", 1) ?? "none"',
]
probe = 'found + " " + skipped'
expect = "--out=x none"
note = """
The same start-index dimension as __flag_at, and the some() payload is the
WHOLE matching element ("--out=x"), not the part after the prefix.
"""

[[args.fn]]
name = "__positional_at"
index_unit = "element-index"
setup = [
  'let kept = args.__positional_at(["--out", "r.txt", "in.txt"], ["out"], 0, [])',
  'let late = args.__positional_at(["a", "b"], [], 1, [])',
]
probe = 'list.join(kept, ",") + " " + list.join(late, ",")'
expect = "in.txt b"
note = """
i is the 0-based RAW-argv position the scan starts at, as for __flag_at:
starting at 0 skips "--out" AND its value "r.txt" (a named option, #4144) and
keeps "in.txt"; starting at 1 never sees "a" at position 0.
"""

[[args.fn]]
name = "positional_at"
index_unit = "element-index"
probe = 'args.positional_at(0, [])! ?? "none"'
expect = "none"
note = """
The harness runs test files with an empty argv, so in-file the probe can only
pin the empty case (index 0 of no positionals is none, not a trap). The
FILTERED-list dimension is measured out-of-band on BOTH legs (2026-08-13,
`almide run … -- alpha --flag beta`, native and wasm byte-identical):
positional_at(0) = "alpha" and positional_at(1) = "beta" — the index counts
POSITIONAL (non-flag) arguments with "--flag" filtered out, 0-based — and
positional_at(2) is none.
"""

# index_unit vocabulary — zlib:
#   value — the Int is the COMPRESSION LEVEL knob, 0–9 (0 = stored, 9 = max
#           effort; out of range CLAMPS, never errors) — not a size and not
#           a byte count
[zlib]
default_index_unit = "value"

[[zlib.fn]]
name = "compress_level"
index_unit = "value"
probe = "1"
expect = "1"
note = """
Declared, not probed in-file: zlib is HOST_CAPABILITY on the wasm leg
(measured wall: "zlib.compress_level needs a declared capability not in this
brick"; spec/stdlib/zlib_test.almd sits in the fallback baseline), so a
calling probe would push this generated file off the wasm leg. Measured on
the native leg (2026-08-13, input [1,2,3] repeated 4x = 12 bytes): the level
is an EFFORT knob, not a size — level 0 STORES (23-byte output, larger than
the input), level 9 compresses to 13; out of range CLAMPS instead of
erroring (level -1 produces level 0's 23 bytes, level 10 produces level 9's
13 — runtime clamp(0, 9)); decompress roundtrips the input byte-identically
at levels 0, 9 and 10.
"""

[[zlib.fn]]
name = "deflate_level"
index_unit = "value"
probe = "1"
expect = "1"
note = """
The same level dimension and clamp on the RAW deflate stream — measured on
the native leg (2026-08-13, same 12-byte input): level 0 gives 17 bytes
where compress_level gives 23 (the 6-byte difference is the zlib
header + adler32 wrapper deflate omits), level 9 gives 7, level 10 clamps
to 9's 7 bytes, and inflate roundtrips the level-10 output byte-identically.
"""

# index_unit vocabulary — fs (every value below verified by executing the probe
# on BOTH legs, native and wasm, 2026-08-13 — byte-identical):
#   byte-value — the module default. No fs signature carries a byte as an Int
#                any more: read_bytes / read_bytes_if_exists / write_bytes take
#                and return `Bytes` (R-fs-01), so their former byte-value
#                entries left with the `List[Int]` they described
#   byte-count — the Int counts BYTES of file content (file_size: "aé" is 3,
#                not 2 characters and not a block count)
#   second     — the Int is a Unix-epoch timestamp in SECONDS (modified_at —
#                the same scale as env.unix_timestamp, NOT millis)
[[zlib.fn]]
name = "crc32"
index_unit = "value"
setup = ["let crc = zlib.crc32(bytes.from_list([1, 2, 3]))"]
probe = "crc"
expect = "1438416925"
note = "The Int is the CRC-32 (IEEE, reflected) checksum value, unsigned 32-bit — pure Almide on every leg (#1700), probed for real now that zlib lowers on wasm."

[[zlib.fn]]
name = "adler32"
index_unit = "value"
setup = ["let adl = zlib.adler32(bytes.from_list([1, 2, 3]))"]
probe = "adl"
expect = "851975"
note = "The Int is the Adler-32 checksum value ((s2 << 16) | s1, mod 65521) — pure Almide on every leg (#1700)."

# The `_max` decoders (R-zlib-04, #4020): max_len is a BYTE-COUNT of decoded
# output — the most bytes the result may hold (the default decoders' bound is
# 268435456). A 3-byte output is ok at max_len 3 and err at 2 (the `?? 9-byte`
# fallback shows which).
[[zlib.fn]]
name = "inflate_max"
index_unit = "byte-count"
setup = [
  "let sm_raw = bytes.from_list([1, 3, 0, 252, 255, 9, 8, 7])",
  'let sm_out = "${bytes.len(zlib.inflate_max(sm_raw, 3) ?? bytes.zeros(9))} ${bytes.len(zlib.inflate_max(sm_raw, 2) ?? bytes.zeros(9))}"',
]
probe = "sm_out"
expect = "3 9"

[[zlib.fn]]
name = "decompress_max"
index_unit = "byte-count"
setup = [
  "let sm_z = bytes.from_list([120, 1, 1, 3, 0, 252, 255, 9, 8, 7, 0, 53, 0, 25])",
  'let sm_out = "${bytes.len(zlib.decompress_max(sm_z, 3) ?? bytes.zeros(9))} ${bytes.len(zlib.decompress_max(sm_z, 2) ?? bytes.zeros(9))}"',
]
probe = "sm_out"
expect = "3 9"

[[zlib.fn]]
name = "gunzip_max"
index_unit = "byte-count"
setup = [
  "let sm_gz = bytes.from_list([31, 139, 8, 0, 0, 0, 0, 0, 0, 255, 1, 3, 0, 252, 255, 9, 8, 7, 54, 253, 45, 166, 3, 0, 0, 0])",
  'let sm_out = "${bytes.len(zlib.gunzip_max(sm_gz, 3) ?? bytes.zeros(9))} ${bytes.len(zlib.gunzip_max(sm_gz, 2) ?? bytes.zeros(9))}"',
]
probe = "sm_out"
expect = "3 9"

[fs]
default_index_unit = "byte-value"

[[fs.fn]]
name = "file_size"
index_unit = "byte-count"
setup = [
  'let p = fs.create_temp_file("almide_manifest_file_size_")!',
  'fs.write_text(p, "aé")!',
  "let n = fs.file_size(p)!",
  "fs.remove(p)!",
]
probe = "n"
expect = "3"
note = """
BYTES on disk, not characters: the 2-codepoint "aé" is 3 — the same count
as the file's Bytes, so file_size(p) == bytes.len(read_bytes(p)).
"""

[[fs.fn]]
name = "modified_at"
index_unit = "second"
setup = [
  'let p = fs.create_temp_file("almide_manifest_modified_at_")!',
  "let now = env.unix_timestamp()",
  "let mt = fs.modified_at(p)!",
  "fs.remove(p)!",
]
probe = "mt > now - 300 and mt < now + 300"
expect = "true"
note = """
SECONDS since the Unix epoch, on the same scale as env.unix_timestamp: the
±300s window around a just-created file's mtime is unreachable for a
milliseconds value (~1.7e12 against a ~1.7e9 bound), so the probe separates
the two scales the way the env second/millisecond rows do — and it is
tighter, because it also pins the ORIGIN as the epoch rather than some
platform-specific zero.
"""

# index_unit vocabulary — http (the module where TWO unrelated Int scales sit
# one call apart, which is exactly why neither may be spelled "value"):
#   status-code — the Int is an HTTP RESPONSE STATUS, 3 digits, and it is the
#                 FIRST parameter of every builder (response / json /
#                 with_headers) — the body follows it. `status(resp, code)`
#                 inverts that shape: there the response comes first
#   port        — the Int is a TCP PORT the server BINDS (serve) — an OS
#                 resource number, never a status. `serve(200, h)` would bind
#                 port 200 and `response(8080, b)` would answer with status
#                 8080; nothing but this declaration separates them
#   millisecond — the Int is a per-call LIMIT in MILLISECONDS, 0 = no limit
#                 (#2631): `total_ms` / `idle_ms` of HttpLimits, which the
#                 public start / *_with_limits wrappers spread into the two
#                 Ints of their private intrinsics below. Never seconds — the
#                 process-wide ALMIDE_HTTP_TIMEOUT_SECS default is the one
#                 seconds-denominated knob, and it is not this Int
#
# Every probe below verified on BOTH legs (native + wasm, 2026-08-13,
# byte-identical). The with_headers probe deliberately reads only the CALLER's
# header: the default-Content-Type cell of that builder DIVERGES between the
# legs (#1352 — native seeds "text/plain", the self-hosted wasm builder starts
# empty), so pinning it here would encode a bug as a promise.
[http]

[[http.fn]]
name = "response"
index_unit = "status-code"
setup = [
  'let r = http.response(200, "hi")',
]
probe = 'http.body(r) + " " + (http.get_header(r, "Content-Type") ?? "none")'
expect = "hi text/plain"
note = """
Pins the ARGUMENT ORDER, which is the whole trap: status first, body second.
A swapped implementation could not produce the body "hi", and the seeded
"text/plain" separates response from json below.
"""

[[http.fn]]
name = "json"
index_unit = "status-code"
setup = [
  'let r = http.json(201, "{}")',
]
probe = 'http.body(r) + " " + (http.get_header(r, "Content-Type") ?? "none")'
expect = "{} application/json"
note = """
The same (status, body) order as response — the ONLY difference is the seeded
Content-Type, so a caller who picks json for the header gets no other change.
201 also shows the status is a free 3-digit code, not a success/failure flag.
"""

[[http.fn]]
name = "with_headers"
index_unit = "status-code"
setup = [
  'let r = http.with_headers(202, "wh", ["X-A": "1"])',
]
probe = 'http.body(r) + " " + (http.get_header(r, "X-A") ?? "none")'
expect = "wh 1"
note = """
(status, body, headers) — the Int stays FIRST even with a third parameter.
Reads only the caller's own header: this builder's default-Content-Type cell
is a live native/wasm divergence (#1352), and the manifest records measured
agreement, never a bug.
"""

[[http.fn]]
name = "status"
index_unit = "status-code"
setup = [
  'let r = http.status(http.response(200, "sb"), 404)',
]
probe = 'http.body(r) + " " + (http.get_header(r, "Content-Type") ?? "none")'
expect = "sb text/plain"
note = """
The order INVERTS here — status(resp, code), response first — and the Int is
still a status code. The Almide surface exposes no status GETTER, so in-file
the probe can only pin that overwriting the code leaves body and headers
untouched. The code itself reaching the wire is measured out-of-band on the
native leg (2026-08-13): a serve handler returning
status(response(200, "teapot"), 418) answers `HTTP/1.1 418 OK` with body
"teapot" — the 418 is the status LINE, and an unmapped code keeps the "OK"
reason text.
"""

[[http.fn]]
name = "status_code"
index_unit = "status-code"
probe = 'http.status_code(http.status(http.response(200, "sb"), 418))'
expect = "418"
note = """
The status GETTER (#1791) — the read twin of status(resp, code), so the code
written by status is read back by status_code: the same 3-digit unit, in the
same slot of the record the *_response client family fills from the wire.
"""

[[http.fn]]
name = "get_status"
index_unit = "status-code"
probe = "1"
expect = "1"
note = """
Declared, not probed: the Int in the return tuple `(status, body)` is the HTTP
STATUS CODE of the response — the same unit as response/json/with_headers
above, read back instead of written. A calling probe would hit the network
and push this generated file off the wasm leg (the client is HOST_CAPABILITY,
proofs/wasm-fallback-baseline.txt). Measured out-of-band on the native leg
(2026-08-30): get_status("https://registry.npmjs.org/react") is (200, body)
and a missing package is (404, body) — any complete response is Ok; Err is
transport-only.
"""

[[http.fn]]
name = "request_status"
index_unit = "status-code"
probe = "1"
expect = "1"
note = """
Declared, not probed, same unit and same out-of-band measurement as
get_status above: the Int is the response STATUS CODE in `(status, body)`.
The general form of get_status (method + body + headers), mirroring how
request generalizes get.
"""

[[http.fn]]
name = "serve"
index_unit = "port"
probe = "1"
expect = "1"
note = """
Declared, not probed: serve BLOCKS on a TCP accept loop, so no in-file probe
can return, and it is HOST_CAPABILITY on the wasm leg
(proofs/wasm-fallback-baseline.txt names it for
spec/lang/effect_intrinsic_tail_test.almd) — a calling probe would push this
generated file off the wasm leg. Measured out-of-band on the native leg
(2026-08-13): serve(8791, handler) binds 0.0.0.0:8791 and answers a request
to 127.0.0.1:8791, so the Int is a TCP PORT NUMBER, not a status and not a
backlog size or a timeout.
"""

[[http.fn]]
name = "__call_start"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed: the private intrinsic behind http.start, whose two
trailing Ints are HttpLimits.total_ms and .idle_ms, both MILLISECONDS, 0 = no
limit. A calling probe would dial the network and push this generated file off
the wasm leg. Measured by tests/http_call_handle_test.rs against a loopback
server (2026-09-25): total_ms 1000 ends a call at ~1000 ms and idle_ms 500 a
silent one at ~500 ms (C-366).
"""

[[http.fn]]
name = "__request_stream_limited"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed: the private intrinsic behind http.request_stream_with_limits, whose two
trailing Ints are HttpLimits.total_ms and .idle_ms, both MILLISECONDS, 0 = no
limit. A calling probe would dial the network and push this generated file off
the wasm leg. Measured by tests/http_call_handle_test.rs against a loopback
server (2026-09-25): total_ms 1000 ends a call at ~1000 ms and idle_ms 500 a
silent one at ~500 ms (C-366).
"""

# index_unit vocabulary — net (HOST_CAPABILITY on the wasm leg — net is an OS
# socket API, named as such in proofs/wasm-fallback-baseline.txt for
# spec/stdlib/net_test.almd — so every entry is DECLARED with a non-calling
# probe; a calling probe would push this generated file off the wasm leg. The
# native semantics below were MEASURED out-of-band on 2026-08-13 with a
# self-connecting listen/connect/accept program, values quoted per row):
#   handle      — the Int is an opaque STREAM or LISTENER token. Measured: it
#                 is a slot index into a per-kind table starting at 0, NOT a
#                 file descriptor and NOT an address — the first listener and
#                 the first stream are BOTH 0, so the two namespaces are
#                 disjoint and a listener handle passed to a stream fn silently
#                 addresses a different socket. Meaningless to arithmetic on
#   port        — the Int is a TCP PORT to bind (tcp_listen) or dial
#                 (tcp_connect), 0–65535 — the same unit as http.serve's
#   byte-count  — the Int counts BYTES: a read budget, or the number pending
#   millisecond — the Int is a timeout in MILLISECONDS, never seconds
#   file-descriptor — the Int is a raw OS FILE DESCRIPTOR (unix_* and shm_*),
#                 NOT a handle: measured natively (2026-09-29, a self-connecting
#                 unix_listen/unix_connect/unix_accept program on macOS and on
#                 Linux) the descriptors were small integers above the three
#                 standard ones, and one that crossed a socket (unix_send ->
#                 unix_take_fds) arrived as a DIFFERENT number naming the same
#                 open file — a write through one was read through the other.
[net]

[[net.fn]]
name = "tcp_connect"
index_unit = "port"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The Int PARAMETER is a TCP port; the
Ok Int is a stream handle. Measured natively: tcp_connect("127.0.0.1", 8792)
against a listener on that port returns handle 0 — the first slot of the
stream table, not an fd.
"""

[[net.fn]]
name = "tcp_listen"
index_unit = "port"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). Measured natively:
tcp_listen("127.0.0.1", 8792) returns listener handle 0 and a subsequent
tcp_connect to 8792 succeeds — the Int is the port actually bound.
"""

[[net.fn]]
name = "tcp_local_port"
index_unit = "port"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The Int PARAMETER is a LISTENER
handle; the Ok Int is a TCP port. Measured natively by
tests/net_tcp_native_core_test.rs (2026-10-13): a listener bound to port 0
reports a port above 0, and a connect to that port reaches it — the port the
OS chose, the one a program passes to tcp_connect.
"""

[[net.fn]]
name = "tcp_accept"
index_unit = "handle"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). Measured natively: accept on listener
0 returned STREAM handle 1 while the client's own stream was 0 — the argument
is a LISTENER handle and the result is a STREAM handle, two disjoint
namespaces that both count from 0.
"""

[[net.fn]]
name = "tcp_read"
index_unit = "byte-count"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). len is a BYTE budget, and the read is
UP TO that many: measured natively, after 5 bytes arrived, tcp_read(s, 2)
returned exactly [1, 2] and left the rest queued — len is not a message count
and not a record count.
"""

[[net.fn]]
name = "tcp_read_exact"
index_unit = "byte-count"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). Measured natively, continuing the same
stream after tcp_read(s, 2): tcp_read_exact(s, 3) returned [3, 4, 5] — len is
a BYTE count, the read resumes at the stream position (it is not an offset),
and unlike tcp_read it delivers exactly len bytes or fails.
"""

[[net.fn]]
name = "tcp_available"
index_unit = "byte-count"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). Measured natively: after a 5-byte
write arrived, tcp_available(s) returned 5 — the Ok Int counts BYTES pending,
not messages, and it is the argument tcp_read's len takes.
"""

[[net.fn]]
name = "tcp_write"
index_unit = "handle"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The only Int is the stream handle —
the payload is Bytes, and nothing is returned, so no byte COUNT crosses this
signature (a caller expecting a written-bytes count gets Unit).
"""

[[net.fn]]
name = "tcp_read_timeout"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). timeout_ms is MILLISECONDS — the
second/millisecond confusion this unit exists to prevent. Measured natively
on a stream with nothing pending: tcp_read_timeout(s, 1, 100) returned
Err("tcp_read_timeout: Resource temporarily unavailable (os error 35)") and
the call returned promptly — 100 is a tenth of a second, not 100 seconds.
"""

[[net.fn]]
name = "tcp_set_timeout"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The same MILLISECOND scale as
tcp_read_timeout, applied to the stream instead of to one call. Measured
natively: tcp_set_timeout(s, 100) is Ok on an open stream.
"""

[[net.fn]]
name = "tcp_is_open"
index_unit = "handle"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The Int is a stream handle, and the
answer tracks the handle's SLOT, not the peer: measured natively, is_open was
true before tcp_close(c) and false after.
"""

[[net.fn]]
name = "tcp_close"
index_unit = "handle"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). Consumes a STREAM handle (the stream
table), not a listener handle — the same Int 0 means a different socket in
each table.
"""

[[net.fn]]
name = "tcp_close_listener"
index_unit = "handle"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The listener-table counterpart of
tcp_close; the split spelling exists precisely because the handle number alone
cannot say which table it belongs to.
"""

[[net.fn]]
name = "unix_connect"
index_unit = "file-descriptor"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The Ok Int is the connected socket's file descriptor. Measured natively against a unix_listen socket: a descriptor above the standard three, usable by unix_send, unix_recv, unix_poll and unix_close alike.
"""

[[net.fn]]
name = "unix_listen"
index_unit = "file-descriptor"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The Ok Int is the listening socket's file descriptor; the path must not exist yet (a second unix_listen on the same path fails with the OS's address-in-use error).
"""

[[net.fn]]
name = "unix_accept"
index_unit = "file-descriptor"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The argument is the LISTENER's descriptor and the Ok Int the accepted connection's — both raw descriptors in one namespace, unlike tcp_accept's two handle tables.
"""

[[net.fn]]
name = "unix_send"
index_unit = "file-descriptor"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). sock is a descriptor and so is every element of fds: measured, a descriptor sent with the first byte arrived at the peer (unix_take_fds) as a different number naming the same file.
"""

[[net.fn]]
name = "unix_recv"
index_unit = "byte-count"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). max is a BYTE budget and the read is UP TO that many: measured natively, "hello" (5 bytes) sent, unix_recv(s, 100) returned exactly those 5; after the peer closed, it returned 0 bytes.
"""

[[net.fn]]
name = "unix_take_fds"
index_unit = "file-descriptor"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). The result is the descriptors received on sock, oldest first, each once: measured, 2 descriptors sent with one message were both returned, and a second call returned none.
"""

[[net.fn]]
name = "unix_poll"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). timeout_ms is MILLISECONDS; 0 checks without waiting, < 0 waits forever. Measured natively: unix_poll(s, 0) with nothing queued returned false, and unix_poll(s, 1000) after the peer closed returned true at once.
"""

[[net.fn]]
name = "unix_wait"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). timeout_ms is MILLISECONDS and the
result the READY subset of fds (raw descriptors), in the order given. Measured
natively: with two connected sockets and data on the second only,
unix_wait([a, b], 1000) returned [b] at once, and unix_wait([a, b], 0) with
nothing queued returned [].
"""

[[net.fn]]
name = "unix_close"
index_unit = "file-descriptor"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). fd is a raw descriptor from any unix_* or shm_* fn or from unix_take_fds; closing a socket also drops descriptors still queued for it.
"""

[[net.fn]]
name = "shm_create"
index_unit = "byte-count"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). size is the file's length in BYTES, zero-filled: measured, shm_create(64) then shm_read(fd, 0, 10000) returned exactly 64 bytes.
"""

[[net.fn]]
name = "shm_resize"
index_unit = "byte-count"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). size is the new length in BYTES: measured, after shm_resize(fd, 4096) a read through ANOTHER descriptor of the same file returned 4096 bytes.
"""

[[net.fn]]
name = "shm_write"
index_unit = "byte-offset"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). offset is a BYTE offset into the file (not a cursor; writes move nothing): measured, shm_write(fd, 10, "shared") then shm_read(fd, 10, 6) returned "shared".
"""

[[net.fn]]
name = "shm_read"
index_unit = "byte-offset"
probe = "1"
expect = "1"
note = """
Declared, not probed (host-capability). offset is a BYTE offset and len a byte count; fewer bytes come back at the file's end.
"""

# Zero-Int modules, ratcheted for the FUTURE: map, set, option, result, error,
# regex, bool, path, base64, hex and html bear no Int in any swept signature
# today, so their entry lists are empty — but COVERED_MODULES holds them, so the first
# Int-bearing fn to land in any of them cannot merge without declaring its unit
# here.
#
# path is the strongest case for a zero-Int ratchet: its whole surface is
# String → String (join / dirname / basename / extension / stem / normalize)
# plus the SafePath newtype, and the ONE dimension a caller would get wrong —
# whether a position counts bytes or codepoints — cannot arise until someone
# adds an Int-bearing fn (a `path.depth`, a `path.split_at`). This section is
# the tripwire for that day.
#
# base64 and hex are total Bytes ⇄ String codecs (encode / encode_url /
# encode_upper / decode / decode_url): every size is carried by the Bytes or
# the String itself, so no Int crosses the boundary. The unit that WOULD appear
# the moment one does is byte-count — a `decoded_len(s)`, an offset-taking
# streaming variant — and it must be declared here first.
#
# html is the SafeHtml newtype algebra (escape / raw / to_string / concat /
# empty) — a String-in, String-out XSS boundary with no numeric surface at
# all. Ratcheted so an Int-bearing truncation helper (`html.truncate(h, n)` —
# codepoints or bytes?) cannot land silently: cutting escaped markup at the
# wrong unit is exactly the #419 class with a security edge.
[map]
default_index_unit = "value"
fn = []

[set]
default_index_unit = "value"
fn = []

[option]
default_index_unit = "value"
fn = []

[result]
default_index_unit = "value"
fn = []

[error]
default_index_unit = "value"
fn = []

[regex]
default_index_unit = "value"
import = true

[[regex.fn]]
name = "index_of"
index_unit = "codepoint"
probe = 'regex.index_of(regex.new("[0-9]"), "café7")'
expect = "some(4)"

[[regex.fn]]
name = "__index_of"
index_unit = "codepoint"
probe = 'regex.__index_of("[0-9]", "café7")'
expect = "4"

[bool]
default_index_unit = "value"

[[bool.fn]]
name = "compare"
index_unit = "ordering"
probe = '"${bool.compare(false, true)} ${bool.compare(true, true)} ${bool.compare(true, false)}"'
expect = "-1 0 1"
note = """
false < true, the order `<` and list.sort already use; the sign is the
answer, as every compare in the stdlib.
"""

[path]
default_index_unit = "value"
fn = []

[base64]
default_index_unit = "value"
fn = []

[hex]
default_index_unit = "value"
fn = []

[html]
default_index_unit = "value"
fn = []
