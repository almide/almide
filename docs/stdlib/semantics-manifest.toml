# index_unit vocabulary — env (the datetime scales, one module over):
#   second      — Unix-epoch seconds (unix_timestamp — NOT millis)
#   millisecond — Unix-epoch milliseconds (millis — 1000× the second scale)
[env]
default_index_unit = "second"

[[env.fn]]
name = "unix_timestamp"
index_unit = "second"
setup = [
  "let ts = env.unix_timestamp()",
]
probe = 'ts > 1700000000 and ts < 100000000000'
expect = "true"
note = """
The window pins the SCALE: seconds since the epoch sit near 1.7e9 in this era,
while a milliseconds value would exceed the 1e11 upper bound — the exact
confusion the second/millisecond split exists to prevent.
"""

[[env.fn]]
name = "millis"
index_unit = "millisecond"
setup = [
  "let ms = env.millis()",
]
probe = 'ms > 1700000000000'
expect = "true"
note = """
Milliseconds exceed 1.7e12 in this era — a seconds value could never reach the
bound, so the probe separates the two scales.
"""

[[env.fn]]
name = "sleep_ms"
index_unit = "millisecond"
probe = "1"
expect = "1"
note = """
Declared, not probed: env.sleep_ms is HOST_CAPABILITY on the wasm leg (no
WASI sleep), so a calling probe would push this whole generated file off the
wasm leg — and the millisecond SCALE would be flaky to assert anyway. The
native semantics are pinned by the duration tests.
"""

