# The diagnostic-code registry behind `almide explain --list` (#2149): the two
# columns a code's doc cannot state in its own text. `mnemonic` (the doc's
# title) and `verdict` (its `## Fix-it verdict`) are read from
# docs/diagnostics/<CODE>.md; this file carries the rest.
#
# severity — what the diagnostic is emitted as: "error", "warning", or
#            "error|warning" when one code has both forms (E053). Checked
#            against the binary: tests/explain_list_test.rs runs every
#            fixture and refuses a level this row does not name.
# since    — the first release whose compiler source names the code
#            (derived once, 2026-09-26, from `git log -S'"EXXX"' -- '*.rs'`
#            and the earliest final tag containing that commit). A new code
#            takes the version it will ship in.
#
# One row per documented code; tests/explain_list_test.rs keeps the rows equal
# to the set of codes the compiler emits.

