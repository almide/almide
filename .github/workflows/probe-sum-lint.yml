name: Probe — sum lint
on:
  push:
    branches: [probe/sum-lint]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-1.97.0
      - name: Warnings of almide-wasm
        run: |
          cargo clippy -p almide-wasm --message-format=short 2>&1 | grep -E '^crates/almide-wasm/.*(warning|error)' | sort | uniq > /tmp/w.txt || true
          head -200 /tmp/w.txt
          echo "count $(wc -l < /tmp/w.txt)"
