# PROBE BRANCH ONLY (#4005 A4 lab): this file replaces the mcdc probe on the
# probe/a4-lab branch so a dispatch runs the A4 census lab. Gates nothing.
name: mcdc-probe
on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "unused"
        required: false
        default: ""
      ref:
        description: "unused"
        required: false
        default: ""
permissions: read-all
jobs:
  trust-spine:
    name: A4 census lab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - name: lab
        run: |
          OUT=$(mktemp -d)
          cargo build -q -p almide-mir --example classify_corpus
          WALL_NAMES=1 cargo run -q -p almide-mir --example classify_corpus -- --out "$OUT" "$PWD/spec" 2>/dev/null | tail -3 || true
          ls -la "$OUT"
          python3 scripts/corpus-own-scan.py "$OUT/ownership.cert" "$OUT/ownership.names"
          mkdir -p lab-out && cp "$OUT"/ownership.* lab-out/
      - name: pack
        if: always()
        run: |
          cd lab-out && tar czf ../lab-out.tgz --exclude='*.bundle' . && ls -la ../lab-out.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a4-lab
          path: lab-out.tgz
          retention-days: 5
