# PROBE BRANCH ONLY (#4005 A4 witness mutation lab): replaces the mcdc probe
# on probe/a4-mut so a dispatch runs it. Gates nothing.
name: mcdc-probe
on:
  workflow_dispatch:
permissions: read-all
env:
  # The CI slice (owner decision 2026-10-25; scripts/lib/ci-slice.sh,
  # crates/almide-corpus/src/ci_slice.rs): a PR or merge group whose base is
  # not main judges a commit-rotated 1-in-8 slice of every corpus gate plus
  # the fixtures the change touches; everything else — pushes to develop and
  # main, tags, schedules, manual runs, PRs into main — runs the full corpus.
  # Whole-corpus staleness / completeness checks run only on a full run, and a
  # slice never rewrites a ledger. Job names do not change with it.
  ALMIDE_CI_SLICE: ${{ ((github.event_name == 'pull_request' && github.base_ref != 'main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref != 'refs/heads/main')) && '8' || '1' }}
  ALMIDE_CI_SEED: ${{ github.sha }}
  ALMIDE_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
  # Bump this suffix to force a clean rebuild of the opam (Rocq) cache.
  OPAM_CACHE_VERSION: v1
  OCAML_VERSION: "5.4.1"
  # The rocq-core release CI proves on. It is in the cache key, so moving it
  # rebuilds the toolchain instead of restoring an older one.
  ROCQ_CORE_VERSION: "9.3.0"
  # The opam-repository commit every package (OCaml, Rocq and their
  # dependencies) resolves from. Its opam files carry each source archive's
  # checksum, so pinning the commit pins every digest opam checks; the
  # repository's moving head did not (security row 16). In the cache key.
  OPAM_REPO_SHA: a04b045f1534714416da6b4f8e8e67d2defbb750

jobs:
  mutlab:
    name: wall ${{ matrix.ref }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ref: [a4-on-0700, probe/a4-cand-0700]
        mode: [fixtures, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/root-tmpdir

      # ── Rust toolchain + cargo cache (almide-mir pulls in the frontend) ──
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"  # the workspace lock needs >= 1.97 (wasmtime 50)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          workspaces: "."
          # Key the cache to this job so it doesn't collide with the main CI.
          prefix-key: "trust-spine"

      # ── opam root (OCaml + Rocq) cache — built ONCE, restored thereafter ──
      # Self-managed opam (not ocaml/setup-ocaml) so a single actions/cache owns
      # ~/.opam end-to-end with a stable key.
      # Restore now; SAVE only at the end on success (below) so a half-built or
      # broken opam root is never cached.
      - name: Restore opam root (OCaml + Rocq)
        id: opam-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-ocaml${{ env.OCAML_VERSION }}-rocq${{ env.ROCQ_CORE_VERSION }}-${{ env.OPAM_CACHE_VERSION }}-${{ env.OPAM_REPO_SHA }}

      - name: Install opam + wabt (wat2wasm for the A2 byte-binding grounding)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends opam wabt

      # check-wasm-exec.sh — the run_g ↔ real-engine differential TRUSTED_BASE
      # cites as closing a residual — needs a real wasm engine. It skip-exit-0'd
      # when wasmtime was absent, and this workflow never installed it, so the
      # check had NEVER run in CI (#921); both wasm gate scripts now hard-fail
      # under CI=true when their tool is missing, and this step is what makes
      # that requirement satisfiable. Pinned + cached + retried exactly like
      # ci.yml's install (the 429-storm lesson).
      - name: Cache wasmtime tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasmtime-v50.0.1-x86_64-linux.tar.xz
          key: wasmtime-v50.0.1-x86_64-linux
      - name: Install wasmtime
        run: |
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Build opam switch + Rocq (cache miss only)
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare --disable-sandboxing -y default "git+https://github.com/ocaml/opam-repository.git#${OPAM_REPO_SHA}"
          opam switch create "${OCAML_VERSION}" -y
          eval "$(opam env)"
          # opam's published rocq-prover has no 9.1.1 (the local trusted base is a
          # source build); CI re-derives on the pinned ROCQ_CORE_VERSION. It is
          # pinned because 9.x minors can break the spine: 9.3 reserved `is`, and
          # an unpinned cold cache picked it up mid-release (#3368). The canonical
          # trusted base stays 9.1.1 (TRUSTED_BASE.md).
          opam install -y "rocq-prover>=9.0.0" "rocq-core=${ROCQ_CORE_VERSION}"

      # coqc/coqchk are what proofs/*.sh invoke. Rocq 9 may expose the prover as
      # `rocq compile` / `rocq check`; install guarded shims iff the classic
      # binaries are absent, so the scripts work either way.
      - name: Ensure coqc / coqchk on PATH
        run: |
          eval "$(opam env)"
          BIN="$HOME/.local/bin"; mkdir -p "$BIN"
          if ! command -v coqc >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec rocq compile "$@"\n' > "$BIN/coqc"; chmod +x "$BIN/coqc"
            echo "installed coqc shim → rocq compile"
          fi
          if ! command -v coqchk >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec rocq check "$@"\n' > "$BIN/coqchk"; chmod +x "$BIN/coqchk"
            echo "installed coqchk shim → rocq check"
          fi
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Toolchain diagnostic
        run: |
          eval "$(opam env)"
          echo "rocq:     $(command -v rocq || echo MISSING)"
          echo "coqc:     $(command -v coqc || echo MISSING)"
          echo "coqchk:   $(command -v coqchk || echo MISSING)"
          echo "ocamlopt: $(command -v ocamlopt || echo MISSING)"
          coqc --version || true
          coqchk --version || true
          ocamlopt --version || true
          cargo --version

      - name: wall
        run: |
          eval "$(opam env)"
          git rev-parse HEAD
          nproc; free -m
          (cd proofs && ./check.sh > /tmp/check.log 2>&1) || { tail -30 /tmp/check.log; exit 1; }
          rc=0
          if [ "${{ matrix.mode }}" = tests ]; then
            STRUCTURAL_WALL_LEDGER_OUT=/tmp/measured.tsv proofs/structural-wall.sh --stdlib-tests || rc=$?
            L=proofs/heap-access-ledger-tests.tsv
          else
            STRUCTURAL_WALL_LEDGER_OUT=/tmp/measured.tsv proofs/structural-wall.sh || rc=$?
            L=proofs/heap-access-ledger.tsv
          fi
          echo "== wall exit $rc; ledger diff (ledger vs measured) =="
          grep -v '^#' "$L" | diff - /tmp/measured.tsv | grep '^[<>]' || echo "== ledger identical"
          exit $rc
