# PROBE BRANCH ONLY (#4005 A4): runs the routines re-inject drills. Gates nothing.
name: mcdc-probe
on:
  workflow_dispatch:
    inputs:
      toolchain:
        required: false
        default: ""
      ref:
        required: false
        default: ""
permissions: read-all
jobs:
  trust-spine:
    name: A4 routines drills
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - name: drills
        run: REINJECT_TARGET_DIR="$PWD/target" bash scripts/witness-reinject.sh routines
