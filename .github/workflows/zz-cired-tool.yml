name: cired tool
on:
  push:
    branches: ["cired-tool*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  GIT_TERMINAL_PROMPT: "0"
jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-build-1.97.0
          save-if: false
      - run: cargo build --release && mkdir -p ~/.local/bin && cp target/release/almide ~/.local/bin/ && echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: commands
        run: bash -x .github/cired/cmds.sh 2>&1 | tee /tmp/cired-out.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cired-out
          path: /tmp/cired-out*
