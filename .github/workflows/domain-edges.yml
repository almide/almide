name: Domain edges (weekly)

# The integer-domain edge gate (scripts/check-domain-edges.sh): every public
# stdlib fn x every Int parameter x the declared edge set, run on BOTH targets
# and diffed bidirectionally against proofs/domain-edges.toml — a new
# divergence fails, a row that stopped diverging fails too. The gate carried a
# NEGATIVE_TESTED row in proofs/gate-verification.toml from its landing
# (PR #1449) but was invoked by nothing (#2207): one module alone measures for
# the better part of an hour, so it has no place in the PR `checks` job. This
# is its home — one job per module, weekly and on dispatch, the fuzz-night
# ethos: red is a finding to act on (fix the guard, or record the divergence
# with a reason and re-measure), never a reason to loosen the ledger.

on:
  schedule:
    # 06:40 UTC Sunday — clear of the nightly fuzz / conformance / ledger
    # windows and the Monday shard-balance ratchet.
    - cron: "40 6 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.0"  # runner-class MSRV: the almide binary embeds wasmtime 47 (commissioned host); compiler crates keep the 1.89 claim per-crate

permissions:
  contents: read

jobs:
  edges:
    name: Edge matrix (${{ matrix.module }}) vs the declared ledger
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The six modules the ledger was measured over (proofs/domain-edges.toml
        # header) plus json and value (#2402: the json family was skipped, not
        # measured, and the skip carried #2396); `--only` scopes both the
        # measurement and the declared rows. The population is EVERY public
        # stdlib fn with an Int parameter — a module absent from this list is
        # unmeasured, and the ledger header says so.
        module: [bytes, list, string, datetime, io, math, json, value]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}

      - name: Build the compiler (release, embedded wasm host)
        run: cargo build --release

      # The wasm leg is measured on the wasmtime CLI under the declared budget
      # (proofs/domain-edges.toml `wasm_budget_bytes`, #2387) — the embedded
      # host's ceiling is the runner's free memory, and six parallel jobs are
      # exactly the pressure that turned an `i32_max` verdict into a coin.
      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-linux.tar.xz
          key: wasmtime-v47.0.3-x86_64-linux
      - name: Install wasmtime
        run: |
          # Pinned + cached + retried, the ci-cross-target.yml block verbatim.
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Ledger admission rules (forged availability-dependent cells are refused)
        run: bash scripts/check-domain-edges.sh --selftest

      - name: Measure ${{ matrix.module }} on both targets and diff against proofs/domain-edges.toml
        run: bash scripts/check-domain-edges.sh --only ${{ matrix.module }}
