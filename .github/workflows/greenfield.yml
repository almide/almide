name: greenfield
on:
  push:
    branches: [greenfield]
  pull_request:
    branches: [greenfield]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the judge: almide/als, pinned
      - uses: Swatinem/rust-cache@v2
      # Evidence machinery (unit 0): incumbent contract gate under the
      # deviation register — only enumerated forward references pass.
      - name: contract port gate
        run: bash scripts/check-contracts-port-gate.sh
      # SD2 (STDLIB-EXCELLENCE.md): core/effect tier boundary, machine-enforced.
      - name: stdlib tier gate
        run: bash scripts/check-stdlib-tiers.sh
      # Rust units (unit 1+): tests include the incumbent golden parity.
      - name: cargo test
        run: cargo test --workspace --locked
      # Two-tier lint policy (PORTLOG.md): greenfield-authored crates are held
      # to zero warnings; verbatim-ported crates keep the incumbent's lint
      # state, frozen — they are built and tested, not clippy-gated. A ported
      # module rebuilt as new structure moves into the strict tier with it.
      - name: clippy (zero warnings, greenfield-authored tier)
        run: cargo clippy -p almide-spine -p almide-diag -p almide-base -p almide-layout -p almide-wasm -p almide-corpus --all-targets --locked -- -D warnings
      - name: MSRV honesty
        run: |
          rustup toolchain install 1.89 --profile minimal
          cargo +1.89 check --workspace --locked

  # Flight-gap A-2: structural coverage of the wasm backend's emitter under
  # its full net (591-fixture parity + 200-seed differential fuzz + first
  # light + alias referee), held by a grow-only floor. Honest scope note in
  # scripts/check-wasm-coverage.sh: this instruments the emitter's Rust;
  # the EMITTED wasm helpers' witnesses are the corpus + fuzzer + mutation
  # evidence.
  wasm-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the judge: almide/als, pinned
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: emitter coverage floor
        run: bash scripts/check-wasm-coverage.sh

  # V-1 (RESEARCH-verification.md): the field's convergent gate is
  # "assertions live in the shipped-shape build". Debug CI already runs the
  # nets with debug_assertions; this lane runs the SAME nets in release
  # shape so a debug/release divergence (optimizer, overflow-check, cranelift
  # tier differences) cannot ship unseen.
  release-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the judge: almide/als, pinned
      - uses: Swatinem/rust-cache@v2
      # The host oracle is the MANIFEST PIN (a877d2138) — the v0.58.0
      # release asset predates the deterministic-time surface and
      # rejects fuel programs outright (the stage-62/64 red). The pin is
      # immutable, so its build caches perfectly.
      - name: fetch the oracle source at the manifest pin
        run: |
          git fetch --depth 1 origin a877d2138d7711eafe62d88faaab7cf45822a5e9
          git worktree add --detach /tmp/oracle-src a877d2138d7711eafe62d88faaab7cf45822a5e9
      - uses: actions/cache@v4
        with:
          path: /tmp/oracle-src/target
          key: host-oracle-a877d2138-v1
      - name: build the host oracle
        run: cargo build --release --manifest-path /tmp/oracle-src/Cargo.toml --bin almide
      - name: install wasmtime (the oracle's wasm leg runs on it)
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: wasm nets in release shape (third oracle armed)
        run: |
          export ALMIDE_FUZZ_HOST_ORACLE=/tmp/oracle-src/target/release/almide
          "$ALMIDE_FUZZ_HOST_ORACLE" --version
          cargo test --release -p almide-wasm --locked

  # Aviation discipline as CI (2026-08-21): codopsy slipped to B twice
  # during the burn and both times only a HUMAN check-in caught it —
  # manual measurement is a dead doctrine. A < 90 is red here forever.
  aviation-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build codopsy
        run: git clone --depth 1 https://github.com/O6lvl4/codopsy /tmp/codopsy && cargo build --release --manifest-path /tmp/codopsy/Cargo.toml
      - name: score must be A (>= 90)
        run: |
          cp .codopsyrc.json crates/almide-wasm/
          # codopsy prints the summary on STDERR — capture both streams,
          # and strip ANSI before judging.
          /tmp/codopsy/target/release/codopsy analyze crates/almide-wasm 2>&1 | tee /tmp/codopsy.out
          sed 's/\x1b\[[0-9;]*m//g' /tmp/codopsy.out | grep -E "Quality Score:" | grep -qE "\((9[0-9]|100)/100\)" || { echo "::error::codopsy below A"; exit 1; }
      - name: file discipline (800-line cap)
        run: bash scripts/check-file-discipline.sh

  # V-6: verification of the verifier as a STANDING gate. Every pre-authored
  # mutant in ci/mutations/ must be CAUGHT by the release-shape net; a
  # surviving mutant or a no-longer-applying patch is red.
  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the judge: almide/als, pinned
      - uses: Swatinem/rust-cache@v2
      - name: mutants must be caught
        run: bash scripts/check-mutation-gate.sh
