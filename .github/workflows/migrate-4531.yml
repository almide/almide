name: migrate-4531 (temporary, removed before review)

# Runs the #4531 precedence migration over the corpus on a GitHub runner and
# uploads the result as a patch. Branch-only; deleted once the patch lands.
on:
  push:
    branches: [swift-precedence-4531]

concurrency:
  group: migrate-4531-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - name: Install wasmtime and binaryen
        run: |
          bash scripts/fetch-pinned.sh \
            https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/wasmtime-v50.0.1-x86_64-linux.tar.xz \
            /tmp/wasmtime.tar.xz
          tar -xf /tmp/wasmtime.tar.xz -C /tmp
          sudo mv /tmp/wasmtime-v50.0.1-x86_64-linux/wasmtime /usr/local/bin/
          sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build
        run: cargo build --release
      - name: Unit tests of the change (informational)
        continue-on-error: true
        run: cargo test --release -p almide-syntax -p almide-tools -p almide-frontend --lib 2>&1 | tee /tmp/unit.log
      - name: Migrate the corpus
        run: ALMIDE_MIGRATE_PRECEDENCE_WRITE=1 cargo test --release --test precedence_regroup_corpus_test every_tracked -- --nocapture 2>&1 | tee /tmp/migrate.log
      - name: Commit the migration locally
        run: |
          git -c user.name=ci -c user.email=ci@localhost commit -qam "migrate" || true
          git diff HEAD~1 --stat | tail -3
      - name: Regenerate the embedded build tables
        continue-on-error: true
        run: |
          bash scripts/check-build-inputs-in-package.sh --regen 2>&1 | tail -20 || true
          git -c user.name=ci -c user.email=ci@localhost commit -qam "tables" || true
      - name: Rebuild with the migrated stdlib
        run: cargo build --release
      - name: Corpus gate after migration
        continue-on-error: true
        run: cargo test --release --test precedence_regroup_corpus_test 2>&1 | tail -40 | tee /tmp/gate.log
      - name: Regenerate the AST and check manifests
        continue-on-error: true
        env:
          ALMIDE_MANIFEST_TREE_CHECK: gate
        run: |
          ORACLE=target/release/almide bash scripts/gen-ast-manifest.sh 2>&1 | tail -5
          ORACLE=target/release/almide bash scripts/gen-check-manifest.sh 2>&1 | tail -5
          git -c user.name=ci -c user.email=ci@localhost commit -qam "manifests" || true
      - name: Run manifest must not move (outputs unchanged on both targets)
        continue-on-error: true
        env:
          ALMIDE_MANIFEST_TREE_CHECK: gate
        run: |
          ORACLE=target/release/almide bash scripts/gen-run-manifest.sh > /tmp/gen-run.log 2>&1; echo "exit $?" >> /tmp/gen-run.log
          git diff --stat -- crates/almide-spine/tests/golden/ | tee /tmp/run-manifest.diff
          git diff -- crates/almide-spine/tests/golden/spec-run-manifest.txt > /tmp/run-manifest.patch || true
          git checkout -- crates/almide-spine/tests/golden/spec-run-manifest.txt crates/almide-spine/tests/golden/ 2>/dev/null || true
      - name: Doc fence gates with the new binary (informational)
        continue-on-error: true
        run: |
          ALMIDE_BIN=$PWD/target/release/almide bash scripts/check-llm-surface.sh > /tmp/llm-surface.log 2>&1; echo "exit $?" >> /tmp/llm-surface.log
          ALMIDE_BIN=$PWD/target/release/almide bash scripts/check-doc-fences.sh > /tmp/doc-fences.log 2>&1; echo "exit $?" >> /tmp/doc-fences.log
      - name: Export the patch
        if: always()
        run: |
          git format-patch "$GITHUB_SHA"..HEAD -o /tmp/patches || true
          git diff "$GITHUB_SHA" --stat > /tmp/stat.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: migrate-4531
          path: |
            /tmp/patches
            /tmp/stat.txt
            /tmp/unit.log
            /tmp/migrate.log
            /tmp/gate.log
            /tmp/run-manifest.diff
            /tmp/run-manifest.patch
            /tmp/gen-run.log
            /tmp/llm-surface.log
            /tmp/doc-fences.log
