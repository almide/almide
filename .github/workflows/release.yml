name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"  # runner-class MSRV: the almide binary embeds wasmtime 49 (commissioned host); compiler crates keep the 1.89 claim per-crate
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

permissions:
  contents: write
  # #1534: release-asset attestation (Sigstore).
  id-token: write
  attestations: write

jobs:
  # The release title and body come from docs/releases/<tag>.md, written by
  # hand and committed before the tag. Checked first, so a tag without notes
  # (or with the auto-generated "What's Changed" PR list) fails in seconds
  # instead of after every build.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - name: Check docs/releases/<tag>.md
        run: bash scripts/check-release-notes.sh "${GITHUB_REF#refs/tags/}"

  build:
    needs: notes
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: almide-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: almide-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: almide-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: almide-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: almide-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-

      # Linux aarch64 cross-compilation
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      # This workflow runs only on a `v*` tag push, so it is the ONE place that
      # builds from a release tag — which is why it is the only place allowed
      # to say `release`. Every other build reports `dev` by default, so a
      # binary that claims to be a release had to be built by this step
      # (#2384). Nothing checks the claim after the fact; the point is that
      # nothing else can make it.
      - name: Build
        env:
          ALMIDE_BUILD_PROVENANCE: release
          ALMIDE_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --target ${{ matrix.target }}

      # Security row 25 (#4129): the artifact itself locks the build-changing
      # switches with no flag. Run wherever the runner can execute the target
      # (the aarch64 Linux build is cross-compiled); a failure stops the
      # release before anything is packaged.
      - name: The release binary locks inherited switches by default
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: bash scripts/check-release-switch-lock.sh "target/${{ matrix.target }}/release/almide${{ runner.os == 'Windows' && '.exe' || '' }}"

      # #2152: the archive carries BOTH binaries. `almide verify` execs the
      # independently versioned `almide-verify` from next to itself and has no
      # linked fallback, so an archive without it would ship a command that
      # can only fail. `cargo build` above builds both (workspace
      # default-members); the copy fails loudly if either is missing.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          staging="${{ matrix.archive }}"
          mkdir -p "$staging"
          cp target/${{ matrix.target }}/release/almide "$staging/"
          cp target/${{ matrix.target }}/release/almide-verify "$staging/"
          cp LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "${{ matrix.archive }}"
          New-Item -ItemType Directory -Force -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/almide.exe" "$staging/"
          Copy-Item "target/${{ matrix.target }}/release/almide-verify.exe" "$staging/"
          Copy-Item "LICENSE" "$staging/"
          # The folder itself, not its contents: the zip unpacks into
          # `$staging/` like the tarballs, which is where tools/install.ps1 and
          # `almide self-update` look for almide.exe (#3359).
          Compress-Archive -Path "$staging" -DestinationPath "$staging.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead("$PWD/$staging.zip").Entries.FullName -replace '\\', '/'
          foreach ($want in @("almide.exe", "almide-verify.exe", "LICENSE")) {
            if ($entries -notcontains "$staging/$want") { Write-Error "$staging.zip has no $staging/$want (entries: $($entries -join ', '))"; exit 1 }
          }
          echo "ASSET=$staging.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ env.ASSET }}
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect assets and generate checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;
          cd release
          sha256sum * > almide-checksums.sha256
          echo "=== Checksums ==="
          cat almide-checksums.sha256

      # #1482: a FINAL tag must not ship over an open release blocker
      # (I-unsound / I-miscompile / I-divergence / regression — the closed set
      # in docs/project/ISSUE-TAXONOMY.md). An -rc prerelease exists precisely
      # to soak a tree, so it prints the count without gating on it.
      - name: Release-blocker gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            *-rc*) bash scripts/count-release-blockers.sh || true ;;
            *)     bash scripts/count-release-blockers.sh --gate ;;
          esac

      # #1534: every release asset is Sigstore-attested — verify with
      #   gh attestation verify <asset> -R almide/almide
      # (documented in SECURITY.md). The checksums file is attested too.
      - name: Attest release assets (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # #1484: an -rc tag publishes as a PRERELEASE — visible, installable,
          # excluded from "latest" — so a soak window exists between the last
          # language-surface change and the final tag.
          FLAGS=""
          case "$TAG" in *-rc*) FLAGS="--prerelease" ;; esac
          bash scripts/check-release-notes.sh "$TAG" notes-out
          gh release create "$TAG" release/* \
            --title "$(cat notes-out/title)" \
            --notes-file notes-out/body.md $FLAGS
