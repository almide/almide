name: probe-wallfix (throwaway)
on:
  push:
    branches: ['probe/blockers-1109-wallfix']
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-build-1.97.0
          save-if: false
      - run: cargo test -q -p almide-mir --lib 2>&1 | tail -15
      - name: walled-real vs baseline
        run: |
          cargo build -q -p almide-mir --example classify_corpus
          mkdir -p /tmp/out
          WALL_NAMES=1 cargo run -q -p almide-mir --example classify_corpus -- --out /tmp/out spec 2> /tmp/report.txt || true
          grep '^WALLED REAL' /tmp/report.txt | sed "s|$PWD/||" | sed -E 's/^WALLED REAL ([^ ]+) :: (.*) :: .*/\1 :: \2/' | sort -u > /tmp/actual.txt
          grep -v '^#' proofs/walled-real-baseline.txt | grep -v '^[[:space:]]*$' | sed -E 's/[[:space:]]+#[[:space:]]*#[0-9]+[[:space:]]*$//' | sort -u > /tmp/expected.txt
          echo "== walled now, not in baseline:"; comm -23 /tmp/actual.txt /tmp/expected.txt
          echo "== in baseline, not walled now:"; comm -13 /tmp/actual.txt /tmp/expected.txt
          grep -A3 "walled real (lowering)" /tmp/report.txt | head -3
  irdump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        commit: ["a71e577ae^", "a71e577ae"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: cp -r .github/wf /tmp/wf && git checkout -q "${{ matrix.commit }}" && python3 /tmp/wf/irdump.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - name: dump
        run: |
          cargo build -q -p almide-mir --example classify_corpus
          for f in spec/lang/generic_type_alias_test.almd spec/wasm_cross/option_result_ctors.almd; do
            d=$(mktemp -d); cp "$f" "$d/"; mkdir -p /tmp/out
            IRDUMP=1 WALL_NAMES=1 cargo run -q -p almide-mir --example classify_corpus -- --out /tmp/out "$d" > /dev/null 2> /tmp/dump-$(basename $f).txt || true
          done
          mkdir -p /tmp/up && cp /tmp/dump-*.txt /tmp/up/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: irdump-${{ strategy.job-index }}
          path: /tmp/up
