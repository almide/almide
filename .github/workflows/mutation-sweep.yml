name: Mutation sweep (full net)

# #1619: the FULL 40-mutant sweep of ci/mutations/ — the standing evidence
# that the release-shape net keeps its teeth. It used to run inside ci.yml
# on every push and PR, where (a) it cost ~45 min per PR for mutants the PR
# never touched, and (b) ci.yml's `cancel-in-progress: true` concurrency
# group let the NEXT develop merge cancel the sweep mid-run, so the develop
# evidence routinely never completed. Here it runs where it cannot be
# canceled and off the PR critical path:
#   - develop pushes, in a queued (NOT cancel-in-progress) group — a burst
#     of merges collapses to "one running + one queued", and the running
#     sweep always finishes;
#   - nightly, beside conformance-mutations;
#   - manual dispatch.
# PRs run the INCREMENTAL scope inside ci.yml (only mutants intersecting
# the change set, under a 28-min budget that names what it deferred to this
# sweep, #2814) — see scripts/check-mutation-gate.sh for the scope rule.
# This sweep sets no budget: it runs every mutant, and it is the only run
# whose verdicts stamp proofs/mutation-score.toml.
#
# 8-way positional shard (mutant index mod 8): every mutant costs one
# release rebuild + one net run, so modulo is the balanced split. 4-way until
# 2026-10-28: a mutant's rebuild + backend_parity run had grown from ~245 s to
# ~470 s (run 40601875296), so ten per shard no longer fit the 90-min cap and
# shard 3 was cancelled on its tenth. Five or six per shard is ~50 min.

on:
  push:
    branches: [develop]
  schedule:
    # 05:15 UTC — clear of the 03:00 fuzz night and 04:30 conformance run.
    - cron: "15 5 * * *"
  workflow_dispatch:

concurrency:
  group: mutation-sweep-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
permissions: read-all

jobs:
  prose-changes:
    # Missing/invalid classification always selects the original full lane.
    runs-on: ubuntu-latest
    outputs:
      prose_only: ${{ steps.classify.outputs.prose_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        continue-on-error: true
        run: |
          # Classify with code from the compared base, not a PR-edited helper.
          # -I prevents repository modules/PYTHONPATH from shadowing stdlib imports.
          base=$(python3 -I -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); n=os.environ.get("GITHUB_EVENT_NAME"); print(e.get("pull_request",{}).get("base",{}).get("sha","") if n=="pull_request" else e.get("merge_group",{}).get("base_sha","") if n=="merge_group" else e.get("before","") if n=="push" else "")')
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$base" HEAD && git cat-file -e "$base:scripts/ci_prose.py"; then
            classifier=$(mktemp "$RUNNER_TEMP/prose-classify.XXXXXX.py")
            trap 'rm -f "$classifier"' EXIT
            git show "$base:scripts/ci_prose.py" > "$classifier"
            python3 -I "$classifier" classify
          else
            echo "prose_only=false" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "trusted base classifier unavailable; full lane"
          fi

  sweep:
    needs: prose-changes
    if: ${{ always() && !cancelled() }}
    name: Mutation sweep (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 1-based for the job name; the gate's ALMIDE_MUTATION_SHARD stays 0-based.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.prose-changes.outputs.prose_only != 'true'
      - uses: ./.github/actions/root-tmpdir
        if: needs.prose-changes.outputs.prose_only != 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.prose-changes.outputs.prose_only != 'true'
      - name: this shard's mutants must all be caught
        if: needs.prose-changes.outputs.prose_only != 'true'
        run: |
          set -o pipefail
          ALMIDE_MUTATION_SHARDS=8 \
          ALMIDE_MUTATION_SHARD=$(( ${{ matrix.shard }} - 1 )) \
            bash scripts/check-mutation-gate.sh | tee mutation-shard-${{ matrix.shard }}.log
      # The per-mutant verdict lines are the measurement the score job reads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.prose-changes.outputs.prose_only != 'true' }}
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutation-shard-${{ matrix.shard }}.log
          retention-days: 14

  # #2152 item 5: the stamped score (proofs/mutation-score.toml, rendered into
  # the README) is re-measured against what the net just did. Red means
  # "refresh the stamp from this run" (bash scripts/gen-mutation-score.sh
  # --from-run <run id>), the same ethos as the ledger-counts nightly — never a
  # reason for an ordinary PR to touch the record.
  score:
    name: Mutation score matches the stamp
    needs: [prose-changes, sweep]
    if: ${{ always() && !cancelled() && needs.prose-changes.outputs.prose_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards
          merge-multiple: true
      - name: stamped counts vs this sweep
        run: bash scripts/gen-mutation-score.sh --drift shards/mutation-shard-*.log
