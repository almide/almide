name: Probe — source mutants of the wasm emitter
# A one-off measurement on its own branch: mutants of the emitter crate's
# source, generated by an unmodified third-party mutation tool, and which of
# the proven witness checkers, the byte-level check and the behaviour corpus
# notice each. Not a gate.
on:
  push:
    branches: [probe/emitter-mutants]

permissions:
  contents: read

jobs:
  list:
    name: List the mutants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - name: Install the mutation tool
        run: |
          cargo install --locked cargo-mutants
          cargo mutants --version
      - name: List
        run: |
          mkdir -p "$RUNNER_TEMP/mutants"
          cargo mutants --help > "$RUNNER_TEMP/mutants/help.txt" 2>&1 || true
          cargo mutants --list --json -f crates/almide-wasm/src > "$RUNNER_TEMP/mutants/by-dir.json" 2> "$RUNNER_TEMP/mutants/by-dir.err" || echo "by-dir: rc $?"
          cargo mutants --list --json -f 'crates/almide-wasm/src/**/*.rs' > "$RUNNER_TEMP/mutants/by-glob.json" 2> "$RUNNER_TEMP/mutants/by-glob.err" || echo "by-glob: rc $?"
          cargo mutants --list --json --package almide-wasm > "$RUNNER_TEMP/mutants/by-package.json" 2> "$RUNNER_TEMP/mutants/by-package.err" || echo "by-package: rc $?"
          wc -c "$RUNNER_TEMP"/mutants/*
          for f in by-dir by-glob by-package; do
            python3 -I -c 'import json,sys,collections; d=json.load(open(sys.argv[1])); print(sys.argv[1].rsplit("/",1)[1], len(d), "mutants; keys:", sorted(d[0]) if d else None); print(collections.Counter(m.get("genre") for m in d).most_common()); print(collections.Counter(str(m.get("file", m.get("source_file", "")))[:60] for m in d).most_common(8))' "$RUNNER_TEMP/mutants/$f.json" || head -c 400 "$RUNNER_TEMP/mutants/$f.err"
          done
          python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); [print(json.dumps(m, indent=1)[:1500]) for m in d[:3]]' "$RUNNER_TEMP/mutants/by-dir.json" || true
      - name: Upload the list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emitter-mutants-list
          path: ${{ runner.temp }}/mutants
