# Acceptance ring (#1533, attack-list A2-2): REAL downstream projects built
# and tested against the compiler at this commit, on every develop/main push
# and PR. The E0004 and #1501 classes were found by real code, #1526 by a
# real downstream running real input — this ring exists because generated
# corpora keep missing what production shapes hit.
#
# Each leg checks a project out at a PINNED commit, so downstream churn can
# never turn compiler CI red on its own (the same doctrine as the downstreams
# pinning ALMIDE_VERSION in their CI: bump on purpose, with review). The leg
# driver (scripts/ci-acceptance-ring.sh) asserts a test-file floor and a
# native-fallback ceiling beyond the exit codes — see its header for why a
# plain green is not enough.
#
# Ring roster — DELIBERATELY OSS-only (decision 2026-08-20): Almide is an
# open-source project and its CI must never depend on a private company's
# repository, so Aid-On/teastia stays OUT of this ring permanently. The
# boundary runs the other way: teastia validates Almide from ITS side, in
# its own CI, against pinned releases. Ring members are almide-org repos:
#   dfa       regex → DFA compiler; leftmost-longest scan proven on wasm
#   parsegen  parser generator, depends on dfa as a git package
#   svg       SVG builder (the same package teastia consumes downstream)
name: Acceptance Ring

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Required contexts (Build the compiler under test, Ring (dfa/parsegen/svg))
  # must also report on the develop merge queue's group branches.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"  # runner-class MSRV: the almide binary embeds wasmtime 49 (commissioned host); compiler crates keep the 1.89 claim per-crate
  CARGO_INCREMENTAL: "0"
  GIT_TERMINAL_PROMPT: "0"

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
permissions: read-all

jobs:
  build-cli:
    name: Build the compiler under test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Dependencies only (see ci.yml `build`): rust-cache prunes the
      # workspace's own artifacts on save; develop writes, PRs read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ring-build-${{ env.RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true
      - run: cargo build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: almide-ring-cli
          path: target/release/almide
          retention-days: 1

  ring:
    name: Ring (${{ matrix.project }})
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # ref pins are deliberate (see header). min_tests is the project's
          # current test-file count; fallback allowance is 0 everywhere until
          # a project earns a documented exception.
          - project: dfa
            repo: almide/dfa
            ref: f5c4784558a0c1ab18e7ae8f79627bfbdb82921c
            min_tests: 3
          - project: parsegen
            repo: almide/parsegen
            ref: 03506fde781f829fa0b095c1d8843152d30a9b9b
            min_tests: 3
          - project: svg
            repo: almide/svg
            ref: 63e8e3b899a6ae07efca61dc5cac4039afc8930f
            min_tests: 2
    steps:
      # The compiler repo, for the leg driver script only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: compiler
      - uses: ./compiler/.github/actions/root-tmpdir
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: project

      # `almide build` compiles through Rust, so downstream builds need a
      # toolchain even though the compiler itself arrives prebuilt.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: ring-${{ matrix.project }}-${{ env.RUST_TOOLCHAIN }}-${{ matrix.ref }}
          restore-keys: ring-${{ matrix.project }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Cache wasmtime tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasmtime-v49.0.1-x86_64-linux.tar.xz
          key: wasmtime-v49.0.1-x86_64-linux
      - name: Install wasmtime
        # `almide test` executes its wasm leg on the wasmtime CLI; without it
        # every file would fall back to native and the fallback ceiling in the
        # leg driver would fail the run (deliberately — a ring that quietly
        # tests only native is the #983 skip-as-pass shape again).
        run: |
          VERSION=v49.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash compiler/scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: almide-ring-cli
          path: bin
      - name: Put the compiler under test on PATH
        run: |
          chmod +x bin/almide
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Ring leg
        run: |
          almide --version
          bash compiler/scripts/ci-acceptance-ring.sh project ${{ matrix.min_tests }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
