name: Wasm checked allocator (nightly)

# #4009 item 2: the wasm leg's use-after-free and heap-overflow detector.
# scripts/wasm-checked-alloc.sh builds every spec/wasm_cross program twice —
# ordinarily and under ALMIDE_WASM_CHECKED_ALLOC, where `$free` poisons a
# freed block and `$alloc` checks the poison before reuse, and every block
# carries a canary past its usable capacity that `$free` checks — and fails
# on any difference in stdout, stderr or exit status. Its two negative
# controls (a write through a dangling `ffi` address, and a 16-byte write into
# a 4-byte buffer; proofs/fixtures/heap-check/) must exit 0 ordinarily and 70
# under the switch, or the check has no teeth.

on:
  schedule:
    # 05:40 UTC — clear of the fuzz (03:00), conformance (04:30), shape
    # matrix (04:50) and mutation-sweep (05:15) windows.
    - cron: "40 5 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"

permissions:
  contents: read

jobs:
  corpus:
    name: Checked allocator, shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}

      - name: Install wasmtime (the pin setup-test-leg uses)
        run: |
          VERSION=v49.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Build the compiler (release)
        run: cargo build --release --bin almide

      - name: Ordinary build vs checked build, every fixture of the shard
        env:
          ALMIDE: ${{ github.workspace }}/target/release/almide
          WASM_CHECKED_SHARD: ${{ matrix.shard }}/4
        run: bash scripts/wasm-checked-alloc.sh

  reinject:
    # #4009 item 3: each fixed memory bug in proofs/fixtures/heap-check/reinject/
    # is put back into the emitter and must be caught by the gate above.
    name: Re-injected bugs are caught
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}

      - name: Install wasmtime (the pin setup-test-leg uses)
        run: |
          VERSION=v49.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Every re-injected bug fails the checked-allocator gate
        run: bash scripts/wasm-checked-alloc-reinject.sh

  witness-reinject:
    # #4005 / #4013: each lost-instruction bug in
    # proofs/fixtures/<property>-witness/reinject/ is put back into the
    # emitter and its witness must be rejected, while the unpatched
    # emitter's witness for the same program is accepted — a lost bounds
    # check for `bounds`, a lost list-literal slot store for `init`, a lost
    # record / variant field store for `fields` (#4279), a lost release in
    # the verified native render for `native` (#4006).
    name: Re-injected lost instructions are rejected (${{ matrix.property }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        property: [bounds, init, fields, native, anchors]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}

      - name: Every re-injected lost instruction is rejected by the witness's checker
        run: bash scripts/witness-reinject.sh ${{ matrix.property }}

  build-certifies:
    # #4011 (row 3 of the security table): `almide build --target wasm`
    # judges its own certificate with the installed almide-verify and refuses
    # to write the artifact on a rejection. Each lost-check bug of
    # proofs/fixtures/bounds-witness/reinject/ is put back; the build must
    # refuse with no file written, and write it once the verifier is moved
    # away.
    name: A build whose certificate is rejected writes nothing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}

      - name: Every re-injected bug makes almide build refuse
        run: bash scripts/check-build-certifies.sh
