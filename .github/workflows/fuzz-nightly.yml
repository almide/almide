name: Fuzz (nightly)

# Stage 3 of the completeness roadmap: the generative differential fuzzer
# (tools/xtarget-fuzz) hunts native↔WASM observable divergences and
# codegen failures on a schedule. This runs ONLY nightly (and on manual
# dispatch) — it is deliberately kept out of the PR/push CI so the fast
# checks stay lean. If it finds anything, it uploads the minimized repros
# and opens/updates a tracking issue.

on:
  schedule:
    # 03:00 UTC daily — off-peak, well clear of the push/PR CI windows.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Fuzz time budget in minutes"
        required: false
        default: "60"
      seed:
        description: "Campaign seed (blank = random, logged in output)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89.0"
  # Default budget for the scheduled run; the dispatch input overrides it.
  #
  # Sized to the runner lifetime this job actually GETS, measured rather than
  # assumed. The 2026-07-27 night is the clean measurement: the runner was
  # reclaimed 7m44s after the job started ("The runner has received a shutdown
  # signal", exit 143) — and 4m48s of that had gone to building, so the campaign
  # got 2m39s of its 10-minute budget. The five nights before it died the same
  # way at 8, 25, 65, 23 and 13 minutes.
  #
  # `exit 143` from a runner shutdown is a JOB-level kill: no `set +e`, no
  # `timeout-minutes`, no later step can catch it, so it reports exactly like a
  # real finding. That is why NONE of the last six nights could be scored green
  # regardless of what the fuzzer found (#796 asks for two consecutive green
  # nights).
  #
  # The fix is structural — the build moved to its own job, so this job spends
  # its whole lifetime fuzzing instead of ~62% of it compiling — and this budget
  # is then set to fit comfortably inside even the SHORTEST lifetime observed.
  # 5 minutes is ~1,000 programs at this job's measured 210 prog/min. Less
  # coverage per night, deliberately: a campaign that FINISHES produces a
  # verdict, and a verdict every night beats a larger campaign truncated at
  # random. Deep runs stay available through the `minutes` dispatch input, which
  # is where the #812-scale histograms should come from.
  FUZZ_MINUTES: "5"

jobs:
  # The build is its OWN job so the fuzz job spends its whole runner lifetime
  # fuzzing. When both lived in one job, a cold build took 4m48s of the 7m44s
  # the runner granted before reclaiming it — the campaign got 2m39s of a
  # 10-minute budget and the night died `exit 143` (#796). Two jobs means two
  # independent lifetimes, and the fuzz job's non-campaign overhead is an
  # artifact download instead of a compile.
  build:
    if: github.server_url == 'https://github.com'
    name: Build compiler + fuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/xtarget-fuzz/target
          key: fuzz-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fuzz-cargo-${{ env.RUST_TOOLCHAIN }}-

      # The compiler the fuzzer shells out to.
      - name: Build almide
        run: cargo build --release --bin almide

      # The fuzzer is its OWN workspace (it path-deps the compiler crates), so
      # its target dir is cached separately above — otherwise every night
      # recompiles the whole compiler a second time.
      - name: Build fuzzer
        working-directory: tools/xtarget-fuzz
        run: cargo build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-binaries-${{ github.run_id }}
          path: |
            target/release/almide
            tools/xtarget-fuzz/target/release/xtarget-fuzz
          retention-days: 1

  fuzz:
    if: github.server_url == 'https://github.com'
    name: Generative differential fuzz
    needs: build
    runs-on: ubuntu-latest
    # Hard ceiling well above the fuzz budget so a hung child can never
    # wedge the runner indefinitely, with room for a dispatch run that raises
    # `minutes`.
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: fuzz-binaries-${{ github.run_id }}

      - name: Restore the executable bit
        # `upload-artifact` does not preserve the mode.
        run: |
          chmod +x target/release/almide tools/xtarget-fuzz/target/release/xtarget-fuzz
          ./target/release/almide --version

      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v42.0.1-x86_64-linux.tar.xz
          key: wasmtime-v42.0.1-x86_64-linux
      - name: Install wasmtime
        # Pinned + cached + retried (matches develop's ci.yml): the exact-release
        # asset download is per-IP rate-limited (a 429 storm burned all retries
        # on 2026-07-11); on a cache hit it never downloads at all. `-f` turns a
        # rate-limit body into a retry instead of a garbage tarball. Bump VERSION
        # and the cache key together.
        run: |
          VERSION=v42.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Run fuzz campaign
        id: campaign
        run: |
          MINUTES="${{ github.event.inputs.minutes || env.FUZZ_MINUTES }}"
          SEED_ARG=""
          if [ -n "${{ github.event.inputs.seed }}" ]; then
            SEED_ARG="--seed ${{ github.event.inputs.seed }}"
          fi
          # The fuzzer exits non-zero iff it recorded a finding; capture
          # that without failing the step so we can branch on it.
          set +e
          ./tools/xtarget-fuzz/target/release/xtarget-fuzz run \
            --minutes "$MINUTES" \
            --repo "$PWD" \
            --almide "$PWD/target/release/almide" \
            $SEED_ARG \
            2>&1 | tee fuzz-output.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          FINDINGS_DIR="tools/xtarget-fuzz/findings"
          COUNT=0
          if [ -d "$FINDINGS_DIR" ]; then
            COUNT=$(find "$FINDINGS_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          fi
          echo "findings=$COUNT" >> "$GITHUB_OUTPUT"

      # ALWAYS report what the campaign saw, including when the runner is
      # reclaimed mid-run. A `exit 143` kill skips every conditional step, so
      # before this the only trace of a truncated night was a red X with no
      # numbers — indistinguishable from a real finding, and #796's "two
      # consecutive green nights" had nothing to read.
      #
      # The rendering lives in scripts/fuzz-night-verdict.sh (testable locally,
      # unlike inline YAML bash): it emits the markdown verdict on stdout and
      # the greppable `fuzz-night:` record line — programs, elapsed, throughput,
      # findings, budget_completed — on stderr, so a throughput regression is
      # visible across nights in the job logs. budget_completed is read from
      # the fuzzer's own `=== campaign summary ===` block, which only prints
      # when the campaign loop exits on its own — a reclaimed runner cannot
      # fake it. The streaks the closure conditions read (#924: 14 full-budget
      # nights, #796: 2 green) are scored from step conclusions by
      # scripts/fuzz-track-record.sh.
      - name: Campaign verdict
        if: always()
        run: |
          bash scripts/fuzz-night-verdict.sh fuzz-output.txt \
            "${{ github.event.inputs.minutes || env.FUZZ_MINUTES }}" \
            "${{ steps.campaign.outputs.findings || '?' }}" \
            >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

      - name: Upload findings
        if: steps.campaign.outputs.findings != '0'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ github.run_id }}
          path: |
            tools/xtarget-fuzz/findings/
            fuzz-output.txt
          retention-days: 30

      - name: Open / update tracking issue
        if: steps.campaign.outputs.findings != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ steps.campaign.outputs.findings }}"
          TITLE="Nightly fuzz: $COUNT cross-target finding(s)"
          # Summarize the finding kinds for the issue body.
          SUMMARY=$(find tools/xtarget-fuzz/findings -name meta.txt -exec cat {} \; \
            | grep -E '^(kind|summary|reproduce)' | head -60 || true)
          BODY=$(cat <<EOF
          The nightly generative differential fuzzer recorded **$COUNT** unique finding(s).

          Artifacts (minimized repros + both-target outputs) are attached to
          [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Each finding's \`meta.txt\` includes a deterministic replay command:
          \`xtarget-fuzz replay --seed <S> --index <I>\`.

          <details><summary>Finding summaries</summary>

          \`\`\`
          $SUMMARY
          \`\`\`

          </details>
          EOF
          )
          # Reuse an open issue with the fuzz label if one exists, else open.
          EXISTING=$(gh issue list --label fuzz --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create fuzz --color B60205 --description "Found by the nightly differential fuzzer" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label fuzz
          fi

      # A night with findings is NOT a green night. Before this the campaign's
      # status was captured with `set +e` and never re-raised, so a run that
      # found real divergences still reported green — the only thing that ever
      # turned this workflow red was the runner being reclaimed (#796). With the
      # build split out the campaign now completes, so its verdict is the thing
      # worth reporting: fail iff it recorded a finding. The findings are already
      # uploaded and filed as an issue by the steps above, so failing here loses
      # nothing and makes "two consecutive green nights" mean what it says.
      - name: Fail the night on findings
        if: steps.campaign.outputs.findings != '0'
        run: |
          echo "::error::the campaign recorded ${{ steps.campaign.outputs.findings }} finding(s) — see the uploaded artifacts and the tracking issue"
          exit 1

  coverage-ratchet:
    name: Compiler structural coverage ratchet (#566)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Pin the toolchain like every other job (#990): this job used to rely
      # on the runner image's default rustup toolchain, which is exactly the
      # kind of unpinned input the coverage ratchet should not depend on.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Build almide (stamp expects an installed binary)
        run: |
          cargo build --release
          mkdir -p ~/.local/bin && cp target/release/almide ~/.local/bin/
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Measure coverage and enforce the ratchet
        run: bash proofs/coverage.sh --check
