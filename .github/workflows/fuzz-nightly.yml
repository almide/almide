name: Fuzz (nightly)

# Stage 3 of the completeness roadmap: the generative differential fuzzer
# (tools/xtarget-fuzz) hunts native↔WASM observable divergences and
# codegen failures on a schedule. This runs ONLY nightly (and on manual
# dispatch) — it is deliberately kept out of the PR/push CI so the fast
# checks stay lean. If it finds anything, it uploads the minimized repros
# and opens/updates a tracking issue.

on:
  schedule:
    # 03:00 UTC daily — off-peak, well clear of the push/PR CI windows.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Fuzz time budget in minutes"
        required: false
        default: "60"
      seed:
        description: "Campaign seed (blank = random, logged in output)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89.0"
  # Default budget for the scheduled run; the dispatch input overrides it.
  #
  # PER-SHARD budget. The night runs FUZZ_SHARDS of these in parallel, so the
  # night's coverage is FUZZ_MINUTES * FUZZ_SHARDS fuzz-minutes delivered in
  # FUZZ_MINUTES of wall clock.
  #
  # Sized to the runner lifetime a job actually GETS, measured rather than
  # assumed. Splitting the build into its own job (#1014, 2026-07-30) fixed the
  # first half of the problem: before it, a cold build ate 4m48s of the 7m44s
  # the runner granted. After it, the fuzz job reliably gets its 5 minutes —
  # measured over the 12 nights since, 10 completed the full budget.
  #
  # The other 2 died the same way as before: "The runner has received a
  # shutdown signal", exit 143. That is a JOB-level kill — no `set +e`, no
  # `timeout-minutes`, no later step can catch it — so a killed night lost
  # everything and reported identically to a real finding.
  #
  # A ~1-in-6 kill rate makes #924's closure condition ("14 consecutive
  # full-budget nights") a (5/6)^14 ≈ 8% proposition: unreachable by
  # arithmetic, not by any property of the compiler. Waiting longer was never
  # going to close it.
  #
  # Hence SHARDS. N independent jobs are N independent runner lifetimes, so a
  # kill costs 1/N of the night's coverage instead of the night, and the
  # surviving shards still produce a verdict. The same change multiplies
  # coverage 4x at constant wall clock (~4,000 programs/night at the measured
  # ~210 prog/min, up from ~1,000). Deep single-seed runs stay available
  # through the `minutes` dispatch input.
  FUZZ_MINUTES: "5"
  FUZZ_SHARDS: "8"
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

jobs:
  # The build is its OWN job so the fuzz job spends its whole runner lifetime
  # fuzzing. When both lived in one job, a cold build took 4m48s of the 7m44s
  # the runner granted before reclaiming it — the campaign got 2m39s of a
  # 10-minute budget and the night died `exit 143` (#796). Two jobs means two
  # independent lifetimes, and the fuzz job's non-campaign overhead is an
  # artifact download instead of a compile.
  build:
    if: github.server_url == 'https://github.com'
    name: Build compiler + fuzzer (${{ matrix.arch }})
    # HOST POLARITY (#1411 stage 2). The night runs on BOTH arches because a
    # whole defect class is arch-conditional: #1403's raw-NaN byte write reads
    # as the canonical pattern on aarch64 and only x86 can observe it, and the
    # inverse blindness holds for anything keyed on x86's sign-set NaNs. One
    # arch is not a subset of the other — each sees bugs the other cannot.
    # ubuntu-24.04-arm is free for public repos, so the cost is runner-minutes,
    # not money.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/xtarget-fuzz/target
          key: fuzz-cargo-${{ matrix.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fuzz-cargo-${{ matrix.arch }}-${{ env.RUST_TOOLCHAIN }}-

      # The compiler the fuzzer shells out to.
      - name: Build almide
        run: cargo build --release --bin almide

      # The fuzzer is its OWN workspace (it path-deps the compiler crates), so
      # its target dir is cached separately above — otherwise every night
      # recompiles the whole compiler a second time.
      - name: Build fuzzer
        working-directory: tools/xtarget-fuzz
        run: cargo build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-binaries-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            target/release/almide
            tools/xtarget-fuzz/target/release/xtarget-fuzz
          retention-days: 1

  fuzz:
    if: github.server_url == 'https://github.com'
    name: Generative differential fuzz (shard ${{ matrix.shard }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    # A reclaimed runner (exit 143) fails its shard LEG, and a failed leg
    # paints the whole RUN red even after the verdict job absorbed the kill as
    # reduced coverage — so every "consecutive green nights" reading of the
    # run list stayed unreachable by arithmetic (shard 5 on 2026-08-17:
    # SIGTERM at 295s, findings=0, night red). The VERDICT job is the run's
    # single failure authority: it fails on correctness findings and on a
    # night with no evidence at all; a shard kill is not a verdict.
    continue-on-error: true
    # `fail-fast: false` is load-bearing, not hygiene: the whole point of
    # sharding is that one shard dying must not take the night's other shards
    # with it. Keep the shard list and FUZZ_SHARDS in step — the verdict job
    # reads FUZZ_SHARDS to report `shards=k/N`, so a mismatch would understate
    # or overstate the night's coverage.
    #
    # Shards 1-4 run x86_64, 5-8 aarch64 (#1411 stage 2): shard NUMBERS are
    # globally unique so the derived seeds (`run_id * 16 + shard`) and the
    # per-shard artifact names never collide across arches, and the verdict
    # job's `shards=k/N` accounting keeps meaning "of the whole night".
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, os: ubuntu-latest, arch: x86_64 }
          - { shard: 2, os: ubuntu-latest, arch: x86_64 }
          - { shard: 3, os: ubuntu-latest, arch: x86_64 }
          - { shard: 4, os: ubuntu-latest, arch: x86_64 }
          - { shard: 5, os: ubuntu-24.04-arm, arch: aarch64 }
          - { shard: 6, os: ubuntu-24.04-arm, arch: aarch64 }
          - { shard: 7, os: ubuntu-24.04-arm, arch: aarch64 }
          - { shard: 8, os: ubuntu-24.04-arm, arch: aarch64 }
    # Hard ceiling well above the fuzz budget so a hung child can never
    # wedge the runner indefinitely, with room for a dispatch run that raises
    # `minutes`.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: fuzz-binaries-${{ github.run_id }}-${{ matrix.arch }}

      - name: Restore the executable bit
        # `upload-artifact` does not preserve the mode.
        run: |
          chmod +x target/release/almide tools/xtarget-fuzz/target/release/xtarget-fuzz
          ./target/release/almide --version

      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-${{ matrix.arch }}-linux.tar.xz
          key: wasmtime-v47.0.3-${{ matrix.arch }}-linux
      - name: Install wasmtime
        # Pinned + cached + retried (matches develop's ci.yml): the exact-release
        # asset download is per-IP rate-limited (a 429 storm burned all retries
        # on 2026-07-11); on a cache hit it never downloads at all. `-f` turns a
        # rate-limit body into a retry instead of a garbage tarball. Bump VERSION
        # and the cache key together.
        run: |
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-${{ matrix.arch }}-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Run fuzz campaign
        id: campaign
        run: |
          MINUTES="${{ github.event.inputs.minutes || env.FUZZ_MINUTES }}"
          # Every shard needs a DIFFERENT seed or the night runs the same
          # campaign N times. Derived, not random, so a finding stays
          # replayable from the run alone: `run_id * 16 + shard` is unique per
          # (run, shard) and well inside u64. A dispatch `seed` input pins the
          # base so a whole night can be re-run deterministically.
          BASE="${{ github.event.inputs.seed }}"
          if [ -z "$BASE" ]; then BASE=$(( ${{ github.run_id }} * 16 )); fi
          SEED=$(( BASE + ${{ matrix.shard }} ))
          # The fuzzer exits non-zero iff it recorded a finding; capture
          # that without failing the step so the verdict job can branch on the
          # NIGHT's total rather than on one shard's.
          set +e
          ./tools/xtarget-fuzz/target/release/xtarget-fuzz run \
            --minutes "$MINUTES" \
            --repo "$PWD" \
            --almide "$PWD/target/release/almide" \
            --seed "$SEED" \
            2>&1 | tee fuzz-output.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # `always()`: a shard whose campaign found something still uploads. A
      # shard the runner RECLAIMED uploads nothing at all — the job is gone
      # before this step — and that absence is precisely how the verdict job
      # counts `shards=k/N`. Nothing here needs to detect the kill; not
      # reporting IS the report.
      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            fuzz-output.txt
            tools/xtarget-fuzz/findings/
          if-no-files-found: ignore
          retention-days: 30

  # The night's verdict is assembled from whatever the shards delivered. It is
  # a SEPARATE job so a reclaimed shard cannot take the verdict down with it:
  # `if: always()` runs it even when some shard job failed or was killed.
  verdict:
    if: always() && github.server_url == 'https://github.com'
    name: Night verdict
    needs: fuzz
    # ALWAYS, even when a shard was killed. A runner shutdown (exit 143, the
    # documented ~1-in-6 event this workflow shards to survive) fails its matrix
    # leg, and without `always()` that skips this job entirely — so a night with
    # ZERO findings was recorded as a failure, indistinguishable from a real
    # divergence. Tonight (2026-08-11) was exactly that: no findings artifact,
    # no `findings=N>0` in any shard log, two shards SIGTERMed, night = failure.
    #
    # With 4 shards at a ~1/6 per-shard kill rate, P(all survive) ~= 48%, so
    # about half of all nights failed for infrastructure alone — which makes any
    # "N consecutive clean nights" closure condition unreachable by arithmetic
    # rather than by a property of the compiler (the exact trap #924 documented
    # and sharding was meant to escape; the escape was incomplete).
    #
    # The verdict below already fails ONLY on findings and the coverage line
    # already reports how many shards reported, so running it unconditionally
    # keeps a kill honest — it costs recorded COVERAGE, not correctness.
    #
    # (That `always()` lives in the job-top `if` above — #1201's first cut
    # added it as a SECOND `if:` key here, which fails the whole workflow's
    # parse: Actions never validates these files until a trigger fires, so
    # the breakage surfaced as three instant "failure" runs, not in CI.)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Download shard outputs
        uses: actions/download-artifact@v8
        with:
          pattern: fuzz-shard-${{ github.run_id }}-*
          path: shards

      # Findings are deduplicated by directory NAME: the fuzzer names each
      # finding after its kind + minimized summary, so two shards that trip the
      # same bug from different seeds produce the same name. Counting those
      # twice would inflate the night and file a duplicate issue.
      #
      # The name's KIND prefix also carries the class split (#1235): `Slow__*`
      # findings are perf-class — one leg outran the budget but completed,
      # byte-identical, at the fuzzer's 10x confirm re-run. They are recorded,
      # uploaded, and issue-tracked under the perf label, but they do NOT fail
      # the night: the correctness gate is for divergence and nontermination,
      # and the 0.57.0 release gate showed a quadratic-slow run (#1229) going
      # red as a phantom "Hang".
      - name: Aggregate findings
        id: agg
        run: |
          mkdir -p night-findings
          if compgen -G "shards/*/tools/xtarget-fuzz/findings/*" >/dev/null; then
            for d in shards/*/tools/xtarget-fuzz/findings/*/; do
              [ -d "$d" ] || continue
              cp -R "$d" "night-findings/$(basename "$d")" 2>/dev/null || true
            done
          fi
          COUNT=$(find night-findings -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          SLOW=$(find night-findings -mindepth 1 -maxdepth 1 -type d -name 'Slow__*' | wc -l | tr -d ' ')
          echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
          echo "slow=$SLOW" >> "$GITHUB_OUTPUT"
          echo "correctness=$((COUNT - SLOW))" >> "$GITHUB_OUTPUT"

      # A night where NO shard uploaded output has no evidence, and green
      # would be vacuous (the #976 class — with `continue-on-error` on the
      # shard legs, nothing else would catch it). Fail it as INFRA, distinct
      # from findings; the streak meter scores this verdict job, so the night
      # honestly breaks the streak.
      - name: Fail the night when no shard reported
        run: |
          if ! find shards -name fuzz-output.txt -type f | grep -q .; then
            echo "::error::no shard uploaded output — the night produced no evidence (infra failure, not a clean night)"
            exit 1
          fi

      - name: Campaign verdict
        run: |
          bash scripts/fuzz-night-verdict.sh shards \
            "${{ github.event.inputs.minutes || env.FUZZ_MINUTES }}" \
            "${{ env.FUZZ_SHARDS }}" \
            "${{ steps.agg.outputs.findings }}" \
            "${{ steps.agg.outputs.slow }}" \
            >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

      - name: Upload findings
        if: steps.agg.outputs.findings != '0'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ github.run_id }}
          path: night-findings/
          retention-days: 30

      - name: Open / update tracking issue
        if: steps.agg.outputs.correctness != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ steps.agg.outputs.correctness }}"
          TITLE="Nightly fuzz: $COUNT cross-target finding(s)"
          SUMMARY=$(find night-findings -mindepth 1 -maxdepth 1 -type d ! -name 'Slow__*' \
            -exec cat {}/meta.txt \; \
            | grep -E '^(kind|summary|reproduce)' | head -60 || true)
          BODY=$(cat <<EOF
          The nightly generative differential fuzzer recorded **$COUNT** unique finding(s)
          across ${{ env.FUZZ_SHARDS }} shard(s).

          Artifacts (minimized repros + both-target outputs) are attached to
          [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Each finding's \`meta.txt\` includes a deterministic replay command:
          \`xtarget-fuzz replay --seed <S> --index <I>\`.

          <details><summary>Finding summaries</summary>

          \`\`\`
          $SUMMARY
          \`\`\`

          </details>
          EOF
          )
          EXISTING=$(gh issue list --label fuzz --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create fuzz --color B60205 --description "Found by the nightly differential fuzzer" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label fuzz
          fi

      # Perf-class Slow findings route to their OWN issue under their own
      # label (#1235): they are real findings — an order-of-magnitude budget
      # overrun on one leg — but they are perf debt (the #1229 discipline),
      # not correctness, and mixing them into the correctness issue would
      # re-red the metric the class split exists to keep honest.
      - name: Open / update perf (slow) tracking issue
        if: steps.agg.outputs.slow != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ steps.agg.outputs.slow }}"
          TITLE="Nightly fuzz: $COUNT slow finding(s) (perf-class)"
          SUMMARY=$(find night-findings -mindepth 1 -maxdepth 1 -type d -name 'Slow__*' \
            -exec cat {}/meta.txt \; \
            | grep -E '^(kind|summary|reproduce)' | head -60 || true)
          BODY=$(cat <<EOF
          The nightly fuzzer recorded **$COUNT** perf-class Slow finding(s): a leg
          outran the per-program budget but completed byte-identical at the 10x
          confirm re-run. Not correctness — the night stays green — but each is a
          real order-of-magnitude perf gap (the #1229 class).

          Artifacts are attached to
          [run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          <details><summary>Finding summaries</summary>

          \`\`\`
          $SUMMARY
          \`\`\`

          </details>
          EOF
          )
          EXISTING=$(gh issue list --label fuzz-perf --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create fuzz-perf --color D93F0B --description "Perf-class (Slow) findings from the nightly fuzzer" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label fuzz-perf
          fi

      # CORRECTNESS findings, and only those, make the night red. Coverage lost
      # to a reclaimed runner is reported by the verdict as `shards=k/N` and is
      # NOT fatal — failing on it would put the infra noise the sharding exists
      # to absorb straight back into the signal, which is how #924 got stuck.
      # Slow findings are tracked above and do not fail the night (#1235).
      - name: Fail the night on correctness findings
        if: steps.agg.outputs.correctness != '0'
        run: |
          echo "::error::the campaign recorded ${{ steps.agg.outputs.correctness }} correctness finding(s) — see the uploaded artifacts and the tracking issue"
          exit 1

  coverage-ratchet:
    name: Compiler structural coverage ratchet (#566)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Pin the toolchain like every other job (#990): this job used to rely
      # on the runner image's default rustup toolchain, which is exactly the
      # kind of unpinned input the coverage ratchet should not depend on.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Build almide (stamp expects an installed binary)
        run: |
          cargo build --release
          mkdir -p ~/.local/bin && cp target/release/almide ~/.local/bin/
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Measure coverage and enforce the ratchet
        run: bash proofs/coverage.sh --check
