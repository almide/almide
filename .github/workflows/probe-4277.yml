name: probe-4277
on:
  push:
    branches: [probe-4277-rc-order]
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        leg: [fixtures, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with: { shared-key: linux-release-1.97.0, save-if: false }
      - name: unit tests
        continue-on-error: true
        if: matrix.leg == 'fixtures'
        run: cargo test -q -p almide-anchor-check
      - name: build
        run: |
          cargo build -q --bin almide && cargo build -q -p almide-wasm --example emit_structural_bundle && cargo build -q -p almide-verify -p almide-anchor-check
          git worktree add -q /tmp/base "$(git merge-base HEAD origin/post-rc1-fixes)"
          (cd /tmp/base && CARGO_TARGET_DIR=/tmp/basetarget cargo build -q -p almide-anchor-check)
      - name: anchor check over the corpus, new vs base checker
        run: |
          set +e
          TD=target/debug; OUT=/tmp/out; mkdir -p $OUT
          if [ "${{ matrix.leg }}" = tests ]; then ls spec/stdlib/*_test.almd > $OUT/list; else grep -v -E '^(#|$)' crates/almide-wasm/tests/golden/witness-fixtures.txt > $OUT/list; fi
          N=0; : > $OUT/new-reject; : > $OUT/base-reject
          while IFS= read -r f; do
            N=$((N+1))
            if [ "${{ matrix.leg }}" = tests ]; then
              $TD/examples/emit_structural_bundle --tests "$f" --write-artifact $OUT/$N.wasm --anchors $OUT/$N.anchors > $OUT/$N.bundle 2>/dev/null || continue
            else
              $TD/almide build "$f" --target wasm -o $OUT/$N.wasm > /dev/null 2>&1 || { echo "build-refused $f"; continue; }
              $TD/examples/emit_structural_bundle "$f" --artifact $OUT/$N.wasm --anchors $OUT/$N.anchors > $OUT/$N.bundle 2>/dev/null || { echo "producer-refused $f"; continue; }
            fi
            $TD/almide-anchor-check $OUT/$N.wasm $OUT/$N.bundle $OUT/$N.anchors > $OUT/$N.new 2>&1 || printf '%s\t%s\n' "$f" "$(grep -m1 REJECT $OUT/$N.new | cut -c1-300)" >> $OUT/new-reject
            /tmp/basetarget/debug/almide-anchor-check $OUT/$N.wasm $OUT/$N.bundle $OUT/$N.anchors > $OUT/$N.base 2>&1 || printf '%s\t%s\n' "$f" "$(grep -m1 REJECT $OUT/$N.base | cut -c1-300)" >> $OUT/base-reject
          done < $OUT/list
          echo "artifacts: $N"
          echo "== base rejects: $(wc -l < $OUT/base-reject)"; hew $OUT/base-reject
          echo "== new rejects: $(wc -l < $OUT/new-reject)"; hew $OUT/new-reject
          python3 - $OUT <<'PY'
          import os,re,sys
          out=sys.argv[1]; t={}
          pat=re.compile(r"RC OK: (\d+) frame\(s\), (\d+) event\(s\) matched to (\d+) call\(s\).*?(\d+) release\(s\) the last read")
          bpat=re.compile(r"RC OK: (\d+) frame\(s\), (\d+) event\(s\) matched to (\d+) call\(s\)")
          for suf,p in (("new",pat),("base",bpat)):
              s=[0,0,0,0]
              for f in os.listdir(out):
                  if f.endswith("."+suf):
                      m=p.search(open(os.path.join(out,f)).read())
                      if m:
                          for i,v in enumerate(m.groups()): s[i]+=int(v)
              print(suf, "frames/events/calls/last-reads:", s)
          PY
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with: { shared-key: linux-release-1.97.0, save-if: false }
      - name: new drills (pinned on this run)
        run: |
          set +e
          REINJECT_UPDATE=1 bash scripts/witness-reinject.sh rc rc-release-before-last-use rc-inc-wrong-local
          for n in rc-release-before-last-use rc-inc-wrong-local; do echo "== $n.reject"; cat proofs/fixtures/rc-witness/reinject/$n.reject; echo; done
      - name: every rc drill
        run: bash scripts/witness-reinject.sh rc
