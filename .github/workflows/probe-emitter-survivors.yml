name: Probe — the wasm test suite and a fixed fuzz campaign against the third sample's mutants that no dynamic layer notices
# A one-off measurement on its own branch: for the mutants of the emitter
# crate's source that nothing in the first two stages noticed (the seeded
# sample probe-emitter-mutants.yml draws), does the merge gate's own wasm test
# job — every test file under spec/, on the wasm target — notice each one.
# Not a gate.
on:
  push:
    branches: [probe/emitter-held-suite]

permissions:
  contents: read

env:
  # The same sample as probe-emitter-mutants.yml; the ids judged here, and the
  # order they run in, are scripts/probe-emitter-survivors-ids.txt.
  SAMPLE_N: "480"
  SAMPLE_SEED: "20261126"
  SHARDS: "9"

jobs:
  list:
    name: List the mutants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - name: Install the mutation tool
        run: |
          cargo install --locked cargo-mutants --version 27.1.0
          cargo mutants --version
      - name: List
        run: |
          mkdir -p "$RUNNER_TEMP/mutants"
          cargo mutants --version > "$RUNNER_TEMP/mutants/version.txt"
          cargo mutants --list --json --package almide-wasm > "$RUNNER_TEMP/mutants/mutants.json"
          python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d), "mutants in", len({m["file"] for m in d}), "files")' "$RUNNER_TEMP/mutants/mutants.json"
      - name: Upload the list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emitter-survivors-list
          path: ${{ runner.temp }}/mutants

  shard:
    name: Shard ${{ matrix.shard }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - name: Cache wasmtime tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasmtime-v50.0.1-x86_64-linux.tar.xz
          key: wasmtime-v50.0.1-x86_64-linux
      - name: Install wasmtime
        run: |
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emitter-survivors-list
          path: ${{ runner.temp }}/list
      - name: Draw this shard's mutants
        run: python3 -I scripts/probe-emitter-mutants-pick.py "$RUNNER_TEMP/list/mutants.json" "$RUNNER_TEMP/pick" "$SAMPLE_N" "$SAMPLE_SEED" ${{ matrix.shard }} "$SHARDS" "$(paste -sd, scripts/probe-emitter-survivors-ids.txt)"
      - name: Measure
        env:
          STAGES: "tests fuzz"
          FUZZ_COUNT: "600"
          FUZZ_SEED: "20261125"
        run: bash scripts/probe-emitter-survivors.sh "$RUNNER_TEMP/survivors" "$RUNNER_TEMP/pick" scripts/probe-emitter-survivors-ids.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emitter-survivors-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/survivors/results.tsv
            ${{ runner.temp }}/survivors/fuzz.tsv
            ${{ runner.temp }}/survivors/fuzz
            ${{ runner.temp }}/survivors/baseline.tsv
            ${{ runner.temp }}/survivors/unstable.txt
            ${{ runner.temp }}/survivors/detail
            ${{ runner.temp }}/survivors/build.err
            ${{ runner.temp }}/pick/sample.tsv
            ${{ runner.temp }}/pick/index.tsv
