name: Reinspect probe (stdlib_inspection_test)
on:
  push:
    branches: [reinspect-1109c-probe-land]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - name: stdlib_inspection_test
        run: cargo test --test stdlib_inspection_test -- --nocapture
