name: Clippy baseline freshness

# The strict half of the clippy warning ratchet (#1462). On a PR the gate
# treats a count BELOW scripts/clippy-warnings-baseline.txt as a notice — a
# PR measures itself merged with develop, so a warning removed by a sibling
# PR drops every open PR under the file at once. Here, nightly on develop,
# the same gate runs with CLIPPY_RATCHET_STRICT=1: a stale baseline is red,
# and the fix is `CLIPPY_RATCHET_WRITE=1 bash scripts/check-clippy-warnings.sh`
# committed in a PR. Red here is a finding, never a broken build.

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.96.0"

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
permissions: read-all

jobs:
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-clippy-${{ env.RUST_TOOLCHAIN }}
      - name: Clippy warning ratchet, strict (a count below the file is red here)
        run: CLIPPY_RATCHET_STRICT=1 bash scripts/check-clippy-warnings.sh
