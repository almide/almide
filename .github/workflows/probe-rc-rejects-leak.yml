name: Probe — the library tests the RC byte check refuses, under the allocation counter
# A one-off measurement on its own branch. Not a gate.
on:
  push:
    branches: [probe/rc-rejects-leak]

permissions:
  contents: read

jobs:
  count:
    name: Allocation counters
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - name: Build
        run: cargo build -q --release --bin almide
      - name: Run each under the allocation counter
        run: |
          set -u
          for t in fs_fold_lines_chunked io_read_line_opt list_completion option_completeness option pipe_chain random_choice_pair random_seeded random_shuffle_pair random stdlib_smoke thread_shared_string map_keyed_count bytes_semantics_manifest list; do
            f="spec/stdlib/${t}_test.almd"
            echo "== $f"
            ALMIDE_WASM_ALLOC_COUNT=1 timeout 300 ./target/release/almide test "$f" --target wasm > out.txt 2> err.txt
            echo "exit $?"
            grep -iE "alloc|free|live|passed|failed|test result|ok" out.txt err.txt | tail -8 | cut -c1-240
          done
