name: probe-wasm-copy-wordwise (throwaway)
on:
  push:
    branches: [probe/wasm-copy-wordwise]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  HEAD_REF: wasm-copy-wordwise
  BASE_REF: b91f29236
  FIXTURE: spec/wasm_cross/string_slice_concat_short_unaligned.almd
jobs:
  inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: git log --oneline -1
      - name: stdlib_inspection_test
        run: cargo test --test stdlib_inspection_test -- --nocapture

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install wasmtime
        run: |
          bash scripts/fetch-pinned.sh \
            https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/wasmtime-v50.0.1-x86_64-linux.tar.xz \
            /tmp/wasmtime.tar.xz
          tar -xf /tmp/wasmtime.tar.xz -C /tmp
          sudo mv /tmp/wasmtime-v50.0.1-x86_64-linux/wasmtime /usr/local/bin/
      - run: git log --oneline -1 && cargo build --release --bin almide
      - name: Contract ledger
        run: bash scripts/check-contracts.sh
      - name: Fixture format
        run: target/release/almide fmt --check "$FIXTURE"
      - name: almide-wasm ledger suite against the committed ledgers
        run: cargo test --release -p almide-wasm --no-fail-fast 2>&1 | tee /tmp/wasm-suite.txt | grep -E "^test result|FAILED|panicked|failures:" | head -80; test "${PIPESTATUS[0]}" = 0
      - name: Manifests and native verified floor against the committed ledgers
        if: always()
        run: |
          cargo test --release -p almide-spine -p almide-syntax --no-fail-fast 2>&1 | grep -E "^test result|FAILED|panicked" | head -60; test "${PIPESTATUS[0]}" = 0
          cargo test --release --test native_verified_floor_test 2>&1 | tail -5; test "${PIPESTATUS[0]}" = 0
