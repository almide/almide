name: C1 probe
on:
  push:
    branches: [c1-probe-walls]
env:
  CARGO_TERM_COLOR: never
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: linux-release-1.97.0
          save-if: false
      - name: build
        run: cargo build --release --bin almide && cargo build --release -p almide-mir --example emit_native_bundle
      - name: compile errors
        run: |
          set +e
          mkdir -p dumps
          for f in assign_alias_rc block_line_collect bytes_f16 env_get string_codepoint tm_tuple2_in_list nested_variant_tree mut_heap_param; do
            echo "=== $f"
            ALMIDE_VERIFIED_DEBUG=1 ./target/release/almide build spec/wasm_cross/$f.almd -o /tmp/$f.v1 > /tmp/$f.log 2>&1
            grep -A14 "^error" /tmp/$f.log | head -32
            ./target/release/examples/emit_native_bundle spec/wasm_cross/$f.almd dumps/$f.v1.rs > /dev/null 2>&1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dumps
          path: dumps
