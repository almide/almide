name: C1 probe
on:
  push:
    branches: [c1-probe2]
env:
  CARGO_TERM_COLOR: never
jobs:
  shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.97.0"
          components: llvm-tools
      - name: shapes detail
        run: |
          bash scripts/c1probe/shapes-detail.sh || true
          bash scripts/check-native-v1-perf-shapes.sh --update || true
          mkdir -p sdump; cp proofs/native-v1-perf-shapes-baseline.txt sdump/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shapes
          path: sdump
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: linux-release-1.97.0
          save-if: false
      - name: build
        run: cargo build --release --bin almide && cargo build --release -p almide-mir --example emit_native_bundle
      - name: outputs (v1, v0, wasm) and the force-moves control
        run: |
          set +e
          for n in mut_param_copy_kept_when_read mut_param_copy_moved_when_dead mut_param_copy_kept_closure; do
            f=spec/wasm_cross/$n.almd
            ALMIDE_VERIFIED_DEBUG=1 ./target/release/almide build $f -o /tmp/$n.v1 > /tmp/$n.v1.log 2>&1 || { echo "V1 BUILD FAIL $n"; tail -30 /tmp/$n.v1.log; }
            grep -i "v1\|verified\|wall" /tmp/$n.v1.log | head -3
            ALMIDE_NO_VERIFIED_OK=1 ./target/release/almide build $f --no-verified -o /tmp/$n.v0 > /dev/null 2>&1 || echo "V0 BUILD FAIL $n"
            /tmp/$n.v1 > /tmp/$n.v1.out 2>&1; echo "exit $?" >> /tmp/$n.v1.out
            /tmp/$n.v0 > /tmp/$n.v0.out 2>&1; echo "exit $?" >> /tmp/$n.v0.out
            ./target/release/almide run --target wasm $f > /tmp/$n.wasm.out 2>&1; echo "exit $?" >> /tmp/$n.wasm.out
            echo "== $n v1"; cat /tmp/$n.v1.out
            cmp -s /tmp/$n.v1.out /tmp/$n.v0.out && echo "SAME v1=v0 $n" || { echo "DIFF v1/v0 $n"; diff /tmp/$n.v1.out /tmp/$n.v0.out; }
            cmp -s /tmp/$n.v1.out /tmp/$n.wasm.out && echo "SAME v1=wasm $n" || { echo "DIFF v1/wasm $n"; diff /tmp/$n.v1.out /tmp/$n.wasm.out; }
            ALMIDE_NATIVE_DRILL_FORCE_MOVES=1 ALMIDE_VERIFIED_DEBUG=1 ./target/release/almide build $f -o /tmp/$n.force > /tmp/$n.force.log 2>&1 || { echo "FORCE BUILD FAIL $n"; grep -A6 "^error" /tmp/$n.force.log | head -20; }
            /tmp/$n.force > /tmp/$n.force.out 2>&1; echo "exit $?" >> /tmp/$n.force.out
            cmp -s /tmp/$n.force.out /tmp/$n.v0.out && echo "FORCE SAME $n" || { echo "FORCE DIFF $n"; diff /tmp/$n.force.out /tmp/$n.v0.out; }
          done
      - name: glue
        if: always()
        run: sudo apt-get install -y -qq valgrind > /dev/null; bash scripts/c1probe/glue.sh || true
      - name: dumps and profiles
        if: always()
        run: |
          set +e
          mkdir -p dumps
          sudo apt-get install -y -qq valgrind > /dev/null
          for f in $(cat scripts/c1probe/list.txt); do
            n=$(basename $f .almd)
            ./target/release/examples/emit_native_bundle $f dumps/$n.v1.rs > /dev/null 2>dumps/$n.err
            ./target/release/almide $f --target rust > dumps/$n.v0.rs 2>&1
            ALMIDE_VERIFIED_DEBUG=1 ./target/release/almide build $f -o /tmp/$n.v1 > /dev/null 2>&1 || echo "V1 FAIL $n"
            ALMIDE_NO_VERIFIED_OK=1 ./target/release/almide build $f --no-verified -o /tmp/$n.v0 > /dev/null 2>&1 || echo "V0 FAIL $n"
            for l in v1 v0; do
              valgrind --tool=callgrind --collect-atstart=no --toggle-collect='almide_*::main' --toggle-collect='*almide_stack_guard_install' --callgrind-out-file=/tmp/cg.$n.$l /tmp/$n.$l > /dev/null 2>&1
              callgrind_annotate --inclusive=no /tmp/cg.$n.$l 2>/dev/null | grep -v "ld-linux\\|/elf/\\|^--\\|^ *$" | head -40 | cut -c1-220 > dumps/$n.$l.prof
            done
          done
      - name: walls
        run: mkdir -p dumps; cargo test --release --test c1_probe_walls_test -- --nocapture; cp c1-walls.tsv dumps/
      - name: ledgers
        if: always()
        run: |
          set +e
          export ORACLE=$PWD/target/release/almide
          bash scripts/gen-run-manifest.sh > /dev/null 2>dumps/run-manifest.err
          bash scripts/gen-check-manifest.sh > /dev/null 2>dumps/check-manifest.err
          bash scripts/gen-ast-manifest.sh > /dev/null 2>dumps/ast-manifest.err
          ALMIDE_UPDATE_ALLOC=1 cargo test --release -p almide-wasm --test alloc_ledger 2>&1 | tail -3
          ALMIDE_UPDATE_SIZES=1 cargo test --release -p almide-wasm --test size_ratchet 2>&1 | tail -3
          ALMIDE_UPDATE_WITNESS_FLOOR=1 cargo test --release -p almide-wasm --test witness_floor 2>&1 | tail -3
          bash proofs/output-parity.sh --update 2>&1 | tail -3
          ALMIDE_UPDATE_NATIVE_VERIFIED_FLOOR=1 cargo test --release --test native_verified_floor_test 2>&1 | tail -3
          git diff > dumps/ledgers.patch; git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dumps
          path: dumps
