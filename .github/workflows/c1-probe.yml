name: C1 probe
on:
  push:
    branches: [c1-probe-walls]
env:
  CARGO_TERM_COLOR: never
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: linux-release-1.97.0
          save-if: false
      - name: build
        run: cargo build --release --bin almide && cargo build --release -p almide-mir --example emit_native_bundle
      - name: floor
        run: cargo test --release --test native_verified_floor_test -- --nocapture 2>&1 | grep -E "native verified render|now wall|not on the floor|test result" || true
      - name: v1 and v0 outputs of the newly certified programs
        run: |
          set +e
          for f in closures_and_variants list_heapelem_rc list_modify_heap list_update_heap sort_by_str_key_heap; do
            p=spec/wasm_cross/$f.almd
            ALMIDE_VERIFIED_DEBUG=1 ./target/release/almide build $p -o /tmp/$f.v1 > /tmp/$f.v1.log 2>&1 || { echo "V1 BUILD FAIL $f"; tail -20 /tmp/$f.v1.log; }
            grep -i "verified\|v1\|fallback\|wall" /tmp/$f.v1.log | head -3
            ALMIDE_NO_VERIFIED_OK=1 ./target/release/almide build $p --no-verified -o /tmp/$f.v0 > /dev/null 2>&1 || echo "V0 BUILD FAIL $f"
            /tmp/$f.v1 > v1.out 2>v1.err; a=$?
            /tmp/$f.v0 > v0.out 2>v0.err; b=$?
            if cmp -s v1.out v0.out && cmp -s v1.err v0.err && [ $a = $b ]; then echo "SAME $f exit=$a lines=$(wc -l < v1.out)"; else echo "DIFF $f $a $b"; diff v1.out v0.out | head; fi
          done
      - name: profile list_heapelem_rc
        run: |
          set +e
          sudo apt-get install -y -qq valgrind > /dev/null
          for l in v1 v0; do
            valgrind --tool=callgrind --callgrind-out-file=/tmp/cg.$l /tmp/list_heapelem_rc.$l > /dev/null 2>&1
            echo "== $l"; callgrind_annotate /tmp/cg.$l 2>/dev/null | head -45 | cut -c1-200
          done
