name: Ledger counts (nightly)

# The aggregate counts the generated docs quote (README claims + stats,
# proofs/STAGE-STATUS.md, docs/contracts/README.md,
# docs/contracts/conformance.md) are STAMPED in proofs/ledger-counts.toml and
# rendered from there: deriving them per PR made every fixture or contract PR
# rewrite the same "N fixtures / N contracts" lines, so any two conflicted at
# the merge queue. The PR gates check structure only and require the dated
# block to match the record; THIS run re-measures the counts and, when the
# record has drifted from the tree, runs the refresh itself and opens (or
# updates) the PR that carries it — `bash scripts/gen-ledger-counts.sh`,
# the ledger with the four docs, one commit. Red-only was the first shape and
# it went ten nights unread (#2207): a nightly that can only complain is a
# gate nobody consumes; the PR is the consumer. Pure grep/awk/python3 over the
# checkout: no build.
#
# The PR is opened with the workflow token, so CI does not start on it by
# itself (GitHub never triggers workflows from GITHUB_TOKEN pushes); the body
# says so and the reviewer's close-and-reopen, or an empty push, starts it.

on:
  schedule:
    # 03:40 UTC daily — clear of the fuzz night (03:00), conformance (04:30)
    # and the mutation sweep (05:15).
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  REFRESH_BRANCH: bot/ledger-counts-refresh

jobs:
  drift:
    name: Stamped totals vs the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Re-measure every stamped count
        id: measure
        # Never fails the job on drift: drift is what the next step acts on.
        # A gate error of any other shape (a missing ledger, a malformed date)
        # is not drift and does fail here — the refresh cannot fix those.
        run: |
          set +e
          bash scripts/check-ledger-counts.sh | tee /tmp/ledger-counts.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif grep -q "stamped count(s) drifted from the tree" /tmp/ledger-counts.txt; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ledger-counts failed for a reason the refresh cannot fix — see above"
            exit "$rc"
          fi

      - name: Refresh the stamp and open or update the PR
        if: steps.measure.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/gen-ledger-counts.sh | tee /tmp/refresh.txt
          bash scripts/check-ledger-counts.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$REFRESH_BRANCH"
          git add proofs/ledger-counts.toml README.md proofs/STAGE-STATUS.md docs/contracts/README.md docs/contracts/conformance.md
          git commit -q -m "Refresh the stamped ledger counts on the landed base"
          git push --force origin "$REFRESH_BRANCH"
          {
            echo "The nightly ledger-counts run measured drift between \`proofs/ledger-counts.toml\` and the tree and ran \`bash scripts/gen-ledger-counts.sh\` — the restamped ledger and the four docs that render it, in one commit, exactly the refresh CLAUDE.md prescribes when the nightly reports drift."
            echo
            echo '```'
            grep -E '^  [a-z_]+: recorded' /tmp/ledger-counts.txt || true
            echo '```'
            echo
            echo "Opened with the workflow token, so CI does not start on this PR by itself — close and reopen it (or push an empty commit) to run the gates, then merge."
          } > /tmp/pr-body.md
          existing=$(gh pr list --head "$REFRESH_BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/pr-body.md
            echo "::notice::updated PR #$existing on $REFRESH_BRANCH"
          else
            url=$(gh pr create --base develop --head "$REFRESH_BRANCH" \
              --title "Refresh the stamped ledger counts" --body-file /tmp/pr-body.md)
            echo "::notice::opened $url"
          fi

      - name: Nothing drifted
        if: steps.measure.outputs.drift == 'false'
        run: echo "ledger-counts: the stamp matches the tree; no PR needed."
