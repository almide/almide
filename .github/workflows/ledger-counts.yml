name: Ledger counts (nightly)

# The aggregate counts the generated docs quote (README claims + stats,
# proofs/STAGE-STATUS.md, docs/contracts/README.md,
# docs/contracts/conformance.md) are STAMPED in proofs/ledger-counts.toml and
# rendered from there: deriving them per PR made every fixture or contract PR
# rewrite the same "N fixtures / N contracts" lines, so any two conflicted at
# the merge queue. The PR gates check structure only and require the dated
# block to match the record; THIS run re-measures the counts and, when the
# record has drifted from the tree, runs the refresh itself and opens (or
# updates) the PR that carries it — `bash scripts/gen-ledger-counts.sh`,
# the ledger with the four docs, one commit. Red-only was the first shape and
# it went ten nights unread (#2207): a nightly that can only complain is a
# gate nobody consumes; the PR is the consumer. Pure grep/awk/python3 over the
# checkout: no build.
#
# The PR is opened with the workflow token, so CI does not start on it by
# itself (GitHub never triggers workflows from GITHUB_TOKEN pushes); the body
# says so and the reviewer's close-and-reopen, or an empty push, starts it.
#
# WHEN THE PR CANNOT BE OPENED (#2335): the repository setting "Allow GitHub
# Actions to create and approve pull requests" is off, so `gh pr create` is
# refused. The refresh is still computed and PUSHED — `contents: write` covers
# the branch and only the PR call is blocked — so the consumer degrades to a
# one-click compare link in the job summary, and the job fails saying that.
# The distinction matters: a red reading "a GraphQL call was refused" trains
# people to ignore the gate, while a red reading "the refresh is on this
# branch, open it here" is still a consumer. Turning the setting on restores
# the PR path with no change to this file.
#
# AND THE RED MUST REACH SOMEONE (#2391): with the setting off, the compare
# link lived only in the job summary of a scheduled red — the channel a
# five-night-old red proves nobody reads — while the refresh sat pushed and
# verified on the branch. So the degraded path also opens ONE issue labeled
# `A-ci` (or comments on the open one) carrying the drift lines, the branch
# and sha, and the exact commands; the green night closes it. The same
# routing fuzz-nightly uses for findings (#2379): a gate is finished when its
# result reaches a place with a daily reader, not when the result is correct.

on:
  schedule:
    # 03:40 UTC daily — clear of the fuzz night (03:00), conformance (04:30)
    # and the mutation sweep (05:15).
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  REFRESH_BRANCH: bot/ledger-counts-refresh
  # The one open issue the drift is delivered to when the PR cannot be opened
  # (#2391); matched by exact title, so keep it stable.
  DRIFT_ISSUE_TITLE: "Stamped ledger counts drifted: the nightly refresh is pushed and waiting for a PR"

jobs:
  drift:
    name: Stamped totals vs the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Re-measure every stamped count
        id: measure
        # Never fails the job on drift: drift is what the next step acts on.
        # A gate error of any other shape (a missing ledger, a malformed date)
        # is not drift and does fail here — the refresh cannot fix those.
        run: |
          set +e
          bash scripts/check-ledger-counts.sh | tee /tmp/ledger-counts.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif grep -q "stamped count(s) drifted from the tree" /tmp/ledger-counts.txt; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ledger-counts failed for a reason the refresh cannot fix — see above"
            exit "$rc"
          fi

      - name: Refresh the stamp and open or update the PR
        if: steps.measure.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/gen-ledger-counts.sh | tee /tmp/refresh.txt
          bash scripts/check-ledger-counts.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$REFRESH_BRANCH"
          git add proofs/ledger-counts.toml README.md proofs/STAGE-STATUS.md docs/contracts/README.md docs/contracts/conformance.md
          git commit -q -m "Refresh the stamped ledger counts on the landed base"
          git push --force origin "$REFRESH_BRANCH"
          {
            echo "The nightly ledger-counts run measured drift between \`proofs/ledger-counts.toml\` and the tree and ran \`bash scripts/gen-ledger-counts.sh\` — the restamped ledger and the four docs that render it, in one commit, exactly the refresh CLAUDE.md prescribes when the nightly reports drift."
            echo
            echo '```'
            grep -E '^  [a-z_]+: recorded' /tmp/ledger-counts.txt || true
            echo '```'
            echo
            echo "Opened with the workflow token, so CI does not start on this PR by itself — close and reopen it (or push an empty commit) to run the gates, then merge."
          } > /tmp/pr-body.md
          existing=$(gh pr list --head "$REFRESH_BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/pr-body.md
            echo "::notice::updated PR #$existing on $REFRESH_BRANCH"
            exit 0
          fi
          # `gh pr create` is REFUSED when the repository has "Allow GitHub
          # Actions to create and approve pull requests" off, which is a
          # reasonable setting to keep off — a workflow cannot grant itself
          # that permission and no change in this file can work around it
          # (#2335). The refresh above is still done and PUSHED: `contents:
          # write` covers the branch, and only the PR call is blocked. So the
          # consumer survives as a one-click compare link, and the job goes
          # red saying THAT, instead of surfacing a GraphQL error that reads
          # like the gate itself broke.
          set +e
          create_out=$(gh pr create --base develop --head "$REFRESH_BRANCH" \
            --title "Refresh the stamped ledger counts" --body-file /tmp/pr-body.md 2>&1)
          create_rc=$?
          set -e
          if [ "$create_rc" -eq 0 ]; then
            echo "::notice::opened $create_out"
            exit 0
          fi
          compare="${{ github.server_url }}/${{ github.repository }}/compare/develop...${REFRESH_BRANCH}?expand=1"
          refresh_sha=$(git rev-parse --short HEAD)
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Every remote branch that looks like a ledger-counts remediation:
          # someone may already have run the refresh by hand and pushed it
          # without opening a PR (that is exactly how #2391 sat five nights).
          other_branches=$(git ls-remote --heads origin '*ledger-counts*' | awk '{print $2}' | sed 's#^refs/heads/##' | grep -v "^${REFRESH_BRANCH}\$" || true)
          {
            echo "The nightly ledger-counts run measured drift between \`proofs/ledger-counts.toml\` and the tree, ran \`bash scripts/gen-ledger-counts.sh\`, re-measured clean, and pushed the refresh — but could not open the PR ([run]($run_url))."
            echo
            echo '```'
            grep -E '^  [a-z_]+: recorded' /tmp/ledger-counts.txt || true
            echo '```'
            echo
            echo "**The refresh is on \`$REFRESH_BRANCH\` at \`$refresh_sha\`** (1 commit: the restamped ledger and the four docs that render it)."
            echo
            echo "**Open it:** $compare"
            echo
            echo "Or from a checkout:"
            echo
            echo '```'
            echo "gh pr create -R ${{ github.repository }} --base develop --head $REFRESH_BRANCH --title \"Refresh the stamped ledger counts\""
            echo '```'
            echo
            echo "Or redo it locally on develop and commit \`proofs/ledger-counts.toml\` with the four docs in one commit:"
            echo
            echo '```'
            echo "bash scripts/gen-ledger-counts.sh && bash scripts/check-ledger-counts.sh"
            echo '```'
            echo
            echo "The branch is force-pushed on every drifting night, so it always carries the counts of the latest \`develop\`; a fixture landing after this run makes it stale until the next night re-pushes it."
            if [ -n "$other_branches" ]; then
              echo
              echo "Other remote branches named like a ledger-counts remediation (check whether one already carries this refresh before opening a second PR):"
              echo
              echo "$other_branches" | sed 's/^/- `/; s/$/`/'
            fi
            echo
            echo "<details><summary>why the PR step could not run</summary>"
            echo
            echo '```'
            echo "$create_out"
            echo '```'
            echo
            echo "Settings -> Actions -> General -> Workflow permissions -> \"Allow GitHub Actions to create and approve pull requests\". Only an admin can turn it on; leaving it off is fine, and this is what the job does instead."
            echo "</details>"
          } > /tmp/drift-body.md
          {
            echo "## Ledger counts drifted — the refresh is pushed, the PR is not opened"
            echo
            cat /tmp/drift-body.md
          } >> "$GITHUB_STEP_SUMMARY"
          # The job summary and the red are read by nobody on a schedule
          # (#2391: five nights red with the refresh pushed and verified, the
          # only announcement being this red). Route the hand-off to ONE open
          # issue under `A-ci`, the label the gate-and-ledger issues wear, the
          # way fuzz-nightly routes findings to `fuzz-findings` (#2379): open
          # it on the first drifting night, comment on it on every following
          # one, and the green step below closes it when the stamp matches
          # again. `issues: write` covers this; the workflow token may open
          # issues regardless of the PR setting.
          existing_issue=$(gh issue list --label A-ci --state open --search "\"$DRIFT_ISSUE_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$DRIFT_ISSUE_TITLE\")) | .[0].number // empty" || echo "")
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body-file /tmp/drift-body.md
            echo "::notice::commented the drift and the refresh branch on issue #$existing_issue"
          else
            gh label create A-ci --color C2E0C6 --description ".github/workflows, scripts/*.sh gates, ledgers and ratchets" 2>/dev/null || true
            issue_url=$(gh issue create --title "$DRIFT_ISSUE_TITLE" --body-file /tmp/drift-body.md --label A-ci)
            echo "::notice::opened $issue_url for the drift and the refresh branch"
          fi
          echo "::error::ledger counts drifted; the refresh is pushed to $REFRESH_BRANCH but the PR could not be opened — open it at $compare (see the job summary and the A-ci issue)"
          exit 1

      - name: Nothing drifted
        if: steps.measure.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ledger-counts: the stamp matches the tree; no PR needed."
          # The drift issue is the consumer of the red; a green night is what
          # closes it, so an open one never outlives the drift it announced.
          existing_issue=$(gh issue list --label A-ci --state open --search "\"$DRIFT_ISSUE_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$DRIFT_ISSUE_TITLE\")) | .[0].number // empty" || echo "")
          if [ -n "$existing_issue" ]; then
            gh issue close "$existing_issue" --comment "The nightly ledger-counts run measured the stamp matching the tree at \`$(git rev-parse --short HEAD)\`; the drift this issue announced is landed."
            echo "::notice::closed issue #$existing_issue — the stamp matches the tree again"
          fi
