name: Probe — shipped runtime routines of the larger programs
# A one-off measurement on its own branch: the kernel check of the shipped
# runtime routines, run on the repository's own larger programs (examples,
# tools, benchmark sources), which no gate selects. Not a gate.
on:
  push:
    branches: [probe/shipped-routines-programs]

permissions:
  contents: read

env:
  # The same toolchain pins as trust-spine.yml, so its opam cache is restored.
  OPAM_CACHE_VERSION: v1
  OCAML_VERSION: "5.4.1"
  ROCQ_CORE_VERSION: "9.3.0"
  OPAM_REPO_SHA: a04b045f1534714416da6b4f8e8e67d2defbb750

jobs:
  shipped:
    name: Kernel check on the larger programs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - name: Restore opam root (OCaml + Rocq)
        id: opam-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-ocaml${{ env.OCAML_VERSION }}-rocq${{ env.ROCQ_CORE_VERSION }}-${{ env.OPAM_CACHE_VERSION }}-${{ env.OPAM_REPO_SHA }}
      - name: Install opam
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends opam
      - name: Build opam switch + Rocq (cache miss only)
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare --disable-sandboxing -y default "git+https://github.com/ocaml/opam-repository.git#${OPAM_REPO_SHA}"
          opam switch create "${OCAML_VERSION}" -y
          eval "$(opam env)"
          opam install -y "rocq-prover>=9.0.0" "rocq-core=${ROCQ_CORE_VERSION}"
      - name: Ensure coqc on PATH
        run: |
          eval "$(opam env)"
          BIN="$HOME/.local/bin"; mkdir -p "$BIN"
          if ! command -v coqc >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec rocq compile "$@"\n' > "$BIN/coqc"; chmod +x "$BIN/coqc"
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          coqc --version || true
      - name: Measure
        run: |
          eval "$(opam env)"
          bash scripts/probe-shipped-routines-programs.sh "$RUNNER_TEMP/shipped-programs"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipped-programs
          path: |
            ${{ runner.temp }}/shipped-programs/programs.txt
            ${{ runner.temp }}/shipped-programs/built.tsv
            ${{ runner.temp }}/shipped-programs/shipped-dump
            ${{ runner.temp }}/shipped-programs/shipped/verdicts.tsv
            ${{ runner.temp }}/shipped-programs/shipped/index.tsv
            ${{ runner.temp }}/shipped-programs/shipped/*.log
            ${{ runner.temp }}/shipped-programs/coqc-*.log
