name: CI

# NO path filtering. This workflow owns all 13 REQUIRED status checks, and a
# required check that never reports is not a skipped check — it is a PR that
# can never merge. A docs-only PR sat BLOCKED at 0 of 13 reported until this
# was removed.
#
# What it replaces: an ordered-negation list (`'**'`, then `'!docs/**'`,
# `'!*.md'`, `'!LICENSE'`, then re-includes for the contract ledger, the ALS
# normative specs and the semantics manifest). It cost correctness twice, both
# times for the same reason — it decided which gates to run by GUESSING which
# files matter:
#   1. #982: a PR touching ONLY docs/contracts/contracts.toml skipped this
#      workflow, i.e. skipped exactly the gate that exists to check that file.
#      The repair was a re-include, added one path at a time, forever.
#   2. The negations made a whole CLASS of PR unmergeable. The obvious repair —
#      a companion workflow re-declaring the same job names on the inverse
#      filter — is worse than the disease: a PR touching both docs and code
#      matches BOTH filters, so a no-op run and a real run report the same
#      check name, and a fake green can mask a real red.
#
# Running the suite on a README edit costs runner minutes. Getting the guess
# wrong costs a gate. The trade is not close.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The develop merge queue (#1732 follow-on): the queue's temporary
  # gh-readonly-queue/* branch must receive every REQUIRED check, or the
  # first queued PR stalls forever. Only this workflow and
  # acceptance-ring.yml produce required contexts; the rest deliberately
  # skip merge_group to keep the queue validation lean.
  merge_group:

# Cancel superseded runs on the same ref so a burst of pushes doesn't fire N
# concurrent runs that all re-download tools and trip the per-IP rate limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.0"  # runner-class MSRV: the almide binary embeds wasmtime 47 (commissioned host); compiler crates keep the 1.89 claim per-crate
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"
  # No CI job may ever wait on an interactive git credential prompt: on the
  # Windows runners a git fetch of an unreachable/bogus remote can block in
  # Git Credential Manager instead of failing fast — the suspected mechanism
  # behind the 4h20m lsp_test hang (#1008).
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: "never"

jobs:
  cancel-superseded-queue-runs:
    # A merge-queue REBUILD (the entry ahead was removed, or its build changed)
    # gives this PR a new gh-readonly-queue/develop/pr-N-<sha> ref, and the
    # concurrency group above is per ref — so the run for the OLD ref keeps
    # going on a tree that can never merge. On 2026-09-21 that left 18 dead
    # merge-group runs holding runners while the live entries sat queued
    # (105 jobs waiting, 44 running). This job cancels every OLDER in-flight
    # merge-group run of the same PR. Only older ones: two rebuilds racing
    # each cancel only what they supersede, never each other.
    name: Cancel this PR's superseded merge-group runs
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          THIS_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(printf '%s' "$REF" | sed -E 's#.*/pr-([0-9]+)-.*#\1#')
          case "$pr" in ''|*[!0-9]*) echo "not a queue ref: $REF"; exit 0;; esac
          mine=$(gh api "repos/$REPO/actions/runs/$THIS_RUN" --jq .created_at)
          gh api "repos/$REPO/actions/runs?event=merge_group&per_page=100" --paginate \
            --jq ".workflow_runs[] | select(.status != \"completed\") | select(.head_branch | test(\"/pr-${pr}-\")) | select(.head_branch != \"$REF\") | select(.created_at < \"$mine\") | \"\(.id) \(.name) \(.head_branch)\"" \
          | while read -r id name br; do
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null && echo "cancelled superseded run $id ($name on $br)"
            done
          echo "done: this PR is #$pr on $REF"

  # ═══════════════════════════════════════════════
  # Change class — a docs-only change skips the test matrix
  # ═══════════════════════════════════════════════

  changes:
    # A README-only PR used to buy the whole matrix: four Test Rust shards
    # (14–20 min), two determinism sweeps, the gates job, the perf ratchet —
    # none of which read what changed. scripts/check-docs-only.sh classifies
    # the change set (allow-list: *.md, images, LICENSE; everything else is
    # code, and the markdown a test or the binary consumes is code too), and
    # the heavy jobs carry `if: needs.changes.outputs.docs_only != 'true'`.
    #
    # Job-level `if`, NOT a workflow `paths` filter: a job skipped by its own
    # `if` reports SUCCESS to branch protection ("Jobs that are skipped will
    # report their status as Success. They will not prevent a pull request
    # from merging, even if it is a required check" — GitHub docs, "Handling
    # skipped but required checks"), while a workflow filtered out by `paths`
    # leaves its required checks Expected forever and the PR blocked.
    #
    # MATRIX jobs are the exception: a job-level `if` skips the job BEFORE the
    # matrix expands, so the one skipped check-run is named with the literal
    # `${{ matrix.shard }}` and the required contexts `Test Rust (shard 1/4)`…
    # `(shard 4/4)` never receive a run — the first docs-only PR (#1609) sat
    # BLOCKED on exactly that. test-rust therefore keeps its job-level guard
    # OFF and guards every STEP instead (`if: env.DOCS_ONLY != 'true'`): the
    # four shards expand, each finishes in seconds, each reports success under
    # its real name.
    #
    # Fail-safe direction: the classify step is `continue-on-error`, so a
    # broken classifier yields an EMPTY output, `'' != 'true'` holds, and
    # everything runs. Breakage costs twenty minutes, never a skipped suite.
    #
    # What still runs on a docs-only change: build (the checks need the
    # binary), Emit & Format (LLM-surface fences, stdlib doc indexes, README
    # stats, the build-speed block, `almide docs-gen --check`), Lean proofs.
    name: Change class (docs-only skips the test matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        name: Classify the change set (scripts/check-docs-only.sh)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # HEAD is the PR's merge commit; its merge-base with the base branch
            # is the base tip, so the range is exactly the PR's own change set.
            git fetch -q origin "${{ github.base_ref }}"
            bash scripts/check-docs-only.sh "$(git merge-base "origin/${{ github.base_ref }}" HEAD)" HEAD
          elif [ "${{ github.event_name }}" = merge_group ]; then
            # The queue's group branch: base_sha is the develop tip the group
            # was built on, so the range is the WHOLE group's change set —
            # docs_only only when every queued PR is docs-only, which is the
            # correct conservative reading.
            base="${{ github.event.merge_group.base_sha }}"
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              bash scripts/check-docs-only.sh "$base" HEAD
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "check-docs-only: merge_group base unavailable — full run"
            fi
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              bash scripts/check-docs-only.sh "$before" HEAD
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "check-docs-only: no comparable base for this push — full run"
            fi
          fi

      - name: Verdict
        run: echo "docs_only=${{ steps.classify.outputs.docs_only }} (empty means the classifier failed — full run)"

  ratchet-separation:
    # #2183: scripts/check-ratchet-separation.sh ran only as a lefthook
    # pre-commit hook, so the commits that re-recorded a parity golden in the
    # same change as the implementation it judged — exactly the class the
    # rule exists to split — were never seen by CI. This checks EVERY commit
    # of the change set on its own, over the same base the classifier above
    # uses; a merge_group or push without a comparable base is reported, not
    # silently green.
    name: Ratchet-commit separation (each commit keeps verification artifacts apart from implementation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit in the range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q origin "${{ github.base_ref }}"
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          elif [ "${{ github.event_name }}" = merge_group ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="";; esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ratchet-separation: no comparable base for this ${{ github.event_name }} — checking HEAD alone"
            BASE="$(git rev-parse HEAD~1)"
          fi
          # The protected line is what was accepted BEFORE this change set: a
          # disposition (proofs/ratchet-dispositions.txt) may close only a
          # commit already on it, and the change set's own commits are judged
          # by its tip's law. A push to develop is its own change set, so its
          # line is develop as it stood before the push; every other event
          # compares against develop.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_name }}" = develop ]; then
            PROTECTED="$BASE"
          else
            git fetch -q origin develop
            PROTECTED=origin/develop
          fi
          RATCHET_PROTECTED="$PROTECTED" bash scripts/check-ratchet-separation.sh "$BASE" HEAD
      - name: The gate judges each commit by the law at its parent (negative controls)
        # Needs the full history this job checks out: the old law it replays
        # is the gate's real July version.
        run: bash scripts/check-ratchet-separation-negative.sh

  # ═══════════════════════════════════════════════
  # Build — shared by all jobs
  # ═══════════════════════════════════════════════

  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # clippy rides this job's compile cache for its ratchet (#1462).
          components: clippy

      # Dependencies only. The old actions/cache entry (registry + git + the
      # whole `target/`) had grown to 4.1 GB and took 143 s to restore — most
      # of it the workspace's own artifacts, which every run recompiles anyway
      # because the sources changed. rust-cache prunes workspace crates from
      # `target/` on save and keeps the dependency artifacts (release,
      # ci-test, and the check/clippy metadata the two ratchets below ride).
      # `save-if`: develop writes, PRs and queue branches read — one warm
      # entry per toolchain + lockfile instead of one per branch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-${{ env.RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true

      - run: cargo build --release

      # #1732: the workspace's TEST build happens ONCE, here, and ships to
      # the shards as a cargo-nextest archive — the four shard jobs stop
      # compiling entirely (each used to repeat this ~10-minute build). The
      # archive carries every test binary plus build-script outputs; shards
      # replay it with `nextest run --archive-file` under the same target map
      # and coverage gate.
      #
      # `--cargo-profile ci-test` (Cargo.toml): the dev profile minus
      # debuginfo. The dev-profile archive was 3.1 GB, took 164 s to pack and
      # 86 s to upload, and every shard downloaded it (the `digest-mismatch`
      # flake lived on that download). Test semantics are the dev profile's
      # (debug_assertions on, so the release-only sweeps stay ignored here).
      # The shards need no profile flag: the archive records its own layout
      # and `--extract-to` recreates target/ci-test/*.
      - name: Install cargo-nextest
        run: |
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 15 https://get.nexte.st/0.9.145/linux -o /tmp/nextest.tar.gz
          tar xzf /tmp/nextest.tar.gz -C /usr/local/bin
          cargo nextest --version
      - name: Archive the workspace test binaries
        run: cargo nextest archive --workspace --cargo-profile ci-test --archive-file /tmp/almide-tests.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: almide-tests-archive
          path: /tmp/almide-tests.tar.zst
          retention-days: 1
          # nextest already zstd-compressed the archive; a second gzip pass
          # over incompressible bytes only costs upload-artifact time.
          compression-level: 0

      # Wired to `build`, not `checks`: the ratchet compiles the workspace, and
      # `checks` downloads a prebuilt binary with no cargo toolchain. Runs after
      # the release build so the warning set is measured against the same
      # compilation the artifact came from (#1379 / #1228).
      - name: Rustc warning ratchet (a noisy build hides the one warning that matters)
        run: bash scripts/check-rustc-warnings.sh

      # The clippy tier of the same discipline (#1462): a shrink-only
      # baseline over `cargo clippy --workspace --all-targets`. Lives in
      # `build` for the same reason the rustc ratchet does — it compiles,
      # and the release build above primes the dependency cache.
      - name: Clippy warning ratchet (#1462 — the lint tier rustc does not see)
        run: bash scripts/check-clippy-warnings.sh

      - uses: actions/upload-artifact@v7
        with:
          name: almide-linux
          path: target/release/almide
          retention-days: 1

  # ═══════════════════════════════════════════════
  # Target tests — all run on every develop/main PR
  # ═══════════════════════════════════════════════

  shard-coverage:
    # THE GATE that makes sharding safe. A partition that drops a target does
    # not fail — it goes GREEN, faster, with less tested. That failure mode is
    # invisible by construction, so it gets its own job: assert the four shards'
    # union is exactly the full target set, with nothing missing and nothing run
    # twice. Cheap (no tests run, just enumeration) and it gates the same commit
    # the shards run on.
    name: Test shards cover every target
    # `test-rust-solo` too (#2381): the five solo legs are NOT in
    # develop's required-check list (only this job and the four shard
    # names are), so this job — which is required — waits for them and
    # refuses to go green unless every solo leg passed. Adding the leg
    # names to branch protection retires that step; until then a red
    # giant blocks the merge through this name.
    needs: [changes, build, test-rust-solo]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Every solo leg passed (they carry five corpus gates the shards no longer run)
        if: needs.test-rust-solo.result != 'success'
        run: |
          echo "::error::Test Rust (solo …) result is '${{ needs.test-rust-solo.result }}' — a solo corpus gate failed or did not run; this gate refuses to certify coverage over it"
          exit 1
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # #1732: enumerate from the build job's nextest archive — this
      # job's old enumerate compiled the workspace.
      - name: Install cargo-nextest
        run: |
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 15 https://get.nexte.st/0.9.145/linux -o /tmp/nextest.tar.gz
          sudo tar xzf /tmp/nextest.tar.gz -C /usr/local/bin
          cargo nextest --version
      - uses: actions/download-artifact@v8
        with:
          name: almide-tests-archive
          path: /tmp/almide-archive
      - name: Union of shards + solo legs == full target set
        # #2381: the five solo targets run in `Test Rust (solo …)` jobs, one
        # per giant, so the union is the four shards PLUS the solo rows, each
        # target in exactly one of them. Both lists come from the SAME
        # archive enumeration, so a solo target that stops existing is a
        # diff here, not a silently empty job.
        run: |
          set -euo pipefail
          A=/tmp/almide-archive/almide-tests.tar.zst
          bash scripts/ci-test-shard.sh --list-all-archive "$A" | sort > /tmp/all.txt
          : > /tmp/union.txt
          for i in 0 1 2 3; do
            bash scripts/ci-test-shard.sh --list-archive "$i" 4 "$A" >> /tmp/union.txt
          done
          bash scripts/ci-test-shard.sh --list-solo-archive "$A" | tee /tmp/solo.txt >> /tmp/union.txt
          solo_n=$(wc -l < /tmp/solo.txt | tr -d ' ')
          if [ "$solo_n" -ne 5 ]; then
            echo "SHARD GATE FAIL: expected 5 solo targets in the archive, found $solo_n — a solo target was renamed or dropped and its job would run nothing" >&2
            exit 1
          fi
          sort /tmp/union.txt > /tmp/union_sorted.txt
          dupes=$(sort /tmp/union.txt | uniq -d | wc -l | tr -d ' ')
          if [ "$dupes" -ne 0 ]; then
            echo "SHARD GATE FAIL: $dupes target(s) assigned to more than one shard:" >&2
            sort /tmp/union.txt | uniq -d >&2
            exit 1
          fi
          if ! diff -u /tmp/all.txt /tmp/union_sorted.txt; then
            echo "SHARD GATE FAIL: the shards' union is not the full target set — a" >&2
            echo "target above with '-' is enumerated but NEVER RUN (a green build" >&2
            echo "that tests less), one with '+' is run twice." >&2
            exit 1
          fi
          echo "shard coverage OK: $(wc -l < /tmp/all.txt | tr -d ' ') target(s), each in exactly one shard or solo job"
      - name: The interp-ledger leg selects its whole binary (no test lost)
        # One leg since #2446 (the two ledger gates share one sweep in one
        # test); the filterset must still equal the binary's test list, so a
        # test added to the binary cannot fall outside the leg.
        run: |
          set -euo pipefail
          A=/tmp/almide-archive/almide-tests.tar.zst
          bash scripts/ci-test-shard.sh --list-solo-tests-archive interp_ledger "$A" > /tmp/leg_a.txt
          cargo nextest list --archive-file "$A" --workspace-remap . --message-format json -E 'binary_id(=almide::wasm_runtime_interp_ledger)' \
            | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for bid, v in sorted(d["rust-suites"].items()):
              for t, tc in sorted(v["testcases"].items()):
                  if tc.get("filter-match", {}).get("status") == "matches":
                      print("%s\t%s" % (bid, t))
          ' > /tmp/leg_all.txt
          [ -s /tmp/leg_a.txt ] || { echo "LEDGER GATE FAIL: the interp-ledger leg selects no test" >&2; exit 1; }
          if ! diff -u <(sort /tmp/leg_all.txt) <(sort /tmp/leg_a.txt); then
            echo "LEDGER GATE FAIL: the interp-ledger leg does not select the binary's whole test list" >&2
            exit 1
          fi
          echo "ledger leg OK: $(wc -l < /tmp/leg_a.txt | tr -d ' ') tests = $(wc -l < /tmp/leg_all.txt | tr -d ' ')"
      # ── The fixture-range shards (#2381, N=2) ──
      # Each `Test Rust (solo <leg> k/2)` job uploaded the fixture list its
      # gate ACTUALLY WALKED plus, for the two whole-corpus gates, a partial.
      # Two steps close the partition: the lists' union must be the corpus
      # (a shard that silently walks fewer fixtures is the one failure this
      # sharding can add, and it is green by construction without this),
      # and `merge/2` judges the summed ceilings and the unioned bridge
      # names with the gates' own code from the same archive.
      - uses: actions/download-artifact@v8
        with:
          pattern: corpus-shard-*
          merge-multiple: true
          path: /tmp/corpus-shard
      - name: Corpus shards cover every fixture (∪ walked lists == ls spec/wasm_cross, no duplicates)
        run: bash scripts/ci-corpus-shards.sh --coverage /tmp/corpus-shard 2
      - name: Merge the shard partials — run_parity ceilings summed, bridge-fallback names unioned — and judge the whole
        run: bash scripts/ci-corpus-shards.sh --merge /tmp/corpus-shard 2 /tmp/almide-archive/almide-tests.tar.zst
      - name: Balance report (informational — imbalance costs time, not coverage)
        run: |
          for i in 0 1 2 3; do
            printf '  shard %s/4: %s target(s)\n' "$((i + 1))" "$(bash scripts/ci-test-shard.sh --list-archive "$i" 4 /tmp/almide-archive/almide-tests.tar.zst | wc -l | tr -d ' ')"
          done

  test-rust:
    # SHARDED (4 ways). The suite's 30 minutes are TEST EXECUTION, not
    # compilation — 29 of them are `finished in` time — so caching cannot touch
    # it, and neither can a bigger runner: nearly every test shells out to
    # `almide`, and each `almide` compile takes a GLOBAL exclusive flock on the
    # shared build dir (src/cli/run.rs::BuildDirLock), which serializes the whole
    # suite inside one machine. Separate JOBS each get their own build dir and
    # therefore their own lock — that is where the parallelism comes from.
    #
    # 4, not more: the load is extremely skewed (the top 4 targets are half the
    # total), so past 4 shards the longest single target IS the floor and extra
    # jobs buy nothing. The former giant, `wasm_runtime_test` (1552 s on run
    # 33695667642), is split into per-gate `wasm_runtime_*` binaries so the
    # packer can spread it. #2381: the five corpus sweeps that are each ONE
    # 18–35-minute test (`wasm_runtime_{cross_target,interp_oracle,opt_parity,
    # interp_ledger}`, `almide-spine::run_parity`) are no longer partitioned
    # at all — `test-rust-solo` below gives each its own runner — so these
    # four shards carry the ~6.5 ks of everything else, ~1.6 ks each.
    name: Test Rust (shard ${{ matrix.shard }}/4)
    needs: [changes, build]
    # No job-level docs-only guard here — see the `changes` job: a skipped
    # MATRIX job never expands, so the required `Test Rust (shard N/4)`
    # contexts would stay Expected. Every step is guarded instead; on a
    # docs-only change the four shards expand, run nothing, and report
    # success under their real names in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    strategy:
      fail-fast: false
      matrix:
        # 1-based for the job NAME (`Test Rust (shard 1/4)` … `(shard 4/4)`,
        # the required contexts); the packer in scripts/ci-test-shard.sh keeps
        # its 0-based index, handed `shard - 1` below. Renaming these changes
        # the branch-protection contexts — swap them in the same landing.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        if: env.DOCS_ONLY != 'true'

      - uses: actions/download-artifact@v8
        if: env.DOCS_ONLY != 'true'
        with:
          name: almide-linux
          path: /tmp/almide-bin

      - name: Setup
        if: env.DOCS_ONLY != 'true'
        run: chmod +x /tmp/almide-bin/almide

      # #2381 item 7: the toolchain, pinned nextest, archive download,
      # wasmtime and binaryen come from one composite — the shard and solo
      # jobs carried the same block twice.
      - uses: ./.github/actions/setup-test-leg
        if: env.DOCS_ONLY != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cargo tests
        if: env.DOCS_ONLY != 'true'
        # Parallel-safe: the shared build scratch dir (/tmp/almide-run,
        # /tmp/almide-build) is serialized across processes by an advisory
        # flock (see src/cli/run.rs BuildDirLock). Unix only — this runner
        # is ubuntu, so the lock applies.
        # ALMIDE_BIN points the cross-target tests at the built compiler (else
        # almide_bin() falls back to PATH and the tests skip).
        # ALMIDE_EXPECT_TOOLS=1: this leg CLAIMS full tool coverage, so the
        # tripwire test fails loudly if wasmtime/wasm-opt/almide ever go
        # missing instead of letting the tool-gated suites skip-as-pass (#983).
        env:
          ALMIDE_BIN: /tmp/almide-bin/almide
          ALMIDE_EXPECT_TOOLS: "1"
        # The script enumerates every workspace test target from cargo's own
        # JSON (root package AND member crates — a bare `cargo test` at the root
        # tests only the root, and the members' suites silently never ran in CI
        # before `--workspace`), packs them heaviest-first into balanced shards,
        # and runs this shard's share. `shard-coverage` below proves the four
        # shards' union is the whole set, so a partition bug reads as a RED
        # build rather than a fast green one.
        run: bash scripts/ci-test-shard.sh --run-archive $(( ${{ matrix.shard }} - 1 )) 4 /tmp/almide-archive/almide-tests.tar.zst

  test-rust-solo:
    # The corpus giants, one runner each (#2381). Five test targets are each
    # ONE test walking spec/wasm_cross serially for 18–35 minutes, and their
    # cost is contention-sensitive: on PR #2440's run (35581361256), sharing
    # a 4-vCPU runner with three other suites made every giant 40–95 %
    # slower than it runs alone (opt_parity 1075 s → 2110 s, interp_oracle
    # 1223 → 2040, cross_target 1377 → 1981, run_parity 1310 → 1907), and
    # the shards sat at 32–44 min for 4.2–5.0 ks sums. The runner was the
    # floor, so each giant gets its own. Same archive, same tools, same
    # ALMIDE_BIN as the shards; the interp ledger's two gates share ONE
    # corpus sweep since #2446 (one test, ~1 min on a thread pool), so the
    # ledger binary is one leg. The coverage gate (`Test shards cover every
    # target`) asserts shards ∪ solos == every target and that the ledger
    # leg selects the whole binary.
    #
    # NOT in develop's required-check list yet (the four shard names and
    # the coverage gate are). The coverage gate `needs` this job and fails
    # unless every leg passed, so a red giant still blocks the merge through
    # a required name; adding `Test Rust (solo <leg> k/N)` × 10 to branch
    # protection makes that direct and retires the proxy step.
    #
    # FIXTURE-RANGE SHARDED, N=2 (#2381, second step). Each leg is one test
    # walking the SORTED corpus; `ALMIDE_CORPUS_SHARD=k/2` keeps a slice of
    # it — since #2457 the LPT partition over the measured per-fixture walls
    # in proofs/corpus-weights.txt (the modulo slice put the heavy tail on one
    # residue class: run_parity 6 vs 16 min), so the halves are balanced by
    # cost, not by count. What
    # keeps that honest lives in the coverage job below: every shard uploads
    # the fixture list it actually walked, and the union must equal
    # `ls spec/wasm_cross` (and the run manifest) with no duplicates. Two
    # gates hold a WHOLE-corpus count or name set (run_parity's shrink-only
    # ceilings, the bridge-fallback half of the interp ledger); a shard never
    # judges its partial against the whole — it leaves the partial, and the
    # coverage job's `merge/2` sums / unions and judges with the gate's own
    # code (crates/almide-corpus/src/lib.rs, `CorpusShard`).
    name: Test Rust (solo ${{ matrix.leg }} ${{ matrix.shard }}/2)
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with SOLO_LEGS in scripts/ci-test-shard.sh, and the
        # gate list in scripts/ci-corpus-shards.sh (the interp_ledger leg is
        # the one-sweep ledger test plus two pure unit tests).
        leg:
          - wasm_runtime_cross_target
          - wasm_runtime_interp_oracle
          - wasm_runtime_opt_parity
          - run_parity
          - interp_ledger
        # N=2 — the `/2` in the job name, ALMIDE_CORPUS_SHARD and the two
        # coverage-job steps must all say the same N.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        if: env.DOCS_ONLY != 'true'

      - uses: actions/download-artifact@v8
        if: env.DOCS_ONLY != 'true'
        with:
          name: almide-linux
          path: /tmp/almide-bin

      - name: Setup
        if: env.DOCS_ONLY != 'true'
        run: chmod +x /tmp/almide-bin/almide

      # #2381 item 7: the toolchain, pinned nextest, archive download,
      # wasmtime and binaryen come from one composite — the shard and solo
      # jobs carried the same block twice.
      - uses: ./.github/actions/setup-test-leg
        if: env.DOCS_ONLY != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cargo test (solo ${{ matrix.leg }}, corpus shard ${{ matrix.shard }}/2)
        if: env.DOCS_ONLY != 'true'
        env:
          ALMIDE_BIN: /tmp/almide-bin/almide
          ALMIDE_EXPECT_TOOLS: "1"
          ALMIDE_CORPUS_SHARD: ${{ matrix.shard }}/2
          ALMIDE_CORPUS_SHARD_DIR: /tmp/corpus-shard
          # #2457/#2502: the per-fixture walls this shard measured ride in the
          # same artifact (under `weights/`, so they cannot be confused with
          # the partials beside them), because proofs/corpus-weights.txt — the
          # table the slices balance on — must be rendered from THIS runner's
          # ratios, not a laptop's: the Mac-measured table predicted 93 / 93 s
          # per run_parity half and split this runner 479 / 1096 s. The refresh
          # is `scripts/gen-corpus-weights.sh --from-ci <run-id>` over these
          # artifacts; the weekly ratchet in shard-balance.yml says when.
          ALMIDE_CORPUS_WEIGHTS_DIR: /tmp/corpus-shard
        run: bash scripts/ci-test-shard.sh --run-solo-archive ${{ matrix.leg }} /tmp/almide-archive/almide-tests.tar.zst

      # The walked-fixture list and the partial counts / names, for the
      # coverage job. Uploaded on failure too, so a red shard's partial
      # says which half it walked; the coverage job refuses to certify
      # over a red leg regardless.
      #
      # Retention outlives the run because the weight refresh reads these
      # (#2502): the weekly ratchet names a run whose skew went red and the
      # fix is `gen-corpus-weights.sh --from-ci <that run>`, which downloads
      # its `weights/` files. At one day the named run was already gone.
      - uses: actions/upload-artifact@v7
        if: env.DOCS_ONLY != 'true' && !cancelled()
        with:
          name: corpus-shard-${{ matrix.leg }}-${{ matrix.shard }}
          path: /tmp/corpus-shard
          retention-days: 7
          if-no-files-found: error

  almide-gates:
    # BRANCH PROTECTION: this job's name is a REQUIRED CHECK on develop. Renaming
    # a job silently un-requires it — the old name never reports again and the
    # PR blocks forever waiting for a check that cannot arrive (which is exactly
    # what the shard rename did to `Test Rust`). Rename here ⟹ update
    # repos/almide/almide/branches/develop/protection/required_status_checks in
    # the same change.
    #
    # The steps that do NOT depend on the shard split, lifted OUT of it.
    #
    # `test-rust` is a 4-way matrix, so every step in it runs FOUR TIMES. These
    # six run the built compiler over fixed inputs — the same work, the same
    # result, four times over — which cost the critical shard ~150s of pure
    # duplication and would not shrink by adding shards. Sharding parallelises
    # `cargo test`; anything else sharing that job just gets copied.
    #
    # The registry regen is the one step here that needs cargo (it rebuilds
    # almide-codegen to diff the generated sources); the rest need only the
    # downloaded binary, which is why this job installs wasmtime/wasm-opt but
    # skips the heavy cargo cache the shards restore.
    name: Almide gates (compiler-driven, shard-independent)
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: almide-linux
          path: /tmp/almide-bin

      - name: Setup
        run: chmod +x /tmp/almide-bin/almide

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache wasmtime tarball
        id: wasmtime-cache
        uses: actions/cache@v6
        with:
          path: /tmp/wasmtime.tar.xz
          key: wasmtime-v27.0.0-x86_64-linux

      - name: Install wasmtime
        run: |
          if [ ! -f /tmp/wasmtime.tar.xz ]; then
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 15 -o /tmp/wasmtime.tar.xz \
              https://github.com/bytecodealliance/wasmtime/releases/download/v27.0.0/wasmtime-v27.0.0-x86_64-linux.tar.xz
          fi
          tar -xf /tmp/wasmtime.tar.xz -C /tmp
          sudo mv /tmp/wasmtime-v27.0.0-x86_64-linux/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen && wasm-opt --version

      - name: Generated runtime registry matches committed sources (regenerate and diff)
        # crates/almide-codegen/src/generated/{rust_runtime,runtime_fn_modes}.rs
        # are committed, but build.rs regenerates them from runtime/rs/src by
        # embedding each module's source TEXT. A draft edited in runtime/rs/src
        # but not committed can be baked into the generated file and committed on
        # its own, silently desyncing the two (this is exactly how the #419
        # codepoint draft leaked). Force a fresh regen (touch the generator so
        # cargo re-runs the build script) and fail on any diff — in CI only
        # committed sources exist, so a leaked draft cannot reproduce. Mirrors the
        # "Contract README up to date" regenerate-and-diff gate.
        run: |
          touch crates/almide-codegen/buildscript/runtime_registry.rs
          cargo build -p almide-codegen
          git diff --exit-code -- \
            crates/almide-codegen/src/generated/rust_runtime.rs \
            crates/almide-codegen/src/generated/runtime_fn_modes.rs \
            || { echo "::error::generated runtime registry is stale — a runtime/rs/src edit was not committed, or a generated file was hand-edited. Rebuild almide-codegen and commit crates/almide-codegen/src/generated/*.rs"; exit 1; }

      # #2183: the AST / check / run parity goldens the greenfield legs are
      # judged by claimed a pinned old oracle while being re-recorded from the
      # tree under test, and nothing could tell a regeneration from a hand
      # edit. The oracle is now defined as the CLI built from THIS commit —
      # the release artifact this job downloads — and the goldens must equal
      # what it produces. Regenerate all three and fail on any row diff (the
      # informational `# oracle:` header is excluded). Needs wasmtime for the
      # run leg, which is why it lives here and not in `checks`.
      - name: Parity goldens equal the CLI's own output (regenerate and diff, #2183)
        run: ORACLE=/tmp/almide-bin/almide bash scripts/check-parity-goldens.sh

      - name: Almide spec tests (Rust target)
        run: |
          ALMIDE=/tmp/almide-bin/almide
          $ALMIDE test spec/ --target rust

      - name: Almide examples tests
        run: |
          ALMIDE=/tmp/almide-bin/almide
          $ALMIDE test examples/

      - name: WASM coverage ratchet (the native-fallback set only shrinks — wasm is a first-class target)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash proofs/check-wasm-fallback.sh

      - name: Wall corpus (#1481 — refused shapes stay refused, with their reasons)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash proofs/check-wall-corpus.sh

      # Per-FUNCTION parity. The ratchet above measures which spec FILES fall back,
      # so a stdlib fn no test touches is invisible to it — datetime.monotonic_ns
      # had no wasm body at all while that gate read a clean 18/18. ~70s.
      - name: WASM reachability ratchet (every stdlib fn builds on both legs, or is listed)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash proofs/check-wasm-reachability.sh

      # Stage 1c. The two ratchets above measure code rendered FROM the shared MIR —
      # the half the 3-way oracle can differ native against wasm. The prelude is the
      # other half: hand-written wasm with no native counterpart, so its assurance has
      # to be named per function. CI runs the reachability re-measurement (the `via`
      # column is measured here, not trusted), which is why the example is built —
      # debug on purpose: it shares the registry-regen step's dep cache, and
      # rendering 47 fixtures is cheap even unoptimized.
      - name: WAT prelude audit (every hand-written wasm fn's evidence named and re-measured)
        run: |
          cargo build -p almide-mir --example render_program
          ALMIDE_RENDER=target/debug/examples/render_program bash scripts/check-wat-prelude-audit.sh

      # The dogfood program (Unit 0.46, #1001). Its own tests cover the decision rules
      # extracted from the shell gates — the parity verdict, the nightly streak fold, the
      # contract link symmetry — which in bash are reachable only through their I/O. Gated
      # here so the program cannot grow unverified: it is written IN Almide, so a compiler
      # regression breaks it, and that is the point of dogfooding it.
      - name: Almide dogfood tests (tools/almide-gates)
        run: |
          ALMIDE=/tmp/almide-bin/almide
          $ALMIDE test tools/almide-gates/

      # The fold-seed-consumes-its-source census (#2380): the shape #2377 broke on,
      # found from SOURCE alone (no compiler in the loop, so the emitter under test
      # cannot blind it) and held as a shrink-only floor over the spec corpus —
      # proofs/fold-seed-source-baseline.txt. A fixture that exercises the shape
      # cannot quietly disappear; stdlib/ sites are reported so the "nobody writes
      # this shape" measurement stays visible.
      - name: fold-seed-source census floor (#2380)
        run: |
          ALMIDE=/tmp/almide-bin/almide
          $ALMIDE run tools/almide-gates/src/main.almd -- fold-seed-source .

      - name: Implementation count per stdlib hole (one operation, N copies — #2397)
        run: |
          ALMIDE=/tmp/almide-bin/almide
          $ALMIDE run tools/almide-gates/src/main.almd -- impl-count .

      # The published build-speed table is DERIVED from docs/benchmarks/build-speed.txt, the
      # same discipline as the contract index and the claims block: a hand-edited number in the
      # README is a defect this catches rather than a change a reader is trusted not to make.
      # Freshness only — the numbers themselves are machine-dependent, so re-measuring here
      # would fail for every machine but the one that produced the baseline. The RATCHET
      # (`-- bench --check`, 1.5x) is a separate, opt-in job for that reason.
      - name: README build-speed block is fresh (#999)
        run: |
          ALMIDE=/tmp/almide-bin/almide
          $ALMIDE run tools/almide-gates/src/main.almd -- bench docs/benchmarks --check-readme

      - name: Frees churn gate (ALMIDE_WASM_FREES over spec/churn)
        # Was wired into NOTHING since it landed (#980) — the free-list-cycle
        # gate never fired anywhere. This job has both requirements: wasmtime
        # (installed above) and the built compiler.
        env:
          ALMIDE_BIN: /tmp/almide-bin/almide
        run: bash scripts/check-frees-churn.sh

  test-arm:
    name: Test ARM (NEON, Apple Silicon)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # almide-kernel's NEON kernels (silu/softmax/gelu/q1_0) cross-built on the x86
    # runners but were never *executed* — build-cross only proves they compile.
    # macos-14 is Apple Silicon, where NEON is the ARMv8 baseline, so the public
    # dispatch entry runs the *_neon path and the crate's differential tests compare
    # it against the scalar reference: a real correctness gate, not theatre.
    # The crate is `exclude`d from the workspace and carries its own empty
    # [workspace], so it is driven via --manifest-path (a root `-p almide-kernel`
    # cannot see an excluded package). No `needs: build` — it tests only the kernel.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/almide-kernel/target
          key: macos-arm-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('crates/almide-kernel/Cargo.toml') }}
          restore-keys: macos-arm-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Test almide-kernel on real ARM (NEON executes, diffed vs scalar)
        # almide-kernel has no committed [workspace] (that would break `almide build`'s
        # generated ML projects, which path-depend on it). Append one ephemerally so
        # cargo can test the excluded crate standalone — harmless here, this job never
        # runs `almide build`.
        run: |
          printf '\n[workspace]\n' >> crates/almide-kernel/Cargo.toml
          cargo test --release --manifest-path crates/almide-kernel/Cargo.toml

  test-wasm:
    name: Test WASM
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: almide-linux
          path: /tmp/almide-bin

      - name: Setup almide
        run: chmod +x /tmp/almide-bin/almide

      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-linux.tar.xz
          key: wasmtime-v47.0.3-x86_64-linux
      - name: Install wasmtime
        run: |
          # Pinned + cached + retried. On a cache hit the tarball is already here,
          # so the per-IP-rate-limited release download runs at most once per key.
          # `-f` turns a 403 rate-limit body into a retry instead of a 92-byte
          # "not a tar archive". Bump VERSION and the cache key together.
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Almide spec tests (WASM target)
        run: |
          ALMIDE=/tmp/almide-bin/almide
          $ALMIDE test spec/ --target wasm

  # ═══════════════════════════════════════════════
  # WASM on a WINDOWS host (#1066)
  #
  # The wasm leg ran on unix hosts only, so the Windows preopen strategy
  # (`--dir=.` + host-temp mapped at /tmp + TMPDIR steering — there is no
  # "/" to preopen) was dead code with no proof. This job runs the
  # fs/temp-dir/tail-call wasm_cross fixtures on windows-latest and asserts
  # native == wasm parity, which is exactly the surface #1066 tracks.
  # ═══════════════════════════════════════════════

  test-wasm-windows:
    name: Test WASM (Windows host)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Self-sufficient build: the `almide-windows` artifact exists only on
    # release PRs (build-cross is PR-to-main-gated), and this gate must run on
    # every develop push — a Windows-host regression found at release time is
    # found weeks late. The cargo cache below keeps the rebuild incremental.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Dependencies only (see the `build` job): rust-cache prunes the
      # workspace's own artifacts on save; develop writes, PRs read.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-wasm-windows-${{ env.RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true

      - run: cargo build --release

      - name: Cache wasmtime zip
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-windows.zip
          key: wasmtime-v47.0.3-x86_64-windows
      - name: Install wasmtime
        shell: bash
        run: |
          VERSION=v47.0.3
          ZIP="wasmtime-${VERSION}-x86_64-windows.zip"
          if [ ! -s "$ZIP" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${ZIP}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$ZIP"
            done
          fi
          unzip -oq "$ZIP"
          # NATIVE spelling, not git-bash's /d/... form: the runner prepends
          # this string to PATH verbatim, and the almide.exe → CreateProcess
          # lookup can only resolve Windows-form entries (bash resolving
          # `wasmtime --version` fine while the spawned compiler got
          # "program not found" was exactly this).
          cygpath -w "$PWD/wasmtime-${VERSION}-x86_64-windows" >> "$GITHUB_PATH"

      - name: Cross-target parity on a Windows host
        shell: bash
        run: |
          set -euo pipefail
          wasmtime --version
          ALMIDE="$PWD/target/release/almide.exe"
          for f in fs_relative_path env_platform_reporting nan_canonical_observation \
                   nan_canonical_bytes_write closure_tail_recursion mutual_tail_recursion; do
            n=$("$ALMIDE" run "spec/wasm_cross/$f.almd" 2>native_err.txt) || { echo "native run failed: $f"; cat native_err.txt; exit 1; }
            w=$("$ALMIDE" run "spec/wasm_cross/$f.almd" --target wasm 2>wasm_err.txt) || { echo "wasm run failed: $f"; cat wasm_err.txt; exit 1; }
            if [ -z "$w" ] || [ "$n" != "$w" ]; then
              echo "PARITY FAIL: $f"
              echo "--- native ---"; echo "$n"
              echo "--- wasm ---";  echo "$w"
              exit 1
            fi
            echo "parity ok: $f"
          done

  # ═══════════════════════════════════════════════
  # WASM host-arch codegen determinism
  #
  # The compiler runs as wasm32 in the browser playground but as 64-bit in the
  # test suite. A codegen path whose output depends on host pointer width or
  # HashMap iteration order emits a different — but stack-/RC-valid — module on
  # 32-bit, which can trap (`RuntimeError: unreachable`). The stack/Perceus
  # verifiers check one module's well-formedness, not reproducibility across
  # hosts. This gate compiles each fixture with the compiler built BOTH natively
  # and to wasm32-wasip1 and asserts byte-identical output.
  # ═══════════════════════════════════════════════

  # SPLIT FROM ONE JOB (#1138). The two determinism scripts share nothing but a
  # harness build and never read each other's output, yet they ran back-to-back
  # in one job: 316s + 476s = 792s, which made this the critical path of CI once
  # the test job was sharded (#1136, #1137). As two jobs they overlap and the
  # pair costs the slower one.
  #
  # The harness build is NOT the duplication worth chasing here — measured at
  # 52s native against ~476s of fixture loop, so ~7% of the job. The loop over
  # spec/wasm_cross is the weight, and partitioning it is the next step in #1138
  # (which needs a coverage gate reconciling both the fixture set and the
  # `walled` tally before it can land).
  wasm-host-determinism:
    name: WASM host-arch determinism
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1, wasm32-unknown-unknown

      # The library must build for the BROWSER without the embedded host: this is
      # the exact dependency shape almide/playground consumes (`default-features =
      # false`). The playground's deploy went red (2026-08-30 onwards) when
      # almide-wasm-run — wasmtime, hence ring/getrandom — became an unconditional
      # dependency of the root crate; this step is the tripwire.
      - name: Library builds for wasm32-unknown-unknown without the embedded host
        run: cargo check --lib --no-default-features --target wasm32-unknown-unknown --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache wasm-pack tarball
        uses: actions/cache@v6
        with:
          path: wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          key: wasm-pack-v0.13.1-x86_64-linux
      - name: Install wasm-pack
        # Pinned + cached + retried (the wasmtime pattern, #1255). The old form
        # was an unpinned installer script fetched WITHOUT `curl -f` and piped
        # into `sh` — a rate-limit body would have been EXECUTED, and the flake
        # class cost a manual rerun on PR #1254. On a cache hit this never
        # downloads at all; `-f` turns a 429 body into a retry.
        run: |
          VERSION=v0.13.1
          TARBALL="wasm-pack-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/rustwasm/wasm-pack/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasm-pack download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xzf "$TARBALL"
          sudo mv wasm-pack-*/wasm-pack /usr/local/bin/
          wasm-pack --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/wasmgen-harness/target
            tools/wasmgen-harness-uu/target
          # Keyed on the LIVE wasm emitter (almide-mir's v1 renderer) — the old
          # key hashed crates/almide-codegen/src/emit_wasm/**, deleted with the
          # v0 retirement, so that component silently hashed nothing (#992).
          key: wasmgen-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/almide-mir/src/**', 'crates/almide-codegen/src/lib.rs', 'crates/almide-codegen/src/pass.rs') }}
          restore-keys: wasmgen-${{ env.RUST_TOOLCHAIN }}-

      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-linux.tar.xz
          key: wasmtime-v47.0.3-x86_64-linux
      - name: Install wasmtime
        run: |
          # Pinned + cached + retried. On a cache hit the tarball is already here,
          # so the per-IP-rate-limited release download runs at most once per key.
          # `-f` turns a 403 rate-limit body into a retry instead of a 92-byte
          # "not a tar archive". Bump VERSION and the cache key together.
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version
      - name: Host-arch codegen determinism (wasm32-wasip1 vs native, byte-identical)
        run: scripts/check-host-determinism.sh

  wasm-browser-determinism:
    # BRANCH PROTECTION: this job's name is a NEW required check on develop.
    # Adding or renaming a job silently changes the required set — the shard
    # rename in #1136 left a PR blocked forever on a `Test Rust` check that
    # could no longer report. Update
    # repos/almide/almide/branches/develop/protection/required_status_checks
    # in the same change.
    name: WASM browser-ABI determinism
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache wasm-pack tarball
        uses: actions/cache@v6
        with:
          path: wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          key: wasm-pack-v0.13.1-x86_64-linux
      - name: Install wasm-pack
        # Pinned + cached + retried (the wasmtime pattern, #1255). The old form
        # was an unpinned installer script fetched WITHOUT `curl -f` and piped
        # into `sh` — a rate-limit body would have been EXECUTED, and the flake
        # class cost a manual rerun on PR #1254. On a cache hit this never
        # downloads at all; `-f` turns a 429 body into a retry.
        run: |
          VERSION=v0.13.1
          TARBALL="wasm-pack-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/rustwasm/wasm-pack/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasm-pack download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xzf "$TARBALL"
          sudo mv wasm-pack-*/wasm-pack /usr/local/bin/
          wasm-pack --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/wasmgen-harness/target
            tools/wasmgen-harness-uu/target
          # Keyed on the LIVE wasm emitter (almide-mir's v1 renderer) — the old
          # key hashed crates/almide-codegen/src/emit_wasm/**, deleted with the
          # v0 retirement, so that component silently hashed nothing (#992).
          # DISTINCT from the host job's key: both jobs cache the same paths, and
          # two jobs saving one key makes the second save fail as a duplicate. The
          # browser leg is also the only one that populates wasmgen-harness-uu, so a
          # shared entry would be written by whichever job finished first.
          key: wasmgen-uu-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/almide-mir/src/**', 'crates/almide-codegen/src/lib.rs', 'crates/almide-codegen/src/pass.rs') }}
          restore-keys: wasmgen-uu-${{ env.RUST_TOOLCHAIN }}-

      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-linux.tar.xz
          key: wasmtime-v47.0.3-x86_64-linux
      - name: Install wasmtime
        run: |
          # Pinned + cached + retried. On a cache hit the tarball is already here,
          # so the per-IP-rate-limited release download runs at most once per key.
          # `-f` turns a 403 rate-limit body into a retry instead of a 92-byte
          # "not a tar archive". Bump VERSION and the cache key together.
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version
      - name: Browser-ABI determinism (wasm32-unknown-unknown via node, no panic + byte-identical)
        run: scripts/check-browser-determinism.sh

  # ═══════════════════════════════════════════════
  # Lean Proofs (AlmidePerceusBelt + AlmideRaceBelt)
  # ═══════════════════════════════════════════════

  lean-proofs:
    name: Lean Proofs (0 sorry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Two complementary checks — both are required for the "proven" claim:
      # 1. grep for `sorry`: `lake build` only WARNS on sorry, so the grep is what
      #    enforces that every theorem is actually proven, not stubbed.
      # 2. `lake build`: kernel-checks that the proofs really compile — without it
      #    a broken proof (or one that only ever built locally) passes CI silently.
      - name: Verify 0 sorry
        run: |
          if grep -rn '\bsorry\b' \
              crates/almide-perceus-belt/AlmidePerceusBelt/ \
              crates/almide-race-belt/AlmideRaceBelt/ \
              crates/almide-edit-belt/AlmideEditBelt/ \
              --include='*.lean'; then
            echo "::error::sorry found in Lean proofs — all theorems must be fully proven"
            exit 1
          fi
          echo "✓ 0 sorry in Lean proofs"

      # Axiom ratchet: every `axiom` in the belts must be on this allowlist.
      # The only sanctioned one is the trustEvalCompleteness MARKER (: True,
      # can prove nothing) that makes the evaluator-completeness assumption
      # enumerable (lean4 trustCompiler pattern). A new axiom = a new trusted
      # assumption = it must be argued onto this list in its own PR.
      - name: Axiom ratchet
        run: |
          found=$(grep -rnE '^\s*axiom\s+\w+\s*:' \
              crates/almide-perceus-belt/AlmidePerceusBelt/ \
              crates/almide-race-belt/AlmideRaceBelt/ \
              crates/almide-edit-belt/AlmideEditBelt/ \
              --include='*.lean' || true)
          unexpected=$(echo "$found" | grep -v 'axiom trustEvalCompleteness : True' | grep -v '^$' || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            echo "::error::unlisted axiom in Lean proofs — trusted assumptions must be added to the CI allowlist deliberately"
            exit 1
          fi
          echo "✓ axiom audit: only the sanctioned marker axiom present"

      - name: Cache elan + Lean toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('crates/almide-perceus-belt/lean-toolchain', 'crates/almide-race-belt/lean-toolchain', 'crates/almide-edit-belt/lean-toolchain') }}

      - name: Install elan (retry-resilient)
        # A transient GitHub 504 (or 403 rate-limit) on the elan tarball
        # download used to fail the whole job — and this job is REQUIRED, so
        # a red here at the head of the merge queue restarts every entry
        # behind it (2026-09-21, run 35614130413: cache hit, elan present,
        # and leanprover/lean-action's own install step still re-ran
        # elan-init.sh with no retry and died on a 504). elan is installed
        # here with a retry loop, ~/.elan is cached above, and the builds
        # below call `lake` directly so nothing downloads elan again.
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            for i in 1 2 3 4 5; do
              curl -sSfL --retry 5 --retry-all-errors --retry-delay 15 https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz && break
              echo "elan download failed (504/rate-limit?), retry ${i}/5"; sleep 20; rm -f /tmp/elan.tar.gz
            done
            tar xzf /tmp/elan.tar.gz -C /tmp
            /tmp/elan-init -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The three belts are kernel-checked with `lake build` straight from the
      # cached elan (elan installs each belt's `lean-toolchain` on first use;
      # the toolchain lives in the ~/.elan cache keyed on those files). The
      # GITHUB_TOKEN authenticates elan's release-tag lookups so they use the
      # 5000/hr authenticated limit, not the 60/hr per-IP one that 403s.
      - name: Kernel-check proofs (lake build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd crates/almide-perceus-belt
          lean --version && lake --version
          lake build

      - name: Kernel-check race-belt proofs (lake build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd crates/almide-race-belt
          lean --version && lake --version
          lake build

      - name: Kernel-check edit-belt proofs (lake build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd crates/almide-edit-belt
          lean --version && lake --version
          lake build

      - name: Kernel-conformance corpus is in sync with its generator
        # The committed corpus (proofs/kernel-conformance) is a pure function
        # of Corpus.lean; editing one without the other is the only way this
        # can fail. Regenerate with `lake exe conformancegen --write`.
        run: |
          cd crates/almide-edit-belt
          lake exe conformancegen --check ../../proofs/kernel-conformance

      - name: Drift gate fires on corruption (negative controls)
        # Proof the gate above can actually reject: corrupted/deleted corpus
        # copies must FAIL --check. A gate only ever seen green is
        # indistinguishable from `exit 0`.
        run: bash scripts/check-conformance-negative.sh

  # ═══════════════════════════════════════════════
  # Checks
  # ═══════════════════════════════════════════════

  coverage-ratchet:
    # #566 gap B: the nightly ratchet surfaced a regression up to 24h late,
    # inviting baseline conflicts. This runs the SAME gate at push/PR time —
    # ~14 min measured — but only when something it measures changed.
    name: Coverage ratchet at push time (#566)
    # `build` too (#2381): the plain release binary this job used to compile
    # for itself (366 s on run 35554511975) is only the stamp's identity —
    # proofs/coverage.sh compiles its own INSTRUMENTED binaries into a
    # separate target dir — and the build job already ships that exact
    # binary as the `almide-linux` artifact. Waiting for `build` costs ~5
    # minutes of start delay against the 6 the compile cost, so the job
    # still finishes earlier, and a whole workspace build leaves the bill.
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Relevance — skip when nothing measured changed
        id: rel
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="$(git rev-parse HEAD~1 2>/dev/null || true)";; esac
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BASE"..HEAD)"
          else
            CHANGED="unknown-base"
          fi
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qE '^(crates/|src/|runtime/|spec/|stdlib/|proofs/coverage|proofs/mcdc|Cargo)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "nothing coverage-relevant changed ($(printf '%s\n' "$CHANGED" | wc -l) file(s))"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # RUST_TOOLCHAIN (1.94), not the historical 1.89 per-crate floor: the
      # commissioned workspace lock carries deps (thiserror 2.0.20) whose MSRV
      # is above 1.89, so a 1.89 build of the WORKSPACE no longer resolves.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rel.outputs.skip != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v6
        if: steps.rel.outputs.skip != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install llvm-tools
        if: steps.rel.outputs.skip != 'true'
        run: rustup component add llvm-tools-preview
      - uses: actions/download-artifact@v8
        if: steps.rel.outputs.skip != 'true'
        with:
          name: almide-linux
          path: /tmp/almide-bin
      - name: Install the built compiler (the stamp expects PATH almide == target/release/almide)
        if: steps.rel.outputs.skip != 'true'
        # proofs/lib/stamp.sh FAILS when the PATH binary's hash differs from
        # the workspace build's, so the one artifact is placed at both paths.
        run: |
          chmod +x /tmp/almide-bin/almide
          mkdir -p ~/.local/bin target/release
          cp /tmp/almide-bin/almide ~/.local/bin/almide
          cp /tmp/almide-bin/almide target/release/almide
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Measure coverage and enforce the ratchet + safety floors
        if: steps.rel.outputs.skip != 'true'
        run: bash proofs/coverage.sh --check

  checks:
    name: Emit & Format
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: almide-linux
          path: /tmp/almide-bin

      - name: Setup
        run: chmod +x /tmp/almide-bin/almide

      - name: Smoke test - emit targets
        # No `cmd && echo OK` here: under GitHub's `bash -e {0}` a failing
        # non-final member of an && list does NOT trip errexit, so the emit
        # failure was silently discarded (#984). And an EMPTY corpus is a hard
        # error, not a pass — the find-nothing-exit-0 shape is how gates go
        # blind (#976 class).
        run: |
          ALMIDE=/tmp/almide-bin/almide
          f=$(find spec/lang -name '*_test.almd' | head -1)
          [ -n "$f" ] || { echo "::error::no spec/lang test files found — the smoke test lost its corpus (#984)"; exit 1; }
          $ALMIDE "$f" --target rust > /dev/null
          echo "Rust emit OK"
          $ALMIDE "$f" --emit-ast > /dev/null
          echo "AST emit OK"

      - name: fmt gate (spec/ + examples/ + tools/almide-gates/ + stdlib/ stay formatted, #919/#1462/#1855; gauntlet reject cells excluded by the manifest; stdlib under --no-import-edit)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-fmt-gate.sh

      - name: Doc fences execute (#1490 — marked stdlib examples check/run byte-exactly)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-doc-fences.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install wasm-opt (binaryen) for the JS host gate's post-opt shim-set assertion (#2276)
        run: sudo apt-get update && sudo apt-get install -y binaryen && wasm-opt --version
      - name: JS host (#2265/#2276 — `--host js` glue runs the wasm_host_js fixtures under node, stdout byte-equal to expected and native; the module and glue ship only the program's surface)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-js-host.sh

      # #2205: the ALMIDE_* switches are one registry. The grep half refuses an
      # unregistered name anywhere in the tree and a direct std::env read in
      # the compiler proper; the Almide half refuses drift between the registry
      # and the table docs/specs/cli.md embeds.
      - name: Environment switches are registered (#2205 — no unregistered ALMIDE_* name, no direct read in the compiler proper)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-env-switches.sh

      - name: Environment switch table matches the registry (#2205 — docs/specs/cli.md is `almide switches --md`)
        run: /tmp/almide-bin/almide run tools/almide-gates/src/main.almd -- env-switches-doc . /tmp/almide-bin/almide

      - name: Regex answers what an outside engine answers (#2129 — C-032's fuzz is blind to a rule both legs read wrong)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-regex-reference.sh

      - name: Forbidden impurities (no raw clocks/threads in the compile path)
        run: scripts/check-forbidden-impurities.sh

      - name: Workflow files parse strictly (a schedule-only workflow that cannot parse fails silently, #1234)
        run: bash scripts/check-workflows.sh

      - name: Stability closure standing (#1485 — informational, never blocks)
        run: bash scripts/check-stability-closure.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: rt-oracle registry (RETIRED with v0, #782 — prints the tombstone; v1 is gated by spec/wasm_cross + the interp oracle)
        # The step name previously claimed "every compile_* registered +
        # verified tests exist" while the script short-circuits on the deleted
        # v0 emitter dir (#981). The honest name stays until the script is
        # deleted outright.
        run: scripts/check-rt-oracle-registry.sh

      - name: Contract ledger traceability (every contract evidenced, every fixture contracted)
        run: scripts/check-contracts.sh

      - name: Contract citations — every C-NNN spelled in source, docs, stdlib or proofs names a ledger contract (#2406)
        run: bash scripts/check-contract-citations.sh

      # #2122: a release-only test the shards skip and no release job names
      # runs in no job at all — and reads green forever.
      - name: Release-only tests are named by a release job (#2122)
        run: bash scripts/check-release-only-tests.sh

      - name: ALS pin — every contract id is known to the judge at proofs/als-pin.txt, every shared statement/title byte-identical (als #60, #2403)
        run: bash scripts/check-als-pin.sh

      - name: ALS pin gate fires on forged statements, titles and allowances (negative controls)
        run: bash scripts/check-als-pin-negative.sh

      - name: Exit sites — every frame exit of the structural emitter goes through the ExitPlan renderer (#1995)
        run: bash scripts/check-exit-sites.sh

      - name: Arm arguments — every module-op arm declares Borrow / Retain per argument (#2004)
        run: bash scripts/check-arm-args.sh

      - name: WASI/Component-Model pin policy (#1628 stage 4) + capability DCE — an IO-only artifact imports no denied-family host fn (#2152)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-wasi-pins.sh

      - name: Allocation ceilings (one 2 GiB limit, every spelling agrees)
        run: bash scripts/check-alloc-ceilings.sh

      - name: Domain-edges ledger admission (an availability-dependent reading never reaches the ledger, #2387)
        run: bash scripts/check-domain-edges.sh --selftest

      - name: L1 verdict ledger (edit-locality prediction loop — schema and vocabularies)
        run: bash scripts/check-l1-verdicts.sh

      - name: L1 verdict ledger gate fires on malformed input (negative controls)
        run: bash scripts/check-l1-verdicts-negative.sh

      - name: Release evidence seals (every seal re-measured against its tag — the audit freeze)
        run: bash scripts/release-seal.sh check

      - name: Retired spellings stay retired (every retirement executed, not asserted)
        # Compiles a probe per ledger row against the built binary, so the
        # gate needs it on ALMIDE_BIN like the other compiler-driven checks.
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-retired-spellings.sh

      - name: Retired-spelling gate fires on forged ledgers (negative controls)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-retired-spellings-negative.sh

      - name: Dialect epoch ledger (@dialect(N) means one thing, and the compiler agrees)
        run: bash scripts/check-dialect-epochs.sh

      - name: Dialect epoch gate fires on forged ledgers and constants (negative controls)
        run: bash scripts/check-dialect-epochs-negative.sh

      - name: Interface differ fires on a removed effect fn (negative controls, #1860)
        # The release gate itself runs at tag time against real refs; this proves
        # it can still refuse — a forged index with one effect fn and one pure fn
        # deleted must classify `breaking`, an added effect fn must count.
        run: bash scripts/check-interface-diff-negative.sh

      - name: Gate verification ledger (every gate classified by how it can fail — no decorative gates)
        run: bash scripts/check-gate-verification.sh

      - name: Capability / effect consistency (#1515 — every fn reaching the nondet floor is effect-declared)
        run: bash scripts/check-cap-effect-consistency.sh

      - name: Mut receivers (#2466 — an intrinsic whose runtime takes `&mut` first declares that parameter `mut`)
        run: bash scripts/check-mut-receivers.sh

      - name: Pass-isolated fixtures (#1487 — byte-identical under full / ablated / only-pass, native == wasm)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-pass-isolated.sh

      - name: TOR references (every operational requirement keeps its enforcing instrument)
        run: bash scripts/check-tor-refs.sh

      - name: Optimization pass roster (#929 — every pass file and NanoPass name rowed per target in ARCHITECTURE.md)
        run: bash scripts/check-pass-roster.sh

      # #2186: the native walker renders ownership, it does not decide it.
      # Every move / clone / borrow / owned verdict is a pass's IR or
      # annotation; the walker may run no analysis walk, keep no fn-local
      # ownership set, and never decide on the text it just rendered.
      - name: Walker only reads annotations (#2186 — no analysis walk, no fn-local ownership set, no rendered-text sniffing in walker/)
        run: bash scripts/check-walker-reads-annotations.sh

      - name: Walker gate negative controls (#2186 — each ownership-decision shape turns the gate red)
        run: bash scripts/check-walker-reads-annotations-negative.sh

      # #2186: the declared pass edges are the WHOLE ordering truth. Under
      # three seeded random orders the edges permit, every spec/lang and
      # spec/wasm_cross program must emit byte-identical Rust.
      - name: Pass-order shuffle (#2186 — byte-identical Rust under every order the declared dependency edges permit)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-pass-shuffle.sh

      - name: Pass-order shuffle negative controls (#2186 — an order-dependent or panicking stand-in turns the gate red)
        run: bash scripts/check-pass-shuffle-negative.sh

      # #2231: the native ownership certifier re-derives every occurrence's
      # use from the final IR and checks the passes' verdicts; the corpus's
      # violations are a shrink-only ledger (proofs/ownership-certifier-baseline.txt).
      - name: Ownership certifier (#2231 — every corpus violation is in the shrink-only ledger, none new, none silently gone)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-ownership-certifier.sh

      - name: Ownership certifier negative controls (#2231 — a new violation, a vanished one, a panic and an empty corpus each turn the gate red)
        run: bash scripts/check-ownership-certifier-negative.sh

      - name: ALS element coverage (every syntax element rowed; UNWRITTEN shrink-only — the freeze precondition)
        run: bash scripts/check-als-element-coverage.sh

      - name: Scalar-read audit (every raw-load arm classified, zero unguarded — the #1183 class stays extinct)
        run: scripts/check-scalar-read-audit.sh

      - name: Abstain classification (every interp abstain classed; the executable-spec boundary never grows unclassified)
        run: scripts/check-abstain-classes.sh

      - name: libm determinism (every platform-libm call classified; a reachable undeclared one is the #1197 class)
        run: scripts/check-libm-determinism.sh

      - name: Keyed-container lookup-cost matrix (#1219 — every map/set repr rowed indexed or linear)
        run: bash scripts/check-keyed-container-index.sh

      - name: Embedded payload size ratchet (#878 — the stdlib every embedder downloads)
        run: scripts/check-embedded-size.sh

      - name: Stdlib semantics manifest (coverage + regen-diff, #521)
        run: ALMIDE_BIN=/tmp/almide-bin/almide scripts/check-semantics-manifest.sh

      - name: Stdlib doc indexes up to date (#1469 — every docs/stdlib page under the generator, regenerate and diff)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-stdlib-docs.sh

      - name: README counts derived, Hello, world bytes match the stamped baseline, no undated hand-written count
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/gen-readme-stats.sh --check && bash scripts/check-readme-numbers.sh

      - name: Mutation score block is the stamped record rendered (#2152 — the sweep workflow re-measures it)
        run: bash scripts/gen-mutation-score.sh --check

      # The two README-reading checks that otherwise live only in jobs a
      # docs-only change skips (tests/docs_gen_test.rs in Test Rust, the
      # build-speed render in Almide gates). This job always runs, so a README
      # edit cannot dodge them by being docs-only.
      - name: docs-gen --check (stdlib-count claim in README/SPEC/WASM-OUTPUT, llms.txt version and codes)
        run: /tmp/almide-bin/almide docs-gen --check

      - name: README build-speed block is fresh (#999 — render check, no measurement)
        # `almide run` builds the gates tool natively, so this step needs cargo.
        run: |
          rustup toolchain install stable --profile minimal >/dev/null 2>&1 || true
          /tmp/almide-bin/almide run tools/almide-gates/src/main.almd -- bench docs/benchmarks --check-readme

      - name: LLM-surface fences compile (#1483 — every \`\`\`almide check fence passes almide check)
        run: ALMIDE_BIN=/tmp/almide-bin/almide bash scripts/check-llm-surface.sh

      - name: Intrinsic boundary (#1468 — every @intrinsic target has a provider)
        run: bash scripts/check-intrinsic-boundary.sh

      - name: Runtime test placement (#2507 — a unit test under runtime/rs runs nowhere)
        run: bash scripts/check-runtime-test-placement.sh

      - name: _str twin ratchet (#1460 — the suffix bill is frozen while the protocol decision pends)
        run: bash scripts/check-str-twin-ratchet.sh
      - name: diagnostic-code coverage floor (attack-list A1-3)
        run: bash scripts/check-diagnostic-code-coverage.sh

      - name: Contract README up to date (regenerate and diff)
        run: |
          bash docs/contracts/generate-readme.sh > docs/contracts/README.md
          git diff --exit-code -- docs/contracts/README.md \
            || { echo "::error::docs/contracts/README.md is stale — run: bash docs/contracts/generate-readme.sh > docs/contracts/README.md"; exit 1; }

      # The same guard the contract index has had, for the roadmap index, which had
      # only the lefthook pre-commit hook. lefthook is an opt-in local install, so an
      # author who never ran `lefthook install` bypasses it silently — and did: the
      # committed index was found stale on 2026-09-12, missing nine rows. Two generated
      # indexes, one guarded twice and one guarded once, was an oversight rather than a
      # decision. The Almide twin's half of this comparison is the dogfood test
      # `the roadmap index rendering is byte-identical …` in the almide-gates job.
      - name: Roadmap README up to date (regenerate and diff)
        run: |
          bash docs/roadmap/generate-readme.sh > docs/roadmap/README.md
          git diff --exit-code -- docs/roadmap/README.md \
            || { echo "::error::docs/roadmap/README.md is stale — run: bash docs/roadmap/generate-readme.sh > docs/roadmap/README.md"; exit 1; }

      # The three gates below were written but never wired to a job. A gate that
      # has never run is indistinguishable from one that does not exist, so they
      # are attached here rather than left as scripts someone remembers to call.
      # Two things this step must supply that the others in this job do not:
      # `lark` (the gate's own parser — without it the script exits 1 with an
      # install hint rather than a verdict), and the binary under the name THIS
      # gate reads. It resolves `ALMIDE`, not the `ALMIDE_BIN` the rest of the
      # job passes, and `checks` never builds — it downloads the artifact — so
      # the default `target/release/almide` probe finds nothing.
      # The grammar gate's Earley pass over the ~1,500-file corpus was this
      # job's longest step (~5 min of ~6.5). Accepted verdicts are memoized
      # under a key of (grammar, lark version, gate script); the memo is
      # restored by prefix so a run inherits the newest memo for the same
      # grammar and re-parses only files whose bytes moved. Any change to the
      # key parses everything again — the memo is a memo of a pure function,
      # never a relaxation. Caches are branch-scoped: a PR reads develop's
      # memo, develop never reads a PR's.
      - name: Grammar-gate corpus memo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lark-gate-memo.json
          key: lark-gate-memo-${{ hashFiles('docs/grammar/almide.lark', 'scripts/lib/lark-gate.py') }}-${{ github.run_id }}
          restore-keys: lark-gate-memo-${{ hashFiles('docs/grammar/almide.lark', 'scripts/lib/lark-gate.py') }}-

      - name: Grammar stays in sync with the parser (#1365)
        env:
          ALMIDE: /tmp/almide-bin/almide
          LARK_GATE_CACHE: ${{ runner.temp }}/lark-gate-memo.json
        run: |
          python3 -m pip install --quiet lark
          bash scripts/check-lark-grammar.sh

      - name: Layout discipline for new long-lived structures (#1387 / #1316)
        run: bash scripts/check-layout-discipline.sh

  perf-ratchet:
    name: Perf ratchet (native/Rust ratio, #917)
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # rustc/cargo: the ratchet compiles the handwritten references and the
      # generated Rust of each benchmark with the same toolchain — STABLE,
      # not the MSRV pin: the ratios describe what users run, and the
      # baselines were historically recorded under the then-stable. (An
      # earlier version of this comment blamed rustc 1.94's optimizer for
      # idiom-ceiling reds; a probe on the runner class showed those reds
      # were runner bimodality under-sampled at 3 runs — see the RUNS
      # comment in scripts/check-perf-ratio.sh. Toolchain choice was never
      # the cause.) Build and test jobs keep the 1.94 MSRV pin; this job's
      # claim is about the GENERATED CODE, not the compiler's build floor.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v8
        with:
          name: almide-linux
          path: /tmp/almide-bin

      - name: Setup
        run: chmod +x /tmp/almide-bin/almide

      # The idiom relation gates on callgrind instruction counts (wall time
      # is machine-state bimodal on this runner class — see the IDIOM_CEILING
      # comment in scripts/check-perf-ratio.sh).
      - name: valgrind (for the Ir idiom gate)
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind

      # wasmtime runs the WASM leg of two gates in this job: the spelling ratio
      # (#2098) and the strbuild idiom relation (#2310) inside the perf ratio
      # below — so it installs BEFORE the first of them, not between them.
      # Without it the strbuild step dies on `wasmtime not found`, which is how
      # the relation first went red on a PR that had nothing wrong with it.
      - name: Cache wasmtime tarball
        # The same cached, pinned tarball the test shards use (#2381): this
        # was the one job still downloading it uncached on every run, i.e.
        # the one job still exposed to the per-IP release rate limit.
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-linux.tar.xz
          key: wasmtime-v47.0.3-x86_64-linux
      - name: Install wasmtime (the wasm-leg gates)
        run: |
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Native runtime ratio vs handwritten Rust
        run: ALMIDE_BIN=/tmp/almide-bin/almide scripts/check-perf-ratio.sh

      # Edit-loop cost lives here rather than in `checks`: it needs the same
      # built binary and the same "measure, don't guess" runner as the ratio
      # above, and both are the perf tier (#1383 scale, #1396 per-phase).
      - name: Edit-loop cost stays scale-independent (#1383 / #1396)
        run: ALMIDE_BIN=/tmp/almide-bin/almide scripts/check-edit-loop-scale.sh

      # #2098: the cost of the spelling the DOCS recommend, against the
      # spelling they tell writers to avoid — one program, one leg, one
      # round-robin run, so the ratio cancels this runner the way the
      # native/Rust ratio above does. Its wasmtime is installed above.
      - name: The documented spelling's tax stays bounded (#2098)
        run: ALMIDE_BIN=/tmp/almide-bin/almide scripts/check-spelling-ratio.sh

  # ═══════════════════════════════════════════════
  # Full CI — cross-platform (PRs to main only)
  # ═══════════════════════════════════════════════

  build-cross:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: almide-macos
          - os: windows-latest
            artifact: almide-windows
    runs-on: ${{ matrix.os }}
    # A hung test must be a fast red, not a 6h grind (the trust-spine #921
    # lesson): the Windows leg sat 4h20m inside a single blocked lsp_test
    # before being cancelled by hand (#1008). Cold build + full workspace
    # tests fit well inside this.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Dependencies only (see the `build` job): rust-cache prunes the
      # workspace's own artifacts on save; develop writes, PRs read.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cross-platform-${{ matrix.os }}-${{ env.RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true

      - run: cargo build --release

      - name: Install wasmtime
        if: runner.os != 'Windows'
        run: |
          # Pinned + retried + VERIFIED, matching the Linux leg above. The previous
          # spelling — `curl https://wasmtime.dev/install.sh -sSf | bash && echo … >>
          # $GITHUB_PATH` — had two defects (#1036):
          #
          #   1. upstream's install.sh now resolves "latest" to the literal `{` (an
          #      unexpanded template) and requests a release that does not exist;
          #   2. `curl | bash` hides the installer's exit status behind the pipe, so the
          #      `&&` chain still ran and the STEP REPORTED SUCCESS while installing
          #      nothing. The failure surfaced 10 minutes later in the #983 tripwire
          #      instead of here.
          #
          # An install that cannot install must fail its own step. The trailing
          # `wasmtime --version` is what makes that true.
          VERSION=v47.0.3
          case "${{ runner.os }}" in
            macOS) ARCH_TRIPLE="aarch64-macos" ;;
            *)     ARCH_TRIPLE="x86_64-linux"  ;;
          esac
          TARBALL="wasmtime-${VERSION}-${ARCH_TRIPLE}.tar.xz"
          for i in 1 2 3 4 5; do
            curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
            echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
          done
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Install wasm-opt (binaryen)
        if: runner.os == 'macOS'
        # Without it wasm_opt_parity_test silently early-returned as a pass on
        # this leg (#983) — the same skip-as-pass hole test-rust closes by
        # installing binaryen.
        run: brew install binaryen && wasm-opt --version

      # These legs verify WHAT ONLY THIS PLATFORM CAN: the release binary
      # builds, and the OS-dependent surfaces work. The full `cargo test
      # --workspace` runs ONCE, on Linux (test-rust) — running it here too made
      # every release PR ~48m, gated entirely by this Windows leg (#1039).
      #
      # NARROWING EVIDENCE (#1039 step 2 — audited every failed release-PR CI
      # run in the preceding month before removing anything): the Windows
      # workspace run never caught a failure Linux did not (it is unarmed, so
      # the tool-gated wasm suites all skip there); the macOS workspace run
      # caught only (a) one failure duplicated by the same run's Linux leg and
      # (b) two tool_arming_tripwire failures — i.e. ITS OWN broken wasmtime
      # install (#1036). The unique platform catches came from elsewhere:
      # `Test Rust (windows)`'s spec run with the real binary (a Windows path
      # bug, os error 3, 2026-08-02) and the #1008 lsp_test Windows hang.
      # The kept set below is exactly those proven-valuable surfaces:
      #
      #   - tool_arming_tripwire_test: the leg stays honest about its own
      #     tools — a broken wasmtime/binaryen install FAILS here instead of
      #     letting the wasm suites skip-as-pass (#983's lesson, kept).
      #   - the wasm_runtime_* binaries (macOS, armed): the byte-compare
      #     harness on the other tool-bearing platform — cross-target
      #     equivalence is checked on a second OS, not just Linux. The three
      #     CORPUS gates run in `corpus-cross` below, one runner each: every
      #     corpus-gate binary builds its own fixture table (see
      #     tests/wasm_runtime_test_parts/corpus.rs), and three of those in a
      #     row outgrew this job's budget.
      #   - lsp_test + fix_test + diagnostic_harness_test: the path- and
      #     process-sensitive root suites (tmp dirs, binary spawning, path
      #     separators) — the classes behind #1008 and the os-error-3 catch.
      #
      # ALMIDE_EXPECT_TOOLS arms the tripwire on macOS; Windows is DELIBERATELY
      # unarmed (#983 decision — wasmtime is not installed there).
      - name: Cargo tests (platform-sensitive set)
        env:
          ALMIDE_EXPECT_TOOLS: ${{ runner.os == 'Windows' && '0' || '1' }}
        shell: bash
        run: |
          cargo test --test tool_arming_tripwire_test --test lsp_test --test fix_test --test diagnostic_harness_test
          if [ "${{ runner.os }}" != "Windows" ]; then
            cargo test --test wasm_runtime_inline --test wasm_runtime_interp_ledger --test wasm_runtime_fail_corpus
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/almide${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 1

  # The three corpus gates on macOS, one runner each — the placement the
  # corpus harness was split for (tests/wasm_runtime_test_parts/corpus.rs:
  # each gate binary builds its own fixture table so the Linux shard packer
  # can put each on its own runner). Run in a row inside build-cross they
  # needed ~100 minutes against its 60: the v0.63.0-rc1 release PR's macOS
  # leg was cancelled at the timeout twice (2026-09-18) with every finished
  # test passing — cross_target alone took 1,404 s, interp_ledger 582 s, and
  # interp_oracle and opt_parity never started. The leg had grown from 25
  # minutes (2026-09-01) through 50 (2026-09-07) as the corpus grew to 710
  # fixtures. Each job here is a release build, a test build and ONE corpus
  # table, inside the same 60-minute hang budget.
  corpus-cross:
    name: Corpus gate (macos-latest, ${{ matrix.gate }})
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        gate: [wasm_runtime_cross_target, wasm_runtime_opt_parity, wasm_runtime_interp_oracle]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cross-platform-macos-latest-${{ env.RUST_TOOLCHAIN }}
          save-if: false

      - run: cargo build --release

      - name: Install wasmtime
        run: |
          # The same pinned, verified install as build-cross (#1036).
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-aarch64-macos.tar.xz"
          for i in 1 2 3 4 5; do
            curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
            echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
          done
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Install wasm-opt (binaryen)
        run: brew install binaryen && wasm-opt --version

      # The tripwire rides along so a broken tool install fails THIS job
      # instead of letting its corpus gate skip as a pass (#983).
      - name: Cargo test (${{ matrix.gate }})
        env:
          ALMIDE_EXPECT_TOOLS: "1"
        run: cargo test --test tool_arming_tripwire_test --test ${{ matrix.gate }}

  test-rust-cross:
    name: Test Rust (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: build-cross
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: almide-macos
            binary: /tmp/almide-bin/almide
          - os: windows-latest
            artifact: almide-windows
            binary: almide-bin/almide.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.os == 'windows-latest' && 'almide-bin' || '/tmp/almide-bin' }}

      - name: Setup (Unix)
        if: matrix.os != 'windows-latest'
        run: chmod +x /tmp/almide-bin/almide

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Almide spec tests (Rust target)
        shell: bash
        run: |
          ALMIDE=${{ matrix.binary }}
          $ALMIDE test spec/ --target rust

  # ═══════════════════════════════════════════════
  # Post-merge — trigger playground deploy
  # ═══════════════════════════════════════════════

  trigger-playground:
    name: Trigger Playground Deploy
    # Gate the deploy on host-arch determinism: the playground runs the compiler
    # as wasm32, so a 32/64-bit codegen divergence must block deploy, not ship.
    needs: [test-rust, test-rust-solo, checks, wasm-host-determinism]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch playground deploy
        # --fail-with-body: without it an expired PLAYGROUND_DISPATCH_TOKEN
        # 401s, curl exits 0, and the playground silently stops updating
        # (#984). Every other curl in this repo already uses -f for the same
        # reason.
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PLAYGROUND_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/almide/playground/dispatches \
            -d '{"event_type":"compiler-updated"}'

  # ── Commissioned wasm leg (Stage 2, 2026-08-26) ─────────────────────────
  # The structural emitter and its greenfield gate fleet, in release shape
  # (V-1: assertions live in the shipped-shape build). Debug shards skip
  # these suites (cfg_attr debug ignore), so this job is their ONLY runner.
  # ═══════════════════════════════════════════════
  # Commissioned wasm gates — three jobs, not one (#2381 item 3)
  # ═══════════════════════════════════════════════
  #
  # One job used to run five steps strictly in sequence, 27.8 min on every
  # develop run (35569545602): release compile + carried gates 679 s →
  # release-only root tests 436 s → double-free sweep 76 s →
  # target-availability matrix 426 s → runtime ratio 25 s. The steps share
  # nothing but the release target dir, so they fan out as A+C / B / D+E with
  # every command byte-for-byte: wall = max(A+C ≈ 13.5, B ≈ 8.5, D+E ≈ 8.5)
  # ≈ 13.5 min, for ~8 more runner minutes per run (B pays its own root-crate
  # release compile, which used to ride A's). The step names and verdict text
  # are unchanged on purpose: scripts/check-release-only-tests.sh greps this
  # file for `--test <target>` and `cargo test --release --locked -p
  # almide-wasm`, and proofs/gate-verification.toml `wired_by` rows name this
  # file. The setup block is the same in all three (stock wasmtime v27 pin —
  # the WASI gate's third-party runtime, see scripts/check-wasi-pins.sh; the
  # v47 pin elsewhere is the embedded host's, and the two are not the same
  # instrument, so they are not unified here).
  commissioned-wasm-gates:
    name: Commissioned wasm gates (structural leg, release)
    # `build` too (#2381): the probe jobs below drive the almide CLI, which
    # this job used to build for itself a second time (`cargo build
    # --release --locked --bin almide`, 426–432 s on every develop run) — the
    # `build` job already ships that binary as `almide-linux`, and every
    # other CLI-driven gate (Almide gates, Emit & Format, Perf ratchet)
    # consumes it. The release test builds stay: those are the gates' own
    # shape, not the CLI's.
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # 679 + 76 s measured plus setup; 1.4–1.9× under runner contention.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: almide-linux
          path: /tmp/almide-bin
      - name: Setup the built compiler
        run: chmod +x /tmp/almide-bin/almide
      - name: Cache stock WASI runtime
        uses: actions/cache@v6
        with:
          path: /tmp/wasmtime.tar.xz
          key: wasmtime-v27.0.0-x86_64-linux
      - name: Install wasmtime (stock CLI — the WASI gate's third-party runtime)
        run: |
          set -euo pipefail
          VERSION=v27.0.0
          TARBALL=/tmp/wasmtime.tar.xz
          if ! tar -tf "$TARBALL" >/dev/null 2>&1; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/wasmtime-${VERSION}-x86_64-linux.tar.xz" \
              --output "$TARBALL"
          fi
          tar -xf "$TARBALL" -C /tmp
          sudo install -m 755 "/tmp/wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      - name: Carried gates in release shape
        run: cargo test --release --locked -p almide-wasm -p almide-wasm-run -p almide-spine -p almide-syntax -p almide-corpus -p almide-layout
      # #2141: the stdlib-LINKING size ladder (crates/almide-wasm/tests/
      # size_ladder.rs, golden/size-ladder.txt) already ran inside the step
      # above; this run prints its table — rung / program / shipped / pinned
      # / delta — into the log on every push, so a reader sees which rung
      # grew without a diff. The manifest-wide size_ratchet pins 700 programs
      # that link almost nothing; the ladder pins the Map / String / JSON /
      # regex programs where the size story is actually decided.
      - name: Stdlib-linking wasm size ladder (#2141 — a shrink-only ceiling per rung, the table in the log)
        run: cargo test --release --locked -p almide-wasm --test size_ladder -- --nocapture
      # #2010 stage 2b: under the double-free trap a second release of a
      # freed block traps instead of wrapping to 0xFFFF_FFFF — the corpus
      # and the gauntlet must hold under it (five fixtures only showed
      # their dangling reads with it armed, 2026-09-08). Rides the compile
      # above (76 s), so it stays in this job.
      - name: Double-free trap sweep (corpus burn-up + gauntlet)
        run: ALMIDE_RC_TRAP_DOUBLE_FREE=1 cargo test --release --locked -p almide-wasm --test backend_parity --test gauntlet

  commissioned-wasm-gates-root:
    name: Commissioned wasm gates (release-only root tests)
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # 436 s measured when it rode the carried-gates compile; it now pays the
    # root crate's release compile itself (rust-cache restores the deps).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: almide-linux
          path: /tmp/almide-bin
      - name: Setup the built compiler
        run: chmod +x /tmp/almide-bin/almide
      - name: Cache stock WASI runtime
        uses: actions/cache@v6
        with:
          path: /tmp/wasmtime.tar.xz
          key: wasmtime-v27.0.0-x86_64-linux
      - name: Install wasmtime (stock CLI — the WASI gate's third-party runtime)
        run: |
          set -euo pipefail
          VERSION=v27.0.0
          TARBALL=/tmp/wasmtime.tar.xz
          if ! tar -tf "$TARBALL" >/dev/null 2>&1; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/wasmtime-${VERSION}-x86_64-linux.tar.xz" \
              --output "$TARBALL"
          fi
          tar -xf "$TARBALL" -C /tmp
          sudo install -m 755 "/tmp/wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      # #2122: the ROOT package's release-only tests. A test marked
      # `cfg_attr(debug_assertions, ignore)` is skipped by every shard (the
      # ci-test profile inherits dev), so without this step it runs in NO
      # job — which is how the native⇄embedded cross net sat broken and
      # unreported. scripts/check-release-only-tests.sh keeps this list
      # honest; the wasm crate's seven ride the carried-gates step above.
      - name: Release-only root tests (the shards skip these by profile)
        run: cargo test --release --locked --test embedded_cross_test --test http_serve_cross_test --test module_type_repr_test --test wasm_vm_parity_test --test wasm_route_parity_test

  commissioned-wasm-gates-probes:
    name: Commissioned wasm gates (target availability + runtime ratio)
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # 426 + 25 s measured; the two probes drive the downloaded binary and
    # never compile the workspace (the toolchain is for `almide run`'s
    # native target, which invokes rustc).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: almide-linux
          path: /tmp/almide-bin
      - name: Setup the built compiler
        run: chmod +x /tmp/almide-bin/almide
      - name: Cache stock WASI runtime
        uses: actions/cache@v6
        with:
          path: /tmp/wasmtime.tar.xz
          key: wasmtime-v27.0.0-x86_64-linux
      - name: Install wasmtime (stock CLI — the WASI gate's third-party runtime)
        run: |
          set -euo pipefail
          VERSION=v27.0.0
          TARBALL=/tmp/wasmtime.tar.xz
          if ! tar -tf "$TARBALL" >/dev/null 2>&1; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/wasmtime-${VERSION}-x86_64-linux.tar.xz" \
              --output "$TARBALL"
          fi
          tar -xf "$TARBALL" -C /tmp
          sudo install -m 755 "/tmp/wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      - name: Target-availability matrix (#1423 — declared == measured, both directions)
        run: ALMIDE=/tmp/almide-bin/almide bash scripts/check-target-availability.sh
      # #1701: the wasm runtime ratchet. The stamped wasm/native ratio does
      # NOT cancel this runner (cross-engine — see the script header), so it
      # prints for information; the verdict CI acts on is the same-runner
      # A/B (#2143): this tree's wasm leg against the latest release's, both
      # binaries benched here, interleaved twice, min-of-runs, band from the
      # ledger's `ab_band`. The non-measured ledger rows are re-measured
      # too — a cell that starts benching fails with the good news until its
      # row is promoted to `measured`. A failed baseline download fails the
      # step: a gate that quietly degrades to informational is the hole
      # #2143 closed, so the script refuses to run on CI without a baseline.
      - name: Fetch the latest release binary (the wasm A/B baseline, #2143)
        run: |
          set -euo pipefail
          mkdir -p /tmp/almide-baseline
          for i in 1 2 3 4 5; do
            curl -fsSL "https://github.com/almide/almide/releases/latest/download/almide-linux-x86_64.tar.gz" -o /tmp/almide-baseline/almide.tar.gz && break
            echo "baseline download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f /tmp/almide-baseline/almide.tar.gz
          done
          tar xzf /tmp/almide-baseline/almide.tar.gz -C /tmp/almide-baseline --strip-components=1
          chmod +x /tmp/almide-baseline/almide
          /tmp/almide-baseline/almide --version
      - name: Wasm runtime ratchet (#1701) — same-runner A/B verdict (#2143)
        run: ALMIDE_BIN=/tmp/almide-bin/almide WASM_RUNTIME_BASELINE_BIN=/tmp/almide-baseline/almide bash scripts/check-wasm-runtime-ratio.sh

  # Aviation discipline as CI (adopted from the greenfield burn, where
  # codopsy slipped to B twice and only a human check-in caught it):
  # the commissioned crates hold A (>= 90) forever, and the 800-line file
  # discipline is the cheap proxy for the measured primary slippage driver.
  commissioned-aviation-quality:
    name: Commissioned aviation quality (codopsy A + file discipline)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # #2381: the analyzer was cloned and built from source on every run
      # (400–437 s, the whole job) although its input — codopsy's HEAD —
      # moves rarely. The built binary is cached under that HEAD's sha, so a
      # run pays the build only when the analyzer itself changed; a stale
      # binary cannot be served because the key IS the source revision.
      - name: Resolve the analyzer revision
        id: codopsy-rev
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/O6lvl4/codopsy HEAD | cut -f1)"
          [ -n "$sha" ] || { echo "::error::could not resolve codopsy HEAD"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Cache the built analyzer
        id: codopsy-cache
        uses: actions/cache@v6
        with:
          path: /tmp/codopsy-bin/codopsy
          key: codopsy-bin-${{ runner.os }}-${{ steps.codopsy-rev.outputs.sha }}
      - name: build codopsy
        if: steps.codopsy-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/O6lvl4/codopsy /tmp/codopsy
          cargo build --release --manifest-path /tmp/codopsy/Cargo.toml
          mkdir -p /tmp/codopsy-bin && cp /tmp/codopsy/target/release/codopsy /tmp/codopsy-bin/codopsy
      - name: score must be A (>= 90)
        run: |
          chmod +x /tmp/codopsy-bin/codopsy
          cp .codopsyrc.json crates/almide-wasm/ 2>/dev/null || true
          /tmp/codopsy-bin/codopsy analyze crates/almide-wasm 2>&1 | tee /tmp/codopsy.out
          sed 's/\x1b\[[0-9;]*m//g' /tmp/codopsy.out | grep -E "Quality Score:" | grep -qE "\((9[0-9]|100)/100\)" || { echo "::error::codopsy below A"; exit 1; }
          # #2152: the independent certificate verifier is held to A too.
          cp .codopsyrc.json crates/almide-verify/ 2>/dev/null || true
          /tmp/codopsy-bin/codopsy analyze crates/almide-verify 2>&1 | tee /tmp/codopsy-verify.out
          sed 's/\x1b\[[0-9;]*m//g' /tmp/codopsy-verify.out | grep -E "Quality Score:" | grep -qE "\((9[0-9]|100)/100\)" || { echo "::error::codopsy below A (crates/almide-verify)"; exit 1; }
      - name: file discipline (800-line cap over the commissioned backend)
        run: bash scripts/check-file-discipline.sh

  # V-6: verification of the verifier as a STANDING gate. Every pre-authored
  # mutant in ci/mutations/ must be CAUGHT by the release-shape net; a
  # surviving mutant or a no-longer-applying patch is red (refresh, never
  # retire).
  #
  # #1619: PR runs are INCREMENTAL — only mutants whose patched files (or
  # patch file, or the shared killer infrastructure) intersect the PR's
  # change set run, so most PRs finish in seconds instead of ~45 min. The
  # FULL 40-mutant sweep lives in mutation-sweep.yml (develop pushes in an
  # uncancelable concurrency group + nightly), where it actually completes —
  # under ci.yml's cancel-in-progress group the develop sweep was routinely
  # canceled mid-run, which is standing evidence that never lands. Push
  # events therefore skip this job entirely (skipped = success for the
  # required-check, and the sweep workflow owns the push-side evidence).
  commissioned-mutation-gate:
    name: Commissioned mutation gate (the net keeps its teeth)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The incremental scope diffs against the PR base ref.
          fetch-depth: 0
      # #2381: this job runs on pull_request only, so the default per-job
      # rust-cache key was written by no develop run and every PR started
      # cold ("No cache found" on the v0.63.0-rc3 PR: 7m08s to the first
      # verdict against ~80 s per mutant after it). The build job's
      # dependency cache is the same lockfile under the same pinned
      # toolchain, so read that one — dependency artifacts only, never the
      # workspace's — and write nothing back.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: in-scope mutants must be caught (full sweep lives in mutation-sweep.yml)
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          ALMIDE_MUTATION_SCOPE=incremental \
          ALMIDE_MUTATION_BASE="origin/${{ github.base_ref }}" \
            bash scripts/check-mutation-gate.sh
