# Throwaway bisect workflow for #4579 (branch probe-4579-bisect only; never merged).
name: probe-4579-bisect
on:
  push:
    branches: [probe-4579-bisect]
permissions: read-all
jobs:
  at:
    name: at ${{ matrix.sha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sha: ['5059b4cdeea89361931b2b614fa9acae6bdb1483', 'b83f513a8fd9d7cff1817e4cb311fdfe5b9cfcf9', '6ef073faea6d700a1b28a73ce482ee97995c49b1', '56a3d0f9043beecb578c0dcdb4b679fad274d69d', 'b57f8e8f50a60337f26c05d1a0edc679baecd79d', '1867eb4628b60061801093f3847fbe3ce4161be6', '9c8bc3909d3b7c71b886df84aac29538a568aebb', 'affc2e968ce1012a87048e8dc60640ebed9230fb', '54150c5f2bdc7647118c40debcbd1baa09e17019', '74f50133d2caa3e4d952e9401a58ce9c492abe7f', '2c8f0aeea0068c0e839528d4eff9c3f49964523b', '235b7dff756ee04ab75459d96c3e0b2a543db5ad', '7dc40a47ce77b3f98e9e3aac5f10f714b1bf26bc', '46f7e9ec944796888581cac1b5cb317b79ff4aaa', '1660586095b4d3c3d8ea1753ca5d1a01a5e90fbd', '409d9b8f1d848f731c748913f58faf8f07eb6090', '070db35e751d7aa2436e6df55937eb18aee9640d', '0bacbfc5a0f010acaa953a33522dd55d97ba80e2', 'ed2cc1539e6f700679e32f02167cd67b764f332b', 'c01f6bf229da12b631f954f47ba86d0e756bf9ad']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: src
      - name: toolchain
        run: |
          tc=$(grep -m1 -oE 'RUST_TOOLCHAIN: "[0-9.]+"' src/.github/workflows/ci.yml | grep -oE '[0-9.]+')
          echo "TC=$tc" >> "$GITHUB_ENV"; echo "toolchain $tc"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.TC }}
      - run: cargo build --release --bin almide
        working-directory: src
      - name: probe
        run: |
          git -C src log -1 --format='%h %ci %s'
          ALMIDE_WALL_REASON=1 src/target/release/almide test probe/.github/probe-4579/c_lex_greatest.almd --target wasm 2>&1 | grep -E 'rendered|declin|Unsupported|wall|passed|failed' | cut -c1-300 | head -8
