# Throwaway bisect workflow for #4579 (branch probe-4579-bisect only; never merged).
name: probe-4579-bisect
on:
  push:
    branches: [probe-4579-bisect]
permissions: read-all
jobs:
  at:
    name: at ${{ matrix.sha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sha: ['51017ff785533ca501be5e3633d21cc24f6aa2fc', '2001eb78154624389dd8319ffadfddffcdff1629', 'e4fcced1104fa8c6d9a5ef45bad91b707b864caa', '437b8f12762d8630af044a6e3ab9f79aaf100f6d', '3201c20439f39a5bf2502f15bd465c21916c9422', 'd5b0125b3177de8b047aab60b2b3c445509a31d7', '0937771c58d3557eebe818cf7a3de139a2de7d21', '703bbf29806a8723c3c09882195e87afc90b66aa', 'b19d88caa2d90ed81cc4484f84480e03edf69084', '7deba3f059578818c7bcc495160137bc03f50ffa', '3007c3fa5fc59b4fda6c1cc90d7eebbb326ac6b8', 'fc570039da09220b69bc1a6de598131f31f32ac7', 'd4cb244d58ab34fb2da0f293f8af77079c40143f', '1141d4d9d72f9f0520c0b7f88bf7065a6929f996', '5c44b58d8745a56e614e45fc664a625bb9f268c4', 'b7305c9e7d8cced45c1960cd1d8affcbf2af01df', '365ab6f661a01d97ecb58b075b93352c917dacba', '6607fbec3eda99cb61492a7e37ac3bfc59b3f62f', '4a79e3fb45fab5b8762335b750cf85c7411c4433', 'df57d75cb158675786e7b965b9c74d605292dc8e']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: src
      - name: toolchain
        run: |
          tc=$(grep -m1 -oE 'RUST_TOOLCHAIN: "[0-9.]+"' src/.github/workflows/ci.yml | grep -oE '[0-9.]+')
          echo "TC=$tc" >> "$GITHUB_ENV"; echo "toolchain $tc"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.TC }}
      - run: cargo build --release --bin almide
        working-directory: src
      - name: probe
        run: |
          git -C src log -1 --format='%h %ci %s'
          ALMIDE_WALL_REASON=1 src/target/release/almide test probe/.github/probe-4579/c_lex_greatest.almd --target wasm 2>&1 | grep -E 'rendered|declin|Unsupported|wall|passed|failed' | cut -c1-300 | head -8
