# Throwaway bisect workflow for #4579 (branch probe-4579-bisect only; never merged).
name: probe-4579-bisect
on:
  push:
    branches: [probe-4579-bisect]
permissions: read-all
jobs:
  at:
    name: at ${{ matrix.sha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sha: ['9b7060e4d4676269449859412e59487d048f1881', '314074f841e611f370223f80de734c4f212fc9d6', 'a0f30dc883030589bafe0974e9af015be8f74c3b', 'ab48c53111504b54a212a99b5fb7e870a9f0ec72', '97ec7f69116b9b306423d7c469b0c63eddbefa06', 'cf74d7d908fc466a1bb9de1de128f38316391ac7', '52b48ded82fcb955ff2b91ae2008e4a7e7d60a69', '3751cec98ba5ccbbe2a7ba965943b35ef2992d9a', '6e77f742b0d80c5beed691e671661bf77a46a19d', '3added0328cec4be71767d112453e79fba8c35db', '5bc4fe5b23a451ae3f7d4086eeffd859111f275d', '2634ec39b0098c56d5311144ed8b9e1aae1b0091', '1a8cade6cea4f2330430b0ea61df0b3ad91a5b98']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: src
      - name: toolchain
        run: |
          tc=$(grep -m1 -oE 'RUST_TOOLCHAIN: "[0-9.]+"' src/.github/workflows/ci.yml | grep -oE '[0-9.]+')
          echo "TC=$tc" >> "$GITHUB_ENV"; echo "toolchain $tc"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.TC }}
      - run: cargo build --release --bin almide
        working-directory: src
      - name: probe
        run: |
          git -C src log -1 --format='%h %ci %s'
          ALMIDE_WALL_REASON=1 src/target/release/almide test probe/.github/probe-4579/c_lex_greatest.almd --target wasm 2>&1 | grep -E 'rendered|declin|Unsupported|wall|passed|failed' | cut -c1-300 | head -8
