name: Conformance mutations (nightly)

# Mutation gate for the kernel-conformance harness (Survey 4 law 1, the roc
# lambda_mono_mutation_check pattern): apply each seeded emit bug in
# proofs/conformance-mutations/, and the 48-program corpus runner must FAIL
# under every one of them. A surviving mutant means the corpus is not
# actually protecting that emit path. Five full compiler rebuilds — nightly
# and manual dispatch only, deliberately kept out of the PR/push CI.

on:
  schedule:
    # 04:30 UTC daily — clear of the 03:00 fuzz night and the push/PR windows.
    - cron: "30 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"  # runner-class MSRV: the almide binary embeds wasmtime 49 (commissioned host); compiler crates keep the 1.89 claim per-crate

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
permissions: read-all

jobs:
  mutation-gate:
    name: 5 seeded emit bugs must all be caught
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # The gate builds under its OWN target dir (target/mutations, #1845)
        # so a mutant binary can never outlive it; that dir is what is worth
        # caching here, and the key carries the dir name so the cache saved
        # under the old shared-target layout is not restored in its place.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mutations
          key: mutation-gate-target-mutations-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache wasmtime tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasmtime-v49.0.1-x86_64-linux.tar.xz
          key: wasmtime-v49.0.1-x86_64-linux

      - name: Install wasmtime
        # Pinned + cached + retried, same pattern as fuzz-nightly.yml. The
        # gate REFUSES to run without a wasm runtime (the wasm-leg mutant m5,
        # seeded into the structural emitter, would survive for the wrong
        # reason).
        run: |
          VERSION=v49.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Run the mutation gate
        run: bash scripts/check-conformance-mutations.sh
