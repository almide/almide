name: Cross-Target CI

# Runs spec/ on both Rust and WASM targets, reports mismatches.
#
# No `paths-ignore`: a workflow filtered out by a path filter leaves its checks
# in the Expected state forever on a PR that touches only the ignored paths
# (see the `changes` job in ci.yml for the GitHub-docs citation), and the two
# `proofs/` steps below are gates that must produce a verdict on every ref.
# `pull_request` so a fix to this very workflow is visible green before it
# merges; `merge_group` so the queue runs the same gates before develop moves.

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:

# Cancel superseded runs on the same ref so a burst of pushes doesn't fire N
# concurrent runs that all re-download tools and trip the per-IP rate limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.0"  # runner-class MSRV: the almide binary embeds wasmtime 47 (commissioned host); compiler crates keep the 1.89 claim per-crate
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

jobs:
  cross-target:
    if: github.server_url == 'https://github.com'
    name: Cross-Target (Rust vs WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Dependencies only (see ci.yml `build`): rust-cache prunes the
      # workspace's own artifacts on save; develop writes, PRs read.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-target-${{ env.RUST_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release

      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-linux.tar.xz
          key: wasmtime-v47.0.3-x86_64-linux
      - name: Install wasmtime
        run: |
          # Pinned + cached + retried. On a cache hit the tarball is already here,
          # so the per-IP-rate-limited release download runs at most once per key.
          # `-f` turns a 403 rate-limit body into a retry instead of a 92-byte
          # "not a tar archive". Bump VERSION and the cache key together.
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5; do
              curl -fLO "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" && break
              echo "wasmtime download failed (rate-limit?), retry ${i}/5"; sleep 15; rm -f "$TARBALL"
            done
          fi
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version

      - name: Cross-target spec (Rust vs WASM)
        run: |
          # Per file, the two lanes must reach the SAME EXIT CODE — not merely the
          # same pass/fail bit. `almide test` has three verdicts (0 pass, 1 fail,
          # 5 nothing to run — docs/specs/cli.md), and a 5/5 on a generated stub
          # with no test block is agreement, not a "Rust FAIL (WASM OK)" (#2204:
          # the boolean form read exactly that split as a mismatch on 22 runs).
          ALMIDE=./target/release/almide
          rust_pass=0; wasm_pass=0; rust_fail=0; wasm_fail=0; agree=0; both_pass=0; empty=0; errors=""

          for f in $(find spec/ -name '*_test.almd' -type f | sort); do
            # Skip files marked with wasm:skip
            if head -3 "$f" | grep -q 'wasm:skip'; then continue; fi

            # `|| code=$?`, not `; code=$?`: the step shell is `bash -e`, and a
            # bare non-zero command (the first exit 5) would end the whole loop.
            rust_code=0; $ALMIDE test "$f" > /dev/null 2>&1 || rust_code=$?
            wasm_code=0; $ALMIDE test "$f" --target wasm > /dev/null 2>&1 || wasm_code=$?

            if [ "$rust_code" -eq 0 ]; then rust_pass=$((rust_pass + 1)); else rust_fail=$((rust_fail + 1)); fi
            if [ "$wasm_code" -eq 0 ]; then wasm_pass=$((wasm_pass + 1)); else wasm_fail=$((wasm_fail + 1)); fi

            if [ "$rust_code" -ne "$wasm_code" ]; then
              errors="$errors\n  Rust exit $rust_code / WASM exit $wasm_code: $f"
            else
              agree=$((agree + 1))
              if [ "$rust_code" -eq 0 ]; then both_pass=$((both_pass + 1)); fi
              if [ "$rust_code" -eq 5 ]; then empty=$((empty + 1)); fi
            fi
          done

          total=$(find spec/ -name '*_test.almd' -type f | wc -l)
          echo ""
          echo "=== Cross-Target Results ==="
          echo "Rust:  $rust_pass pass / $rust_fail fail"
          echo "WASM:  $wasm_pass pass / $wasm_fail fail"
          echo "Agree: $agree / $total (both pass $both_pass, both empty $empty)"

          if [ -n "$errors" ]; then
            echo -e "\nMismatches (exit codes differ):$errors"
            echo "::error::Cross-target mismatches found — see above"
            exit 1
          fi

          echo "::notice::Cross-target: Rust $rust_pass, WASM $wasm_pass, agree $agree / $total (both pass $both_pass, both empty $empty)"

      - name: v1 trust-spine differential fuzz (render_program v0==v1)
        run: |
          # PER-PR generative byte-match of the V1 TRUST-SPINE path (render_program -> wasm). The
          # cross-target step above compares the two `almide test` lanes' VERDICTS per file, not
          # the bytes either lane produced, and the
          # nightly xtarget-fuzz emits only `let`-bound expressions — so the imperative
          # `var v = w; … v = …` shape had NO per-PR gate, which is how the scalar-aliasing miscompile
          # shipped. This synthesizes that class (var reassignment, loops, accumulators, the sha1
          # rotation) PLUS the COMPARISON matrix (==/!=/</<=/>/>= over Int/String/Bool/Float + lists,
          # in if-condition AND value position — the class that shipped the handle-compare / both-arms
          # silent miscompiles) and byte-diffs v0 native vs v1 wasm. N is high enough that every
          # template (now 11) is exercised each run. Any divergence fails the build.
          bash proofs/diff-fuzz.sh 150

      - name: v1 trust-spine output parity (fixtures, ratcheting baseline)
        run: |
          # FIXTURE byte-match of the V1 trust spine over spec/ (recursive), gated against a
          # ratcheting baseline (proofs/output-parity-baseline.txt) that can only GROW. The
          # generative fuzz above catches NEW shapes; this catches a REGRESSION in any shape a
          # committed fixture pins. The corpus-wall proves v1's SOUNDNESS properties but never
          # compares stdout — this is the output-correctness leg. Under CI a missing tool is a
          # hard failure (#978: the PATH-lookup skip made this gate a no-op on every run it ever
          # had); the oracle resolves to ./target/release/almide built above.
          bash proofs/output-parity.sh
