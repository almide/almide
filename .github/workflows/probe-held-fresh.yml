name: Probe — the fresh-block rule on a held-out sample of source mutants
# A one-off measurement on its own branch. A sample of source mutants of the
# wasm emitter was drawn and judged on another branch, which kept the modules
# each mutant changed. This job emits the unmutated modules again from that
# branch's tree, cuts the fresh-block proposals out of both with this branch's
# cutter, and has the Rocq kernel judge each one (proofs/GuardFresh.v). The
# rule and the cutter were fixed before that sample's results were read.
# Not a gate.
on:
  push:
    branches: [probe/rules-on-replays-2]

permissions:
  contents: read
  actions: read

env:
  # The sample run kept the modules of the mutants that change at most a
  # hundred programs (45536243441, judged first); this run judged the other
  # thirty-six again and kept every changed module.
  # The runs that built five replayed bound-test defects, each with and
  # without its defect.
  REPLAYS: >-
    45676377343:1786-closure-call-borrowed-arg.record-dropped
    45676377343:1786-closure-call-borrowed-arg.record-kept
    45676377343:2613-cell-occupant-stored-without-share
    45677866679:2613-cell-occupant-stored-without-share.record-dropped
    45676377343:4476-call-rebinds-global-read-earlier

jobs:
  fresh:
    name: Fresh-block proposals of the mutants' modules (${{ matrix.sample }})
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The tree each sample was drawn over, and the run that kept every
        # module its mutants changed.
        include:
          - sample: s1
            held_ref: probe/emitter-s1-modules
            held_run: "45578876545"
          - sample: s2
            held_ref: probe/emitter-s2-modules
            held_run: "45578884578"
    env:
      HELD_REF: ${{ matrix.held_ref }}
      HELD_RUN: ${{ matrix.held_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.held_ref }}
          path: held
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: |
            .
            held
          prefix-key: "trust-spine"
      - name: Restore opam root (OCaml + Rocq)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-ocaml5.4.1-rocq9.3.0-v1-a04b045f1534714416da6b4f8e8e67d2defbb750
      - name: Rocq on PATH
        run: |
          BIN="$HOME/.opam/5.4.1/bin"
          ls "$BIN" | grep -E '^(rocq|coqc)$' || { echo "no Rocq in the restored opam root" >&2; exit 1; }
          if [ ! -x "$BIN/coqc" ]; then printf '#!/bin/sh\nexec rocq compile "$@"\n' > "$BIN/coqc"; chmod +x "$BIN/coqc"; fi
          echo "$BIN" >> "$GITHUB_PATH"
      - name: Build the cutter
        run: cargo build -q --release --locked -p almide-anchor-check
      - name: Build the unmutated compiler and the witness producer
        working-directory: held
        run: |
          cargo build -q --release --locked --bin almide
          cargo build -q --release --locked -p almide-wasm --example emit_structural_bundle
          ./target/release/almide --version
      - name: Fetch the modules the sample kept
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$HELD_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha --jq '"the sample run: \(.status) \(.conclusion) at \(.headSha)"'
          mkdir -p "$RUNNER_TEMP/shards"
          # While the sample is still running there is nothing to fetch: the
          # unmutated modules are then judged alone (a trial of this job).
          gh run download "$HELD_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'emitter-mutants-[0-9]*' --dir "$RUNNER_TEMP/shards" || echo "no shard artifact could be fetched"
          echo "$(find "$RUNNER_TEMP/shards" -type f -path '*/emut/modules/*/*.wasm' | wc -l) kept module(s) in $(ls "$RUNNER_TEMP/shards" | wc -l) shard(s)"
      - name: Measure
        run: bash scripts/probe-held-fresh.sh target/release/almide-anchor-check held "$RUNNER_TEMP/shards" "$RUNNER_TEMP/held-fresh"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: held-fresh-${{ matrix.sample }}
          path: |
            ${{ runner.temp }}/held-fresh/held-fresh.tsv
            ${{ runner.temp }}/held-fresh/held-fresh-programs.tsv
            ${{ runner.temp }}/held-fresh/held-located.tsv
            ${{ runner.temp }}/held-fresh/kernel-uniq/costly.txt
            ${{ runner.temp }}/held-fresh/jobs.tsv
            ${{ runner.temp }}/held-fresh/base-failed
            ${{ runner.temp }}/held-fresh/kernel.log
            ${{ runner.temp }}/held-fresh/kernel/verdicts.tsv
            ${{ runner.temp }}/held-fresh/uniq-dump
            ${{ runner.temp }}/held-fresh/held-loop.tsv
            ${{ runner.temp }}/held-fresh/held-loop-programs.tsv
            ${{ runner.temp }}/held-fresh/held-windows.tsv
            ${{ runner.temp }}/held-fresh/held-windows-programs.tsv
            ${{ runner.temp }}/held-fresh/win-kernel.log
            ${{ runner.temp }}/held-fresh/win-kernel/verdicts.tsv
            ${{ runner.temp }}/held-fresh/win-uniq-dump
            ${{ runner.temp }}/held-fresh/loop-kernel.log
            ${{ runner.temp }}/held-fresh/loop-kernel/verdicts.tsv

  replays:
    name: The three rules on the replayed defects
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: |
            .
            held
          prefix-key: "trust-spine"
      - name: Restore opam root (OCaml + Rocq)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-ocaml5.4.1-rocq9.3.0-v1-a04b045f1534714416da6b4f8e8e67d2defbb750
      - name: Rocq on PATH
        run: |
          BIN="$HOME/.opam/5.4.1/bin"
          ls "$BIN" | grep -E '^(rocq|coqc)$' || { echo "no Rocq in the restored opam root" >&2; exit 1; }
          if [ ! -x "$BIN/coqc" ]; then printf '#!/bin/sh\nexec rocq compile "$@"\n' > "$BIN/coqc"; chmod +x "$BIN/coqc"; fi
          echo "$BIN" >> "$GITHUB_PATH"
      - name: Build the cutter
        run: cargo build -q --release --locked -p almide-anchor-check
      - name: Fetch the replayed defects' builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in $REPLAYS; do
            run="${pair%%:*}"
            name="${pair#*:}"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" -n "replay-$name" --dir "$RUNNER_TEMP/replays/replay-$name"
          done
          mkdir -p "$RUNNER_TEMP/rbase" "$RUNNER_TEMP/rshards/replay/emut/modules/bug"
          for d in "$RUNNER_TEMP"/replays/*/*.base; do
            n="$(basename "$d" .base)"
            b="$(dirname "$d")/$n.bug"
            [ -s "$d/a.anchors.wasm" ] && [ -s "$d/a.anchors" ] && [ -s "$b/a.anchors.wasm" ] || { echo "incomplete: $n"; continue; }
            cp "$d/a.anchors.wasm" "$RUNNER_TEMP/rbase/$n.wasm"
            cp "$d/a.anchors" "$RUNNER_TEMP/rbase/$n.anchors"
            cp "$b/a.anchors.wasm" "$RUNNER_TEMP/rshards/replay/emut/modules/bug/$n.wasm"
            # The module with the defect again, as its own base: judged with ITS
            # anchor file, so that its allocator is the one its own anchors name
            # (the defect's patch can renumber what the allocator calls, and
            # then no function of it equals the unpatched allocator byte for byte).
            if [ -s "$b/a.anchors" ]; then
              cp "$b/a.anchors.wasm" "$RUNNER_TEMP/rbase/$n+own.wasm"
              cp "$b/a.anchors" "$RUNNER_TEMP/rbase/$n+own.anchors"
              cp "$b/a.anchors.wasm" "$RUNNER_TEMP/rshards/replay/emut/modules/bug/$n+own.wasm"
            fi
          done
          # The programs written for surviving mutants of the first two samples:
          # each compiler's module and anchor file for every program, as the
          # two runs that asked the static checkers kept them.
          for pair in s1:45673801224 s2:45540870071; do
            s="${pair%%:*}"
            gh run download "${pair#*:}" --repo "$GITHUB_REPOSITORY" -n emitter-kill --dir "$RUNNER_TEMP/kill-$s"
            K="$RUNNER_TEMP/kill-$s/kill"
            for b in "$K"/base/judge/*.wasm; do
              n="$(basename "$b" .wasm)"
              [ -s "$K/base/judge/$n.anchors" ] || continue
              cp "$b" "$RUNNER_TEMP/rbase/$s-$n.wasm"
              cp "$K/base/judge/$n.anchors" "$RUNNER_TEMP/rbase/$s-$n.anchors"
            done
            for d in "$K"/m*/judge; do
              mid="$(basename "$(dirname "$d")")"
              mkdir -p "$RUNNER_TEMP/rshards/kill/emut/modules/$s-$mid"
              for w in "$d"/*.wasm; do
                n="$(basename "$w" .wasm)"
                [ -s "$w" ] && [ -s "$RUNNER_TEMP/rbase/$s-$n.wasm" ] || continue
                cmp -s "$w" "$RUNNER_TEMP/rbase/$s-$n.wasm" && continue
                cp "$w" "$RUNNER_TEMP/rshards/kill/emut/modules/$s-$mid/$s-$n.wasm"
              done
            done
          done
          ls "$RUNNER_TEMP/rbase" | grep -c '\.wasm$'
          find "$RUNNER_TEMP/rshards" -name '*.wasm' | sed "s#$RUNNER_TEMP/rshards/##" | sort
      - name: Measure
        env:
          HELD_BASE_DIR: ${{ runner.temp }}/rbase
        run: bash scripts/probe-held-fresh.sh target/release/almide-anchor-check . "$RUNNER_TEMP/rshards" "$RUNNER_TEMP/replay-rules"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-rules
          path: |
            ${{ runner.temp }}/replay-rules/held-fresh.tsv
            ${{ runner.temp }}/replay-rules/held-fresh-programs.tsv
            ${{ runner.temp }}/replay-rules/held-loop.tsv
            ${{ runner.temp }}/replay-rules/held-loop-programs.tsv
            ${{ runner.temp }}/replay-rules/held-windows.tsv
            ${{ runner.temp }}/replay-rules/held-windows-programs.tsv
            ${{ runner.temp }}/replay-rules/jobs.tsv
            ${{ runner.temp }}/replay-rules/dump
            ${{ runner.temp }}/replay-rules/kernel.log
            ${{ runner.temp }}/replay-rules/loop-kernel.log
            ${{ runner.temp }}/replay-rules/win-kernel.log
