name: Feature Branch CI

# THROWAWAY (rf0691 probe): time range_head_fold_edges on wasm before/after the v0.69.1 integration.
on:
  push:
    branches:
      - 'feature/rf0691-probe'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"

jobs:
  probe:
    name: probe ${{ matrix.label }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: before, ref: 166eb38b694b9ccebdb68646f589b8a6647efe32, os: ubuntu-latest, arch: x86_64 }
          - { label: after, ref: 10d4bffbdc33b5586328d59a635f191319dcacc5, os: ubuntu-latest, arch: x86_64 }
          - { label: before, ref: 166eb38b694b9ccebdb68646f589b8a6647efe32, os: ubuntu-24.04-arm, arch: aarch64 }
          - { label: after, ref: 10d4bffbdc33b5586328d59a635f191319dcacc5, os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe-src
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
          workspaces: |
            .
            tools/xtarget-fuzz
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-${{ matrix.arch }}-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-${{ matrix.arch }}-linux/wasmtime" /usr/local/bin/wasmtime
          rm -rf "$TARBALL" "wasmtime-${VERSION}-${{ matrix.arch }}-linux"
      - name: Build
        run: |
          cargo build --release --bin almide
          (cd tools/xtarget-fuzz && cargo build --release)
      - name: Time the recorded finding
        run: |
          set +e
          A=$PWD/target/release/almide
          R=$PWD/probe-src/probe/repro.almd
          mkdir -p /tmp/p
          t() { local s=$(date +%s.%N); timeout "$TL" "$@" > /tmp/p/out.txt 2>&1; local rc=$?; local e=$(date +%s.%N); echo "TIME $(echo "$e - $s" | bc) rc=$rc :: $*"; tail -c 1500 /tmp/p/out.txt; }
          TL=120
          t $A run $R
          t $A run $R
          TL=60
          t $A run $R --target wasm
          $A build $R --target wasm -o /tmp/p/repro.wasm; echo "build rc=$?"
          t wasmtime /tmp/p/repro.wasm
          TL=600
          t ./tools/xtarget-fuzz/target/release/xtarget-fuzz ladder $R --repo "$PWD" --almide "$A"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ matrix.label }}-${{ matrix.arch }}
          path: /tmp/p/*.wasm
          retention-days: 3
