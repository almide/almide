name: Feature Branch CI

# THROWAWAY probe for #4588: the shapes gate on the base.
on:
  push:
    branches:
      - 'feature/f4588-probe-base'

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"

permissions: read-all

jobs:
  shapes:
    name: Perf shapes (base)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools
      - name: Gate
        run: bash scripts/check-native-v1-perf-shapes.sh
