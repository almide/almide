name: Feature Branch CI

# Lightweight CI for agent feature branches.
# Build + cargo test + exercises only. No cross-platform, TS, JS, WASM.

on:
  push:
    branches:
      - '*/[a-z]*'        # dolphin/*, shark/*, octopus/*, squid/*, clownfish/*
      - 'feature/**'
      - 'worktree-*/**'

# Cancel superseded runs on the same ref so a burst of pushes doesn't fire N
# concurrent runs that all re-download tools and trip the per-IP rate limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"  # runner-class MSRV: the almide binary embeds wasmtime 50 (commissioned host); compiler crates keep the 1.89 claim per-crate
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
permissions: read-all

jobs:
  full:
    name: Full-size sliced gates (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: cross-target
            cmd: cargo test --release --test wasm_runtime_cross_target
          - part: interp-oracle-opt-parity
            cmd: cargo test --release --test wasm_runtime_interp_oracle --test wasm_runtime_opt_parity --test wasm_runtime_interp_ledger
          - part: native-floors
            cmd: cargo test --release --test fan_region_floor_test --test native_verified_floor_test --test native_v1_differential_test --test crossmod_matrix_test --test dep_shaped_leg_test --test wasm_vm_parity_test
          - part: root-rest
            cmd: cargo test --release --test wasm_test_lane_wall_test --test wasm_imports_within_effects_test --test explain_list_test --test fmt_test --test stdlib_nominal_order_matrix_test --test wasm_dispatch_coverage_test --test kernel_conformance_test --test diagnostic_coverage_test --test diagnostic_harness_test
          - part: crates
            cmd: cargo test --release -p almide-spine --test check_parity --test run_parity --test stdlib_examples_test && cargo test --release -p almide-syntax --test ast_parity && cargo test --release -p almide-wasm --test alloc_ledger --test native_result_ownership --test surface_matrix --test witness_floor --test fuzz_differential --test wasi_gate --test size_ratchet --test backend_parity && cargo test --release -p almide-mir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          rm -rf "$TARBALL" "wasmtime-${VERSION}-x86_64-linux"
      - name: Build
        run: cargo build --release
      - name: ${{ matrix.part }} (no ALMIDE_CI_SLICE)
        env:
          ALMIDE_EXPECT_TOOLS: "1"
        run: |
          git log --oneline -1
          test -z "${ALMIDE_CI_SLICE:-}"
          ${{ matrix.cmd }} 2>&1 | grep -vE "^test .* \.\.\. ok$"
          exit ${PIPESTATUS[0]}
  corpus-macos:
    name: Corpus gate (macos-latest, ${{ matrix.gate }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: [wasm_runtime_cross_target, wasm_runtime_opt_parity, wasm_runtime_interp_oracle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-cross-platform-macos-latest-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - run: cargo build --release
      - name: Install wasmtime
        run: |
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-aarch64-macos.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo mv wasmtime-*/wasmtime /usr/local/bin/
          wasmtime --version
      - name: Install wasm-opt (binaryen)
        run: brew install binaryen && wasm-opt --version
      - name: Cargo test (${{ matrix.gate }})
        env:
          ALMIDE_EXPECT_TOOLS: "1"
        run: cargo test --test tool_arming_tripwire_test --test ${{ matrix.gate }}
