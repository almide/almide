name: Feature Branch CI

# THROWAWAY (rf0691 probe): time range_head_fold_edges on wasm before/after the v0.69.1 integration.
on:
  push:
    branches:
      - 'feature/rf0691-probe'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"

jobs:
  probe:
    name: probe ${{ matrix.label }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: before, ref: 166eb38b694b9ccebdb68646f589b8a6647efe32, os: ubuntu-latest, arch: x86_64 }
          - { label: after, ref: 10d4bffbdc33b5586328d59a635f191319dcacc5, os: ubuntu-latest, arch: x86_64 }
          - { label: before, ref: 166eb38b694b9ccebdb68646f589b8a6647efe32, os: ubuntu-24.04-arm, arch: aarch64 }
          - { label: after, ref: 10d4bffbdc33b5586328d59a635f191319dcacc5, os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
          workspaces: |
            .
            tools/xtarget-fuzz
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-${{ matrix.arch }}-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-${{ matrix.arch }}-linux/wasmtime" /usr/local/bin/wasmtime
          rm -rf "$TARBALL" "wasmtime-${VERSION}-${{ matrix.arch }}-linux"
      - name: Build
        run: |
          cargo build --release --bin almide
          (cd tools/xtarget-fuzz && cargo build --release)
      - name: Time
        run: |
          set +e
          A=$PWD/target/release/almide
          F=spec/wasm_cross/range_head_fold_edges.almd
          mkdir -p /tmp/p
          cat > /tmp/p/bottom.almd <<'EOF'
          effect fn main() -> Unit = {
            let bottom_count = list.range(-9223372036854775808, -9223372036854775805) |> list.fold(0, (a, _x) => a + 1)
            println("bottom=${bottom_count}")
          }
          EOF
          cat > /tmp/p/bottom_first.almd <<'EOF'
          effect fn main() -> Unit = {
            let bottom_first = list.range(-9223372036854775808, -9223372036854775805) |> list.fold(0, (a, x) => if a == 0 then x else a)
            println("first=${bottom_first}")
          }
          EOF
          cat > /tmp/p/top.almd <<'EOF'
          effect fn main() -> Unit = {
            let top_count = list.range(9223372036854775804, 9223372036854775807) |> list.fold(0, (a, _x) => a + 1)
            println("top=${top_count}")
          }
          EOF
          t() { local s=$(date +%s.%N); timeout 120 "$@" > /tmp/p/out.txt 2>&1; local rc=$?; local e=$(date +%s.%N); echo "TIME $(echo "$e - $s" | bc) rc=$rc :: $*"; tail -c 400 /tmp/p/out.txt; }
          for i in 1 2 3; do t $A run $F; done
          for i in 1 2 3 4 5; do t $A run $F --target wasm; done
          $A build $F --target wasm -o /tmp/p/edges.wasm; echo "build rc=$?"
          for i in 1 2 3; do t wasmtime /tmp/p/edges.wasm; done
          for p in bottom bottom_first top; do
            t $A run /tmp/p/$p.almd
            t $A run /tmp/p/$p.almd --target wasm
            $A build /tmp/p/$p.almd --target wasm -o /tmp/p/$p.wasm; echo "build $p rc=$?"
            t wasmtime /tmp/p/$p.wasm
          done
          for i in 1 2 3; do t ./tools/xtarget-fuzz/target/release/xtarget-fuzz replay --seed 676064306263 --index 4566 --family all --repo "$PWD" --almide "$A"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ matrix.label }}-${{ matrix.arch }}
          path: /tmp/p/*.wasm
          retention-days: 3
