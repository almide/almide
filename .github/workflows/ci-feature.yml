name: Feature Branch CI

# Lightweight CI for agent feature branches.
# Build + cargo test + exercises only. No cross-platform, TS, JS, WASM.

on:
  push:
    branches:
      - '*/[a-z]*'        # dolphin/*, shark/*, octopus/*, squid/*, clownfish/*
      - 'feature/**'
      - 'worktree-*/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.tasks/**'

# Cancel superseded runs on the same ref so a burst of pushes doesn't fire N
# concurrent runs that all re-download tools and trip the per-IP rate limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89.0"
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

jobs:
  build-and-test:
    if: github.server_url == 'https://github.com'
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: feature-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: feature-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Build
        run: cargo build --release

      - name: Cargo tests
        # Parallel-safe on Unix: the shared build scratch dir is serialized
        # across processes by an advisory flock (src/cli/run.rs BuildDirLock).
        # This runner is ubuntu, so the lock applies. Matches ci.yml.
        # --workspace: a bare `cargo test` tests only the root package (see ci.yml).
        run: cargo test --workspace

      # The execution signal for feature branches. This step was a double
      # no-op for months (#979): it globbed `exercises/` — deleted long ago —
      # and muted even that failure with continue-on-error ("TODO: re-enable
      # after stdlib reconnection", which happened without the re-enable).
      # `examples/` is the live corpus ci.yml runs; the count floor keeps a
      # renamed corpus from reading as green (the #976 lesson).
      - name: Run examples (Rust target)
        run: |
          ALMIDE=./target/release/almide
          count=$(find examples -name '*.almd' | wc -l)
          [ "$count" -ge 10 ] || { echo "::error::only $count example files found — the corpus moved (#979)"; exit 1; }
          $ALMIDE test examples/

      - name: Emit check (smoke)
        run: |
          ALMIDE=./target/release/almide
          f=examples/binary-search.almd
          [ -f "$f" ] || { echo "::error::$f not found — pick a new smoke fixture (#979)"; exit 1; }
          $ALMIDE "$f" --target rust > /dev/null
          echo "Rust emit OK"
          $ALMIDE "$f" --emit-ast > /dev/null
          echo "AST emit OK"
