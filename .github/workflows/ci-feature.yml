name: Feature Branch CI

# THROWAWAY probe for #4588: which corpus programs the check refuses.
on:
  push:
    branches:
      - 'feature/f4588-probe'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"

permissions: read-all

jobs:
  refusals:
    name: Refusals over the shapes corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Run
        run: |
          set +e
          cargo build -q --release -p almide-mir --example render_corpus --example emit_native_bundle; echo "build rc=$?"
          { grep -E '^spec/' proofs/native-verified-floor.txt; ls research/benchmark/perf/v1-shapes/*.almd; } > corpus.txt
          wc -l corpus.txt
          for f in $(cat corpus.txt); do
            ./target/release/examples/emit_native_bundle $f /tmp/o.rs 2>&1 >/dev/null | grep PROBE4588 | sed "s#^#$f: #"
          done
          echo end
