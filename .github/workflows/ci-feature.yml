name: Feature Branch CI

# THROWAWAY probe: #4608.
on:
  push:
    branches:
      - 'feature/fx4608-probe'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"

permissions: read-all

jobs:
  verify:
    name: Fix tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Tests
        run: |
          set +e
          cargo test --release --bin almide batching_tests; a=$?
          cargo test --release --test fix_test; b=$?
          echo "unit rc=$a e2e rc=$b"
          [ $a = 0 ] && [ $b = 0 ]
  negative:
    name: Negative control (fix reverted)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Revert the fix only
        run: git -c user.name=ci -c user.email=ci@example.invalid revert --no-commit 77455c71b
      - name: Tests
        run: |
          set +e
          cargo test --release --bin almide batching_tests; a=$?
          cargo test --release --test fix_test; b=$?
          echo "unit rc=$a e2e rc=$b"
          [ $b != 0 ] && [ $a != 0 ] && echo "negative control failed as expected"
