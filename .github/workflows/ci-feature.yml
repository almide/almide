name: Feature Branch CI

# Lightweight CI for agent feature branches.
# Build + cargo test + exercises only. No cross-platform, TS, JS, WASM.

on:
  push:
    branches:
      - '*/[a-z]*'        # dolphin/*, shark/*, octopus/*, squid/*, clownfish/*
      - 'feature/**'
      - 'worktree-*/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.tasks/**'

# Cancel superseded runs on the same ref so a burst of pushes doesn't fire N
# concurrent runs that all re-download tools and trip the per-IP rate limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.0"  # runner-class MSRV: the almide binary embeds wasmtime 47 (commissioned host); compiler crates keep the 1.89 claim per-crate
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

jobs:
  build-and-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Dependencies only (see ci.yml `build`). Feature branches only READ
      # the shared entry (develop's ci-feature run never happens — the
      # trigger is branch-pattern-gated), so every feature push writes its
      # own key: keep it but let the branch pay for the workspace it built.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release

      - name: Cache wasmtime tarball
        uses: actions/cache@v6
        with:
          path: wasmtime-v47.0.3-x86_64-linux.tar.xz
          key: wasmtime-v47.0.3-x86_64-linux

      - name: Install the runtime `almide test` uses for its wasm leg
        run: |
          set -euo pipefail
          VERSION=v47.0.3
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          if ! tar -tf "$TARBALL" >/dev/null 2>&1; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" \
              --output "$TARBALL"
          fi
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version

      # No `cargo test --workspace` here, on purpose.
      #
      # It used to run, UNSHARDED on this one runner, and it was the whole cost
      # of this workflow: measured median 119 min over 19 runs, the most recent
      # 187-223 min — on a file whose first line calls it "lightweight". The
      # same suite runs in ci.yml split across four shards (`Test Rust (shard
      # N/4)`, ~27 min end to end), and THOSE are the required checks on
      # develop; this job never was. So the step duplicated a required check,
      # 8x slower, gated nothing, and — because `concurrency` only cancels a
      # superseded push, not a merge — kept a runner for hours after its
      # branch had already landed (2026-09-23: 2h on a merged branch).
      #
      # What stays is what a pre-PR branch actually needs quickly: it builds,
      # the example corpus runs, and emit does not crash. The test suite
      # arrives with the pull request, sharded, as a required check.

      # The execution signal for feature branches. This step was a double
      # no-op for months (#979): it globbed `exercises/` — deleted long ago —
      # and muted even that failure with continue-on-error ("TODO: re-enable
      # after stdlib reconnection", which happened without the re-enable).
      # `examples/` is the live corpus ci.yml runs; the count floor keeps a
      # renamed corpus from reading as green (the #976 lesson).
      - name: Run examples (Rust target)
        run: |
          ALMIDE=./target/release/almide
          count=$(find examples -name '*.almd' | wc -l)
          [ "$count" -ge 10 ] || { echo "::error::only $count example files found — the corpus moved (#979)"; exit 1; }
          $ALMIDE test examples/

      - name: Emit check (smoke)
        run: |
          ALMIDE=./target/release/almide
          f=examples/binary-search.almd
          [ -f "$f" ] || { echo "::error::$f not found — pick a new smoke fixture (#979)"; exit 1; }
          $ALMIDE "$f" --target rust > /dev/null
          echo "Rust emit OK"
          $ALMIDE "$f" --emit-ast > /dev/null
          echo "AST emit OK"
