name: Feature Branch CI

# THROWAWAY probe: final #4606 / #4607 branch.
on:
  push:
    branches:
      - 'feature/fz4606-final'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"
  FIXES: fold_float_literal_lambda json_parse_astral_before_u_escape loop_frame_exit_before_later_let

permissions: read-all

jobs:
  verify:
    name: Final ledgers and tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          rm -rf "$TARBALL" "wasmtime-${VERSION}-x86_64-linux"
      - name: Build
        run: cargo build --release
      - name: Tests
        run: |
          set +e
          export ALMIDE_BIN=$PWD/target/release/almide ORACLE=$PWD/target/release/almide
          mkdir -p /tmp/almide-bin && cp target/release/almide /tmp/almide-bin/almide
          export PATH=/tmp/almide-bin:$PATH
          run() { echo "::group::$*"; "$@"; echo "rc=$? :: $*" | tee -a status.txt; echo "::endgroup::"; }
          run bash scripts/check-contracts.sh
          for x in $FIXES; do run almide fmt --check spec/wasm_cross/$x.almd; done
          run cargo test --release -p almide-wasm
          run cargo test --release -p almide-mir
          run cargo test --release --test native_verified_floor_test
          run cargo test --release --test native_v1_differential_test
          run cargo test --release --test wasm_runtime_interp_ledger
          run bash proofs/output-parity.sh
          for x in $FIXES; do
            ALMIDE_CORPUS_FILTER=$x run cargo test --release --test wasm_runtime_cross_target
            ALMIDE_CORPUS_FILTER=$x run cargo test --release --test wasm_runtime_interp_oracle
          done
          run cargo test --release -p almide-spine
          run cargo test --release -p almide-syntax
          cat status.txt
          ! grep -v "^rc=0 " status.txt
