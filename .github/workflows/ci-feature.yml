name: Feature Branch CI

# Lightweight CI for agent feature branches.
# Build + cargo test + exercises only. No cross-platform, TS, JS, WASM.

on:
  push:
    branches:
      - '*/[a-z]*'        # dolphin/*, shark/*, octopus/*, squid/*, clownfish/*
      - 'feature/**'
      - 'worktree-*/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.tasks/**'

# Cancel superseded runs on the same ref so a burst of pushes doesn't fire N
# concurrent runs that all re-download tools and trip the per-IP rate limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"  # runner-class MSRV: the almide binary embeds wasmtime 50 (commissioned host); compiler crates keep the 1.89 claim per-crate
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
permissions: read-all

jobs:
  regen:
    name: Regenerate the derived files for the v0.69.2 batch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          rm -rf "$TARBALL" "wasmtime-${VERSION}-x86_64-linux"
      - name: Build
        run: cargo build --release
      - name: Precedence migration over the guard-let files and the whole corpus
        run: |
          set +e
          A=$PWD/target/release/almide
          echo "=== guard-let files: almide fix --dry-run --json (precedence_rewrites)"
          while read f; do
            out=$("$A" fix --dry-run --json "$f" 2>&1); echo "$f :: $(echo "$out" | grep -o '"precedence_rewrites":[0-9]*' | head -1) :: $(echo "$out" | grep -c 'NOT rewritten')"
          done < v0692-glfiles.txt
          echo "=== guard-let files: almide check (looking for E120)"
          while read f; do
            case "$f" in tests/diagnostics/*/broken.almd) continue;; esac
            "$A" check "$f" > chk.txt 2>&1; echo "$f rc=$? E120=$(grep -c E120 chk.txt)"
          done < v0692-glfiles.txt
          echo "=== every tracked .almd: sites the migration would rewrite or refuse"
          git ls-files '*.almd' | while read f; do
            out=$("$A" fix --dry-run --json "$f" 2>&1)
            n=$(echo "$out" | grep -o '"precedence_rewrites":[0-9]*' | head -1 | cut -d: -f2)
            r=$(echo "$out" | grep -c 'NOT rewritten')
            if [ "${n:-0}" != "0" ] || [ "$r" != "0" ]; then echo "SITE $f rewrites=${n} refused=${r}"; fi
          done | tee sites.txt
          echo "sites-files=$(wc -l < sites.txt)"
          cargo test --release --test precedence_regroup_corpus_test 2>&1 | tail -15
          cargo test --release -p almide-syntax test_guard_let 2>&1 | grep -E "test result|FAILED|panicked" | head
          cargo test --release -p almide-syntax regroup 2>&1 | grep -E "test result|FAILED|panicked" | head
      - name: Regenerate
        env:
          ALMIDE_MANIFEST_TREE_CHECK: "off"
        run: |
          set +e
          export ORACLE=$PWD/target/release/almide ALMIDE_BIN=$PWD/target/release/almide
          run() { echo "::group::$*"; "$@"; echo "rc=$? :: $*" | tee -a regen-status.txt; echo "::endgroup::"; }
          run bash scripts/gen-run-manifest.sh
          run bash scripts/gen-check-manifest.sh
          run bash scripts/gen-ast-manifest.sh
          ALMIDE_UPDATE_ALLOC=1 run cargo test --release -p almide-wasm --test alloc_ledger
          ALMIDE_UPDATE_SIZES=1 run cargo test --release -p almide-wasm --test size_ratchet
          ALMIDE_UPDATE_WITNESS_FLOOR=1 run cargo test --release -p almide-wasm --test witness_floor
          ALMIDE_UPDATE_SURFACE=1 run cargo test --release -p almide-wasm --test surface_matrix
          run bash proofs/output-parity.sh --update
          ALMIDE_UPDATE_NATIVE_VERIFIED_FLOOR=1 run cargo test --release --test native_verified_floor_test
          ALMIDE_UPDATE_INTERP_LEDGER=1 run cargo test --release --test wasm_runtime_interp_ledger
          rm -f chk.txt sites.txt
          git status --short | grep -v "^??"
          git diff -- . ':(exclude).github' ':(exclude)v0692-glfiles.txt' > regen.patch
          cat regen-status.txt
          git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: regen
          path: |
            regen.patch
            regen-status.txt
