name: Feature Branch CI

# Lightweight CI for agent feature branches.
# Build + cargo test + exercises only. No cross-platform, TS, JS, WASM.

on:
  push:
    branches:
      - '*/[a-z]*'        # dolphin/*, shark/*, octopus/*, squid/*, clownfish/*
      - 'feature/**'
      - 'worktree-*/**'

# Cancel superseded runs on the same ref so a burst of pushes doesn't fire N
# concurrent runs that all re-download tools and trip the per-IP rate limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"  # runner-class MSRV: the almide binary embeds wasmtime 50 (commissioned host); compiler crates keep the 1.89 claim per-crate
  # Cold runners gain nothing from the workspace's release-incremental
  # profile (#1006) — it only bloats the caches. Opt out.
  CARGO_INCREMENTAL: "0"

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
jobs:
  control:
    name: The #4538 tests on this tree
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          rm -rf "$TARBALL" "wasmtime-${VERSION}-x86_64-linux"
      - name: Build
        run: cargo build --release && cargo build --release -p almide-mir --example emit_native_bundle
      - name: Probe the new fixtures on every leg
        run: |
          set +e
          A=$PWD/target/release/almide
          E=$PWD/target/release/examples/emit_native_bundle
          for f in spec/wasm_cross/range_count_overflow*.almd spec/wasm_cross/range_head_*count_overflow.almd probe4538/*.almd; do
            n=$(basename $f .almd); mkdir -p w/$n; cp $f w/$n/main.almd
            V=v0; "$E" $f w/$n/v1.rs > /dev/null 2> w/$n/wall.txt && V=v1
            N=$( cd w/$n && timeout 120 "$A" run main.almd 2>&1; echo "exit=$?" )
            Z=$( cd w/$n && ALMIDE_NO_VERIFIED_OK=1 timeout 120 "$A" run --no-verified main.almd 2>&1 | grep -v '^\[almide\] ALMIDE_'; echo "exit=${PIPESTATUS[0]}" )
            W=$( cd w/$n && timeout 120 "$A" run main.almd --target wasm 2>&1; echo "exit=$?" )
            echo "=== $n (native render: $V)"; echo "--- native default:"; echo "$N"; echo "--- native v0:"; echo "$Z"; echo "--- wasm:"; echo "$W"
            [ "$V" = v0 ] && head -3 w/$n/wall.txt; true
          done
      - name: Gates on the new fixtures
        env:
          ALMIDE_EXPECT_TOOLS: "1"
        run: |
          set +e
          ALMIDE_CORPUS_FILTER=count_overflow cargo test --release --test wasm_runtime_cross_target -- --nocapture 2>&1 | tail -30; echo "cross rc=${PIPESTATUS[0]}" | tee -a status.txt
          ALMIDE_CORPUS_FILTER=count_overflow cargo test --release --test wasm_runtime_interp_oracle -- --nocapture 2>&1 | tail -40; echo "interp rc=${PIPESTATUS[0]}" | tee -a status.txt
          cargo test --release --test native_v1_differential_test 2>&1 | grep -v "^\s*$" | tail -30; echo "differential rc=${PIPESTATUS[0]}" | tee -a status.txt
          cat status.txt
