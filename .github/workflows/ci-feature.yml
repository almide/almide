name: Feature Branch CI

# THROWAWAY probe for #4588.
on:
  push:
    branches:
      - 'feature/f4588-probe'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"

permissions: read-all

jobs:
  repro:
    name: Repro on head
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
      - name: Build
        run: cargo build --release && cargo build --release -p almide-mir --example emit_native_bundle
      - name: Probe
        run: |
          set +e
          A=$PWD/target/release/almide
          E=$PWD/target/release/examples/emit_native_bundle
          mkdir -p out
          for f in probe4588/*.almd; do
            b=$(basename $f .almd)
            echo "===== $b ====="
            $A run $f; echo "native rc=$?"
            $A run $f --target wasm; echo "wasm rc=$?"
            ALMIDE_NO_VERIFIED_OK=1 $A run --no-verified $f; echo "v0 rc=$?"
            $E $f out/$b.rs > out/$b.bundle; echo "emit rc=$?"
            ALMIDE_DUMP_MIR=1 $E $f out/$b.mir.rs > /dev/null 2> out/$b.mir; echo "dump rc=$?"
            echo "--- render ---"; hew out/$b.rs | grep -v '^\s*$' | sed -n '/__ALMIDE_V1_RT_END__/,$p'
            echo "--- mir ---"; cat out/$b.mir
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-out
          path: out
  bisect:
    name: Bisect ${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: [166eb38b694b9ccebdb68646f589b8a6647efe32, 902e36f84e0778064efc8e564cbb30cb820ca84c, c732e8981c4eb1e98e1523547ffe44a3307f084d, dcf6d0a0ae6f2beaf321e3443544544b157f7a96, e3ed29aec623fca70298fa9f869c3a67d1931ba8, 6299c7ccb44500389d3aa3143cffead505616214, 869cb8322af19df20b34f68d5d7f28c8463f6b93, 64fbe974c638a33b9f13aa6ca6e195c49bb858d7, ca98c045a698868fb68e9ead3467849826301064, c1a344e375b557cc86526bce113377c3ebc637d9, 65f488062a6c4b9f9194902f1a81c427a5320149, f4ee60d32e579abdb16f7a10813d2ab83ff6256d]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe-src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          path: src
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Emit
        working-directory: src
        run: |
          set +e
          cargo build --release -p almide-mir --example emit_native_bundle; echo "build rc=$?"
          for f in ../probe-src/probe4588/*.almd; do
            b=$(basename $f .almd)
            ./target/release/examples/emit_native_bundle $f /tmp/$b.rs > /dev/null; echo "$b emit rc=$?"
            calls=$(grep -o '__almd_ci_[0-9a-z_]*(' /tmp/$b.rs | sort -u | tr -d '(')
            for c in $calls; do
              if grep -q "fn $c(" /tmp/$b.rs; then echo "$b: $c defined"; else echo "$b: $c MISSING  <<<<<"; fi
            done
          done
