name: Feature Branch CI

# THROWAWAY (fix-globalread-4571): probe the v1 heap-slot snapshot fix.
on:
  push:
    branches:
      - 'feature/gr4571-shapes'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  RUST_STABLE_TOOLCHAIN: "1.99.1"
  CARGO_INCREMENTAL: "0"

jobs:
  shapes:
    name: native-v1-perf-shapes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools
      - run: |
          sed 's/counts\[key\] = counts.get(key, 0) + 1/counts[key] = counts.get(key, 0) + 1; print("REGION", reg[1], reg[5], reg[2], reg[3], repr(own[:300])) if ("heap_slot" in reg[1] or "move_op" in reg[5]) else None/' scripts/check-native-v1-perf-shapes.sh > scripts/_dbg-shapes.sh
          bash scripts/_dbg-shapes.sh; true
