name: Feature Branch CI

# THROWAWAY (ps0691): the native v1 perf gates over the fix branch.
on:
  push:
    branches:
      - 'feature/ps0691-probe'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  shapes:
    name: shapes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools
      - name: shapes gate
        run: |
          set +e
          bash scripts/check-native-v1-perf-shapes.sh; echo "shapes rc=$?"
  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - run: cargo build --release --bin almide
      - name: bench runs
        run: |
          set +e
          A=target/release/almide
          $A run research/benchmark/perf/v1-shapes/chain_key_loop_reader.almd; echo "run rc=$?"
      - name: perf gate
        run: |
          set +e
          bash scripts/check-native-v1-perf.sh; echo "perf rc=$?"
  small:
    name: small
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - run: cargo build --release --bin almide
      - name: small gate
        run: |
          set +e
          bash scripts/check-native-v1-perf-small.sh; echo "small rc=$?"
