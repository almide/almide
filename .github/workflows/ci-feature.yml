name: Feature Branch CI

# THROWAWAY (fz4571): reproduce the value.get_int in-domain probe failure.
on:
  push:
    branches:
      - 'feature/fz4571-probe'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"

jobs:
  probe:
    name: value.get_int probe repro
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
          workspaces: |
            .
            tools/xtarget-fuzz
      - name: Install wasmtime
        run: |
          set -euo pipefail
          VERSION=v50.0.1
          TARBALL="wasmtime-${VERSION}-x86_64-linux.tar.xz"
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/${TARBALL}" "$TARBALL"
          tar -xf "$TARBALL"
          sudo install -m 755 "wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          rm -rf "$TARBALL" "wasmtime-${VERSION}-x86_64-linux"
      - name: Build almide
        run: cargo build --release --bin almide
      - name: Dump probe programs
        working-directory: tools/xtarget-fuzz
        run: DUMP_DIR=/tmp/probes cargo test --release dump_probe_programs_throwaway -- --ignored --nocapture
      - name: Run probes
        run: |
          set +e
          A=$PWD/target/release/almide
          cd /tmp/probes
          for f in value_get_int value_get; do
            echo "===== $f.almd"; cat -n $f.almd
            echo "----- check"; $A check $f.almd; echo "check rc=$?"
            echo "----- native"; $A run $f.almd -- alpha --flag beta --opt=7; echo "native rc=$?"
            echo "----- wasm"; $A run $f.almd --target wasm -- alpha --flag beta --opt=7; echo "wasm rc=$?"
            echo "----- v0"; ALMIDE_NO_VERIFIED_OK=1 $A run --no-verified $f.almd -- alpha; echo "v0 rc=$?"
            echo "----- emit rust"; $A $f.almd --target rust > $f.rs; echo "emit rc=$?"; head -c 20000 $f.rs
          done
      - name: In-domain probe test
        working-directory: tools/xtarget-fuzz
        run: cargo test --release generator::inspect_gen
