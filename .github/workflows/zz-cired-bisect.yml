name: cired bisect
on:
  push:
    branches: ["cired-bisect*"]
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  b:
    strategy:
      fail-fast: false
      matrix:
        sha: [b4cce032227df4bd6fb80aa3679ad0f04372f0b6, 7fb2f6c6531ff87d8b9c7b59a9036b4d6c883363, eaa2ec6602a7a6c8fcb4a58ca0b59da93013958d, 9103e0c09fe1c685c3940145e1683feb4401aba3, 1a14f2d068e68070b091780da3adce40010590c6, 311c7880a14749e225f5eba2d7685e9a9b02fbd9, a7ec47857e6ce64c08d4291f9453efd810aee1ba, 3a81cacde3929ace2266f24cc6cc4ff5a999959b, 47265d4f9d09dc29958a781d4a749ac49824f6e5, b4d593ca837676aadbc7a422f5087bcb6caa385b, ff17be1e44c5d28a0f2cafd71974d53bd4df9bb1, fc8a7213c3b430be6c70b6d0db8c5f46ed1ece3b, 38fd0eb89c48719bc9798b160963c8364b462030, 0b3d96ecbed0138daed0f766d96b607fe01a503c, 1d76427c804687c236a1cad6b75d6ed834f51913, 3e605379768cc85c437fc1395d1372f08efe9d2e, 46e39ad570191280897d650ba05119a76a75b423, 22eeadfc9d98f8e1784ab43e1c2815ce91d5a574]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: tool }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: src, ref: "${{ matrix.sha }}", fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-build-1.97.0, save-if: false, workspaces: src }
      - run: cd src && cargo build --release
      - run: cd tool && bash .github/cired/probe.sh $GITHUB_WORKSPACE/src/target/release/almide 2>&1 | sed "s/^/[${{ matrix.sha }}] /"
