name: cired bisect
on:
  push:
    branches: ["cired-bisect*"]
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  b:
    strategy:
      fail-fast: false
      matrix:
        sha: [ddfbee11ee30, 4b783ec68dd5, 3e7bee510add, 7b6d79c952b6, a1b2e0d5e9b9, fea08cf366de, b345382cfe43, 7c4cee50c3ae, 08aed3731420, 6ea62c3e9643, f394a10ec964, 1856930196cb, 9eb529043ae4, 0adac2f7d808, c9821cd45bcb]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: tool }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: src, ref: "${{ matrix.sha }}", fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: ci-build-1.97.0, save-if: false, workspaces: src }
      - run: cd src && cargo build --release
      - run: cd tool && bash .github/cired/probe.sh $GITHUB_WORKSPACE/src/target/release/almide 2>&1 | sed "s/^/[${{ matrix.sha }}] /"
