name: probe-w4-carve (throwaway)
on:
  push:
    branches: ['probe/w4-*']
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: regenerate the committed stdlib tables
        run: cargo build -q -p almide-types && git status --short
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: crates/almide-types/src/generated/
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - prop: anchors
            names: carve-room-loosened-by-one carve-store-misplaced
          - prop: init
            names: carve-store-lost
          - prop: carve-run
            names: pass2-count-disagrees pass2-carves-short
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: regenerate the stdlib tables and commit them locally (the drill worktree is HEAD)
        run: |
          cargo build -q -p almide-types
          git -c user.name=probe -c user.email=probe@example.invalid commit -qam "regen (probe-local)" || true
          git log --oneline -1
      - name: re-inject (held to the pinned verdicts)
        run: bash scripts/witness-reinject.sh ${{ matrix.prop }} ${{ matrix.names }}
      - name: pinned files
        if: always()
        run: for f in $(git status --short | awk '{print $2}'); do echo "== $f"; head -c 1500 "$f"; echo; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pinned-${{ matrix.prop }}
          path: |
            proofs/fixtures/
            proofs/poisoned-certs/
