name: probe-w4-carve (throwaway)
on:
  push:
    branches: ['probe/w4-*']
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: regenerate the committed stdlib tables
        run: cargo build -q -p almide-types && git status --short && git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: crates/almide-types/src/generated/
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: build the producer and the checkers
        run: cargo build -q -p almide-wasm --example emit_structural_bundle && cargo build -q -p almide-verify -p almide-anchor-check
      - name: the reproduction's init witness and anchor verdict
        run: |
          set -x
          f=proofs/fixtures/init-witness/reinject/carve-store-lost.almd
          ./target/debug/examples/emit_structural_bundle $f --only init '(program)' > /tmp/init.w || true
          tr ';' '\n' < /tmp/init.w | grep -n -E '^ *[kce][0-9]' | head -40
          tr ';' '\n' < /tmp/init.w | wc -l
          ./target/debug/examples/emit_structural_bundle $f --anchors /tmp/a.anchors > /tmp/a.bundle || true
          ./target/debug/almide-anchor-check /tmp/a.anchors.wasm /tmp/a.bundle /tmp/a.anchors || true
          git apply proofs/fixtures/init-witness/reinject/carve-store-lost.patch
          git diff --stat
          cargo build -q -p almide-wasm --example emit_structural_bundle
          ./target/debug/examples/emit_structural_bundle $f --only init '(program)' > /tmp/init2.w || true
          tr ';' '\n' < /tmp/init2.w | grep -n -E '^ *[kce][0-9]' | head -40
          tr ';' '\n' < /tmp/init2.w | head -3
          ./target/debug/almide-verify init /tmp/init2.w; echo "verify exit $?"
          git checkout -- .
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - prop: anchors
            names: carve-room-loosened-by-one carve-store-misplaced
          - prop: init
            names: carve-store-lost
          - prop: carve-run
            names: pass2-count-disagrees pass2-carves-short
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: re-inject (pin the verdicts)
        run: REINJECT_UPDATE=1 bash scripts/witness-reinject.sh ${{ matrix.prop }} ${{ matrix.names }}
      - name: pinned files
        if: always()
        run: git status --short; for f in $(git status --short | awk '{print $2}'); do echo "== $f"; head -c 600 "$f"; echo; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pinned-${{ matrix.prop }}
          path: proofs/
