name: probe-w4-carve (throwaway)
on:
  push:
    branches: ['probe/w4-*']
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - prop: anchors
            names: carve-room-loosened-by-one carve-store-misplaced
          - prop: init
            names: carve-store-lost
          - prop: carve-run
            names: pass2-count-disagrees pass2-carves-short
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: re-inject (pin the verdicts)
        run: REINJECT_UPDATE=1 bash scripts/witness-reinject.sh ${{ matrix.prop }} ${{ matrix.names }}
      - name: pinned files
        if: always()
        run: git status --short; for f in $(git status --short | awk '{print $2}'); do echo "== $f"; head -c 600 "$f"; echo; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pinned-${{ matrix.prop }}
          path: proofs/
