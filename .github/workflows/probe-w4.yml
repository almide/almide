name: probe-w4-carve (throwaway)
on:
  push:
    branches: ['probe/w4-*']
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: build the producer and the checkers
        run: cargo build -q -p almide-wasm --example emit_structural_bundle && cargo build -q -p almide-verify -p almide-anchor-check
      - name: W3's parser alone (no carve routing) through the anchor check
        run: |
          printf 'import json\n\neffect fn main() -> Unit = {\n  let v = json.parse("[true, \\"ab\\", {\\"k\\": 1}]")!\n  println(json.stringify(v))\n}\n' > /tmp/r.almd
          cat /tmp/r.almd
          ./target/debug/examples/emit_structural_bundle /tmp/r.almd --anchors /tmp/a.anchors > /tmp/a.bundle || true
          ./target/debug/almide-anchor-check --explain /tmp/a.anchors.wasm /tmp/a.bundle /tmp/a.anchors || true
          grep -a -n '^witness ownership' /tmp/a.bundle | cut -c1-120 | head -60
