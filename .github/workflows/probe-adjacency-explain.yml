name: Probe — what the byte-level check reads at five sites of the adjacency campaign
# A one-off measurement on its own branch. Not a gate.
on:
  push:
    branches: [probe/adjacency-explain]

permissions:
  contents: read

jobs:
  explain:
    name: Five sites, two deletions each
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - name: Measure
        run: bash scripts/probe-adjacency-explain.sh "$RUNNER_TEMP/explain"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adjacency-explain
          path: |
            ${{ runner.temp }}/explain/0*
            ${{ runner.temp }}/explain/pick/sample.tsv
