name: Probe — a second sample of source mutants of the wasm emitter
# A one-off measurement on its own branch: mutants of the emitter crate's
# source, generated by an unmodified third-party mutation tool, and which of
# the proven witness checkers, the byte-level check and the behaviour corpus
# notice each. A second draw, by another seed, on a later revision: the checks
# that the first sample led to are in it. Not a gate.
on:
  push:
    branches: [probe/emitter-fresh]

permissions:
  contents: read

env:
  # How many mutants are drawn from the tool's listing, by which seed, and
  # over how many shards (the matrix below lists the same shards).
  SAMPLE_N: "480"
  SAMPLE_SEED: "20261124"
  SHARDS: "16"
  # Empty for the whole sample; a comma-separated list of the sample's ids
  # restricts the run to those mutants (a trial of the harness).
  ONLY_IDS: ""

jobs:
  list:
    name: List the mutants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - name: Install the mutation tool
        run: |
          cargo install --locked cargo-mutants
          cargo mutants --version
      - name: List
        run: |
          mkdir -p "$RUNNER_TEMP/mutants"
          cargo mutants --version > "$RUNNER_TEMP/mutants/version.txt"
          cargo mutants --list --json --package almide-wasm > "$RUNNER_TEMP/mutants/mutants.json"
          python3 -I -c 'import json,sys,collections; d=json.load(open(sys.argv[1])); print(len(d), "mutants in", len({m["file"] for m in d}), "files"); print(collections.Counter(m["genre"] for m in d).most_common())' "$RUNNER_TEMP/mutants/mutants.json"
      - name: Upload the list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emitter-mutants-list
          path: ${{ runner.temp }}/mutants

  # Shard 9 of the sixteen lost its runner while judging one mutant and
  # uploaded nothing. Its thirty mutants are judged again here in three parts,
  # that mutant alone in the first, with an address-space limit on every
  # checker process as well (V_CHECK) so that a certificate a checker cannot
  # read in bounded memory ends that one process and not the machine.
  shard:
    name: Shard 9, part ${{ matrix.part }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      V_CHECK: "3000000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: a
            ids: "m0457"
          - part: b
            ids: "m0009,m0025,m0041,m0057,m0073,m0089,m0105,m0121,m0137,m0153,m0169,m0185,m0201,m0217,m0233"
          - part: c
            ids: "m0249,m0265,m0281,m0297,m0313,m0329,m0345,m0361,m0377,m0393,m0409,m0425,m0441,m0473"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emitter-mutants-list
          path: ${{ runner.temp }}/list
      - name: Draw this shard's mutants
        run: python3 -I scripts/probe-emitter-mutants-pick.py "$RUNNER_TEMP/list/mutants.json" "$RUNNER_TEMP/pick" "$SAMPLE_N" "$SAMPLE_SEED" 0 1 "${{ matrix.ids }}"
      - name: Measure
        run: bash scripts/probe-emitter-mutants.sh "$RUNNER_TEMP/emut" "$RUNNER_TEMP/pick"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emitter-mutants-9${{ matrix.part }}
          path: |
            ${{ runner.temp }}/emut/results.tsv
            ${{ runner.temp }}/emut/detail
            ${{ runner.temp }}/pick/sample.tsv
            ${{ runner.temp }}/pick/index.tsv
