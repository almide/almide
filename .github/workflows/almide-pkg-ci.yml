name: Almide Package CI

on:
  workflow_call:

# #4094: the same read-only token the repository default gives, stated here so a
# settings change cannot widen it. A job that needs more declares it itself.
permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - name: Install Almide
        # A reusable workflow: the checkout is the CALLER's repository, so
        # scripts/fetch-pinned.sh is not on disk. `latest` is a moving name no
        # digest can pin; the bytes are refused unless they carry the release
        # workflow's Sigstore attestation (security row 16).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 "https://github.com/almide/almide/releases/latest/download/almide-linux-x86_64.tar.gz" -o almide.tar.gz
          gh attestation verify almide.tar.gz --repo almide/almide \
            --signer-workflow almide/almide/.github/workflows/release.yml >/dev/null
          tar xzf almide.tar.gz --strip-components=1
          chmod +x almide
          sudo mv almide /usr/local/bin/
          almide --version

      - name: Compile
        run: almide compile

      - name: Test
        # "No tests in this package" is the one tolerated case. This used to be
        # twelve lines that grepped the harness's prose to tell it apart from a
        # real failure, because there was no exit code to test — and the `|| echo`
        # before THAT had swallowed every failure (#993). `almide test` now exits
        # 5 for "nothing to run", distinct from 1, and this flag is the opt-out
        # (#2084).
        run: almide test --allow-no-tests
