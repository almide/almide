name: Almide Package CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Almide
        run: |
          curl -fsSL "https://github.com/almide/almide/releases/latest/download/almide-linux-x86_64.tar.gz" -o almide.tar.gz
          tar xzf almide.tar.gz --strip-components=1
          chmod +x almide
          sudo mv almide /usr/local/bin/
          almide --version

      - name: Compile
        run: almide compile

      - name: Test
        # `|| echo` swallowed EVERY failure, real test failures included
        # (#993). "No tests in this package" is the one tolerated case, and it
        # is identified by the harness's message — not by ignoring the exit
        # code wholesale.
        run: |
          set +e
          out=$(almide test 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ] && printf '%s' "$out" | grep -q "No .almd files with test blocks found"; then
            echo "no tests in this package — OK"
            exit 0
          fi
          exit "$code"
