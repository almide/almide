name: Almide Package CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Almide
        run: |
          curl -fsSL "https://github.com/almide/almide/releases/latest/download/almide-linux-x86_64.tar.gz" -o almide.tar.gz
          tar xzf almide.tar.gz --strip-components=1
          chmod +x almide
          sudo mv almide /usr/local/bin/
          almide --version

      - name: Compile
        run: almide compile

      - name: Test
        # "No tests in this package" is the one tolerated case. This used to be
        # twelve lines that grepped the harness's prose to tell it apart from a
        # real failure, because there was no exit code to test — and the `|| echo`
        # before THAT had swallowed every failure (#993). `almide test` now exits
        # 5 for "nothing to run", distinct from 1, and this flag is the opt-out
        # (#2084).
        run: almide test --allow-no-tests
