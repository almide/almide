name: wasm-perf-4612 (branch verification, temporary)

# Temporary verification lane for the #4612 branch: builds the base and the
# branch compiler, times strchurn on one runner (alternating, AOT), counts
# allocations, runs the new fixtures native vs wasm, re-records the wasm
# ledgers into a patch artifact, and runs the negative controls. Removed
# before the branch is merged.
on:
  push:
    branches: [wasm-perf-4612]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: wasm-perf-4612-${{ github.sha }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  BASE_SHA: a0f6b9040
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-build-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Build the branch compiler
        run: cargo build --release && mkdir -p /tmp/bins && cp target/release/almide /tmp/bins/almide-new
      - name: Build the base compiler
        run: |
          git worktree add /tmp/base "$BASE_SHA"
          cd /tmp/base && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --bin almide
          cp "$GITHUB_WORKSPACE/target/release/almide" /tmp/bins/almide-base
      - name: Build the negative-control compilers
        run: |
          set -euo pipefail
          # NC1: the byte walk forced past the stage judgment.
          git worktree add /tmp/nc1 HEAD
          sed -i 's/if !almide_ir::fusion::stages_mergeable(&verdicts) {/if walk.is_none() \&\& !almide_ir::fusion::stages_mergeable(\&verdicts) {/' /tmp/nc1/crates/almide-wasm/src/list_fuse.rs
          grep -n 'walk.is_none() && !almide_ir' /tmp/nc1/crates/almide-wasm/src/list_fuse.rs
          (cd /tmp/nc1 && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --bin almide)
          cp "$GITHUB_WORKSPACE/target/release/almide" /tmp/bins/almide-nc1
          # NC2: the one-byte split kernel drops the piece after a final separator.
          git worktree add /tmp/nc2 HEAD
          sed -i 's/i.local_get(p).local_get(slen).i32_le_u().br_if(0);/i.local_get(p).local_get(slen).i32_lt_u().br_if(0);/' /tmp/nc2/crates/almide-wasm/src/value_helpers.rs
          grep -n 'i32_lt_u().br_if(0)' /tmp/nc2/crates/almide-wasm/src/value_helpers.rs
          (cd /tmp/nc2 && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --bin almide)
          cp "$GITHUB_WORKSPACE/target/release/almide" /tmp/bins/almide-nc2
          # Experiment (not committed): word-wise small copies in $copy.
          git worktree add /tmp/wc HEAD
          (cd /tmp/wc && git apply .github/wasm-perf-4612-wcopy.patch && git diff --stat)
          (cd /tmp/wc && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --bin almide)
          cp "$GITHUB_WORKSPACE/target/release/almide" /tmp/bins/almide-wcopy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins
          path: /tmp/bins
          retention-days: 3

  measure:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bins
          path: /tmp/bins
      - name: Install wasmtime
        run: |
          set -euo pipefail
          chmod +x /tmp/bins/*
          VERSION=v50.0.1
          TARBALL=/tmp/wasmtime.tar.xz
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/wasmtime-${VERSION}-x86_64-linux.tar.xz" "$TARBALL"
          tar -xf "$TARBALL" -C /tmp
          sudo install -m 755 "/tmp/wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      - name: New fixtures, native vs wasm, and the formatter
        run: |
          set +e -uo pipefail
          A=/tmp/bins/almide-new
          fail=0
          for f in spec/wasm_cross/bytes_walk_reduction_fused.almd spec/wasm_cross/split_one_byte_separator.almd spec/wasm_cross/r5_wasm_split_replace_iterative.almd; do
            echo "== $f"
            $A run "$f" > /tmp/native.out 2>&1; echo "native exit $?"
            head -c 2000 /tmp/native.out
            $A run "$f" --target wasm > /tmp/wasm.out 2>&1; echo "wasm exit $?"
            /tmp/bins/almide-base run "$f" --target wasm > /tmp/basewasm.out 2>&1; echo "base wasm exit $?"
            cat /tmp/native.out
            if cmp -s /tmp/native.out /tmp/wasm.out; then echo "IDENTICAL native == wasm"; else echo "DIVERGES"; diff /tmp/native.out /tmp/wasm.out; fail=1; fi
            cmp -s /tmp/native.out /tmp/basewasm.out && echo "base wasm identical too" || { echo "base wasm differs:"; diff /tmp/native.out /tmp/basewasm.out; }
          done
          cp spec/wasm_cross/bytes_walk_reduction_fused.almd spec/wasm_cross/split_one_byte_separator.almd /tmp/
          $A fmt spec/wasm_cross/bytes_walk_reduction_fused.almd spec/wasm_cross/split_one_byte_separator.almd
          git diff --exit-code spec/ || { echo "FORMAT DRIFT (diff above)"; fail=1; }
          exit $fail
      - name: Negative controls
        if: always()
        run: |
          set +e -uo pipefail
          for nc in nc1:spec/wasm_cross/bytes_walk_reduction_fused.almd nc2:spec/wasm_cross/split_one_byte_separator.almd; do
            b=${nc%%:*}; f=${nc#*:}
            /tmp/bins/almide-new run "$f" > /tmp/native.out 2>&1
            /tmp/bins/almide-$b run "$f" --target wasm > /tmp/nc.out 2>&1; echo "$b wasm exit $?"
            if cmp -s /tmp/native.out /tmp/nc.out; then echo "NEGATIVE CONTROL $b: NOT CAUGHT"; else echo "NEGATIVE CONTROL $b: caught"; diff /tmp/native.out /tmp/nc.out; fi
          done
      - name: strchurn — allocations, outputs, AOT timing (base vs branch, one runner)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/perf && cd /tmp/perf
          cat > strchurn.almd <<'EOF'
          // strchurn: 200,000 strings through interpolate -> split -> trim -> to_upper -> join.
          let n = 200000
          let prime = 1000000007

          fn build(i: Int) -> String =
            "item-${i}, value ${(i * 7) % 1000} ,  tag${i % 13}  ,x"
              |> string.split(",")
              |> list.map((p) => string.to_upper(string.trim(p)))
              |> list.join("|")

          fn main() -> Unit = {
            let strs = list.range(0, n) |> list.map(build)
            let total = strs |> list.map((s) => string.len(s)) |> list.sum
            let ck = strs |> list.fold(0, (acc, s) => (acc * 31 + list.sum(bytes.to_list(bytes.from_string(s)))) % prime)
            println("${total} ${ck}")
          }
          EOF
          sed -i 's/^          //' strchurn.almd
          printf 'fn main() -> Unit = {\n  println("hello")\n}\n' > hello.almd
          printf 'fn main() -> Unit = {\n  println(string.split("a,b", ",") |> list.join("|"))\n}\n' > splitone.almd
          for v in base new wcopy; do
            for prog in hello splitone; do
              /tmp/bins/almide-$v build $prog.almd --target wasm -o $prog-$v.wasm && echo "size $prog $v $(stat -c %s $prog-$v.wasm)"
            done
          done
          for v in base new wcopy; do
            /tmp/bins/almide-$v build strchurn.almd --target wasm -o strchurn-$v.wasm
            ls -l strchurn-$v.wasm
            wasmtime compile strchurn-$v.wasm -o strchurn-$v.cwasm
            echo "== $v alloc counters"
            ALMIDE_WASM_ALLOC_COUNT=1 /tmp/bins/almide-$v run strchurn.almd --target wasm
          done
          python3 - <<'EOF'
          import subprocess, time, statistics
          outs = {}
          times = {"base": [], "new": [], "wcopy": []}
          for r in range(13):
              order = [["base", "new", "wcopy"], ["new", "wcopy", "base"], ["wcopy", "base", "new"]][r % 3]
              for v in order:
                  t0 = time.perf_counter()
                  p = subprocess.run(["wasmtime", "run", "--allow-precompiled", f"strchurn-{v}.cwasm"], capture_output=True)
                  dt = (time.perf_counter() - t0) * 1000
                  assert p.returncode == 0, p.stderr
                  outs.setdefault(v, p.stdout)
                  assert outs[v] == p.stdout
                  if r >= 2:
                      times[v].append(dt)
          print("outputs equal:", outs["base"] == outs["new"] == outs["wcopy"], outs["new"])
          for v in times:
              print(v, "median %.2f ms" % statistics.median(times[v]), ["%.1f" % t for t in times[v]])
          print("ratio new/base = %.4f" % (statistics.median(times["new"]) / statistics.median(times["base"])))
          print("ratio wcopy/new = %.4f" % (statistics.median(times["wcopy"]) / statistics.median(times["new"])))
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-wasm
          path: /tmp/perf/*.wasm
          retention-days: 7

  ledgers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [ratchet, ledgers, parity, wasi, rest, cross]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bins
          path: /tmp/bins
      - name: Install wasmtime and the branch compiler
        run: |
          set -euo pipefail
          chmod +x /tmp/bins/*
          mkdir -p target/release && cp /tmp/bins/almide-new target/release/almide
          VERSION=v50.0.1
          TARBALL=/tmp/wasmtime.tar.xz
          bash scripts/fetch-pinned.sh "https://github.com/bytecodealliance/wasmtime/releases/download/${VERSION}/wasmtime-${VERSION}-x86_64-linux.tar.xz" "$TARBALL"
          tar -xf "$TARBALL" -C /tmp
          sudo install -m 755 "/tmp/wasmtime-${VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
      - name: Regenerate the parity manifests
        run: |
          set -uo pipefail
          ORACLE=target/release/almide bash scripts/gen-run-manifest.sh
          ORACLE=target/release/almide bash scripts/gen-check-manifest.sh
          ORACLE=target/release/almide bash scripts/gen-ast-manifest.sh
          git diff --stat
      - name: This shard's gates against the committed ledgers
        if: matrix.shard != 'cross'
        run: |
          set -uo pipefail
          ARGS="$(bash scripts/ci-commissioned-wasm-shard.sh args ${{ matrix.shard }})"
          # shellcheck disable=SC2086
          cargo test --release --locked --no-fail-fast -p almide-wasm -p almide-wasm-run -p almide-spine -p almide-syntax -p almide-corpus -p almide-layout -- $ARGS > /tmp/shard.log 2>&1
          echo "cargo exit $?"
          grep -E '^test .* FAILED|^test result|panicked' /tmp/shard.log | head -200
      - name: Cross-target gate and the wasm spec tests
        if: matrix.shard == 'cross'
        run: |
          set -uo pipefail
          ALMIDE_BIN=$PWD/target/release/almide ALMIDE_EXPECT_TOOLS=1 cargo test --release --locked --test wasm_runtime_cross_target > /tmp/shard.log 2>&1
          echo "cargo exit $?"
          grep -E 'FAILED|^test result|panicked|DIVERG|mismatch' /tmp/shard.log | head -100
          target/release/almide test spec/ --target wasm > /tmp/spec-wasm.log 2>&1; echo "almide test exit $?"
          tail -30 /tmp/spec-wasm.log
          bash scripts/check-contracts.sh 2>&1 | tail -3
          bash scripts/check-file-discipline.sh 2>&1 | tail -2
      - name: Collect
        if: always()
        run: |
          git diff --stat
          git diff > /tmp/ledgers.patch
          tail -c 3000000 /tmp/shard.log > /tmp/shard-tail.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ledgers-${{ matrix.shard }}
          path: |
            /tmp/ledgers.patch
            /tmp/shard-tail.log
            /tmp/spec-wasm.log
          retention-days: 7
