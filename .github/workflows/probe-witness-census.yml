name: Probe — witness census
# A one-off measurement on its own branch: sizes, check times and the row-4
# census of every artifact the structural wall judges. Not a gate.
on:
  push:
    branches: [probe/census-develop]

permissions:
  contents: read

jobs:
  census:
    name: Witness census
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: "."
          prefix-key: "trust-spine"
      - name: Restore opam root (OCaml + Rocq)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-ocaml5.4.1-rocq9.3.0-v1-a04b045f1534714416da6b4f8e8e67d2defbb750
      - name: Rocq on PATH
        run: |
          BIN="$HOME/.opam/5.4.1/bin"
          ls "$BIN" | grep -E '^(rocq|coqc)$' || { echo "no Rocq in the restored opam root" >&2; exit 1; }
          if [ ! -x "$BIN/coqc" ]; then printf '#!/bin/sh\nexec rocq compile "$@"\n' > "$BIN/coqc"; chmod +x "$BIN/coqc"; fi
          echo "$BIN" >> "$GITHUB_PATH"
      - name: Install wabt
        run: sudo apt-get update -q && sudo apt-get install -y -q wabt
      - name: Measure
        env:
          CENSUS_LIGHT: "1"
        run: bash scripts/probe-witness-census.sh "$RUNNER_TEMP/census"
      - name: Upload rows and rejected artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-census
          path: |
            ${{ runner.temp }}/census/rows.tsv
            ${{ runner.temp }}/census/fnrows.tsv
            ${{ runner.temp }}/census/fxrows.tsv
            ${{ runner.temp }}/census/fyrows.tsv
            ${{ runner.temp }}/census/bodyrows.tsv
            ${{ runner.temp }}/census/provenrows.tsv
            ${{ runner.temp }}/census/mutrows.tsv
            ${{ runner.temp }}/census/mutrows-old.tsv
            ${{ runner.temp }}/census/storerows.tsv
            ${{ runner.temp }}/census/kindrows.tsv
            ${{ runner.temp }}/census/freshrows.tsv
            ${{ runner.temp }}/census/fresh-kernel/verdicts.tsv
            ${{ runner.temp }}/census/fresh-kernel/summary.txt
            ${{ runner.temp }}/census/fresh-kernel/GuardFresh.log
            ${{ runner.temp }}/census/okrows.tsv
            ${{ runner.temp }}/census/shaperows.tsv
            ${{ runner.temp }}/census/windowrows.tsv
            ${{ runner.temp }}/census/window-dump
            ${{ runner.temp }}/census/window-kernel/verdicts.tsv
            ${{ runner.temp }}/census/window-kernel/index.tsv
            ${{ runner.temp }}/census/window-kernel/refused_*.v
            ${{ runner.temp }}/census/window-kernel/GuardWindow.log
            ${{ runner.temp }}/census/routinerows.tsv
            ${{ runner.temp }}/census/mutctx.txt
            ${{ runner.temp }}/census/keep

