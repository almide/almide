name: Native v1 vs v0 perf (nightly)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Lint
        shell: bash
        run: |
          mkdir -p out
          cargo build --release --bin almide
          mkdir -p /tmp/almide-bin && cp target/release/almide /tmp/almide-bin/
          /tmp/almide-bin/almide run tools/almide-gates/src/main.almd -- impl-count . > out/impl.log 2>&1 || true
          /tmp/almide-bin/almide run tools/almide-gates/src/main.almd -- impl-count . --update > out/impl-update.log 2>&1 || true
          git diff -- proofs/impl-count-ledger.toml > out/impl.diff
          git checkout -- proofs
          cargo clippy --release --workspace --all-targets --message-format=json > out/clippy.json 2> out/clippy.err || true
          git diff --name-only origin/post-rc1-fixes...HEAD > out/files.txt
          python3 - <<'PY'
          import json
          files=set(l.strip() for l in open('out/files.txt'))
          out=open('out/mine.txt','w'); n=0
          for line in open('out/clippy.json'):
              if not line.startswith('{'): continue
              m=json.loads(line)
              if m.get('reason')!='compiler-message': continue
              msg=m['message']
              if msg.get('level')!='warning': continue
              n+=1
              sp=[s for s in msg.get('spans',[]) if s.get('is_primary')]
              if sp and sp[0]['file_name'] in files:
                  out.write(msg.get('rendered') or '')
          print('total warnings (with dups)', n)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint
          path: |
            out/impl.log
            out/impl-update.log
            out/impl.diff
            out/mine.txt
            out/files.txt
