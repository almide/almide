name: Native v1 vs v0 perf (nightly)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

permissions:
  contents: read

jobs:
  control:
    name: Gate scripts over the control programs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - name: Build the compiler
        run: cargo build --release --bin almide
      - name: The gates over the control programs only
        run: |
          cp ctl-progs.txt proofs/native-verified-floor.txt
          bash scripts/check-native-v1-perf-small.sh > small.log 2>&1 || true
          NATIVE_V1_PERF_ONLY_SHAPES= bash scripts/check-native-v1-perf.sh > big.log 2>&1 || true
          grep -hE "^(LOSS|ok|small|debt|CLEAN|WORSE|BUILD-FAIL|RUN-FAIL|UNCERTIFIED|glue)" small.log big.log | grep -v "v1-shapes/" || true
          grep -hE "^LOSS .*int32" small.log big.log || true
