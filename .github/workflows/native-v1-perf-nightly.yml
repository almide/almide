name: Native v1 vs v0 perf (nightly)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

permissions:
  contents: read

jobs:
  probe:
    name: Probe v1 and v0 renders
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - name: Build the compiler
        run: cargo build --release --bin almide
      - name: Probe
        run: |
          bash probe.sh probe-int.txt probe-out/int
          for f in probe-out/int/*.v1.stdout; do b=${f%.v1.stdout}; cmp -s "$f" "$b.v0.stdout" && echo "same $b" || echo "DIFF $b"; done | tee probe-out/int/stdout-cmp.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe
          path: probe-out
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}
          save-if: false
      - name: fmt
        continue-on-error: true
        run: cargo fmt -p almide-mir --check 2>&1 | head -80
      - name: almide-mir
        continue-on-error: true
        run: cargo test --release -p almide-mir 2>&1 | grep -E "test result|FAILED|panicked|error(\[|:)|narrow" | head -60
      - name: native floor
        continue-on-error: true
        run: cargo test --release --test native_verified_floor_test 2>&1 | tail -30
      - name: clippy
        continue-on-error: true
        run: cargo clippy --release -p almide-mir 2>&1 | grep -A8 "render_native_narrow" | head -60
