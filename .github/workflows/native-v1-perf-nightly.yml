name: Native v1 vs v0 perf (nightly)

on:
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.97.0"

permissions:
  contents: read

jobs:
  probe:
    name: Hand-edited narrow local
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - name: Run
        run: bash hand/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe
          path: hand-out
