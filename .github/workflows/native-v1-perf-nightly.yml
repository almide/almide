name: Native v1 vs v0 perf (nightly)

# #4006, the no-perf-loss rule: every program the certified native render
# (v1) renders, and the curated shape benches in
# research/benchmark/perf/v1-shapes/, built both ways and compared by
# instruction count under cachegrind (scripts/check-native-v1-perf.sh). A v1
# loss over 1.03x that proofs/native-v1-perf-ledger.txt does not record fails
# the job; a wall-time ratio over 1.10x on a hot program is a warning in the
# run summary. The second step is the gate's negative control: with the
# render's moves turned off it must fail.
#
# The gate's two blind spots each have a second check, in their own jobs
# (proofs/gate-verification.toml): `small` gates the programs under 1M
# instructions on their own work, counted inside main (callgrind)
# (scripts/check-native-v1-perf-small.sh), and `shapes` holds the render
# paths no program in the perf corpus exercises
# (scripts/check-native-v1-perf-shapes.sh). Each runs its negative control.

on:
  schedule:
    # 06:35 UTC — after the memory-trap controls (06:05).
    - cron: "35 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

permissions:
  contents: read

jobs:
  hit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Hit
        run: |
          cargo build -q --release -p almide-mir --example render_corpus
          { grep -E '^spec/' proofs/native-verified-floor.txt; ls research/benchmark/perf/v1-shapes/*.almd; } > corpus.txt
          target/release/examples/render_corpus < corpus.txt 2>&1 | grep -B1 -A1 HIT513 | head -40
