name: Native v1 vs v0 perf (nightly)

# #4006, the no-perf-loss rule: every program the certified native render
# (v1) renders, and the curated shape benches in
# research/benchmark/perf/v1-shapes/, built both ways and compared by
# instruction count under cachegrind (scripts/check-native-v1-perf.sh). A v1
# loss over 1.03x that proofs/native-v1-perf-ledger.txt does not record fails
# the job; a wall-time ratio over 1.10x on a hot program is a warning in the
# run summary. The second step is the gate's negative control: with the
# render's moves turned off it must fail.

on:
  schedule:
    # 06:35 UTC — after the memory-trap controls (06:05).
    - cron: "35 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

permissions:
  contents: read

jobs:
  v1-vs-v0:
    name: Certified native render is not slower than the standard codegen
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/root-tmpdir

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release-${{ env.RUST_TOOLCHAIN }}

      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Build the compiler
        run: cargo build --release --bin almide

      - name: v1 vs v0 over the certified floor and the shape benches
        run: bash scripts/check-native-v1-perf.sh

      - name: Negative control — with the moves off the gate must fail
        run: |
          if ALMIDE_NATIVE_DRILL_NO_MOVES=1 NATIVE_V1_PERF_ONLY_SHAPES=1 bash scripts/check-native-v1-perf.sh > drill.log 2>&1; then
            cat drill.log
            echo "the gate read green with the render's moves turned off"
            exit 1
          fi
          grep -E '^LOSS .*push_swap' drill.log
