name: "Fetch the test archive"
description: >-
  Download the build job's nextest archive (almide-tests-archive) onto the
  runner's root volume and export its path as TEST_ARCHIVE_FILE. The ONE place
  every job that unpacks the archive gets it from, so the location cannot drift
  between them. Not /tmp: on the current ubuntu-latest image /tmp is a ~7.9 GB
  tmpfs (df in run 40618688174), and the 3.0 GB download plus its 839-binary
  unpack overran it ("Disk quota exceeded"). The unpacks themselves go to
  $TMPDIR, which .github/actions/root-tmpdir moves to the root volume.

runs:
  using: "composite"
  steps:
    - name: Disk before the archive
      shell: bash
      run: df -h / /tmp "$RUNNER_TEMP"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: almide-tests-archive
        path: ${{ runner.temp }}/almide-archive
    - name: Export the archive's location
      shell: bash
      run: |
        echo "TEST_ARCHIVE_FILE=$RUNNER_TEMP/almide-archive/almide-tests.tar.zst" >> "$GITHUB_ENV"
        ls -la "$RUNNER_TEMP/almide-archive"
        df -h / /tmp "$RUNNER_TEMP"
