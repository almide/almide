pre-commit:
  commands:
    roadmap-readme:
      glob: "docs/roadmap/{active,on-hold,done}/*.md"
      run: bash docs/roadmap/generate-readme.sh > docs/roadmap/README.md && git add docs/roadmap/README.md
    rt-oracle-registry:
      # emit_wasm/*.rs and rt-oracle-registry.toml were deleted with the v0
      # retirement (#782) — dead glob members pruned (#981). The hook stays
      # wired so the tombstone re-arms if emit_wasm/ ever reappears.
      glob: "{scripts/check-rt-oracle-registry.sh,scripts/lib/contract-classes.txt}"
      run: scripts/check-rt-oracle-registry.sh
    contracts:
      glob: "{docs/contracts/contracts.toml,docs/contracts/*.md,spec/wasm_cross/*.almd,scripts/check-contracts.sh,scripts/lib/contract-classes.txt,scripts/gen-claims.sh,README.md}"
      run: bash scripts/gen-claims.sh && git add README.md && scripts/check-contracts.sh && bash docs/contracts/generate-readme.sh > docs/contracts/README.md && git add docs/contracts/README.md
    release-seals:
      glob: "{proofs/releases/*.toml,scripts/release-seal.sh}"
      run: bash scripts/release-seal.sh check
    gate-verification:
      glob: "{proofs/gate-verification.toml,scripts/check-*.sh,proofs/*.sh}"
      run: bash scripts/check-gate-verification.sh
    tor-refs:
      glob: "{proofs/TOR.md,scripts/check-tor-refs.sh}"
      run: bash scripts/check-tor-refs.sh
    als-element-coverage:
      glob: "{proofs/als-element-coverage.toml,scripts/check-als-element-coverage.sh,scripts/lib/als-element-enumerate.py,crates/almide-syntax/src/ast.rs,docs/specs/als/*.md}"
      run: bash scripts/check-als-element-coverage.sh
    libm-determinism:
      glob: "{runtime/rs/src/*.rs,crates/almide-kernel/src/*.rs,proofs/libm-determinism-audit.toml,scripts/check-libm-determinism.sh,scripts/lib/libm-call-enumerate.py}"
      run: bash scripts/check-libm-determinism.sh
    scalar-read-audit:
      glob: "{crates/almide-mir/src/lower/*.rs,proofs/scalar-read-audit.toml,scripts/check-scalar-read-audit.sh,scripts/lib/scalar-read-enumerate.py}"
      run: bash scripts/check-scalar-read-audit.sh
    wat-prelude-audit:
      # STRUCTURE only pre-commit (no reachability re-render — that needs the
      # render_program example binary and runs in CI). Catches the common local
      # failure: a `(func $…)` added or edited without its ledger row.
      glob: "{crates/almide-mir/src/render_wasm*.rs,proofs/wat-prelude-audit.toml,scripts/check-wat-prelude-audit.sh,scripts/lib/wat-prelude-enumerate.py}"
      run: bash scripts/check-wat-prelude-audit.sh
    ratchet-separation:
      run: scripts/check-ratchet-separation.sh
    workflow-parse:
      # A schedule-only workflow that cannot parse fails SILENTLY at trigger
      # time (#1234, the 0.57.0 fuzz-nightly dup-key incident) — strict-parse
      # every workflow file whenever one changes.
      glob: "{.github/workflows/*.yml,.github/workflows/*.yaml,scripts/check-workflows.sh}"
      run: bash scripts/check-workflows.sh
    semantics-manifest:
      # Globbed by PATTERN, not by covered module: the hook named
      # stdlib/string.almd literally, so the next module onto the ratchet
      # would edit its surface without ever arming the gate. COVERED_MODULES
      # in the check script is the one place the module list lives.
      glob: "{docs/stdlib/semantics-manifest.toml,stdlib/*.almd,spec/stdlib/*_semantics_manifest_test.almd,scripts/check-semantics-manifest.sh}"
      run: scripts/check-semantics-manifest.sh

commit-msg:
  scripts:
    "english-only":
      runner: python3
