pre-commit:
  commands:
    roadmap-readme:
      glob: "docs/roadmap/{active,on-hold,done}/*.md"
      run: bash docs/roadmap/generate-readme.sh > docs/roadmap/README.md && git add docs/roadmap/README.md
    rt-oracle-registry:
      # emit_wasm/*.rs and rt-oracle-registry.toml were deleted with the v0
      # retirement (#782) — dead glob members pruned (#981). The hook stays
      # wired so the tombstone re-arms if emit_wasm/ ever reappears.
      glob: "{scripts/check-rt-oracle-registry.sh,scripts/lib/contract-classes.txt}"
      run: scripts/check-rt-oracle-registry.sh
    contracts:
      glob: "{docs/contracts/contracts.toml,docs/contracts/*.md,spec/wasm_cross/*.almd,scripts/check-contracts.sh,scripts/lib/contract-classes.txt,scripts/lib/dojo-families.txt,tests/diagnostics/*/meta.toml,docs/specs/als/*.md,scripts/gen-claims.sh,scripts/lib/ledger-counts.sh,proofs/ledger-counts.toml,README.md}"
      run: bash scripts/gen-claims.sh && git add README.md && scripts/check-contracts.sh && bash docs/contracts/generate-readme.sh > docs/contracts/README.md && git add docs/contracts/README.md
    contract-citations:
      # Every `C-NNN` spelled outside the ledger and the fixture headers must
      # name a ledger contract (#2406). Cheap (one python walk, ~1s), so the
      # glob is the whole citation surface rather than a guess at it.
      glob: "{docs/contracts/contracts.toml,scripts/check-contract-citations.sh,stdlib/**/*.almd,crates/**/*.rs,src/**/*.rs,runtime/**/*.rs,docs/**/*.md,proofs/**/*.toml,spec/**/*.almd,llms.txt,README.md,CHANGELOG.md}"
      run: bash scripts/check-contract-citations.sh
    readme-stats:
      # The README's derived-count blocks and the no-undated-count rule. The
      # Hello, world baseline (docs/benchmarks/wasm-size.txt) is re-stamped by
      # `--measure`, never by hand — CI rebuilds it and demands the same bytes.
      glob: "{README.md,docs/stdlib/*.md,docs/benchmarks/wasm-size.txt,docs/contracts/contracts.toml,spec/**/*.almd,scripts/gen-readme-stats.sh,scripts/gen-mutation-score.sh,proofs/mutation-score.toml,scripts/check-readme-numbers.sh,scripts/lib/ledger-counts.sh,proofs/ledger-counts.toml,docs/wasm/README.md,docs/project/BENCHMARKS.md}"
      run: bash scripts/gen-readme-stats.sh && bash scripts/gen-mutation-score.sh --render && git add README.md && bash scripts/check-readme-numbers.sh
    release-seals:
      glob: "{proofs/releases/*.toml,scripts/release-seal.sh}"
      run: bash scripts/release-seal.sh check
    gate-verification:
      glob: "{proofs/gate-verification.toml,scripts/check-*.sh,proofs/*.sh}"
      run: bash scripts/check-gate-verification.sh
    tor-refs:
      glob: "{proofs/TOR.md,scripts/check-tor-refs.sh}"
      run: bash scripts/check-tor-refs.sh
    pass-roster:
      glob: "{docs/ARCHITECTURE.md,crates/almide-codegen/src/*.rs,crates/almide-optimize/src/**/*.rs,scripts/check-pass-roster.sh}"
      run: bash scripts/check-pass-roster.sh
    als-element-coverage:
      glob: "{proofs/als-element-coverage.toml,scripts/check-als-element-coverage.sh,scripts/lib/als-element-enumerate.py,crates/almide-syntax/src/ast.rs,docs/specs/als/*.md}"
      run: bash scripts/check-als-element-coverage.sh
    libm-determinism:
      glob: "{runtime/rs/src/*.rs,crates/almide-kernel/src/*.rs,proofs/libm-determinism-audit.toml,scripts/check-libm-determinism.sh,scripts/lib/libm-call-enumerate.py}"
      run: bash scripts/check-libm-determinism.sh
    scalar-read-audit:
      glob: "{crates/almide-mir/src/lower/*.rs,proofs/scalar-read-audit.toml,scripts/check-scalar-read-audit.sh,scripts/lib/scalar-read-enumerate.py}"
      run: bash scripts/check-scalar-read-audit.sh
    wat-prelude-audit:
      # STRUCTURE only pre-commit (no reachability re-render — that needs the
      # render_program example binary and runs in CI). Catches the common local
      # failure: a `(func $…)` added or edited without its ledger row.
      glob: "{crates/almide-mir/src/render_wasm*.rs,proofs/wat-prelude-audit.toml,scripts/check-wat-prelude-audit.sh,scripts/lib/wat-prelude-enumerate.py}"
      run: bash scripts/check-wat-prelude-audit.sh
    ratchet-separation:
      run: scripts/check-ratchet-separation.sh
    workflow-parse:
      # A schedule-only workflow that cannot parse fails SILENTLY at trigger
      # time (#1234, the 0.57.0 fuzz-nightly dup-key incident) — strict-parse
      # every workflow file whenever one changes.
      glob: "{.github/workflows/*.yml,.github/workflows/*.yaml,scripts/check-workflows.sh}"
      run: bash scripts/check-workflows.sh
    semantics-manifest:
      # Globbed by PATTERN, not by covered module: the hook named
      # stdlib/string.almd literally, so the next module onto the ratchet
      # would edit its surface without ever arming the gate. COVERED_MODULES
      # in the check script is the one place the module list lives.
      glob: "{docs/stdlib/semantics-manifest.toml,stdlib/*.almd,spec/stdlib/*_semantics_manifest_test.almd,scripts/check-semantics-manifest.sh}"
      run: scripts/check-semantics-manifest.sh
    fold-seed-source:
      # #2380: the census of `list.fold(xs, <seed that reads xs>, f)` sites
      # (the #2377 shape) over stdlib/ spec/ examples/ tools/, held as a
      # shrink-only floor. Fires on the corpus, the scanner and the floor;
      # runs the PATH `almide` — the gate needs only stdlib, no compiler
      # feature newer than the last release.
      glob: "{stdlib/*.almd,spec/**/*.almd,examples/**/*.almd,tools/almide-gates/src/fold_seed_source.almd,proofs/fold-seed-source-baseline.txt}"
      run: almide run tools/almide-gates/src/main.almd -- fold-seed-source .
    stdlib-docs:
      # A stdlib surface change (any stdlib/*.almd), a doc page edit, the
      # clock table, or the generator itself re-arms the regenerate-and-diff
      # (#1469). The block is derived from the PATH binary here; CI reads
      # the freshly built one.
      glob: "{docs/stdlib/*.md,stdlib/*.almd,crates/almide-types/src/time_units.rs,tools/gen-stdlib-doc-index.py,scripts/check-stdlib-docs.sh}"
      run: bash scripts/check-stdlib-docs.sh
    layout-discipline:
      # Globbed over ALL compiler/CLI Rust, not over the ledger: #1316 exists
      # because the discipline has to bite at the moment a NEW long-lived
      # structure is written, without anyone remembering to ask. 0.2s scan.
      glob: "{crates/**/*.rs,crates/*/src/*.rs,src/**/*.rs,src/*.rs,proofs/layout-ledger.toml,scripts/check-layout-discipline.sh,scripts/lib/layout-enumerate.py}"
      run: bash scripts/check-layout-discipline.sh

# The two gates that cost a CI round each on 2026-09-21 and are cheap enough
# to hold a PUSH (not a commit): the clippy ratchet (a collapsible `if` was
# 1457 > 1456) and run_parity's shrink-only abstention ceiling (a fixture the
# interpreter could not vote on was 19 > 18). Both read the whole tree, so
# there is no glob — every push pays them, and a push that would have failed
# CI fails here in minutes instead of in an hour. `LEFTHOOK=0 git push` skips.
# CONDITIONAL, stated where the claim is: run_parity verdicts everywhere
# (~90 s) and is the half that would have caught #2414. The clippy count is
# toolchain-coupled, so it verdicts ONLY on the pinned 1.94.0; on any other
# toolchain the stanza below prints NO VERDICT and skips — the push is still
# green, and that green is not a clippy verdict. On this machine the toolchain
# is qusp-managed (no rustup, no ~/.rustup), so the pin cannot be installed by
# the usual route and the clippy half is CI's alone (measured 2026-09-21).
pre-push:
  parallel: true
  commands:
    clippy-ratchet:
      # A VERDICT only on the pinned toolchain. Off-pin the count is not
      # comparable to the baseline (clippy grows lints every release), so
      # the hook says so LOUDLY and skips instead of spending minutes on a
      # number that cannot fail: a green push is never a clippy verdict here.
      # This machine's toolchain is qusp-managed (no rustup), so the pin is
      # not installable by the usual route — CI's pinned run is the judge.
      run: |
        if rustup toolchain list 2>/dev/null | grep -q '^1\.94\.0'; then
          bash scripts/check-clippy-warnings.sh
        else
          echo "clippy-ratchet: NO VERDICT — pinned 1.94.0 not installed (local: $(rustc --version 2>/dev/null || echo unknown)); CI judges the ratchet. Set CLIPPY_REQUIRE_PIN=1 to fail instead."
          [ "${CLIPPY_REQUIRE_PIN:-}" != "1" ]
        fi
    run-parity:
      run: cargo test --release -p almide-spine --test run_parity

commit-msg:
  scripts:
    "english-only":
      runner: python3
