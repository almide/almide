# UTF-8 producer ledger (#4005 A4; the certificate that retires it is #4395),
# gated by scripts/check-utf8-producers.py (CI `checks`, with its --self-test
# drill). The script's docstring is the full reference.
#
# proofs/TRUSTED_BASE.md trusts one representation invariant: a String block's
# payload is valid UTF-8. Every operation that can put bytes into a String
# block has a row here saying HOW its output stays valid. The gate derives the
# row SET from declarations, so a new producer without a row fails CI:
#   [[fn]]     public stdlib functions whose declared type hands out a String
#   [[op]]     host ops the guest can call (verdict per leg: embedded / p1 / component)
#   [[prim]]   prim.* operations the self-hosted stdlib calls
#   [[mint]]   stdlib sources that mint String blocks (prim.alloc_str)
#   [[helper]] the wasm emitter's runtime helpers
#
# The verdicts:
#   validates     checks or lossily repairs bytes it did not make
#   construction  builds from valid Strings and ASCII, cuts only at boundaries
#   host          the String comes from the [[op]] rows in `ops`
#   obligation    writes raw bytes; the calling [[mint]] / [[op]] row carries the evidence
#   typed         (op leg) crosses an interface typed as valid text (a Component Model string, a Rust String)
#   message       (op leg) host-authored text only: static ASCII, the guest's own path, a Rust String
#   none          puts no bytes into a String block
#   unserved      (op leg) the leg does not serve the op
#   open          CAN produce invalid UTF-8 today: a named exception of the
#                 trusted-base row, with the `fix` that closes it
#
# A validates/construction verdict cites evidence (`file::test`). The test must
# feed invalid bytes: it holds a byte no UTF-8 contains. An Almide test must
# also call the producer and check the output with its file's own `utf8_ok`
# oracle.
#
# The open list only shrinks. `open_ceiling` equals the number of open rows,
# and it comes down, in its own commit, as each fix lands.
open_ceiling = 19

# ── leaf types: return-type names no index or stdlib `type` declares ──
# `string` says whether a value of the type can hold a String block. A
# container's own name is false: its arguments are read where they are
# written (List[String] is caught by `String`).

