# The WASI/Component-Model version-pin policy (#1628 stage 4).
#
# WASI 0.3.x cuts a minor every two months and minors ADD WIT-language
# requirements (0.3.1 already requires `map<K,V>` / `implements`), so
# "which WASI minor the p3 leg targets" is a LEDGER ROW, not an
# assumption — and every place that row's facts appear in the tree is
# re-derived against this file by scripts/check-wasi-pins.sh (CI
# `checks` job): a drifted pin fails the gate naming the file that
# moved.
#
# Change protocol: bump a field here IN THE SAME PR as the thing that
# moved (a vendored-WIT upgrade, a wasmtime major, a flag change), with
# the upstream release named in `sources`. The wasm-tools family
# (wasmparser / wasm-encoder / wit-component / wit-parser) moves in
# LOCKSTEP (session doctrine — split-family versions have broken parses
# before); the gate checks the workspace pins agree with each other.

[wasi]
# The WASI minor the p3 component leg targets. The vendored WIT under
# crates/almide-wasm-run/wit/p3/ carries interfaces at EXACTLY this
# version, copied from the RUNTIME's vendored tree (the runtime's copy
# is the ground truth, not wasi-cli's draft tags — the rc-2025-09-16
# draft had `async func` stdio while the ratified 0.3.0 ships
# write-via-stream sync+future, and only the runtime tree showed it).
minor = "0.3.0"

[runtime]
# wasmtime floor for the p3 leg: 46 is the first release running p3 BY
# DEFAULT; LTS 36 has NO default p3 (documented refusal, not a target).
# `crate_major` is the embedded host's Cargo pin — wasmtime, and the
# wasmtime-wasi / wasmtime-wasi-http p3 worlds it runs an HTTP program's
# component on (ADR-0023 step 7), in lockstep (§6.5: their p3 modules are
# experimental and get no patch backports, so they move with the major);
# `ci` is the release CI installs for the execution legs.
floor = 46
crate_major = 50
ci = "v50.0.1"
# The flag surface the p3 execution legs pass (47.x, unchanged on 49.x and 50.x): NO feature flag
# (ADR-0023 step 1). The shim uses only the baseline async builtins
# (`waitable-set.*`, the `[async-lower]` stream/future copies), which
# need `component-model-async` alone — on by default since 46, as is p3
# itself, so neither `-W component-model-more-async-builtins` nor
# `-S p3=y` is passed; the component validates with the 🚝 feature off
# (`wasi_p3::validate_baseline`, run on every emit). -S http=y is the
# capability grant, not a feature: it mounts wasi:http@0.3 for the client
# leg (#1710 PR B); components that import it refuse to link without it.
flags = "-S http=y"

[wasm-tools]
# The lockstep family version (workspace Cargo pins). 0.259 is the
# 0.3.1-era toolchain (WIT `map<K,V>` / `implements` support) — the
# coordinated bump #1759 landed the family as ONE change after the
# per-crate dependabot PRs each failed on split-family version skew,
# and #2336 repeated it for 0.259 after the same four PRs failed the
# same way. The per-crate PRs are now grouped in .github/dependabot.yml
# so the family arrives as one proposal. 0.261 (#3427, with gimli/rustix/wat
# in one batch) added `canonical_names` to `embed_component_metadata`; both
# call sites pass false, which keeps 0.259's encoding. 0.262 (#3877, with the
# other open dependabot updates) renamed `Payload::CodeSectionStart { range }` to
# `unchecked_range`, read in dwarf.rs and its line test.
family = "0.262"

[sources]
