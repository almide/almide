# =============================================================
# DIALECT EPOCH LEDGER — what a `@dialect(N)` stamp means
# =============================================================
# Almide's users are code generators. A model writes against whatever dialect
# it learned, and the file records that dialect in a `@dialect(N)` stamp so the
# compiler can tell a stale dialect from a wrong program — and so
# modification-survival rate can be measured per dialect instead of in
# aggregate.
#
# An epoch is NOT a release. Almide cut 219 releases in its first 5.3 months
# and almost none of them changed anything a writer can observe; stamping the
# release version would rewrite every file's first line every few hours and
# tell a reader nothing. The epoch advances only when the language surface
# changes in a way that can BREAK ALREADY-WRITTEN CODE — a spelling removed, a
# previously-accepted program rejected, a construct's meaning changed.
#
# Rules:
#   - `n` is a positive integer, unique, strictly ascending, gapless.
#   - Every epoch above 1 lists `breaks`: what a file written for the PREVIOUS
#     epoch must change. An epoch with no break is not an epoch.
#   - The highest `n` here is the CURRENT dialect, and it must equal
#     `CURRENT_DIALECT` in crates/almide-types/src/dialect.rs. The two are
#     cross-checked by scripts/check-dialect-epochs.sh, so neither can drift.
#   - Entries are APPEND-ONLY. An epoch that shipped is history; editing it
#     rewrites what a stamp in an existing file means.
#   - A spelling kept alive for a window before it is removed is a
#     `[[deprecation]]` (after the epochs): `since_epoch` is the epoch it was
#     deprecated in, `removal_epoch` the future epoch whose `breaks` will
#     remove it. Deprecating breaks nothing, so it takes no epoch of its own;
#     the removal does. `removal_epoch` must be above `since_epoch`, and the
#     compiler constant that prints it is cross-checked by
#     scripts/check-dialect-epochs.sh.
#
# What this ledger is not, yet: the join to per-break migration diagnostics.
# The `breaks` strings are prose today. Making each one a `@deprecated`
# with a `since` epoch and a use-site repair hint is the next arc — that is
# what turns a stale stamp from a label into an automatic fix.

[[epoch]]
n = 1
since = "0.1.0"
name = "pre-error-surface"
summary = "The original dialect: implicit `?` propagation and the `try_*` function family."
breaks = []

[[epoch]]
n = 2
since = "0.54.0"
name = "explicit-error-surface"
summary = "The error surface became explicit and the redundant spellings were removed (ADR arc v0.54-v0.56)."
breaks = [
  "implicit `?` propagation removed — an un-annotated `let x = f()` where `f` is an effect fn is E041; write `f()!` to propagate",
  "the user-spelled `try_*` function family removed — use the `T?` / `T!` postfix forms",
  "a bare effect call in statement position is E042 (must-use) — write `let _ = f()` to discard",
]
# Late enforcement of an existing break, not a new epoch. The ledger is
# append-only; these notes add to epoch 2 without changing what it means.
notes = [
  "2026-09-30, 0.66.0 (#3063): the implicit-`?` break is now enforced on field and index assignment targets too. `s.f = f()`, `xs[i] = f()` and `o.inner.f = f()` had escaped E041 because the checker never typed their values. They were always epoch-2 violations. Each E041 carries the positioned `!` fix-it (`s.f = f()!`), the same one `let x = f()` gets. Like every E041 it is a suggestion that `almide fix --json` lists, not an automatic rewrite (#1312).",
]

[[epoch]]
n = 3
since = "0.57.0"
name = "resolution-hardening"
summary = "Two silently-accepted ambiguities became hard errors (the V-eradication campaign)."
breaks = [
  "a local fn whose name collides with a selectively-imported fn is E050 — rename one, or drop the selective import",
  "two cases with the same name in one module are E019 at registration — previously the later registration silently won",
]

[[epoch]]
n = 4
since = "0.63.0"
name = "literal-exit-domain"
summary = "Literal process exit codes must fit the portable exit-code domain."
breaks = [
  "a direct call to stdlib process.exit with an integer literal outside 0..=125 is E084, including signed/parenthesized literals and pipe calls — choose an exit code within that range; computed arguments retain the runtime domain check",
]

# Note on epoch 4 (#2780): the entry stays as it shipped, because entries are
# append-only. After 0.64.0, E084's range went back up to the exit status
# 0..=255. A literal from 126 through 255 is accepted again; one below 0 or
# above 255 is still E084. That change only accepts more programs, so it is not


# an epoch.

[[epoch]]
n = 5
since = "0.63.0"
name = "mut-byte-writers"
summary = "The bytes in-place writers declare their receiver `mut`, like `list.push` and `bytes.push` (#2466)."
breaks = [
  "passing a `let` binding, a non-`mut` parameter or a temporary to a bytes writer (`bytes.append_*`, `set_*`, `write_*`, `fill`, `clear`, `copy_from`) is E032 — declare a local buffer with `var`, and give a helper that fills its caller's buffer a `mut b: Bytes` parameter (the caller then passes a `var`)",
]
# Late enforcement of an existing break, not a new epoch. The ledger is
# append-only; these notes add to epoch 5 without changing what it means.
notes = [
  "2026-10-22, 0.68.0 (#3966): the break now covers `bytes.as_mut_ptr`, the writer whose writes go through the RawPtr it returns. It declares its receiver with `@mutating` rather than `mut b`, and the checker read only `mut b`, so a `let` binding or a plain parameter passed to it escaped E032 — and a write through the pointer changed the caller's `let` binding on native but not on wasm. Same repair: a `var` buffer, or a `mut b: Bytes` parameter.",
]

[[epoch]]
n = 6
since = "0.67.0"
name = "no-var-in-concurrent-bodies"
summary = "E008 generalized from a `fan` block capturing a `var` to any concurrently-run body reaching one: http handlers, every fan head and callback, and the user fns their slots flow through (ADR-0020 §3, #2697). Measured impact: 0 programs across spec/, examples/, stdlib, research exercises and the 44 downstream canary projects."
breaks = [
  "a `var` reachable from an http handler or a `fan` body (captured, top-level, or through a called fn) is E008; keep cross-request state outside the program, bind a `let` copy for read-only use",
]

[[epoch]]
n = 7
since = "0.67.0"
name = "fan-map-runs-every-element"
summary = "`fan.map` evaluates every element in list order, including the ones after an element that returns `Err`, and the lowest-index `Err` surfaces — the rule `fan { }` block arms already followed (ADR-0024 D1, C-005). Measured impact: 0 programs — none of the 18 programs in spec/ and examples/ that call `fan.map` changes its observation (native A/B against 0.64.0), and the almide-dojo corpus (124 .almd files) has no `fan.map`."
breaks = [
  "`fan.map` runs every element even after one returns `Err`; to stop at the first failure, use a `for` loop with `!`",
]

[[epoch]]
n = 8
since = "0.67.0"
name = "readers-are-effects"
summary = "A plain fn writes and aborts but never reads (ADR-0022): the stdlib readers that were plain fns are effect fns, `@pure` is checked, and `[permissions]` sees the categories the stdlib and externs really touch (#3245, #3246, #3248, #3250)."
breaks = [
  "`io.read_byte`, `io.read_n_bytes`, `process.args` and the `args` readers (`args.flag`, `args.option`, `args.option_or`, `args.positional`, `args.positional_at`, `args.raw`) are `effect fn`s — a call from a plain fn is E006; mark the caller `effect fn`, or read in the caller and pass the value in",
  "`@pure` is checked — a `@pure` fn that is an effect fn or an extern, or that reaches `println` / `eprintln` / `panic` / `assert*`, a stdlib call with an effect category, or an `@extern`, is E092; move that call to a caller, or remove `@pure`",
  "`[permissions].allow` counts `random` as `Rand` and `io` as `IO`, and an `@extern` fn as every category — a project whose allow list omits one of those now fails `almide build` with a capability violation; add the category it names (an extern needs all six until a bound can be declared)",
]

[[epoch]]
n = 9
since = "0.67.0"
name = "closure-mutation-every-write-form"
summary = "E011 judges the binding a closure mutates, so every write form of an enclosing `var` inside a pure fn's closure is rejected — not only the whole assign (#3344)."
breaks = [
  "inside a closure of a pure fn, an index or map-key write (`seen[k] = v`), a field or nested-place write (`s.f = v`), or an in-place mutator handed the enclosing `var` (`list.push(acc, x)`) is E011, as `seen = v` already was — mark the enclosing fn `effect fn`, or move the mutation out of the closure (a `for` loop, or a `list.fold` / `list.map`)",
]

[[epoch]]
n = 10
since = "0.67.0"
name = "names-resolve-where-declared"
summary = "Two names the checker used to accept without resolving them are refused: a module-qualified type resolves only through a module in scope that declares it, and every `[permissions].allow` name must be a grantable capability (#3252). Found by the v0.67.0-rc1 downstream canary (run 37224303801): almide/parsegen and O6lvl4/gramide (types), almide/porta (permissions)."
breaks = [
  "a type qualified by a module the file does not import (`lex.LexError` with no `import self.lex`), or by a module that does not itself declare it (`dfa.Dfa` where package `dfa` declares `Dfa` in its submodule `table`), is E029 — import the declaring module (`import self.lex`, `import dfa.table`) and qualify by it (`table.Dfa`)",
  "an unknown name in `[permissions].allow` (`\"FS.read\"`, `\"FS.write\"`) is refused on its manifest line (0.66.0 accepted it) — write only IO, Net, Env, Time, Rand, Fan (file access is IO)",
]

[[epoch]]
n = 11
since = "0.67.0"
name = "served-app-is-instance-closed"
summary = "The app passed to `http.serve` is instance-closed: it reads no local of the fn that serves it, only top-level items (ADR-0020 §5.2, #2698). Measured impact: 1 program across spec/, examples/, stdlib and research exercises (spec/serve_cross/http_serve_replay.almd, migrated in the same change)."
breaks = [
  "an app passed to `http.serve` that reads a `let`, `var` or parameter of the fn that serves it (a handler lambda capturing a local of main, or `let app = http.router(…)!` in main) is E095; make the value a top-level `let` (`let app = http.router(…)` served as `http.serve(port, app!)!`) or compute it inside the handler",
]

[[epoch]]
n = 12
since = "0.67.0"
name = "mut-param-fn-is-not-a-value"
summary = "A fn with a `mut` parameter is called, never used as a function value (#3456): a function type cannot carry the write-back, so a call through the value lost it on wasm and failed rustc E0596 natively. Measured impact: 0 of 4,497 programs across spec/, examples/, stdlib/, research/benchmark/exercises/ and tests/diagnostics/ (the new E096 fixture aside)."
breaks = [
  "a fn with a `mut` parameter used as a value (`let f = bump`, `list.map(xs, f)` where `f` takes `mut`, a record field, a list element, a return value, `module.fn`, `list.push`) is E096; call it directly (`bump(s)` with `var s`) or pass a lambda that names the `var` (`() => bump(s)`). It never built natively; on wasm only a fn that mutates its own copy ran correctly, and that fn drops `mut` and rebinds with `var` inside",
]

[[epoch]]
n = 13
since = "0.67.0"
name = "argv-readers-are-effects"
summary = "The `args` module's readers read argv, so they are `effect fn`s like `env.args` and `process.args` (#848, ADR-0022: a plain fn writes and aborts but never reads). They have Almide bodies, so a call is typed `Result[T, String]` like a user effect fn's. Measured impact: 4 of 4,507 programs across spec/, examples/, stdlib/, research/benchmark/exercises/ and tests/diagnostics/ (the new E006 fixtures aside), all 4 for the missing `!` (E001/E005/E041/E025) and 0 for E006."
breaks = [
  "`args.raw`, `args.flag`, `args.option`, `args.option_or`, `args.positional` and `args.positional_at` are `effect fn`s — a call from a plain fn is E006; mark the caller `effect fn`, or read the arguments in `effect fn main` and pass the value in",
  "a call to an `args` reader is typed `Result[T, String]` and is propagated with `!` like any Almide-bodied effect fn's: `args.flag(\"verbose\")!`, `args.option(\"out\")! ?? \"-\"`; without it the value is a Result (E041 on a `let`, a type mismatch as an argument)",
]

[[epoch]]
