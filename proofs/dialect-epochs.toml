[[epoch]]
n = 15
since = "0.69.0"
name = "stdlib-redesign"
summary = "The standard-library redesign (docs/roadmap/stdlib-redesign/). Its waves add their breaks here. First: the memory-unsafe stdlib surface moves to an explicitly imported `ffi` module (R-ffi-01, R-L0-45), and `--profile critical` refuses everything outside the memory-safety guarantee (#4008)."
breaks = [
  "under `--profile critical`, every `ffi.*` call, the deprecated `bytes` raw-pointer functions (`as_ptr`, `as_mut_ptr`, `data_ptr`, `from_raw_ptr`, `copy_to_ptr`) and an `@extern` fn declaration are E100 (outside the memory-safety guarantee), and no `--allow` grants them; the program checked without the profile is unchanged. Keep raw-address and foreign code in a module that is not checked with `--profile critical`",
  "a program that runs as its p3 component on the embedded wasm host (`almide run --target wasm` of a program naming the full-response http family) has the working directory and the temp dir preopened instead of `/` (#4022): an fs path outside both now errs there; grant it with `[permissions] fs = [\"<dir>\", …]` in almide.toml, which preopens exactly the listed directories",
]

# DEPRECATIONS — spellings accepted for a window, with the epoch that removes them
# =============================================================

# A window is a [[deprecation]] block: id, issue, since_epoch, since,
# removal_epoch, summary, removal. `legacy-native-callback-names` (#3425,
# since epoch 10) reached its removal_epoch 14 and is a break of epoch 14 above.

[[deprecation]]
id = "bytes-raw-pointers-to-ffi"
issue = 3853
since_epoch = 15
since = "0.69.0"
removal_epoch = 16
summary = "The five `bytes` raw-pointer functions are `@deprecated` (E052) in favour of the `ffi` module, which needs `import ffi` (R-ffi-01). `ffi.read` / `ffi.write` are effect fns (R-ffi-02) and `ffi.write` takes the address first (R-ffi-03)."
removal = "`bytes.as_ptr(b)` / `bytes.as_mut_ptr(b)` → `ffi.address(b)`; `bytes.data_ptr(b)` → `ffi.to_int(ffi.address(b))` (0 for an empty b); `bytes.from_raw_ptr(p, n)` → `ffi.read(p, n)` from an effect fn; `bytes.copy_to_ptr(b, p, c)` → `ffi.write(p, b, c)` from an effect fn — each with `import ffi`"

# ======================================================
