  "`mem.save()` → delete the call, and the `import mem` line with it: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "`mem.restore(mark)` → delete the call, and the `import mem` line with it: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "`bytes.heap_save()` → delete the call: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "`bytes.heap_restore(mark)` → delete the call: it took or rewound an opaque arena checkpoint, and under reference counting it did nothing on any target",
  "the pre-#3338 callback spellings a package's `native/*.rs` could still call (deprecation `legacy-native-callback-names`, #3425, since epoch 10) are gone: a `native/*.rs` calling `crate::almide_rt_<pkg>_v<N>_<fn>` or `..._v<N>_<sub>_<fn>` gets rustc E0425 — write the injective name (`_` in a segment is `_0`, a `.` is `_1`: `almide_rt_tf_v0_calc_double` → `almide_rt_tf_0v0_1calc_double`)",
