  "`matrix.qwen3_block_f32_kv(…)` → `import nn.kernels` + `kernels.qwen3_block_f32_kv(…)` (package almide-graphics/nn: `almide add almide-graphics/nn@v0.2.0 --trust github.com/almide-graphics`; the same arguments)",
