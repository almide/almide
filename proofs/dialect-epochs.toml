summary = "Thirty-three stdlib functions leave the language with no deprecation window (owner ruling 2026-10-17). The four LLM-provider streaming clients move to package almide/llm, built on the generic `http.request_stream` that stays; the twenty-five neural-network kernels of `matrix` move to package almide/nnlib, pure Almide over the generic `matrix` API that stays; the arena checkpoints `mem.save`/`mem.restore` (the whole `mem` module) and `bytes.heap_save`/`bytes.heap_restore`, v0 bump-allocator relics that are no-ops under reference counting, are deleted. A call to any of them is a check-time error whose hint is the entry below (crates/almide-frontend/src/removed_spellings.rs reads it from this ledger). The same epoch renames the fan selection forms (ADR-0028, decided 2026-10-17/18): `fan.race` is `fan.min(clock) { … }` — the clock argument is required and its TYPE says what \"least\" is measured on (`compute` = the least deterministic compute within the budget, ties to source order; `duration` lands separately, #3788) — and `fan.any` is removed: the first Ok in source order is a `??` chain, over a list `list.find_map(xs, (x) => f(x)?)`; every peer keeps try-in-order with its list functions (Rust/OCaml `find_map`, Elixir `find_value`), and in every other ecosystem `race` means \"first to finish\" and `any` \"no order guarantee\". The interim names `fan.first_ok` / `fan.min_cost` were never released. No deprecation window."
