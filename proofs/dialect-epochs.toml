  "`matrix.pre_norm_linear(…)` → `import nn.kernels` + `kernels.pre_norm_linear(…)` (package almide-graphics/nn: `almide add almide-graphics/nn@v0.2.0 --trust github.com/almide-graphics`; the same arguments)",
