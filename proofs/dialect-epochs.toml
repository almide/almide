  "`io.stdin()`, `io.stdout()`, `io.stderr()`, `uuid.v4()`, `uuid.v7()`, `net.tcp_is_open(s)`, `unix.take_fds(s)`, `unix.select(xs, ms)`, `process.poll(c)`, `process.child_pid(c)`, `process.read_new_stdout(c)` and `process.read_new_stderr(c)` are effect fns written in Almide: each call is a Result and takes `!` (ADR-0008)",
  "`net.TcpStream` and `net.TcpListener` are opaque handle types, no longer `Int` (R-net-01): a signature that said `s: Int` names the type, and a handle can no longer be printed or built from a number",
