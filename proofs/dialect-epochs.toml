  "`process.env`, `process.pid`, `process.sleep`, `process.is_alive`, `io.write`, `io.write_bytes` and `net.tcp_is_open` are `effect fn`s (#4159): they act on the host, and as plain fns a pure fn could call them. A pure fn calling one is E006; mark it `effect fn`. Their call types are unchanged",
  "`json.parse` refuses a string RFC 8259 / I-JSON does not allow (C-400, #4111): a lone surrogate (`json: lone surrogate at pos N`), an unknown escape (`json: unknown escape at pos N`), `\\u` without four hex digits, a raw U+0000–U+001F, a noncharacter and an unterminated string are each an err where the parser used to drop or close them (`\"ad\\ud800min\"` was `admin`). A program that relied on the drop must escape its input correctly",
  "`json.parse` accepts exactly one RFC 8259 value (C-401, #4112): a duplicate object key (`json: duplicate key at pos N`; the first value used to win), trailing data or a second value (`json: trailing data at pos N`), an unquoted key, a trailing comma, a missing `:` or separator, whitespace other than space / tab / LF / CR and a number outside the RFC grammar (`01`, `1.`, `-`) are each an err where they used to be accepted",
  "`url.parse` validates the scheme at the start (`ALPHA *( ALPHA / DIGIT / \"+\" / \"-\" / \".\" )` then `://`), strips leading/trailing C0 and space and removes tab/LF/CR as WHATWG does, refuses a backslash, a remaining control character, a `%` in the host and a non-canonical numeric host (`127.1`, `0x7f.0.0.1`), lowercases scheme and host, and removes `.`/`..` path segments including `%2e` spellings (C-361, C-402, #4116): `javascript:alert(1)//://good.com` is an err where it parsed with host `good.com`, and `HTTP://Good.COM/a/../b` is `http://good.com/b`",
  "`url.resolve` cleans the reference by `url.parse`'s rules and removes `%2e` dot segments (C-403, #4116): `\\\\evil.com` and `/\\evil.com` are errs where they resolved onto the base host, ` //evil.com` resolves to host `evil.com`, and `%2e%2e/` climbs a directory",
  "`http.query_params(req)` returns `Result[List[(String, String)], String]` (was `Map[String, String]`) and is `url.parse_query` of the target after its first `?` (C-404, #4117): every pair is kept in order, a bare key has value `\"\"`, and a bad escape or invalid UTF-8 is an err. Rewrite `map.get(http.query_params(req), k)` as `list.find(http.query_params(req) ?? [], ((key, _)) => key == k)` (or `map.from_list(http.query_params(req) ?? [])` for the old last-wins map)",
  "on a socket host, `http.serve` answers `400` before the handler to a request head RFC 9112 refuses (C-405, #4112): a line not ending in CRLF or holding a bare CR, a request line that is not three single-space-separated parts with a token method and `HTTP/1.1` / `HTTP/1.0`, an asterisk-form or authority-form target, whitespace before a field's colon, a line without a colon, an obs-fold line, two `Host` fields, or an HTTP/1.1 request without `Host`; an absolute-form target reaches the handler as its origin-form path. A client that omitted `Host` must send it",
  "`value.object(pairs)` folds a repeated key as one upsert (first position, last value), and so do `value.to_camel_case` / `value.to_snake_case` when two keys rename to one (C-401, #4112): `value.keys` lists the key once, `value.field` reads the last value, and `json.stringify` never writes a key twice. `value.pick(v, keys)` of a non-object is `{}` (was `v`)",
  "`http.router` answers `400 Bad Request: the path is not in canonical form` to a path with an empty segment inside it, a `.` / `..` segment, a percent-encoded unreserved byte, a backslash or a control character, and `400 Bad Request: a path parameter is a dot segment or holds a /, \\ or NUL` to such a parameter (C-406, #4133, #4134): `//admin` and `/%61dmin` used to route as `/admin`, and `/u/..%2F..%2Fetc` bound `../../etc`",
  "every `http.serve` response carries `X-Content-Type-Options: nosniff` unless the handler set the field (C-407, #4134)",
  "the buffered http client (`http.get` family, `http.request_response`, `http.request_bytes`) answers `malformed or incomplete response from \"<url>\"` for a response with no whole head, a body shorter than Content-Length, or a chunked body without its 0-chunk, and for a head past 1 MiB (C-408, #4137), where it used to return what had arrived as ok",
  "the http client's URL splitter cleans and refuses as `url.parse` does (C-402, #4116 comment): a backslash or control character and a non-canonical numeric host (`127.1`, `0x7f.0.0.1`) are URL errors, leading/trailing C0 and space and tab/LF/CR are removed, and `.` / `..` segments (with `%2e` spellings) leave the target before it is sent",
  "an `http.serve` handler's `err(m)` is answered with the fixed body `Internal Server Error (request <id>)` (`id` = 8 hex digits of `hash.fnv1a32(method + \" \" + target + \"\\n\" + body)`) and `m` goes to stderr only, quoted, as `http.serve: request <id>: handler error: <m>`; a refused response's body is `Internal Server Error` (C-409, #4150). A client or test that read the error text from the body must read the server's stderr",
  "an attribute on a record field that the compiler does not read is an error (E053); the field vocabulary is `@builtin`, `@location`, `@skip`, `@skip_decode`",
  "`hash.md5(b)` → rewrite as `hash.sha256(b)`: MD5 is broken for security and left the stdlib with no deprecation window and no package (security table row 20, C-424); SHA-256 is a different digest, so a protocol that needs MD5's own bytes carries its own implementation",
  "`hash.md5_hex(b)` → rewrite as `hex.encode(hash.sha256(b))`: MD5 is broken for security and left the stdlib with no deprecation window and no package (security table row 20, C-424); SHA-256 is a different digest, so a protocol that needs MD5's own bytes carries its own implementation",
  "`hash.sha1(b)` → rewrite as `hash.sha256(b)`: SHA-1 is broken for security and left the stdlib with no deprecation window and no package (security table row 20, C-424); SHA-256 is a different digest, so a protocol that needs SHA-1's own bytes carries its own implementation",
  "`hash.sha1_hex(b)` → rewrite as `hex.encode(hash.sha256(b))`: SHA-1 is broken for security and left the stdlib with no deprecation window and no package (security table row 20, C-424); SHA-256 is a different digest, so a protocol that needs SHA-1's own bytes carries its own implementation",
  "`datetime.parse_iso` refuses a year outside 0..=9999 with `year out of range: <y>` (it answered ok with a wrapped instant), and the year is the first range-checked field (#4118, C-410)",
  "`base64.decode` / `base64.decode_url` accept only the canonical padded form of their own alphabet: unpadded input is `invalid base64 length: <n>`, more than two `=` is `invalid base64 padding`, the other alphabet's `+/` or `-_` is `invalid base64 character`, and nonzero bits under the padding are `invalid base64 trailing bits` (#4119, C-411)",
  "`string.to_upper` / `to_lower` / `capitalize` leave a non-ASCII scalar whose case mapping contains ASCII unchanged (ı ſ ß ŉ ǰ U+1E96–U+1E9A ﬀ–ﬆ upward; İ and the Kelvin sign downward): `string.to_upper(\"adm\\u{131}n\")` is `\"ADM\\u{131}N\"`, not `\"ADMIN\"` (#4121, C-412)",
  "`float.parse` answers `err(\"invalid float literal\")` for the nan / inf / infinity spellings and `err(\"float literal out of range\")` for a literal that overflows f64 (was ok(NaN) / ok(±inf)); build an infinity or a NaN by arithmetic (`1.0 / 0.0`) (#4121, C-413)",
  "`int.parse`, `float.parse` and the sized-number parses trim only ASCII TAB, LF, FF, CR and SPACE: `\"\\u{A0}5\"`, `\"\\u{3000}5\"`, `\"\\u{2028}5\"` and `\"\\u{B}5\"` are now err (#4121, C-413)",
  "`net.unix_recv` closes, on receipt, a descriptor that arrives while 28 already wait untaken on that socket; `net.unix_take_fds` answers at most 28 (#4124, C-416)",
  "`process.kill(pid, signal)` with pid outside 1..=2147483647 (0, -1, a negative process group) or signal outside 0..=31 answers err, and a failed kill(2) answers a fixed errno text (`no such process`, `operation not permitted`, `invalid signal`) instead of the kill tool's stderr (#4125, C-417)",
  "`process.is_alive(pid)` is false for pid <= 0, and true for a live pid owned by another user (EPERM) (#4125, C-417)",
  "under `[permissions] proc`, `process.kill` and `process.is_alive` need `kill` on the list, like a spawned command (a compile-time refusal; the embedded host answers err / false) (#4125, C-417)",
  "runtime error texts escape the control and bidi characters of an embedded path, command or host (`\\n`, `\\u{1b}`, …); `process.exec_status`, `exec_status_timeout` and `run` no longer escape `\"` and `\\` in the command (#4126, C-418)",
  "`args.flag(name)` no longer answers to `-<first letter of name>`: only `--name` sets it (a one-letter name also `-n`); keep a short form by reading it, `args.flag(\"dry-run\")! or args.flag(\"n\")!` (#4144)",
  "`--` ends option parsing in the `args` readers: `args.flag`, `args.has_flag`, `args.option` and `args.option_or` ignore every argument after the first `--`, and `args.positional()` / `args.positional_at` include every argument after it, a leading `-` included (#4144)",
  "`bigint.parse` / `bigint.parse_radix` in a radix that is not a power of two answer `err(\"integer string conversion exceeds the limit of 4300 digits\")` for more than 4300 digits, where they used to parse (#4196, C-419)",
  "`bigint.to_string` / `bigint.to_string_radix` in a radix that is not a power of two abort with `integer string conversion exceeds the limit of 4300 digits` for a result of more than 4300 digits (#4196, C-419)",
  "`bigint.pow` aborts with `pow result too large` when `(bit_length(base) - 1) * exp >= 30 * 2^28`, before computing (#4196, C-419)",
  "`list.range_step(start, end, step)` whose `end - start` overflows Int (bounds of opposite sign) lists the whole span instead of a wrapped, truncated count: `range_step(MIN, MAX, 2^62)` is 4 elements, not `[MIN]` (#4197, C-420)",
  "`env.set(name, value)` is fallible (#4200, C-421): it errs, and sets nothing, on an empty name (`env.set: empty name`), a name containing `=` or NUL, and a value containing NUL, where native panicked (exit 101) and wasm stored the pair; a bare `env.set(k, v)` statement is now E042 — write `env.set(k, v)!`",
  "the fs whole-file readers (`fs.read_text`, `read_bytes`, `read_lines`, `read_bytes_raw`, their `_if_exists` twins and the rooted `root_read_text` / `root_read_bytes`) read a regular file of at most 1 GiB on every leg (C-422, #4201): a device, FIFO or socket errs `fs.<call>(\"<path>\"): Not a regular file` without blocking (before, `/dev/zero` allocated until the process was killed, a FIFO blocked forever, and `/dev/null` answered ok(\"\")), and a file over 1073741824 bytes errs `File too large (the read limit is 1073741824 bytes)`. Read stdin with `io.read_all`; stream a larger file with `fs.fold_lines`",
  "the fs whole-file readers (`fs.read_text`, `read_bytes`, `read_lines`, `read_bytes_raw`, their `_if_exists` twins and the rooted `root_read_text` / `root_read_bytes`) read a regular file of at most 1 GiB on every leg (C-431, #4201): a device, FIFO or socket errs `fs.<call>(\"<path>\"): Not a regular file` without blocking (before, `/dev/zero` allocated until the process was killed, a FIFO blocked forever, and `/dev/null` answered ok(\"\")), and a file over 1073741824 bytes errs `File too large (the read limit is 1073741824 bytes)`. Read stdin with `io.read_all`; stream a larger file with `fs.fold_lines`",
  "`json.set_path` returns `err(\"json: nesting deeper than 1000\")` when the value it would build nests past 1000 levels — the path's steps plus the new value's own nesting — where it used to build it, and a later stringify, `==` or drop of it could run out of stack (R-L0-47, #4209, C-433); the bound and the text are `json.parse`'s (C-391)",
  "an http client error that names the URL masks its userinfo password as `***` (`\"http://alice:***@host/p\"`, an empty password included; the user name, query and fragment stay verbatim — C-328, #4205), and a WASI 0.3 component no longer dials the userinfo as part of the host: it sends `Authorization: Basic …` as native does. A program that read the password back out of the error text must keep it itself",
  "`http.decode_json(req, decode)` → rewrite as `http.decode_json[T](req)` with `T` an input type (a record declared `: Decode`, not `Codec`): the decode callback is gone and the body decodes with `T.decode_strict` (row 22, C-436); the two-argument call is E004",
  "a type argument of `http.decode_json` (an `@input_sink`) that is also sent out — a `: Codec` or `: Encode` type, or an input type holding such a record at any depth (a field or a variant payload) — is E110, as is a forwarding fn's type parameter that is not itself `@input_sink`: declare `type XInput: Decode = { <what the client may set> }`, decode into it and build `X` in code (row 22, C-436)",
  "`http.decode_json[T]` answers `400 Bad Request: unknown key '<k>'` (with the key's path, `, at address`) for a body key outside `T` at any depth, where the old decode callback (`T.decode`) ignored it (row 22, C-436)",
  "`T.decode_strict` refuses an unknown key at every depth, with its path (`unknown key 'k', at address.geo`), and a `Decode` variant derives it too (a key after the tag, or outside a record payload, is unknown), where it refused only a record's own top-level keys (C-429, row 22)",
  "`type T: Decode` / `type T: Encode` derive their half (`T.decode` + a record's `decode_strict` / `T.encode`) where they derived nothing (C-435); a `@skip` or `@skip_decode` field on a `: Decode` type that is not `Encode` is E053, since every field of an input type is input",
  "the embedded wasm host (`almide run --target wasm`) without a named cap budgets a run's linear memory at the least of 4 GiB, the cgroup memory limit and physical memory instead of 4 GiB (#4135, C-197): in a container or on a machine under 4 GiB a program that grows past that limit ends in `Error: out of memory`, exit 1, where it used to be killed by the kernel",
  "`datetime.from_parts` returns `Result[Int, String]` and refuses a field out of range with `parse_iso`'s rules and texts (year 0..=9999, month 1..=12, day 1..=days in the month, hour 0..=23, minute and second 0..=59), where it returned an Int and rolled over (`from_parts(2026, 2, 30, 0, 0, 0)` was 2026-03-02, month 13 the next January) (R-datetime-07, #4149, C-360); a call needs `!`, `??` or a match, and a date outside those ranges is an `err`",
  "a negative count is 0 and a range bound clamps into [0, len] (#4147, C-054): `list.take(xs, -1)` and `string.take(s, -1)` are empty where they returned everything, `list.drop` / `string.drop` with a negative count keep everything where they returned nothing, `take_end` / `drop_end` likewise, `list.slice`, `bytes.slice` and `matrix.slice_rows` read a negative start or end as 0 (a negative start was the empty result, a negative end ran to the end), `list.split_at(xs, -1)` is `([], xs)`; `bytes.take` / `drop` / `take_end` / `drop_end` / `split_at` and `string.split_at` answer the same way where they aborted",
  "`list.chunk` / `list.windows` / `list.window` with a negative size abort with `Error: chunk size must be positive` / `Error: window size must be positive` and exit 1, like a size of 0, where a negative chunk size answered the whole list as one chunk and a negative window size the empty list (#4147, C-129)",
  "`args.positional` and `args.positional_at` take the names of the options the program reads (`args.positional([\"out\"])`, `args.positional_at(0, [])`), and the argument after a named `--option` is that option's value, not a positional (#4144, C-181): `--out report.txt input.txt` with `[\"out\"]` is `[\"input.txt\"]`; a call without the list is an arity error",
  "parameters are named by role (R-L0-30), so a named argument spelled with the old name is E004 and the hint names the new one; positional calls are unchanged: `path.dirname` / `basename` / `extension` / `is_absolute` / `stem` / `normalize` take `path` (was `p`); `list.set` / `list.insert` / `list.repeat` take `x` (was `val`), `list.flatten` takes `xs` (was `xss`); `set.insert` / `set.remove` / `set.contains` take `x` (was `value`); `string.contains` takes `needle` (was `sub`), `string.pad_start` / `pad_end` take `fill` (was `ch`), `string.push` takes `x` (was `suffix`); `map.from_list`, `url.build_query`, `value.array`, `value.object`, `matrix.from_lists` and `matrix.concat_cols` take `xs` (was `pairs` / `items` / `rows` / `matrices`); `result.partition` takes `xs` (was `rs`) and `result.filter` takes `f` (was `pred`); `testing.assert_some` / `assert_none` take `o` (was `opt`) and `assert_ok` / `assert_err` take `r` (was `result`); `json.stringify_pretty` takes `v` (was `j`); the `zlib` compressors and decoders and `matrix.from_bytes_f16_le` / `f32_le` / `f64_le` take `b` (was `data`)",
  "`hash.fnv1a32` and `hash.sha256_hex` take `Bytes`, as every other `hash` function does (R-hash-01, R-hash-05): a `String` argument is E005; rewrite `hash.fnv1a32(s)` as `hash.fnv1a32(bytes.from_string(s))` and `hash.sha256_hex(s)` as `hash.sha256_hex(bytes.from_string(s))` (the same answers: they hashed the UTF-8 of s)",
  "`zlib.decompress`, `zlib.inflate` and `zlib.gunzip` are plain fns returning `Result[Bytes, String]` instead of `effect fn`s (R-zlib-02): a pure fn may call them now. Inside an effect fn `zlib.inflate(b)!` is unchanged; a `let x = zlib.inflate(b)` there is now a `Result` value, not E041",
  "`value.str(s)` → rewrite as `value.string(s)`: the same String Value, spelled like the other constructors (`value.int`, `value.float`, `value.bool`, `value.array`, `value.object`) and the readers `as_string` / `get_string` (R-value-08)",
  "`string.chars(s)` → rewrite as `string.to_list(s)`: the same one-char strings in order, under the name every container uses for its elements as a list (R-string-17)",
  "`string.codepoint(s)` → rewrite as `string.to_codepoint(s)` for a one-character s; `to_codepoint` is none for \"\" AND for two or more codepoints, where `codepoint` read the first character, so the first character's codepoint is `string.to_codepoint(string.get(s, 0) ?? \"\")` (R-string-12, R-string-14)",
  "`string.count(s, needle)` with a String needle is E005: the substring count is `string.count_matches(s, needle)` (the same answer), and `string.count(s, f)` counts the characters for which `f` is true, as every container's `count` does (R-string-18)",
  "`string.from_codepoint(n)` returns `String?`: none for a negative n, a surrogate or a value past U+10FFFF, where it returned \"\". Write `string.from_codepoint(n) ?? \"\"` for the old answer, or match the none (R-string-14)",
  "`matrix.get(m, i, j)` returns `Float?` (C-282): none for a row or column out of range, where it aborted with `Error: matrix index out of bounds`; rewrite as `matrix.get(m, i, j) ?? default`, or `matrix.get(m, i, j) ?? panic(\"matrix index out of bounds\")` to keep the abort",
  "`matrix.from_bytes_f16_le(b, offset, rows, cols)`, `from_bytes_f32_le` and `from_bytes_f64_le` return `Matrix?` (C-341): none unless `0 <= offset <= len` and the rows x cols elements fit after it, where a short buffer answered a matrix of zeros; rewrite as `matrix.from_bytes_f32_le(b, offset, rows, cols) ?? default`, or `?? panic(\"short matrix bytes\")` to keep an abort",
  "`list.binary_search(xs, target)` takes any element type (R-list-15): the order is `list.sort`'s, and over a List[Int] it answers the same index as before",
  "`testing.assert_gt(a, b)` / `assert_lt(a, b)` take any ordered type, compared with `>` / `<` (R-testing-02); inside a test block a failure no longer prints the two Int operands",
  "`fs.write(path, content)` → rewrite as `fs.write_text(path, content)`: the same write, named for the matrix {read, write, append} x {text, bytes} (R-fs-05); its err head is `fs.write_text(\"<path>\")`",
  "`fs.append(path, content)` → rewrite as `fs.append_text(path, content)`: the same append (R-fs-05); its err head is `fs.append_text(\"<path>\")`",
  "`fs.read_bytes_raw(path)` → rewrite as `fs.read_bytes(path)`: the same Bytes, now under the plain name (R-fs-01); its err head is `fs.read_bytes(\"<path>\")`",
  "`fs.read_bytes_raw_if_exists(path)` → rewrite as `fs.read_bytes_if_exists(path)`: the same `Bytes?` (R-fs-01)",
  "`fs.write_bytes_raw(path, data)` → rewrite as `fs.write_bytes(path, data)`: the same write of a Bytes (R-fs-01); its err head is `fs.write_bytes(\"<path>\")`",
  "`fs.read_bytes(path)` returns `Result[Bytes, String]` and `fs.read_bytes_if_exists(path)` `Result[Bytes?, String]` (were `List[Int]`), and `fs.write_bytes(path, data)` takes `Bytes` (was a `List[Int]` whose Ints were cut to their low byte, so -1 wrote 255) (R-fs-01): the old uses are E005. Wrap a list with `bytes.from_list(xs)` and read one back with `bytes.to_list(b)`",
  "`map.entries(m)` → rewrite as `map.to_list(m)`: the same (key, value) pairs in insertion order, under the name every container uses for its elements as a list (R-map-07)",
  "`io.read_line()` returns `String?` (R-io-01): `none` at the end of input, `some(\"\")` for an empty line; rewrite a caller that wanted the old `\"\"` as `io.read_line() ?? \"\"`",
  "`io.read_line_opt()` → rewrite as `io.read_line()` (R-io-01: the Option form is now the one reader)",
  "`io.read_byte()` → rewrite as `io.read(io.stdin()!, 1)!` (R-io-05): an empty `Bytes` at the end of input where the old fn answered -1",
  "`io.read_n_bytes(n)` → rewrite as `bytes.to_list(io.read(io.stdin()!, n)!)` (R-io-05): `io.read` answers `Bytes` and is `err` for a negative n, where the old fn answered the empty list",
  "`io.write(data)` → rewrite as `io.write(io.stdout()!, data)!` (R-io-05: the handle is the first argument, `io.write(io.stderr()!, data)!` writes stderr)",
