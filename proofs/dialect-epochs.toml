  "`net.unix_listen(path)` → rewrite as `unix.listen(path)`; `net.unix_accept(l)` → `unix.accept(l)` (R-unix-01)",
  "`net.unix_send(sock, data, fds)` → rewrite as `unix.write_fds(sock, data, fds)`; `net.unix_recv(sock, max)` → `io.read(sock, max)`; `net.unix_take_fds(sock)` → `unix.take_fds(sock)!` (R-unix-02)",
