  "the `regex` module takes a compiled `Regex` (R-regex-02, #3942, C-395): every operation's first argument is a `Regex` made by `regex.new(pat)` (a refused pattern aborts with `Error: invalid regex: <reason>`; a literal one is E102 at check time) or `regex.compile(pat) -> Result[Regex, String]`, so `regex.find(\"[0-9]+\", s)` is a type error whose hint is `regex.find(regex.new(\"[0-9]+\"), s)` and `almide fix` wraps a literal pattern; a pattern the engine read leniently is refused (`(`, `[`, `*`, `a{`, `a{2`, a named group `(?P<n>…)`), as is one past 20,000 states; `regex.captures` answers `List[String?]` with `none` for a group that took no part (R-regex-08), where it answered the empty string; `regex.replace` reads `rep` literally as before and `regex.replace_with` takes the function. Migrated here: 519 call sites in 24 spec/proof/bench files and 10 in Rust test generators; downstream repos call regex from no .almd file",
