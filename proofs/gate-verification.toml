# GATE VERIFICATION LEDGER — who watches the watchmen (Stage 5:「検証ツール
# 自身の検証」). Every verdict-bearing gate script carries a row classifying
# HOW we know the gate itself can fail correctly, with a durable evidence
# pointer. Enforced by scripts/check-gate-verification.sh: every enumerated
# gate needs exactly one row, stale rows fail, a non-UNVERIFIED row needs
# `evidence`, and the UNVERIFIED count may only SHRINK (ceiling below).
#
# Classes:
#   KERNEL_PROVEN   — the verdict-bearing core is the Coq-extracted checker
#                     (or the proof-check itself); the shell is plumbing.
#   MUTATION_TESTED — a deliberate corruption of the gate's ledger/input was
#                     demonstrated to FAIL the gate (recorded where).
#   NEGATIVE_TESTED — a forged/violating input was demonstrated to FAIL.
#   EXERCISED       — both verdict directions observed in real operation
#                     (a genuine catch, or a recorded multi-mode exercise).
#   UNVERIFIED      — no recorded evidence the gate can fail correctly.
#                     Honest debt: the gate may be decorative and we would
#                     not know. Burn-down tracked by the ceiling.
#
# A second axis (#2128) says what the gate READS, which decides the language it
# belongs in. The roadmap decision: a gate that reads STRUCTURED data (TOML,
# markdown, a ledger, generated-output comparison) is written in Almide, where a
# typed TOML and markdown reader already exists and the next such gate gets it
# free; a gate that greps and exits stays bash. The check enforces one
# direction — a row declaring `structured` whose path is a `.sh` FAILS — because
# a rule alone did not hold: the previous "no committed .sh" goal shipped with a
# done-criterion nobody implemented, and committed shell went 50 -> 124 files in
# six weeks with 50 of the 81 additions being `scripts/check-*.sh`.
#
#   structured      — reads TOML / markdown / a ledger / generated output.
#   scalar          — greps, counts, compares strings; exits.
#   UNCLASSIFIED    — not yet decided. Honest debt, shrink-only, same idiom as
#                     UNVERIFIED: classifying 80 existing rows must not block
#                     the mechanism from landing. 81 as of #2129: the regex
#                     reference gate reads a committed answer table, which is
#                     structured by this rule, and porting it needs the probe
#                     to take the table as an ARGUMENT (process.exec has no
#                     stdin) — a deliberate change, not one to make inside a
#                     regex fix. Declared undecided rather than mislabelled.
#
# A third axis (#2207) says who RUNS the gate. Three rows here carried
# NEGATIVE_TESTED evidence for a month while nothing invoked the script
# (check-cap-effect-consistency, check-pass-isolated, check-domain-edges) — a
# gate nobody runs cannot fail anyone, whatever its class says. Every row names
# its consumer(s) in `wired_by`: a workflow, lefthook.yml, the Makefile, another
# script or a test, comma-separated; the check requires each named file to
# exist and to actually invoke the gate (its basename, or for an Almide gate an
# almide-gates call of that subcommand). `UNWIRED` is the honest-debt spelling,
# shrink-only under the ceiling below: 6 as of #2207, the six almide-gates
# twins whose line-for-line comparison against their .sh originals is #2130's
# open work — they are enumerated so the ledger can see them, not because
# anything runs them yet.
#
# A fourth axis (#2234) says what the gate MEASURES and whether that quantity
# has been SEEN TO VARY. The perf ratchet's four `ablation/*` rows carried
# NEGATIVE_TESTED evidence for three months while the quantity they compared —
# optimizer-ablated native runtime over optimized — was 1.0 by construction
# (the two binaries were byte-identical, #2229); every reading, green or red,
# was runner noise. The negatives proved the harness fires on a forged input,
# never that a real divergence can exist. Every row now names its measurand:
#
#   measures = "<the quantity>, read from <the artifact(s)>"   (required)
#   varies   = "<where the quantity took two different values: a commit, a
#               PR, a run; for a ratchet the last time its anchor moved>"
#
# A RATCHET (the check detects one from the gate's own text: a committed
# `*-baseline.txt`, an in-source `MAX_*=` ceiling, a `*_ceiling`) must carry
# `varies` — that is exactly the row class the ablation rows were. Any other
# row may leave it empty under the shrink-only ceiling below; the 2 as of
# #2234 are the two Almide twins (`output-parity`, `fuzz-track-record`) that
# are UNVERIFIED for the same reason (#2130): nothing has run them against
# their originals, so nothing has seen their quantity move.
#
# unverified_ceiling = "2"
# unclassified_reads_ceiling = "81"
# unwired_ceiling = "6"
# unvaried_ceiling = "2"
#
# The ceiling moved 0 -> 2 for the first time since it reached 0, and the reason
# is the opposite of a regression: enumerating the Almide gates (#2128) brought
# `output-parity` and `fuzz-track-record` INTO the ledger's field of view. Their
# debt is not new — nothing has ever compared either twin to its `.sh` original,
# which is exactly what #2130 is open about; what is new is that the ledger can
# see it. A gate the ledger cannot see is worse than one it records as
# unverified. The burn-down is #2130 step 1 for those two twins (`output-parity`
# sweeps the whole corpus and `fuzz-track-record` queries the GitHub API, so
# each needs a fixture design of its own), and this ceiling returns to 0 there.

[[gate]]
path = "scripts/check-regex-reference.sh"
# NOT YET DECIDED, and the honest answer is uncomfortable: this gate reads a
# committed answer TABLE, which the boundary calls structured — so by #2128's
# own rule it belongs in Almide. It is not classified `scalar` to make itself
# pass. Porting it needs the probe to take the table as an argument rather than
# on stdin (`process.exec` has no stdin), which is a change worth making
# deliberately rather than inside a regex fix. Recorded as debt with the port
# named, which is what this bucket is for.
reads = "UNCLASSIFIED"
wired_by = ".github/workflows/ci.yml"
class = "NEGATIVE_TESTED"
evidence = "#2129 landing (2026-09-13): a forged reference row (is_match `[]]` over `]` flipped true -> false) turned BOTH legs red naming the case and printing the op/pattern/subject/reference/leg columns, restored green at 6624 cases. The gate's own first run is what found the two defects it now pins — `[]]` read as an empty class plus a stray `]` (silently never matched) and `split` over an empty-matching pattern eating a character (`split(\"^\", \"abc\")` -> `[\"a\", \"bc\"]`) — neither of which C-032's native-vs-wasm fuzz can see, because both legs agreed on the wrong answer. The table floor (6000 rows) fails a subset that shrank: a gate that stopped looking must not pass."
measures = "per-row agreement of both legs' regex answers with the external reference table, read from proofs/regex/reference-answers.tsv against `almide run` on native and wasm"
varies = "#2129 landing (2026-09-13): the forged row `[]]` over `]` read true on both legs against a false reference — the table and the legs disagreed, and agreed again once restored"

