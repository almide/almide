reads = "scalar"
wired_by = ".github/workflows/ci.yml"
class = "EXERCISED"
evidence = "#2403 landing (2026-09-21): recorded 12-mode exercise on every run (the nine below plus a forged four-digit id (1063, a line number wearing the C- prefix) in the judge's statement and in ours — each exit 1 naming `<file>:<line>: four-digit contract id a four-digit id (1063 wearing the C- prefix)`, while the committed ledger's real `RFC-7386` line, present in every control, is never reported — the boundary guard) against mutated copies of docs/contracts/contracts.toml (the gate reads both ledgers and the allowance from files — ALS_LEDGER / OUR_LEDGER / ALS_AHEAD — so a forged input is a file; the real tree, pin and network are never touched). One positive control (the ledger against an exact copy of itself is green with 702 fields compared, so a harness blind to the fields cannot pass vacuously) plus nine forged inputs: the judge's statement with a sentence appended (exit 1, names `C-001.statement`, `als ahead`, points at the allowance); this tree's statement with a sentence appended (exit 1, `almide ahead`, remedy `land the wording in almide/als first`); the judge's title changed (exit 1, names `.title`, not `.statement`); the statement's middle rewritten (exit 1, `diverged`); the als-ahead drift with its id listed in the allowance (exit 0, `tolerated`, `1 tolerated as als-ahead`); the almide-ahead drift with the same allowance (still exit 1 — the list covers only the judge's extra text); an allowance for an id that does not drift (exit 1, `stale`); the subject's [[contract]] removed from the judge (exit 1, the original id refusal); a malformed allowance entry (exit 2). The pre-#2403 gate, given the first forged judge, exits 0 — the demonstration that the controls are not decorative. ALS_PIN_GATE points the controls at another copy of the gate for that A/B."
measures = "the exit code and named id/field/direction check-als-pin.sh gives ten forged ledger/allowance files (a judge statement extended, our statement extended, a title changed, a diverged statement, a listed and a stale allowance, a removed id, ...)"
