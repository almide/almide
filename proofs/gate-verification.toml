[[gate]]
path = "scripts/check-als-pin.sh"
reads = "UNCLASSIFIED"
wired_by = ".github/workflows/ci.yml"
class = "NEGATIVE_TESTED"
evidence = "als #60 second-half landing (2026-09-07, almide #1982): a judge ledger with C-347 removed (ALS_LEDGER=<file>) went red naming the id and the remedy (land it in almide/als first, then advance proofs/als-pin.txt; ours 347, judge 346 at 12099f3), the live judge ledger at the pin green (347/347). A fetch failure is exit 2, red in CI — the gate cannot pass by not looking. 2026-09-21 (#2403): the gate compared IDS only, so a `statement` rewritten here without an als PR was invisible — measured against the judge at the pin a7a8f7f, 8 of 351 shared statements differed (C-004 / C-053 / C-076 / C-197 / C-215 / C-237 / C-273 with text the judge lacked, C-122 with text the judge had), every title identical, and the id-only gate reported `OK 351/351`. Now every shared `statement` and `title` is compared byte-for-byte; a drift is refused naming `<id>.<field>`, the first differing byte, a window of each side and the direction (almide ahead / als ahead / diverged). The als-ahead direction is tolerated only for an id listed in proofs/als-ahead.txt, and a listed id that no longer drifts is refused (shrink-only). A/B on one forged judge statement (C-001 plus a sentence, ALS_LEDGER=<file>): the pre-#2403 gate exits 0 `OK 351/351`, the new gate exits 1 naming `C-001.statement`; the forged-input matrix lives in check-als-pin-negative.sh (row below). Item 4 of #2403 in the same gate: a four-or-more-digit `C-NNNN` anywhere in either ledger is refused with file:line as a line number cited as a contract (the a four-digit id (1063 wearing the C- prefix) that opened the issue was the line of C-076's title); the token must start at a boundary so the ledgers' `RFC-7386` citation is not reported — measured 0 phantoms in both ledgers at the pin and at als main on 2026-09-21. The reads axis stays UNCLASSIFIED knowingly: the gate now reads two TOML ledgers in awk, which the #2128 rule says belongs in Almide — declared undecided rather than mislabelled, the same call as the regex reference gate."
measures = "the set of contract ids in docs/contracts/contracts.toml absent from the judge's ledger at the commit pinned in proofs/als-pin.txt, and the set of shared (id, statement|title) fields whose text differs byte-for-byte between the two ledgers, split by direction against the als-ahead allowance"
varies = "als #60 second half (2026-09-07, almide #1982): 0 absent on the pinned ledger, 1 (C-347) on the ledger with that row removed; #2403 (2026-09-21): 8 drifted statements against the judge at a7a8f7f, 4 (C-122 / C-226 / C-229 / C-334, all als-ahead) against the judge's main after almide/als#82, 0 on the ledger against an exact copy of itself"
