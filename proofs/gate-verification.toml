[[gate]]
path = "scripts/check-action-pins.sh"
reads = "scalar"
wired_by = ".github/workflows/ci.yml"
class = "NEGATIVE_TESTED"
evidence = "#4094 landing (2026-10-24): `--self-test` runs on every CI run. It forges a workflow with a tag pin (actions/checkout@v7), a branch pin (dtolnay/rust-toolchain@stable), a local action and a commit pin, and requires exit 1 naming both refs and `2 of 3`, then pins both and requires exit 0. Against the real tree before #4094 (origin/develop at 56a3d0f90, extracted with git archive), the gate exits 1 with `218 of 218 action references are not pinned to a commit`; the pinned tree reads `OK — 218 action references`. Security row 16 (2026-10-27) adds scripts/lib/action_supply.py: `versions` on the tree before the pins (sec-batch-1026c e25c7b636) exits 1 with `9 step(s) fetch by a moving name (59 checked)` — three node-version majors, rustup `stable`, unpinned `pip install lark`, three dtolnay/rust-toolchain steps with no `toolchain:`, `cargo install cargo-audit` with no version — and 0 after; `--closure` walks the 13 pinned actions at their commits (actions/attest-build-provenance -> actions/attest pinned) and exits 0. The self-test forges each of the seven moving kinds (resolved through env, a composite's input and a dispatch default) and a mirrored composite whose own `uses:` is `ex/tagged@v1`, requires each refusal, then the fixed trees to pass. Security row 16, second gap (2026-10-29): scripts/lib/download_pins.py (run by the gate) scans every `curl` / `wget` / `Invoke-WebRequest` in .github/workflows, .github/actions and scripts/*.sh that writes a binary or archive and refuses one whose step does not check it against a pinned sha256 (.github/pinned-downloads.txt via scripts/fetch-pinned.sh, or a 64-hex literal with sha256sum) or, for a first-party `latest`, `gh attestation verify --repo` of that same repository; a fetch-pinned.sh call is expanded through the step's shell variables, env, matrix and a composite's callers and must land on a manifest line. Against the tree before (origin/develop 3007c3fa5, git archive) `check-action-pins.sh` exits 1 with `download-pins: 35 finding(s) (35 download(s) checked)` — wasmtime (x86_64/aarch64 Linux, aarch64 macOS, Windows), nextest, wasm-pack, elan by `latest`, and four almide release fetches with no check (setup-almide twice, almide-pkg-ci, the A/B baseline); the changed tree reads `OK — 36 download(s)`. A deliberately wrong digest (the wasmtime x86_64-linux line, last hex digit changed) makes `bash -c 'set -e; bash scripts/fetch-pinned.sh <url> <out>; echo REACHED'` exit 1 with `sha256 mismatch ... Aborting.`, no file left and REACHED never printed; plain `curl -o f <url>; echo \"<wrong>  f\" | shasum -a 256 -c -` exits 1 too. The self-test forges six unpinned downloads (a raw release asset, an installer piped into sh, a helper call on an unlisted version, a `latest` attested by another repository, a composite whose caller passes an unlisted version, a script `wget`) and a malformed manifest line, requires `7 finding(s)`, then the fixed tree to pass; and runs the helper on a file:// asset with a wrong digest (exit 1, no file, the step does not continue), the right one (0), a poisoned cached file (re-fetched) and an unlisted URL (1). Row 16 remainder (2026-10-29): the gate also refuses fetches by other clients — a `git clone` not followed by a `git checkout` of a 40-hex commit (or marked `# supply: head-tracked — <why>`), an `actions/checkout` of another repository at a non-commit `ref:`, `elan toolchain install` / `update` / `default`, an `opam init` / `repo add` not naming `git+https://…#<40-hex>`, and a third-party action not declared in .github/pinned-downloads.txt with what it fetches. Against the tree before (3dcf15bfd, git archive) it exits 1 with `243 finding(s)`: codopsy's HEAD clone, the almide-grammar and downstream-canary clones, the belts' `elan toolchain install`, trust-spine's `opam init` at the repository head, and 238 `uses:` of eight undeclared actions (actions/setup-node among them, now replaced by a local composite that fetches Node through the manifest). Lean toolchain v4.29.1 now arrives through fetch-pinned.sh; with its digest's last hex digit changed the step exits 1 (`sha256 mismatch … Aborting.`) before the unpack, locally. The self-test forges seven such sites (a moving clone, an unreasoned head-tracked mark, a checkout of ex/project at `main`, elan, opam at its head, two undeclared actions), requires `7 finding(s)` and that a clone checked out at a 40-hex commit is not among them, then the fixed tree to pass."
measures = "the count of `uses: owner/repo@ref` lines in .github/workflows and .github/actions whose ref is not a 40-hex commit (local ./ actions and docker:// excluded); the count of toolchain / runtime / installer steps whose resolved version is a moving name; the count of nested `uses:` / images in the pinned actions' own action.yml (read at the pinned commit) that are not pinned; the count of binary / archive downloads in .github and scripts/*.sh whose bytes are not checked against a pinned sha256 or a same-repository attestation"
varies = "#4094 landing (2026-10-24): 218 unpinned on origin/develop 56a3d0f90, 0 on the pinned tree; 2 on the self-test's forged workflow. Row 16 (2026-10-27): 9 moving versions on e25c7b636, 0 after. Row 16 downloads (2026-10-29): 35 unpinned on 3007c3fa5, 0 after; 7 on the self-test's forged tree. Row 16 remainder (2026-10-29): 243 on 3dcf15bfd (5 fetch sites, 238 undeclared action uses), 0 after; 7 on the forged tree"
blind = "a component rustup installs for the exact toolchain, an apt / Homebrew package, an unpacked tree restored from actions/cache, and a clone marked head-tracked (the canary's subjects, the grammar data) — checked against the Rust channel manifest, a distribution's signed index or nothing stated here -> proofs/TRUSTED_BASE.md; a commit that was already malicious when it was pinned -> .github/dependabot.yml"

