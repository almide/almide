reason = "the runtime's ONE foreign-call module (#4007): signal / pthread_self / pthread_kill / _exit (http.serve's stop, process's SIGPIPE), waitpid(WNOHANG | WUNTRACED) (process.poll), kill (process.kill / is_alive, #4125: the syscall, never a `kill` on PATH), clock_gettime(CLOCK_THREAD_CPUTIME_ID) (the fan clock), getentropy (random.bytes, every unix; moved here from random.rs by #4007, which also replaced Linux's getrandom(3) with it: the same glibc 2.25 floor and the same syscall), BCryptGenRandom (random.bytes on Windows) and SetConsoleCtrlHandler (Windows). cblas_dgemm is gone (#4007): cfg(have_blas) was set by no build, so it was unsafe code nothing reached, each behind a safe wrapper whose arguments make the call sound. http.rs, list.rs, process.rs and random.rs call these and hold no unsafe. Checked: thread_cpu_ns under Miri (the fan corpus, scripts/miri-fan-gate.sh) and ASan; set_signal and wait_exited_or_stopped under ASan (scripts/lib/sys-ffi-asan.almd in the asan job); send_signal by spec/embedded_cross/process_kill_syscall.almd and, under ASan, scripts/lib/unsafe-boundary-asan.almd (a live child signalled 0 then SIGTERM); fill_entropy (A/B against bc954e9c1 on GCE n2, min of 7 pinned runs: 400 000 x random.bytes(32) 238 -> 235 ms, 4 000 x random.bytes(65536) 1281 -> 1274 ms) by tests/runtime_random_float_construction_test.rs on Linux, macOS and Windows CI (it includes sys.rs) and, under ASan, the boundary program at 0 / 1 / 255 / 256 / 257 / 1000 bytes; thread_self / thread_kill / exit_now only by tests/http_serve_cross_test.rs (functional, no sanitizer); the Windows console handler by nothing automated (no Windows CI job serves http) — the one row site without a boundary test, owed to #4009. Its two declaration blocks (every unix libc call, clock_gettime and getentropy among them, in one; SetConsoleCtrlHandler) are `unsafe extern` since #4007's D1 — tests/runtime_random_float_construction_test.rs includes the file into an edition-2024 crate, where a plain extern block is refused — so they count now: 13 lines in all"

