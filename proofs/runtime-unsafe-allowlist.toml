[[file]]
path = "crates/almide-codegen/src/prelude_box_body.rs"
count = 22
class = "emitted-prelude"
reason = "AlmideBox (#4249-#4252), the indirection that closes a recursive type's cycle: a NonNull-owned heap cell with Send/Sync impls, its into_inner / Deref / DerefMut, and the type-erased drop, clone and == work queues (raw pointer plus unsafe fn step) that a nested drop, clone or compare pushes instead of recursing, so a long chain runs in constant native stack. Sound while each queued pointer is consumed exactly once by the draining outer call; spec/ recursive-record fixtures and the 200 000-long chain tests exercise drop, clone and == through it. #4342: new and clone take the cell pointer from NonNull::from(Box::leak) (safe; 0.99-1.04x on binarytrees / treealloc with the region window off, a 200 000-long variant chain and a depth-18 recursive record tree, GCE Intel n2 and AMD n2d, 2026-10-30). A plain Box<T> in its place is not a replacement: its drop, clone and == recurse once per level and overflow the native stack on the 200 000-long chains (#4250, #4252), so the queues and their raw pointers stay Boundary test (#4007): beside tests/recursive_type_depth_test.rs, scripts/lib/unsafe-boundary-asan.almd builds, shares, compares, displays and drops a 200 000-long chain under ASan. #4303: a running walk's queue is reached only through the slot's pointer (almide_box_q_push / almide_box_q_pop, two lines in place of the three per-walk pushes), since the outer walk popping its `work` by name ended that pointer under Stacked Borrows and Miri reported every deep recursive-type program UB."

