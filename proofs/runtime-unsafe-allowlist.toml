[[file]]
path = "crates/almide-codegen/src/prelude_box_body.rs"
count = 23
class = "emitted-prelude"
reason = "AlmideBox (#4249-#4252), the indirection that closes a recursive type's cycle: a NonNull-owned heap cell with Send/Sync impls, its into_inner / Deref / DerefMut, and the type-erased drop, clone and == work queues (raw pointer plus unsafe fn step) that a nested drop, clone or compare pushes instead of recursing, so a long chain runs in constant native stack. Sound while each queued pointer is consumed exactly once by the draining outer call; spec/ recursive-record fixtures and the 200 000-long chain tests exercise drop, clone and == through it. #4342: new and clone take the cell pointer from NonNull::from(Box::leak) (safe; 0.99-1.04x on binarytrees / treealloc with the region window off, a 200 000-long variant chain and a depth-18 recursive record tree, GCE Intel n2 and AMD n2d, 2026-10-30). A plain Box<T> in its place is not a replacement: its drop, clone and == recurse once per level and overflow the native stack on the 200 000-long chains (#4250, #4252), so the queues and their raw pointers stay"

[[file]]
path = "crates/almide-codegen/src/prelude_region.rs"
count = 6
class = "emitted-prelude"
reason = "the region-window bump arena (#1991): AlmideRgn's Deref (one line per trap variant), the trapped header read, the node write into a fresh block in alloc (per variant) and the armed restore's header poisoning. Since #4342 the arena's marks and chunk table are Cell / RefCell, so save, restore and the bump itself are safe code (1.00x on binarytrees and treealloc, GCE Intel n2 and AMD n2d, 2026-10-30). The arena itself stays: plain allocation in its place (ALMIDE_REGION_OFF=1) measured 4.04x / 4.26x on binarytrees and 4.42x / 5.71x on treealloc (Intel / AMD, min of 7 pinned runs). Sound only while every handle dies inside its window, i.e. while pass_region_window.rs's region-pure verdict is right; ALMIDE_REGION_TRAP_STALE=1 arms a generation check that turns a wrong verdict into a panic (#4023: off by default — measured +30% on binarytrees and +52% on treealloc — and CI runs spec/ and the differential fuzz with it armed)"

