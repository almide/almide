# Every `unsafe` the native runtime carries, per file (#4007). The language's memory
# safety ends at these lines: the native leg trusts Rust's safe code, so each line here
# is outside the guarantee. scripts/check-runtime-unsafe.sh counts the non-comment lines
# holding the word `unsafe` and refuses any file whose count differs from its row — a new
# `unsafe` needs a row and a reason, a removed one lowers the row in the same change.
#
# class: fan-sync (Almide values cross threads; Miri/loom are the plan), ffi-surface
# (the raw-pointer stdlib surface, closed to ffi.read/ffi.write by R-L0-45),
# c-call (a C / OS function; safe when its arguments are), emitted-prelude (Rust text the
# compiler pastes into every generated program that needs it — crates/almide-codegen/src/
# prelude_*.rs, counted since #4023: the line is in the user's binary, not in runtime/rs).

[[file]]
path = "runtime/rs/src/list.rs"
count = 8
class = "fan-sync"
reason = "the fan gate: a lifetime-erasing transmute of the take closure, one `unsafe impl Sync` (AlmideFanGate), raw parent pointers and the take-cell read (lines 680-989); plus clock_gettime (c-call) at 417/423. The fan blocks are Mutex cells since #4007, with no unsafe"

[[file]]
path = "runtime/rs/src/bytes.rs"
count = 2
class = "ffi-surface"
reason = "from_raw_parts / copy_nonoverlapping behind bytes.from_raw_ptr / copy_to_ptr; moves to ffi.read / ffi.write (R-ffi-01, #3853)"

[[file]]
path = "runtime/rs/src/ffi.rs"
count = 2
class = "ffi-surface"
reason = "from_raw_parts / copy_nonoverlapping behind ffi.read / ffi.write (R-ffi-01, #4042): the one place a program reads or writes a raw address; @memory_unsafe, refused under --profile critical (E100)"

[[file]]
path = "runtime/rs/src/http.rs"
count = 12
class = "c-call"
reason = "signal handling for http.serve: pthread_self / pthread_kill / signal / _exit, and SetConsoleCtrlHandler on Windows"

[[file]]
path = "runtime/rs/src/process.rs"
count = 3
class = "c-call"
reason = "SIGPIPE disposition and waitpid(WNOHANG | WUNTRACED) for process.poll"

[[file]]
path = "runtime/rs/src/matrix.rs"
count = 1
class = "c-call"
reason = "cblas_dgemm: reads m*k and k*n and writes m*n f64 through raw pointers; the dimensions come from shape-checked matrices"




[[file]]
path = "crates/almide-rt-core/src/net_unix_sys.rs"
count = 5
class = "c-call"
reason = "SCM_RIGHTS descriptor passing (sendmsg / recvmsg / cmsg) and memfd for the unix module"

[[file]]
path = "crates/almide-codegen/src/prelude_region.rs"
count = 9
class = "emitted-prelude"
reason = "the region-window bump arena (#1991): AlmideRgn's Deref (one line per trap variant), the trapped header read, and the three TLS-cell borrows of alloc / save / restore per variant. Sound only while every handle dies inside its window, i.e. while pass_region_window.rs's region-pure verdict is right; ALMIDE_REGION_TRAP_STALE=1 arms a generation check that turns a wrong verdict into a panic (#4023: off by default — measured +30% on binarytrees and +52% on treealloc — and CI runs spec/ and the differential fuzz with it armed)"

[[file]]
path = "crates/almide-codegen/src/prelude_rem_body.rs"
count = 1
class = "emitted-prelude"
reason = "one `imul r64` inline asm in almide_mulhs (the high half of a signed product for the constant-divisor remainder): pure, nomem, nostack; cfg'd off under Miri"
