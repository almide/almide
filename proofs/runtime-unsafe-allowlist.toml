# Every `unsafe` the native runtime carries, per file (#4007). The language's memory
# safety ends at these lines: the native leg trusts Rust's safe code, so each line here
# is outside the guarantee. scripts/check-runtime-unsafe.sh counts the non-comment lines
# holding the word `unsafe` and refuses any file whose count differs from its row — a new
# `unsafe` needs a row and a reason, a removed one lowers the row in the same change.
#
# class: fan-sync (Almide values cross threads; checked by Miri and loom, below), ffi-surface
# (the raw-pointer stdlib surface, closed to ffi.read/ffi.write by R-L0-45),
# c-call (a C / OS function; safe when its arguments are), emitted-prelude (Rust text the
# compiler pastes into every generated program that needs it — crates/almide-codegen/src/
# prelude_*.rs, counted since #4023: the line is in the user's binary, not in runtime/rs; and,
# since #4007, the other emitted code — walker/mod.rs's main SIGPIPE prelude, the @extern(c)
# glue, the C-196 stack guard and the inlined matrix kernels).
#
# #4007: within the runtime, every c-call sits in ONE module per crate behind safe wrappers —
# runtime/rs/src/sys.rs (os calls, plus cblas_dgemm) and crates/almide-rt-core/src/
# net_unix_sys.rs. Checks: scripts/miri-generated.sh and scripts/asan-generated.sh over the
# generated crates (.github/workflows/miri-nightly.yml), scripts/miri-fan-gate.sh and
# scripts/loom-fan-gate.sh (the gate protocol's interleavings enumerated) for fan-sync,
# scripts/lib/sys-ffi-asan.almd for sys.rs's process paths, scripts/lib/unsafe-boundary-asan.almd
# for the entropy, kill, matmul / transpose kernel and AlmideBox edges.
#
# Per site (#4007): every counted line carries its own invariant, a `SAFETY:` comment (or a
# `# Safety` doc section) on it or directly above it, and the gate refuses a line without
# one. The total only goes down: CI runs the gate with --base, and a total above the base
# tree's is refused (a row may move between files, the sum may not rise).

[[file]]
path = "runtime/rs/src/list.rs"
count = 6
class = "fan-sync"
reason = "the fan gate: a lifetime-erasing transmute of the take closure, one `unsafe impl Sync` (AlmideFanGate), raw parent pointers, the take-cell read and the slot reads (almide_fan_deal .. almide_fan_steal). kept: std::thread::scope in its place (no unsafe) measured 1.13-1.32x the pool's wall time on offers of fine and medium elements and 0.95-1.00x on coarse ones (mandelbrot, binarytrees, fanblock), Apple M-series 14 cores, 2026-10-24 (#4007). Checked under Miri with four CPUs and helpers on by scripts/miri-fan-gate.sh (miri-nightly.yml miri-fan), whose control drops the caller's wait and must come back UB"

[[file]]
path = "runtime/rs/src/ffi.rs"
count = 2
class = "ffi-surface"
reason = "from_raw_parts / copy_nonoverlapping behind ffi.read / ffi.write (R-ffi-01, #4042, ADR-0031): the one place a program reads or writes a raw address, reached only after the Almide-side bounds check against the Region's own length (and, for a write, its permission); @memory_unsafe, refused under --profile critical (E100)"

