# Every `unsafe` in code the compiler puts into a native program, per file (#4007): the
# runtime template (runtime/rs/src), the cores it includes (crates/almide-rt-core/src), and
# the compiler-emitted code (crates/almide-codegen/src string templates, crates/almide-mir/src,
# crates/almide-kernel/src, crates/almide-base/src/native_stack_guard.rs). The language's
# memory safety ends at these lines: the native leg trusts Rust's safe code, so each line
# here is outside the guarantee. scripts/check-runtime-unsafe.sh counts the lines that use
# the keyword and refuses any file whose count differs from its row — a new `unsafe` needs
# a row, a class and a reason; a removed one lowers the row in the same change.
#
# class (closed set; the gate refuses any other):
#   os-ffi          a C / OS call std has no safe form of, in an FFI declaration module
#                   (a safe wrapper per call; the module is the only file of its crate
#                   that holds `unsafe`)
#   blas-ffi        the system BLAS, same shape
#   region-arena    the region allocator's raw arena (#4023)
#   fan-sync        Almide values crossing fan threads through a lifetime-erased borrow
#   ffi-surface     the raw-address stdlib surface a program calls itself (ffi.read/write)
#   simd-intrinsic  std::arch SIMD under #[target_feature] (the matrix kernels)
#   inline-asm      std::arch::asm!
#   user-ffi        the glue of a program's own @extern(c) declaration
#
# Checks per class: os-ffi / fan-sync / region-arena / ffi-surface / user-ffi run in the
# generated crates under Miri and AddressSanitizer (.github/workflows/miri-nightly.yml,
# scripts/miri-generated.sh, scripts/asan-generated.sh, scripts/miri-fan-gate.sh).

[[file]]
path = "runtime/rs/src/sys.rs"
count = 8
class = "os-ffi"
reason = "the runtime's ONE foreign-call module (#4007): signal / pthread_self / pthread_kill / _exit (http.serve's stop, process's SIGPIPE), waitpid(WNOHANG | WUNTRACED) (process.poll), clock_gettime(CLOCK_THREAD_CPUTIME_ID) (the fan clock), cblas_dgemm (blas-ffi, cfg(have_blas), which no build sets today) and SetConsoleCtrlHandler (Windows), each behind a safe wrapper whose arguments make the call sound. http.rs, list.rs, process.rs and matrix.rs call these and hold no unsafe. Checked: thread_cpu_ns under Miri (the fan corpus, scripts/miri-fan-gate.sh) and ASan; set_signal and wait_exited_or_stopped under ASan (scripts/lib/sys-ffi-asan.almd in the asan job); thread_self / thread_kill / exit_now only by tests/http_serve_cross_test.rs (functional, no sanitizer); dgemm by nothing (no build sets have_blas); the Windows handler by nothing"

[[file]]
path = "runtime/rs/src/list.rs"
count = 6
class = "fan-sync"
reason = "the fan gate: a lifetime-erasing transmute of the take closure, one `unsafe impl Sync` (AlmideFanGate), raw parent pointers, the take-cell read and the slot reads (almide_fan_deal .. almide_fan_steal). kept: std::thread::scope in its place (no unsafe) measured 1.13-1.32x the pool's wall time on offers of fine and medium elements and 0.95-1.00x on coarse ones (mandelbrot, binarytrees, fanblock), Apple M-series 14 cores, 2026-10-24 (#4007). Checked under Miri with four CPUs and helpers on by scripts/miri-fan-gate.sh (miri-nightly.yml miri-fan), whose control drops the caller's wait and must come back UB"

