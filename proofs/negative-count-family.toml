# The negative-count rule (#4147): ONE rule for every count-taking function of
# the sequence modules, held by tests/negative_count_family_test.rs.
#
# POPULATION: every public fn of list, string, bytes and matrix with an `Int`
# parameter, read from the compiler's own module interface (`almide compile
# <module> --json`). Every slot of it is a row here, either a `[[cell]]` the
# test RUNS or a slot named under `[outside]` with the reason its class is not a
# count. A new Int parameter with no row fails the gate, and so does a row whose
# slot no longer exists, so the family cannot gain a member that escapes it.
#
# THE RULE, per class (each `[[cell]]` is run with N = 0, -1 and i64::MIN, on
# native, on the embedded wasm host and on a stock wasmtime run of the built
# artifact, and every leg must print the same line):
#   count  a negative count is 0: f(.., -1) and f(.., i64::MIN) print what
#          f(.., 0) prints. `take(rows, -1)` is [], never every row.
#   bound  a range bound clamps into [0, len]: a negative bound is 0, the
#          same check as `count`.
#   size   a size's domain is >= 1: N = 0, -1 and i64::MIN each abort with
#          exit 1 and "must be positive" on stderr (chunk, window(s), conv1d's
#          stride).
# `probe` is an Almide String expression with N standing for the argument.

[[cell]]
slot = "list.take.n"
class = "count"
probe = 'show_l(list.take([1, 2, 3], N))'

