known_problems = "None release-blocking. Open at the tag: (1) #2796 — a shadowed Result let is exempted from E041 by name, so check accepts a program rustc rejects (pre-existing since at least v0.62.0; fix #2797 in review); (2) #2692 — a killed http.serve loses its buffered stdout; (3) serving is still sequential on native and a stock wasm artifact cannot serve (#2665, #2659) — ADR-0020 is the accepted design; (4) a WASI preview-1 build refuses exit codes 126..=255 by design (C-350) and the p2/p3 component builds still turn every non-zero exit into 1 (pre-existing)."
