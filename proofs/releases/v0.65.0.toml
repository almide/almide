release_gate = "Minor release through the rc channel (#1484). The v0.64.1 patch train was tagged as v0.64.1-rc1 (7384056de, release PR #2773) and never finalised: its soak (fuzz-nightly run 36321007234: shards 8/8, 480.1 of 480 minutes, 117,645 programs) found 2 cross-target divergences, #2782 (wasm bytes.repeat wrapped len * n past the C-197 ceiling check) and #2783 (native matrix.linear_f32_row_no_bias skipped the C-161 ceiling), neither a regression against v0.64.0, both fixed with a third instance found by the family sweep (select_rows_f32) in #2787 (batch of #2786). The fixes could only land on a develop that already carried ADR-0021 and ADR-0022 (#2774), so the train became v0.65.0. v0.65.0-rc1 (dbde826d1, release PR #2790: every required check green including Windows Build and Test Rust, 129 pass, full mutation sweep green on 76e48de5b, tree-identical to develop 76e48de5b). The final is tagged on the rc1 commit itself. Blocker gate at the tag: 0 (#1482); #2780 (process.exit refused 126..=255 since 0.64, a regression) was fixed before the rc via als#107 and #2785 in #2787. Interface diff v0.64.0 -> v0.65.0: identical (added=0 removed=0; #1488). Trust spine on the tag green (run 36347050745, dossier attested and attached). Fuzz soak on v0.65.0-rc1 (fuzz-nightly run 36341532613): shards 8/8, 480.4 of 480 minutes delivered, 115,804 programs, 1 finding: #2795 -> #2796, a checker-accepts / rustc-rejects case (a shadowed Result let borrowed the consumer of the let that shadows it) that also fails on v0.64.0 and v0.62.0, so not a regression; fix in review as #2797."
