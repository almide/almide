# Integer-domain edge divergences — MEASURED, not asserted.
#
# Every public stdlib fn x every Int parameter x a declared edge set, run on both
# targets and compared. Regenerate with `scripts/check-domain-edges.sh --update`;
# the gate diffs BOTH directions, so a new divergence fails and a row that stopped
# diverging also fails and must be deleted. `count` is a shrink-only ceiling.
#
# POPULATION vs MEASURED (#2402). The tool's population is EVERY public stdlib
# fn with an Int parameter — `parse_stdlib(only=None)` walks all of stdlib/, and
# the `[[skip]]` rows at the bottom name each slot of that population it could
# not build. The divergence rows below are what particular RUNS measured, and a
# run is scoped by `--only`: the 2026-08-17 run covered six modules (bytes,
# list, string, datetime, io, math), and `.github/workflows/domain-edges.yml`
# now also measures json and value weekly. Any module not in that list has NO
# measured divergence rows here — not because it is clean, but because nobody
# has run it; "not in the ledger" and "measured 0 divergent" are different
# claims and this header is where the difference is written down.
#
# Measured 2026-08-17 on the A-ratified tree, six modules (bytes, list, string,
# datetime, io, math), quiet machine, solo-retry instrument:
#   AGREE 4823   DIVERGE 64   WALL 627   BOMB 2
# That run's AGREE count included cells whose probe did not type-check (an
# `Int?` return rendered as `Int`; a self-host helper called by its private
# name) and so agreed on "compile error" — the tool now type-checks each slot
# first and names such slots as skips or helpers instead of counting them.
# json and value measured 2026-09-21 on the tree carrying #2396's fix:
#   json  14 cells / 1 slot (`json.index(i)`)  AGREE 14   skipped 0
#   value 11 cells / 1 slot (`value.int(n)`)   AGREE 11   skipped 0
# The rest of the population is unmeasured under the widened tool until the
# weekly run lands: `string`'s tail, `datetime`, `io`, `math` were never swept
# under the widening (the 2026-09-21 partial sweep stopped for disk after
# bytes / list / part of string), and the widening ADDS cells to every module
# (generic fns, `T?` / `Result` returns) that the earlier runs never had.
#
# Every one of the divergent rows below is the CONTRACTED divergence (C-197,
# ratified A): a cell between the two legs' structural allocation bounds, where
# the narrower leg (wasm32) takes the defined out-of-memory abort and the wider
# one answers. These are DECLARED, not defects — the count is not a defect
# ratchet for them. What stays shrink-only is the UNTRIAGED population: a row
# without a contracted/inherited reason is an open finding, and this file has
# ZERO of those. datetime/io/math measured 0 divergent — their former rows were
# fixed (#1455) and are deleted as stale. BOMB 2 are declared timeout outcomes
# (native filling tens of GB), not findings.
#
# 2026-09-21, #2385 — the first `domain-edges.yml` run (the gate had been
# committed but never executed) failed on string, and the reason above was the
# finding rather than the frame. `string.pad_start`/`pad_end` did NOT take the
# defined abort past the wasm leg's bound: the width was narrowed with a bare
# `i32_wrap_i64`, so the leg ANSWERED with the width mod 2^32 —
# `pad_start("ab", 2^32+5, "x")` returned `"xxxab"`. Four rows sat inside this
# file's "every row is the contracted divergence" claim while being something
# worse, because a ledger of WHICH cells diverge cannot see HOW. The narrowing
# now aborts on the defined line, which makes the two surviving pad rows true
# and removes four cells outright (`i64_max`, `i64_max_m1` on both fns: both
# legs now print `Error: out of memory` and exit 1, byte-identical). Those four
# are deterministic on any machine — `i64::MAX` is a size nothing can satisfy,
# so no amount of free memory changes the answer.
#
# The two `i32_max` rows went for a DIFFERENT reason from the other four.
# `i32_max` asks both legs for 2 GiB, and the wasm leg's ceiling on the
# `almide run --target wasm` path is `StoreLimits::default()`
# (`crates/almide-wasm-run/src/host.rs:663`) — HOST AVAILABILITY, not a
# structural bound. So the verdict for an `i32_max` cell tracked how much memory
# was free when it ran: a sweep run concurrently with another heavy job called
# them divergent; on a quiet machine both legs agreed. They were deleted because
# a phantom that landed once was being declared forever, NOT because anything
# about them was fixed — and the same run reported the three bytes cells
# (`bytes.new:len`, `bytes.pad_left`/`pad_right:target_len`) the other way.
#     string: DIVERGE 8 -> 4;  count 64 -> 62;  UNTRIAGED stays 0.
#
# 2026-09-21, #2387 — THE BUDGET PIN. `wasm_budget_bytes` below is the
# linear-memory budget every wasm reading in this file was taken under:
# tools/domain_edge_matrix.py builds the module and runs it on the wasmtime CLI
# with `-W max-memory-size=<budget>`, so a request past the budget takes the
# defined C-197 abort on EVERY machine, and the `i32_max` cells that read
# AGREE and DIVERGE from one binary minutes apart now read one thing. The
# native leg is uncapped: RLIMIT_AS is unenforced on Darwin (setrlimit ->
# EINVAL), so a native cap would split the local and CI verdicts, and its 2 GiB
# request at `i32_max` is the same availability claim this file already makes
# at 4 GiB for every `u32_max` row (#2387 item 2, open). The verdict that moved
# in every recorded reading was the wasm leg's, and that one is pinned.
#
# What the pin changed, measured 2026-09-21 on `almide 0.63.0 (dev)`, three runs
# plus one under a 6 GiB memory hog, identical on all four: the five 1-byte-
# element `i32_max` cells (`bytes.new:len`, `bytes.pad_left`/`pad_right:
# target_len`, `string.pad_start`/`pad_end:n`) are now DIVERGE at the declared
# budget — the wasm leg aborts structurally, native answers — and are declared
# below with the C-197 reason, which is what they were whenever the machine
# happened to have 2 GiB free. The 17 `i32_max` rows already here (array
# readers, `bytes.repeat`, `list.range`) request >= 4 GiB on wasm32 and were
# structural before the pin; they do not move. The count is a ceiling on the
# UNTRIAGED population, which stays 0; these five are the instrument's fixed
# boundary made visible, not new defects.
#     bytes: DIVERGE +3; string: DIVERGE +2;  count 62 -> 67.
#
# tools/domain_edge_ledger.py REFUSES a measurement that is not pinned to this
# budget (absent, different, or a cell marked unpinned) before diffing it, so an
# availability reading can neither fail the gate nor be written here.
# `scripts/check-domain-edges.sh --selftest` proves that with forged cells.

wasm_budget_bytes = 1073741824
count = 67
skip_count = 186

