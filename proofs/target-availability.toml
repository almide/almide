# The target-availability matrix, PER LEG (#1423 stages 2+3; #1710
# increment 2's vocabulary; #1827's full-surface enumeration): the
# DECLARED unavailable surface of each SERVICE LEG, diffed bidirectionally
# against the measured reality by scripts/check-target-availability.sh
# (CI). Measurement = the renderer's (or the run path's) own verdict via
# tools/target_availability_probe.py --leg <leg>, over EVERY public fn of
# every registered module — enumerated from the compiler's own interface
# (`almide compile <mod> --json`, the source the docs/stdlib signature
# indexes are generated from); the docs-HEADING enumeration it replaces
# reached 391 of 973 fns, so this agreement covered 40 % of the surface
# until #1827. Each leg keeps its own two-direction agreement and its own
# shrink-only story.
#
# Legs:
#   structural    ALMIDE_WASM_STRUCTURAL=1 build — the emitter frontier
#                 (the incumbent may still serve the fn; informational
#                 for #1584).
#   stock-p1      default `build --target wasm` (reroute included) — a
#                 wall here means NO build path serves the fn: the E081
#                 check-time-diagnostic set (src/cli/build.rs reads the
#                 stock-p1 rows).
#   embedded      `run --target wasm` through the embedded host —
#                 service measured by execution (an answered runtime err
#                 counts as service; a refusal before the program's first
#                 line, or an unknown-op host reply, does not).
#   p3-component  ALMIDE_COMPONENT_P3 — the sweep joins with the
#                 wasi:http@0.3 port (#1710); no rows declare it yet.
#
# Row discipline (per leg, the rustc tier-check rule): every measured
# wall MUST have its leg in a row, every declared leg MUST still measure
# as a wall (a leg that starts serving makes the entry STALE — remove
# the leg, the shrink direction), a reasonless leg fails, and the
# pending-class counts are both-way ratchets. A public fn the probe
# cannot synthesize a call for FAILS the gate (never a silent skip — the
# #1827 shape). A fn the probe reaches but whose leg walls on an ARGUMENT
# CONSTRUCTOR the probe itself injected (an HttpRequest exists only
# inside an http.serve handler) is `unprobed` on that leg: claimed
# neither way, listed by the gate, and held to the leg's
# unprobed_ceiling_<leg> both ways.
#
# Closure class (schema 3, #1423 stage 4's follow-up): every row carries
# `class`, the honest ENDGAME of the row, one of the closed vocabulary —
#   pending-self-host    closes by work IN THIS REPO: a self-host body
#                        the leg can link, a structural-leg arm for the
#                        body's layout, an emitter representation the
#                        leg lacks — landed with a cross fixture in one
#                        PR. Shrink-only ratchet: pending_self_host_ceiling.
#   pending-port         the leg lacks a HOST surface the fn needs (a
#                        wasi:http@0.3 station, a structural-leg host
#                        import, a p3 world); closes when the port lands.
#                        Shrink-only ratchet: pending_port_ceiling.
#   native-only-forever  the fn cannot exist on the wasm target as
#                        specified (no subprocess API in stock WASI, an
#                        uncatchable trap); the row carries a
#                        `justification` sentence and never counts as
#                        pending. No ceiling — but a forever leg that
#                        starts serving is still STALE (the two-direction
#                        agreement covers every class).
# A pending row needs an `issue`; a row that says `reason = "pending-self-
# host"` must be class pending-self-host (the reason tag and the class
# cannot disagree); a missing or unknown class fails the gate. Moving a
# row between classes moves a ceiling, so a reclassification is always a
# visible edit, never a silent one.
schema = 3

# 2026-09-02 (#1827): 15 -> 82. The MEASUREMENT widened, not the surface:
# the sweep now enumerates all 973 public fns (from 391), and the 67
# additional pending-self-host rows (the bytes search/edit family, the
# int bit family and every sized `to_float32` twin, 26 matrix ops,
# list.partition, string.split_once) were structural walls all along,
# invisible to the docs-heading enumeration. Not a regression: the
# incumbent serves every one of them (stock-p1 ok); the structural leg
# has no arm yet. Burn down from here.
# 2026-09-02 (#1423 stage 4): 82 -> 74. hex.decode, the html and path
# newtype ctors and the value case walks serve on the structural leg.
# 2026-09-03 (#1423 stage 4): 74 -> 36. The bytes search/edit/predicate
# family (17: cmp, contains, index_of, starts_with, ends_with, is_empty,
# is_valid_utf8, eof, skip, insert, remove_at, reverse, xor, map_each,
# split, lines, data_ptr) and the int bit family with every `to_float32`
# twin (21) serve on the structural leg: the audited bytes_core /
# int_bitcount / int_bits / float_bits / int_to_float bodies join the
# linked-impl whitelist, split and lines get native arms (their self-host
# twins write the incumbent's 8-byte List slot stride raw), and the
# i2f32 prim converts i64 -> f32 directly (single rounding).
# 2026-09-08 (#1423 stage 4): the 25 remaining matrix rows and
# list.partition are one blocker, not 26: stdlib/matrix_core.almd reads
# the incumbent's list layout (LEN as an element count, 8-byte handle
# slots) and the structural leg stores LEN in bytes with 4-byte slots.
# They close together — by a layout-abstract prim family or by the
# structural leg's own matrix arms once the incumbent retires (#1696
# step 5). Still pending-self-host: a body exists, the leg cannot link it.
# 2026-09-21 (#1423 bucket C, schema 3): the reason vocabulary is a
# `class` per row. The two ruled rows land here — env.set has NO row
# (the embedded overlay shim serves it, crates/almide-wasm/tests/
# wasi_services.rs), testing.assert_throws is native-only-forever with
# the subprocess family (process.exec/exec_in/exec_status/
# exec_status_timeout/exec_with_stdin/spawn/is_alive/kill/pid);
# process.env and process.stdin_lines stay pending-port (environ and
# stdin exist in WASI; the split the ruling asked for).
# 2026-09-21 (schema 3): 34 -> 56 is the CLASS basis, not a regression.
# The count now spans every row that closes by work in this repo — a
# self-host body, a structural-leg arm, an emitter representation — not
# only the rows tagged `pending-self-host` on the structural leg: the
# fused matrix kernels and append_rows/fma/fma3 (native intrinsics with
# no wasm body on any leg, 12), the structural-leg-gap rows (Matrix
# [Float32] representation, fold_lines_range arm, string.clear's Hole;
# 8) and mem.save/restore (the allocator-mark scalar; 2) join. Burn-down
# to 0 is still the stage-4 finish line; only the denominator is honest now.
# 2026-09-22 (#1423 stage 4): 56 -> 50. The in-place clear/delete family
# (map.delete, map.clear, bytes.clear, string.clear) gets structural-leg
# arms — var write-backs of a fresh block, the map.insert / list.clear
# shape, so an alias bound before the mutation keeps its value (C-033;
# the incumbent's string_clear twin stores into the SHARED block and the
# 0.62.0 default route printed the alias cleared — the new arm is the
# fix on the default route); mem.save / mem.restore get the C-041
# trivial-pair twins (stdlib/mem_checkpoint.almd — v1's RC discipline
# makes both no-ops on every leg, exactly as native and bytes.heap_save
# already are) and leave every leg. Parity evidence:
# spec/wasm_cross/inplace_clear_family.almd, spec/wasm_cross/mem_checkpoint.almd.
# Same day (#2465): the incumbent's twin follows — `rewrite_clear` (the
# `list.clear` rebind) now covers string / bytes and a record-field
# receiver for all four, so the forced incumbent and the shapes the router
# still sends there agree with native; the shared-block `string_clear` /
# `bytes_clear` bodies stay as rows but are not reached from a var or field
# receiver. Evidence: spec/wasm_cross/inplace_clear_alias.almd +
# tests/incumbent_clear_alias_test.rs (native == structural == incumbent).
# Same day: 50 -> 48. fs.stat and fs.glob cross the embedded host on the
# structural leg (ops 38 / 39 — the four FileStat fields as i64s, the
# C-228 segment-wise glob transcribed into the host), the fs.walk shape.
# An fs program routes to the incumbent on the BUILD path, so the parity
# evidence is the embedded lane: spec/embedded_cross/fs_stat_glob_structural.almd.
# Left this round, each for a stated reason: fs.fold_lines_range /
# fold_lines_chunked (a byte-range walk and the chunk partition need a
# host op pair plus C-220's ownership rule in the guest — more than one
# sitting), list.shuffle (a generic `[A]` element move: the structural
# leg would need per-element-type twins and the entropy floor; the
# random.shuffle twins wall on the same leg), list.partition and every
# matrix row (the 2026-09-08 layout finding above — one blocker, not 45).
pending_self_host_ceiling = 48
pending_port_ceiling = 56

# The unprobed class (#1827), per leg. Today: the five HttpRequest
# accessors (http.query_params / req_body / req_header / req_method /
# req_path) — the value exists only inside an http.serve handler, and on
# these two legs http.serve itself walls at build, so the accessors are
# never reached. The structural leg walls on the HttpRequest binding
# itself (bind-ty:Named), which is that leg's own verdict — declared.
unprobed_ceiling_structural = 0
unprobed_ceiling_stock_p1 = 5
unprobed_ceiling_embedded = 5

