# INCOMPLETE-VERIFICATION LEDGER (C-462, ALS-I5; owner ruling 2026-11-24).
#
# A wasm module whose own certificate is INCOMPLETE — every witness accepted,
# some function the producer could not certify — is refused by default on
# every route that makes one (build, run, test, bench, the core module of a
# component). `--allow-incomplete-verification` lets it through with a
# warning naming each uncertified function. The repository's own corpus
# carries that flag ONLY for the programs listed here: one row per (route,
# program), `entry = "<test|run|build|bench> <path>"`, with the producer's reasons
# as measured. Fixing a row means certifying the construct in the producer
# (crates/almide-wasm: witness_gate*.rs and the hooks), never raising a
# verifier limit; then delete the row and lower the ceiling.
#
# Shrink-only: tests/incomplete_verification_ledger_test.rs holds the row
# count to the ceiling (above: refused; below: lower the ceiling in the same
# change), each entry well formed, unique and naming a file;
# scripts/check-incomplete-verification.sh refuses an INCOMPLETE warning, in a
# directory run's log, from a program not listed. A listed program found
# CERTIFIED (run its route without the flag) is a stale row: delete it.
#
# History:
#   2026-11-24  seeded by the census on decision-sites (ds-2): 86 (route,
#               program) pairs were INCOMPLETE before the producer fixes of
#               the same change (list.find_index / list.partition predicate
#               activations, the audited fallback for any other callback
#               argument); 56 after. `almide verify` (the program build) saw
#               32 of 2102 corpus files; test lanes and the embedded run lane
#               build other modules, hence the different set.
#
# ceiling = "56"

