# DECISION-SITE LEDGER — every place in the compiler, the CLI or the runtime
# glue whose outcome is PASS or REFUSE for a capability, scope, trust, purity,
# verification or ownership property. The sibling of
# proofs/gate-verification.toml (CI scripts) and proofs/name-keyed-sites.toml
# (name lists that pick a lowering); the three join on `file::item`.
#
# Two halves (#2128's split):
#   tests/decision_sites_test.rs     the detector: finds sites by what they emit
#                                    (S1 a refusal code whose codes.toml row says
#                                    `decision`, S2 a refusal carrier declared in
#                                    [detector], S3 a build-changing switch read, or
#                                    any switch read where a refusal is decided, S4
#                                    the CLI's Subcommand variants -> [routes]), and
#                                    keeps `keys` equal to what is found;
#   tools/almide-gates decision-sites the judge: reads the rows' evidence and the
#                                    ceilings below.
#   tests/decision_route_matrix_test.rs runs each row's probe on every `runs` cell.
#   scripts/run-decision-controls.sh    the c4 mutation pass: base green, patched
#                                    red (a build VM); the judge checks on every
#                                    PR that each patch still applies.
#
# A row is STAMPED only when all four hold, and the judge recomputes each from
# the row's evidence:
#   c1  it decides from declarations, types or reach — not names, prefixes,
#       suffixes, parameter names or Debug/Display text  (`from`; a
#       `mixed:` of two or more of declaration / type / reach counts, one
#       with any other part does not — owner ruling 2026-11-23);
#   c2  an unknown item is refused, and a test adds a NOVEL item and sees it
#       refused  (`unknown = "refuse"`, `novel = "<test file>::<fn>"`, the test
#       calling a tests/support/novel.rs generator);
#   c3  it runs on every route that produces or runs code; a route left out
#       says why (`n.a.: <why>`) or names an open issue (`skipped: #NNNN`);
#       every `runs` cell is executed by the route-matrix test (`probe`);
#   c4  a negative control: proofs/decision-controls/<id>.patch removes the
#       check and `control_test` turns red (`control_seen = "<sha> <date>"`,
#       recorded from scripts/run-decision-controls.sh).
#       A rule with two checks one patch cannot each neuter names a second
#       control beside it (`control_extra` = <id>.<what>.patch, with
#       `control_extra_test` / `control_extra_seen`).
#
# Status: STAMPED (`stamp = "<sha> <date>"`) | UNSTAMPED (`reasons` says which
# condition fails) | UNCLASSIFIED (not yet read to a verdict; never counted as
# stamped). The 2026-11-19 read-only draft called 21 rows STAMPABLE; they keep
# `draft = "STAMPABLE"` and stay UNSTAMPED until their cells and control RAN.
#
# Shrink-only ceilings (the judge refuses a count above its ceiling; lower the
# ceiling in the PR that lowers the count; a rise is a reviewed header line
# naming the PR and why):
# unstamped_ceiling     = "81"
# unclassified_ceiling  = "0"
# skipped_route_ceiling = "70"
# failopen_ceiling      = "11"
