# DECISION-SITE LEDGER — every place in the compiler, the CLI or the runtime
# glue whose outcome is PASS or REFUSE for a capability, scope, trust, purity,
# verification or ownership property. The sibling of
# proofs/gate-verification.toml (CI scripts) and proofs/name-keyed-sites.toml
# (name lists that pick a lowering); the three join on `file::item`.
#
# Two halves (#2128's split):
#   tests/decision_sites_test.rs     the detector: finds sites by what they emit
#                                    (S1 a refusal code whose codes.toml row says
#                                    `decision`, S2 a refusal carrier declared in
#                                    [detector], S3 a build-changing switch read, or
#                                    any switch read where a refusal is decided, S4
#                                    the CLI's Subcommand variants -> [routes]), and
#                                    keeps `keys` equal to what is found;
#   tools/almide-gates decision-sites the judge: reads the rows' evidence and the
#                                    ceilings below.
#   tests/decision_route_matrix_test.rs runs each row's probe on every `runs` cell.
#   scripts/check-decision-controls.sh  the c4 patches apply (PR) / turn red (VM).
#
# A row is STAMPED only when all four hold, and the judge recomputes each from
# the row's evidence:
#   c1  it decides from declarations, types or reach — not names, prefixes,
#       suffixes, parameter names or Debug/Display text  (`from`);
#   c2  an unknown item is refused, and a test adds a NOVEL item and sees it
#       refused  (`unknown = "refuse"`, `novel = "<test file>::<fn>"`, the test
#       calling a tests/common/novel.rs generator);
#   c3  it runs on every route that produces or runs code; a route left out
#       says why (`n.a.: <why>`) or names an open issue (`skipped: #NNNN`);
#       every `runs` cell is executed by the route-matrix test (`probe`);
#   c4  a negative control: proofs/decision-controls/<id>.patch removes the
#       check and `control_test` turns red (`control_seen = "<sha> <date>"`).
#
# Status: STAMPED (`stamp = "<sha> <date>"`) | UNSTAMPED (`reasons` says which
# condition fails) | UNCLASSIFIED (not yet read to a verdict; never counted as
# stamped). The 2026-11-19 read-only draft called 21 rows STAMPABLE; they keep
# `draft = "STAMPABLE"` and stay UNSTAMPED until their cells and control RAN.
#
# Shrink-only ceilings (the judge refuses a count above its ceiling; lower the
# ceiling in the PR that lowers the count; a rise is a reviewed header line
# naming the PR and why):
# unstamped_ceiling     = "159"
# unclassified_ceiling  = "31"
# skipped_route_ceiling = "193"
# failopen_ceiling      = "62"
#
# History:
#   2026-11-19  seeded from the read-only draft (143 rows) plus the detector's
#               first run (the sites the draft missed enter UNCLASSIFIED):
#               159 rows, 0 stamped, 31 unclassified (15 draft + 16 detector),
#               193 skipped route cells, 62 fail-open rows.

[detector]
# S2: constructing one of these is a refusal that never becomes a diagnostic
# code. A carrier is a TYPE or a platform refusal value, never a function name.
carriers = [
  "FsBeneathError",
  "PermissionDenied",
]

[routes]
"ToolCommand::Install" = "n.a.: installs a CLI package; trust.install-owner and native.install-allow-native cover it"
"QueryCommand::Stdlib" = "n.a.: prints the bundled stdlib outlines, no user code"
"QueryCommand::Outline" = "n.a.: parses only (outline), produces and runs no code"
"QueryCommand::Interface" = "check: type-checks the module to print its interface"
"QueryCommand::Doc" = "n.a.: reads docs, produces and runs no code"
"Commands::Verify" = "build: `almide verify` builds the artifact through the build route and hands its bundle to almide-verify"
"Commands::Upgrade" = "n.a.: the toolchain rows (toolchain.selfupdate-attestation) cover it"
"Commands::Update" = "n.a.: dependency management; the supply-chain rows (trust.*, deps.*) cover it on their own cells"
"Commands::Trust" = "n.a.: edits [trust] owners"
"Commands::Tool" = "n.a.: the Install subcommand is mapped on its own row"
"Commands::TestRunCompile" = "test: internal leg of `almide test` (the batched harness compile)"
"Commands::Test" = "test"
"Commands::Switches" = "n.a.: lists the env switches"
"Commands::SurviveTestLeg" = "test: internal leg of `apply` (the test harness compile and run)"
"Commands::Survive" = "n.a.: a tombstone that names its replacement and exits"
"Commands::SelfUpdate" = "n.a.: the toolchain rows (toolchain.selfupdate-attestation) cover it"
"Commands::Run" = "run (the native / wasm / wasi / component columns are its `--target`s)"
"Commands::Repl" = "skipped: #REPL compiles and runs each input (try_compile + the built binary) and is no column of the matrix"
"Commands::Remove" = "n.a.: dependency management"
"Commands::Query" = "n.a.: reads interfaces and docs; the Interface subcommand is mapped on its own row"
"Commands::Mcp" = "mcp"
"Commands::Lsp" = "lsp"
"Commands::Install" = "n.a.: installs a CLI package; trust.install-owner and native.install-allow-native cover it"
"Commands::Init" = "n.a.: writes a project skeleton, produces and runs no code"
"Commands::Ide" = "lsp: the editor queries share the LSP's cache-only front end"
"Commands::Fmt" = "n.a.: formats source; produces and runs no code"
"Commands::Fix" = "check: rewrites source after the checker's diagnostics; produces no artifact"
"Commands::Explain" = "n.a.: prints a diagnostic's doc"
"Commands::Emit" = "emit"
"Commands::DocsGen" = "n.a.: regenerates docs from the repo"
"Commands::Deps" = "n.a.: lists dependencies"
"Commands::DepPath" = "n.a.: prints a cached dependency path"
"Commands::Compile" = "check: writes the module interface after the same front end (`almide compile` = check + .almdi)"
"Commands::Clean" = "n.a.: removes caches"
"Commands::Check" = "check (and the check_json / check_effects columns: `--json`, `--effects`)"
"Commands::Build" = "build"
"Commands::Budgets" = "n.a.: lists the compile-cost budgets"
"Commands::Bench" = "bench"
"Commands::Apply" = "test: compiles and runs the edited file's tests through SurviveTestLeg"
"Commands::Add" = "n.a.: dependency management; trust.add-trust-flag covers it"

