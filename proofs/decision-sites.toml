# DECISION-SITE LEDGER — every place in the compiler, the CLI or the runtime
# glue whose outcome is PASS or REFUSE for a capability, scope, trust, purity,
# verification or ownership property. The sibling of
# proofs/gate-verification.toml (CI scripts) and proofs/name-keyed-sites.toml
# (name lists that pick a lowering); the three join on `file::item`.
#
# Two halves (#2128's split):
#   tests/decision_sites_test.rs     the detector: finds sites by what they emit
#                                    (S1 a refusal code whose codes.toml row says
#                                    `decision`, S2 a refusal carrier declared in
#                                    [detector], S3 a build-changing switch read, or
#                                    any switch read where a refusal is decided, S4
#                                    the CLI's Subcommand variants -> [routes]), and
#                                    keeps `keys` equal to what is found;
#   tools/almide-gates decision-sites the judge: reads the rows' evidence and the
#                                    ceilings below.
#   tests/decision_route_matrix_test.rs runs each row's probe on every `runs` cell.
#   scripts/run-decision-controls.sh    the c4 mutation pass: base green, patched
#                                    red (a build VM); the judge checks on every
#                                    PR that each patch still applies.
#
# A row is STAMPED only when all four hold, and the judge recomputes each from
# the row's evidence:
#   c1  it decides from declarations, types or reach — not names, prefixes,
#       suffixes, parameter names or Debug/Display text  (`from`);
#   c2  an unknown item is refused, and a test adds a NOVEL item and sees it
#       refused  (`unknown = "refuse"`, `novel = "<test file>::<fn>"`, the test
#       calling a tests/support/novel.rs generator);
#   c3  it runs on every route that produces or runs code; a route left out
#       says why (`n.a.: <why>`) or names an open issue (`skipped: #NNNN`);
#       every `runs` cell is executed by the route-matrix test (`probe`);
#   c4  a negative control: proofs/decision-controls/<id>.patch removes the
#       check and `control_test` turns red (`control_seen = "<sha> <date>"`,
#       recorded from scripts/run-decision-controls.sh).
#
# Status: STAMPED (`stamp = "<sha> <date>"`) | UNSTAMPED (`reasons` says which
# condition fails) | UNCLASSIFIED (not yet read to a verdict; never counted as
# stamped). The 2026-11-19 read-only draft called 21 rows STAMPABLE; they keep
# `draft = "STAMPABLE"` and stay UNSTAMPED until their cells and control RAN.
#
# Shrink-only ceilings (the judge refuses a count above its ceiling; lower the
# ceiling in the PR that lowers the count; a rise is a reviewed header line
# naming the PR and why):
# unstamped_ceiling     = "140"
# unclassified_ceiling  = "0"
# skipped_route_ceiling = "201"
# failopen_ceiling      = "54"
#
# History:
#   2026-11-19  seeded from the read-only draft (143 rows) plus the detector's
#               first run (the sites the draft missed enter UNCLASSIFIED):
#               159 rows, 0 stamped, 31 unclassified (15 draft + 16 detector),
#               193 skipped route cells, 62 fail-open rows.
#   2026-11-19  batch 4 (VM ds-1): the route matrix RAN every probe on all 14
#               columns, inside and outside the project; cells corrected to
#               what happens. 15 rows STAMPED (controls red, cells driven).
#               Skipped cells 193 -> 194: the version pin is admitted from
#               outside the project (#4846, 9 cells) and check --effects runs
#               no value gate (#4847, 1 cell), cells the draft read as `runs`;
#               other draft `skipped` cells became `n.a.` with a reason. Every
#               skipped cell now names an open issue (13 filed: #4846-#4858).
#   2026-11-19  batch 5 + the #4848-#4858 fixes (VM ds-2, after merging
#               bugs-final 84729430f6 / ADR-0035; moved items re-pointed): all 31
#               UNCLASSIFIED rows read to a verdict (E114 and the http runtime caps
#               classified out: 157 rows); 4 gaps probed and filed (#4859-#4862).
#               13 controls run (12 red, 1 decorative); the #4849 verifier claims
#               narrowed, so their cells are `n.a.` with the reason. 15 stamped,
#               142 not, 0 unclassified, 134 skipped cells. The four gaps
#               were then fixed on the owner's word (#4859-#4862, refuse +
#               novel test + control): 59 fail-open rows.
#   2026-11-19  third pass (VM ds-2): #4859 ruled BY DESIGN for module-level
#               vars (C-187 / #3317); E011 now decides from the binding's
#               declaration kind (Local / TopLevel / Param; unrecorded refused).
#               #4856 shown real (a fan over fn values from a top-level let ran
#               threaded on v0.69.1); its control is red now. The nine ADR-0035
#               rows re-read against the typed sources, each with a novel test,
#               a probe and a red control. New gaps probed and filed: #4864,
#               #4865, #4867, #4868, #4869. 17 stamped (effect.e011-closure-
#               mutation, env.expect-tools), 140 not, 54 fail-open.
#   2026-11-20  skipped ceiling raised 134 → 202 by owner ruling 2026-11-20:
#               honest cells for routes that do not read the dependency from
#               outside the project; falls with #4830/#4829. (Measured 216
#               before merging bugs-final 14227f2082; its #4829 reader fix
#               turned 14 of those cells to `runs`.)

[detector]
# S2: constructing one of these is a refusal that never becomes a diagnostic
# code. A carrier is a TYPE or a platform refusal value, never a function name.
carriers = [
  "FsBeneathError",
  "PermissionDenied",
]

[routes]
"ToolCommand::Install" = "n.a.: installs a CLI package; trust.install-owner and native.install-allow-native cover it"
"QueryCommand::Stdlib" = "n.a.: prints the bundled stdlib outlines, no user code"
"QueryCommand::Outline" = "n.a.: parses only (outline), produces and runs no code"
