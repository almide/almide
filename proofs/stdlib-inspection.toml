# STDLIB INSPECTION LEDGER — one row per public stdlib function, and an
# `inspected` stamp on each function that has passed every criterion below on
# both legs. Requested by the owner on 2026-10-11, after #3519, #3520, #3530 and
# #2393 were all found by use-shape on one leg only: correct per-function
# tests had passed while a rebind, a tail call or a fold copied the whole value.
#
# Enforced by tests/stdlib_inspection_test.rs: every public function has
# exactly one row, no row is stale, a row's `sig` is the function's current
# signature (a signature change voids the stamp), an `inspected` row carries
# every evidence field, and the uninspected count only falls.
#
# CRITERIA — a function is stamped `inspected` only when all five hold:
#
#   1. SAME BEHAVIOUR ON RUST AND WASM. Native and wasm (and the interpreter,
#      where it runs the function) agree byte for byte on stdout, stderr and
#      exit code, including the error path. Evidence: `parity`.
#   2. NO WASTED ORDER. The per-call cost matches the declared `order`, and
#      no use-shape — a plain call, the var's own rebind in a loop, a self tail
#      call, a fold callback, a pipe stage — adds a copy the shape does not need.
#      Measured on both legs at n, 2n and 4n from built artifacts, never
#      `almide run`. Evidence: `complexity`, plus `alloc`: the wasm leg leaves 0
#      live blocks at exit, and an accumulation shape allocates linearly
#      (canon law 10, ../almide-references/RESEARCH-stdlib.md).
#   3. CODOPSY A HOLDS. Any change the inspection makes keeps every scored
#      crate at A under codopsy HEAD, measured the way CI measures. Recorded
#      in `stamp`.
#   4. FUZZY COMBINATIONS EVERY RUN. Each inspection runs freshly generated
#      differential programs centred on the function — the function composed
#      with others, at generated arguments — and the native/wasm/interpreter
#      verdicts must agree. Evidence: `parity` names the seed and program count.
#   5. MODULE DIAMONDS. The function called through a diamond of user
#      modules (base wraps it; left and right import base; main imports both
#      and also calls it directly) behaves exactly as the in-module call, on
#      both legs. Evidence: `diamond`.
#
# A defect found during an inspection is filed as its own issue and fixed;
# the row stays `uninspected` until the fix lands and the run is repeated.
#
# ROW FIELDS
#   name, sig, class   generated (`pure` | `effect`); `effect` rows need the
#                      host capability on wasm, and their parity is judged on
#                      the embedded host and a stock WASI runtime both
#   status             `uninspected` | `inspected`
#   stamp              "<version> @ <commit> <date>; codopsy <scores>"
#   order              declared per-call cost, in the size of the named param
#   parity, complexity, diamond, alloc
#                      the evidence, with the command, the seed or sizes, the
#                      machine, and the measured result
#
# uninspected_ceiling = "1031"

